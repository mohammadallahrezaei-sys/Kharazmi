<body class="p-4 max-w-3xl mx-auto flex flex-col min-h-screen justify-between">
    <div>
        <!-- هدر بالای صفحه -->
        <div class="flex justify-between items-center mb-6 bg-slate-800 border border-slate-700 p-4 rounded-2xl shadow-md">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-rose-500/20 text-rose-400 flex items-center justify-center font-bold text-lg">🏥</div>
                <div>
                    <h1 class="text-base font-bold text-white">بهداری و سوابق پزشکی</h1>
                    <p class="text-[11px] text-slate-400">مدیریت مراجعین، هشدارهای دارویی و حوادث شغلی</p>
                </div>
            </div>
            <a href="index.html" class="px-3 py-1.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-slate-300 hover:bg-slate-700">← بازگشت</a>
        </div>

        <!-- انتخاب پرسنل -->
        <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-md mb-4 space-y-3">
            <label class="block text-xs font-bold text-slate-300">انتخاب پرسنل جهت بررسی پرونده یا ثبت ویزیت:</label>
            <select id="employeeSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm outline-none focus:border-emerald-500">
                <option value="">-- در حال بارگذاری لیست پرسنل... --</option>
            </select>
        </div>

        <!-- بخش نمایش خلاصه وضعیت و هشدارهای پزشکی (مخفی تا انتخاب فرد) -->
        <div id="healthSummaryCard" class="hidden bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-md mb-4 space-y-4">
            <h3 class="text-xs font-bold text-slate-300 border-b border-slate-700 pb-2">خلاصه پرونده سلامت و آمار سوابق</h3>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 text-center">
                    <span class="text-[10px] text-slate-400 block mb-1">گروه خونی</span>
                    <span id="txtBloodType" class="font-bold text-white text-sm">-</span>
                </div>
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 text-center">
                    <span class="text-[10px] text-slate-400 block mb-1">تعداد کل مراجعین</span>
                    <span id="txtTotalVisits" class="font-bold text-white text-sm">0 بار</span>
                </div>
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 text-center">
                    <span class="text-[10px] text-slate-400 block mb-1">حوادث ثبت‌شده</span>
                    <span id="txtTotalIncidents" class="font-bold text-rose-400 text-sm">0 مورد</span>
                </div>
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 text-center">
                    <span class="text-[10px] text-slate-400 block mb-1">اعزام‌ها</span>
                    <span id="txtTotalReferrals" class="font-bold text-blue-400 text-sm">0 مورد</span>
                </div>
            </div>

            <!-- باکس هشدارهای دارویی و ممنوعه (در صورت وجود) -->
            <div id="alertBox" class="hidden bg-rose-950/40
