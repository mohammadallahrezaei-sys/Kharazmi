<script>
window.onerror = function (msg, src, line) {
    const box = document.getElementById('debugBox');
    document.getElementById('debugText').textContent = 'JS: ' + msg + ' (خط ' + line + ')';
    box.classList.remove('hidden');
};

const SB_URL = 'https://priopguwfjawybffarhd.supabase.co';
const SB_KEY = 'sb_publishable_fKFQePO9qiFhj4qU3Vq4lQ_OAFi7rfu';
const SB_HEADERS = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };
const byId = id => document.getElementById(id);
let employees = [];

byId('employeeSelect').innerHTML = '<option value="">اسکریپت اجرا شد، در حال دریافت لیست...</option>';

function showDebug(msg) {
    byId('debugText').textContent = msg;
    byId('debugBox').classList.remove('hidden');
}

async function loadEmployees() {
    const select = byId('employeeSelect');
    try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 15000);
        const res = await fetch(SB_URL + '/rest/v1/employees?order=emp_id.asc&limit=500', { headers: SB_HEADERS, signal: ctrl.signal });
        clearTimeout(timer);
        const data = await res.json();
        if (!res.ok) throw new Error(JSON.stringify(data));

        employees = data;
        if (!employees.length) {
            select.innerHTML = '<option value="">هیچ پرسنلی در دیتابیس یافت نشد!</option>';
            return;
        }

        select.innerHTML = '<option value="">-- انتخاب پرسنل از لیست کارخانه --</option>';
        employees.forEach(emp => {
            const opt = document.createElement('option');
            opt.value = emp.emp_id;
            opt.textContent = (emp.first_name || '') + ' ' + (emp.last_name || '') + ' (کد: ' + emp.emp_id + ' - واحد: ' + (emp.department || 'نامشخص') + ')';
            select.appendChild(opt);
        });
    } catch (e) {
        select.innerHTML = '<option value="">خطا در بارگذاری پرسنل</option>';
        showDebug(e.name === 'AbortError' ? 'پاسخی از سرور نیامد (تایم‌اوت). اتصال یا فیلترینگ را بررسی کنید.' : e.message);
    }
}

async function loadSummary(empId) {
    const emp = employees.find(x => String(x.emp_id) === String(empId)) || {};
    byId('txtBloodType').textContent = emp.blood_type || emp.blood_group || 'ثبت‌نشده';
    byId('txtTotalVisits').textContent = '...';
    byId('txtTotalIncidents').textContent = '...';
    byId('txtTotalReferrals').textContent = '...';
    try {
        const res = await fetch(SB_URL + '/rest/v1/clinic_visits?employee_id=eq.' + encodeURIComponent(empId) + '&select=visit_reason,is_referred', { headers: SB_HEADERS });
        const rows = await res.json();
        if (!res.ok) throw new Error(JSON.stringify(rows));
        byId('txtTotalVisits').textContent = rows.length + ' بار';
        byId('txtTotalIncidents').textContent = rows.filter(r => r.visit_reason === 'incident').length + ' مورد';
        byId('txtTotalReferrals').textContent = rows.filter(r => r.is_referred).length + ' مورد';
    } catch (e) {
        byId('txtTotalVisits').textContent = '-';
        byId('txtTotalIncidents').textContent = '-';
        byId('txtTotalReferrals').textContent = '-';
        showDebug('خواندن سوابق: ' + e.message);
    }
}

byId('employeeSelect').onchange = function (e) {
    const empId = e.target.value;
    byId('debugBox').classList.add('hidden');
    byId('healthSummaryCard').classList.toggle('hidden', !empId);
    byId('visitFormContainer').classList.toggle('hidden', !empId);
    if (empId) loadSummary(empId);
};

byId('isReferred').onchange = function (e) {
    const input = byId('referralDestination');
    input.classList.toggle('hidden', !e.target.checked);
    if (!e.target.checked) input.value = '';
};

byId('clinicForm').onsubmit = async function (e) {
    e.preventDefault();
    const empId = byId('employeeSelect').value;
    if (!empId) { alert('لطفاً ابتدا یک پرسنل را از لیست انتخاب کنید.'); return; }

    const btn = byId('submitBtn');
    btn.disabled = true;
    btn.textContent = 'در حال ثبت...';

    const newVisit = {
        employee_id: empId,
        visit_reason: byId('visitReason').value,
        blood_pressure: byId('bloodPressure').value.trim() || null,
        chief_complaint: byId('chiefComplaint').value.trim() || null,
        treatments_given: byId('treatmentsGiven').value.trim() || null,
        is_referred: byId('isReferred').checked,
        referral_destination: byId('referralDestination').value.trim() || null
    };

    try {
        const res = await fetch(SB_URL + '/rest/v1/clinic_visits', {
            method: 'POST',
            headers: Object.assign({}, SB_HEADERS, { 'Content-Type': 'application/json', Prefer: 'return=representation' }),
            body: JSON.stringify(newVisit)
        });
        if (!res.ok) throw new Error(await res.text());

        alert('مراجعه با موفقیت در سیستم ثبت شد.');
        byId('clinicForm').reset();
        byId('referralDestination').classList.add('hidden');
        loadSummary(empId);
    } catch (err) {
        showDebug(err.message);
        alert('خطا در ثبت اطلاعات: ' + err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = 'ثبت نهایی مراجعه در سیستم';
    }
};

loadEmployees();
</script>
