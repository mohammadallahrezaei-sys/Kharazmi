<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>گزارش واحدها برای Outlook - نرم‌افزار جامع HSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<link rel="stylesheet" href="hse_ui.css">
<style>.pv{background:#fff;border-radius:10px;padding:10px;overflow-x:auto;margin-top:8px}.sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.sub input{flex:1;min-width:200px}</style>
</head>
<body>
<div class="w">
  <div class="top">
    <div><h1>✉️ گزارش واحدها برای Outlook</h1><p>کارنامه‌ی ماهانه‌ی هر واحد با اقدام‌های پیشنهادی — کپی کنید و در Outlook بچسبانید</p></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><select id="mSel" style="width:auto"></select><select id="uSel" style="width:auto"></select><a class="btn" href="evaluation.html">ارزیابی واحدها</a><a class="btn" href="index.html">← بازگشت</a></div>
  </div>
  <div id="err" class="err"></div>
  <div id="out"><div class="card">در حال بارگذاری...</div></div>
</div>
<script src="eval_core.js"></script>
<script>
const {esc,fa,getAll,jk,monthKeys,monthLabel,loadEval,compute,ZONES,PARAM,unitMatcher}=HSE;
const $=id=>document.getElementById(id);
const TODAY=new Date().toISOString().slice(0,10),dd=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const fday=d=>{try{return new Date(String(d).slice(0,10)+'T00:00:00').toLocaleDateString('fa-IR',{dateStyle:'medium'})}catch(e){return d||''}};
const n1=v=>fa(Math.round(v*10)/10);
const ZC=['#059669','#0284c7','#d97706','#dc2626'];
let B=null,FIN=null,K=null,MAIL={};
$('mSel').innerHTML=monthKeys(12).map(k=>`<option value="${k}">${monthLabel(k)}</option>`).join('');
async function load(){
  [B,FIN]=await Promise.all([loadEval(),getAll('findings?select=status,created_at,due_date,location,question,severity')]);
  if(!B.units){$('err').style.display='block';$('err').textContent='جدول واحدها پیدا نشد. فایل hse_eval_setup.sql را در Supabase اجرا کنید.';$('out').innerHTML='';return}
  $('uSel').innerHTML='<option value="">همه‌ی واحدها</option>'+B.units.filter(u=>u.active!==false).slice().sort((a,b)=>a.name.localeCompare(b.name,'fa')).map(u=>`<option value="${esc(u.id)}">${esc(u.name)}</option>`).join('');
  draw();
}
const td=(a,b)=>`<td style="border:1px solid #cbd5e1;padding:4px 8px;background:#f8fafc;color:#475569;font-size:12px">${a}</td><td style="border:1px solid #cbd5e1;padding:4px 8px;font-size:13px"><b>${b}</b></td>`;
function build(r,p,fnd,K){
  const u=r.u,hi=u.manager?`جناب آقای/خانم ${esc(u.manager)}`:'سرپرست محترم',M=monthLabel(K),act=[];
  const over=fnd.filter(f=>(f.due_date?dd(TODAY,f.due_date):dd(TODAY,f.created_at.slice(0,10))-14)>0);
  if(r.entered){
    if(r.part<PARAM.PART_T||r.part===0)act.push(`مشارکت واحد پایین است (${n1(r.part)} از حداقل ${fa(PARAM.PART_T)}). تا پایان ماه آینده حداقل ${fa(Math.max(1,Math.ceil(r.C/10)))} کارت خطر یا شبه‌حادثه از نفرات واحد دریافت و به HSE تحویل شود.`);
    if(!r.talks)act.push('یک جلسه‌ی کوتاه ایمنی (۵ تا ۱۰ دقیقه) با نفرات واحد برگزار و به HSE اطلاع داده شود.');
    if(r.ppe)act.push(`${fa(r.ppe)} مورد عدم استفاده از وسایل حفاظت فردی (PPE) مشاهده شد؛ لطفاً با نفرات مربوطه پیگیری شود.`);
    if(r.unsafe)act.push(`${fa(r.unsafe)} مورد رفتار ناایمن مشاهده شد؛ لطفاً در جلسه‌ی کاری با نفرات مرور شود.`);
  }
  if(over.length)act.push(`${fa(over.length)} عدم‌انطباق باز از مهلت گذشته است؛ لطفاً رفع کرده و به HSE اطلاع دهید.`);
  else if(fnd.length)act.push(`${fa(fnd.length)} عدم‌انطباق در مهلت باز است؛ لطفاً تا سررسید رفع شود.`);
  if(r.ac)act.push('حادثه‌ای در این ماه ثبت شده؛ اقدام اصلاحی آن با HSE هماهنگ و اجرا شود.');
  if(r.entered&&r.zone===0)act.push('عملکرد واحد در ناحیه‌ی «الگو» است. از همکاران تشکر می‌کنیم؛ لطفاً روند ادامه یابد.');
  if(!act.length)act.push('مورد خاصی برای اقدام وجود ندارد.');
  const pe=p&&p.entered?p:null;
  const score=r.entered?`<table style="width:100%;border-collapse:collapse;margin:8px 0"><tr><td style="padding:8px;text-align:center;border:1px solid #cbd5e1"><div style="font-size:11px;color:#475569">شاخص ایمنی</div><div style="font-size:24px;font-weight:bold">${n1(r.safety)}</div>${pe?`<div style="font-size:11px;color:#64748b">ماه قبل ${n1(pe.safety)}</div>`:''}</td><td style="padding:8px;text-align:center;border:1px solid #cbd5e1"><div style="font-size:11px;color:#475569">شاخص مشارکت</div><div style="font-size:24px;font-weight:bold">${n1(r.part)}</div>${pe?`<div style="font-size:11px;color:#64748b">ماه قبل ${n1(pe.part)}</div>`:''}</td><td style="padding:8px;text-align:center;border:1px solid #cbd5e1;color:${ZC[r.zone]}"><div style="font-size:11px;color:#475569">ناحیه</div><div style="font-size:14px;font-weight:bold">${ZONES[r.zone]}</div></td></tr></table>`:'<div style="padding:8px;background:#fef9c3;border:1px solid #fde68a;font-size:12px;margin:8px 0">امتیاز ایمنی و مشارکت واحد پس از تکمیل ارزیابی ماهانه اعلام می‌شود.</div>';
  const lst=fnd.slice().sort((a,b)=>(a.due_date||'9').localeCompare(b.due_date||'9')).slice(0,8).map(f=>{const o=(f.due_date?dd(TODAY,f.due_date):dd(TODAY,f.created_at.slice(0,10))-14)>0;return`<li style="margin:2px 0">${esc(f.question||'—')} — ${esc(f.location||'')}${f.due_date?' (مهلت '+fday(f.due_date)+')':''}${o?' <b style="color:#dc2626">معوق</b>':''}</li>`}).join('');
  const html=`<div dir="rtl" style="font-family:Tahoma,Arial,sans-serif;font-size:13px;line-height:1.9;color:#0f172a;max-width:640px;text-align:right">
<p style="margin:0 0 6px">${hi}، سلام و احترام</p>
<p style="margin:0 0 6px">کارنامه‌ی HSE واحد <b>${esc(u.name)}</b> برای <b>${M}</b> به شرح زیر است:</p>
${score}
<table style="width:100%;border-collapse:collapse;margin:6px 0"><tr>${td('نفرات',fa(r.C))}${td('کارت خطر',fa(r.hz))}${td('شبه‌حادثه',fa(r.nm))}</tr><tr>${td('پیشنهاد',fa(r.sg))}${td('جلسه‌ی ایمنی',fa(r.talks))}${td('حوادث (جزئی)',fa(r.ac)+' ('+fa(r.ak)+')')}</tr>${r.entered?`<tr>${td('عدم استفاده از PPE',fa(r.ppe))}${td('رفتار ناایمن',fa(r.unsafe))}${td('روز از دست‌رفته',fa(r.lost))}</tr>`:''}</table>
${fnd.length?`<p style="margin:8px 0 2px"><b>عدم‌انطباق‌های باز واحد:</b></p><ul style="margin:0;padding-inline-start:20px">${lst}</ul>`:''}
<p style="margin:8px 0 2px"><b>اقدام‌های پیشنهادی:</b></p><ol style="margin:0;padding-inline-start:20px">${act.map(a=>`<li style="margin:2px 0">${a}</li>`).join('')}</ol>
<p style="margin:10px 0 0">با تشکر — واحد HSE</p></div>`;
  const text=`${hi}، سلام\nکارنامه HSE واحد ${u.name} - ${M}\n`+(r.entered?`شاخص ایمنی ${n1(r.safety)} | مشارکت ${n1(r.part)} | ${ZONES[r.zone]}\n`:'')+act.map((a,i)=>`${fa(i+1)}. ${a}`).join('\n')+'\nواحد HSE';
  return{html,text,subject:`کارنامه HSE واحد ${u.name} — ${M}`};
}
function draw(){
  K=$('mSel').value;const R=compute(K,B),Pv=compute(prevK(K),B),sel=$('uSel').value,match=unitMatcher(B.units);
  const byU={};(FIN||[]).filter(f=>f.status==='open').forEach(f=>{const u=match(f.location);if(u)(byU[u.id]=byU[u.id]||[]).push(f)});
  const rows=R.rows.filter(r=>!sel||r.u.id===sel);MAIL={};
  $('out').innerHTML=rows.length?rows.map((r,i)=>{const p=Pv.rows.find(x=>x.u.id===r.u.id),m=build(r,p,byU[r.u.id]||[],K);MAIL[r.u.id]=m;
   return`<div class="card"><div class="sub"><b>${esc(r.u.name)}</b><span class="mu">${esc(r.u.manager||'بدون مسئول')}</span><span style="flex:1"></span><button data-c="${esc(r.u.id)}" class="p">📋 کپی برای Outlook</button><button data-s="${esc(r.u.id)}">کپی موضوع</button><button data-p="${esc(r.u.id)}">🖨 چاپ</button></div><div class="pv">${m.html}</div></div>`}).join(''):'<div class="card mu">واحدی برای نمایش نیست.</div>';
}
const prevK=K=>{let y=+K.slice(0,4),m=+K.slice(5)-1;if(m<1){m=12;y--}return y+'-'+String(m).padStart(2,'0')};
async function copyHTML(html,text){
  try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);return true}catch(e){}
  try{const d=document.createElement('div');d.contentEditable='true';d.innerHTML=html;d.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(d);const rg=document.createRange();rg.selectNodeContents(d);const s=getSelection();s.removeAllRanges();s.addRange(rg);const ok=document.execCommand('copy');s.removeAllRanges();d.remove();return ok}catch(e){return false}
}
$('out').addEventListener('click',async ev=>{const t=ev.target,id=t.dataset.c||t.dataset.s||t.dataset.p;if(!id)return;const m=MAIL[id];
  if(t.dataset.c){const ok=await copyHTML(m.html,m.text);const o=t.textContent;t.textContent=ok?'✓ کپی شد — در Outlook بچسبانید':'کپی نشد؛ متن را دستی انتخاب کنید';setTimeout(()=>t.textContent=o,2500)}
  else if(t.dataset.s){try{await navigator.clipboard.writeText(m.subject);t.textContent='✓ کپی شد'}catch(e){prompt('موضوع ایمیل:',m.subject)}setTimeout(()=>t.textContent='کپی موضوع',2000)}
  else{const w=window.open('','_blank');if(!w){alert('اجازه‌ی باز شدن پنجره را بدهید.');return}w.document.write(`<html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>${esc(m.subject)}</title></head><body style="margin:20px">${m.html}<script>setTimeout(()=>print(),300)<\/script></body></html>`);w.document.close()}});
$('mSel').onchange=draw;$('uSel').onchange=draw;
load();
</script>
</body>
</html>
