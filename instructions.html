<!doctype html><html lang="fa" dir="rtl"><head><meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"><script src="auth.js"></script><script src="hse_nav.js" defer="defer"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کتابخانه دستورالعمل‌ها - نرم‌افزار جامع HSE</title><link rel="stylesheet" href="hse_ui.css"><style>.w{max-width:900px;margin:0 auto;padding:14px}.mu{color:var(--mu);font-size:12px}.c2{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0}.t{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.bg{display:inline-block;border-radius:99px;padding:1px 10px;font-size:11px;border:1px solid var(--bd);color:var(--mu)}a.dl{display:inline-block;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px;font-size:13px;text-decoration:none}a.dl.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input,select{font:inherit;font-size:13px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);padding:7px 9px}h2{font-size:14px;margin:16px 0 4px}</style></head><body><div class="w"><h1 style="">📚 کتابخانه دستورالعمل‌های HSE</h1><div class="mu">هر دستورالعمل در دو قالب: <b>تک‌برگی</b> (PDF برای چاپ و نصب در محل کار، و Word برای ویرایش) و <b>کامل</b> (Word). کد و تاریخ بازنگری روی خود فایل‌ها درج شده است.</div><div class="row" style=""><input id="q" placeholder="جستجو: عنوان یا کد…" style=""><select id="g"><option value="">همهٔ گروه‌ها</option></select></div><div id="n" class="mu"></div><div id="list"></div></div><script>const $=n=>document.querySelector(n),esc=n=>String(n).replace(/[&<>"]/g,n=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[n]));let M=[];function draw(){const n=$("#q").value.trim(),e=$("#g").value,t=M.filter(t=>(!e||t.group===e)&&(!n||(t.title+" "+t.code+" "+(t.long||"")).includes(n)));$("#n").textContent=t.length+" دستورالعمل";const o=[...new Set(t.map(n=>n.group))];$("#list").innerHTML=o.map(n=>"<h2>"+esc(n)+"</h2>"+t.filter(e=>e.group===n).map(n=>`<div class="c2"><div class="t"><div style="flex:1;min-width:220px"><b>${esc(n.title)}</b><div class="mu">کد تک‌برگی ${esc(n.code)}${n.long?" · کد کامل "+esc(n.long):""}</div></div>\n   <div class="row">${n.single?`<a class="dl p" href="instructions/${n.single}.pdf" target="_blank" rel="noopener">🖨 تک‌برگی (PDF)</a><a class="dl" href="instructions/${n.single}.docx" download>تک‌برگی Word</a>`:""}${n.long?`<a class="dl" href="instructions/${n.long}.docx" download>کامل Word</a>`:""}</div></div></div>`).join("")).join("")||'<div class="c2">موردی پیدا نشد.</div>'}fetch("instructions/manifest.json").then(n=>n.json()).then(n=>{M=n;[...new Set(n.map(n=>n.group))].forEach(n=>{const e=document.createElement("option");e.textContent=n;$("#g").appendChild(e)});draw()}).catch(()=>{$("#list").innerHTML='<div class="c2">فهرست دستورالعمل‌ها بارگذاری نشد.</div>'});$("#q").oninput=draw;$("#g").onchange=draw;</script></body></html>
