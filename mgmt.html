      s.v.forEach((v,i)=>{if(v==null)return;g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${s.c}" stroke="var(--card)" stroke-width="1.5"><title>${labels[i]} · ${s.name}: ${fa(v)}</title></circle>`;

  h+=sl('',`<h2>بازرسی و انطباق</h2><div class="sub">بازرسی‌های میدانی HSE و نرخ انطباق چک‌لیست‌ها</div>
   <div class="kg">${kp(fa(c.rounds),'گشت بازرسی',dl(c.rounds,pv('rounds'),'up'))}${kp(fa(c.checks),'مورد کنترل‌شده',dl(c.checks,pv('checks'),'up'))}${kp(c.comp==null?'—':fa(c.comp)+'٪','نرخ انطباق',dl(c.comp,pv('comp'),'up'))}</div>
   <div class="note">نرخ انطباق = موارد منطبق ÷ (منطبق + عدم‌انطباق). جزئیات هر ماه در گزارش دوره‌ای HSE.</div>`);
  const trRows=Object.entries(c.byT).sort((x,y)=>y[1].p-x[1].p).map(([k,o])=>`<tr><td>${TN[k]||k}</td><td>${fa(o.n)}</td><td>${fa(o.p)}</td><td>${fa(Math.round(o.h*10)/10)}</td></tr>`).join('');
  h+=sl('',`<h2>آموزش</h2><div class="sub">آموزش به تفکیک نوع؛ نفر-ساعت = تعداد فراگیر × مدت استاندارد (بدو استخدام ۰٫۵، دوره‌ای ۲، سایر ۰٫۲۵ ساعت)</div>
   <div class="kg">${kp(fa(c.trN),'جلسهٔ آموزشی',dl(c.trN,pv('trN'),'up'))}${kp(fa(c.trP),'نفر آموزش‌دیده (حضور)',dl(c.trP,pv('trP'),'up'))}${kp(fa(Math.round(c.trH*10)/10),'نفر-ساعت',dl(c.trH,pv('trH'),'up'))}</div>
   <table><tr><th>نوع آموزش</th><th>جلسه</th><th>نفر</th><th>نفر-ساعت</th></tr>${trRows||'<tr><td colspan="4" class="mu">آموزشی در این دوره ثبت نشده است</td></tr>'}</table>`);
  h+=sl('',`<h2>کمیتهٔ حفاظت فنی و بهداشت کار و مستندات</h2><div class="sub">برگزاری جلسات، پیگیری مصوبات و ارسال صورتجلسه به مراجع</div>
   <div class="kg">${kp(fa(c.cmN),'جلسه',dl(c.cmN,pv('cmN'),'up'))}${kp(fa(c.ciDone),'اقدام انجام‌شده',dl(c.ciDone,pv('ciDone'),'up'))}${kp(fa(c.ciOn),'در دست اقدام')}${kp(fa(c.ciNew),'مصوبهٔ جدید')}</div>
   <div class="note">صورتجلسه‌ها با قالب رسمی چاپ و اکسل ساخته و برای اداره کار و مرکز بهداشت ارسال و بایگانی می‌شوند.</div>`);
  h+=sl('',`<h2>فرهنگ ایمنی و مشارکت</h2><div class="sub">تشویق و اخطار، کارت‌های خطر و اقدامات روزانهٔ HSE</div>
   <div class="kg">${kp(fa(c.rw),'تشویق',dl(c.rw,pv('rw'),'up'))}${kp(fa(c.wr),'اخطار/تذکر',dl(c.wr,pv('wr'),'down'))}${kp(fa(c.cards),'کارت خطر / شبه‌حادثه',dl(c.cards,pv('cards'),'up'))}${kp(fa(c.wl),'اقدام ثبت‌شده در گزارش روزانه',`<small class="mu">${fa(c.wlPh)} مورد همراه با عکس</small>`)}</div>`);
  const tot=[['مورد عدم‌انطباق',D.fin.length],['بازرسی',D.ins.length],['حادثه',D.inc.length],['جلسهٔ آموزشی',D.tr.length],['حضور آموزشی',D.ta.length],['بند صورتجلسه',D.ci.length],['اقدام روزانه',D.wl.length],['سابقهٔ اخطار/تشویق',D.ek.length]];
  h+=sl('',`<h2>نرم‌افزار جامع HSE خوارزمی</h2><div class="sub">همهٔ کار HSE در یک سامانه: ثبت، پیگیری، هشدار و گزارش خودکار</div>
   <div class="two"><div><b>ماژول‌ها</b><ul><li>چک‌لیست‌های بازرسی و پیگیری عدم‌انطباق با عکس قبل/بعد</li><li>میز کار روزانه، تقویم و وظایف دوره‌ای</li><li>بهداری، حوادث و شاخص‌های AFR / ASR / FSI</li><li>آموزش و فرم‌های چاپی (طرح درس، لیست امضا، پس از حادثه، پیمانکار)</li><li>صورتجلسهٔ کمیته با چاپ و اکسل همان فرم رسمی</li><li>اخطار و تشویق با فرم چاپی و هشدار تکرار</li><li>کارت خطر، ارزیابی واحدها و فرهنگ ایمنی</li><li>گزارش دوره‌ای، اسلایدهای قبل/بعد و گزارش واحدها</li></ul></div>
   <div><b>داده‌های ثبت‌شده در سامانه</b><table>${tot.map(([k,v])=>`<tr><td>${k}</td><td><b>${fa(v)}</b></td></tr>`).join('')}</table></div></div>`);
  h+=sl('',`<h2>پیام کلیدی و تصمیم‌های لازم از مدیریت</h2><div class="sub">این دو کادر را قبل از ارائه تکمیل کنید (فقط در همین مرورگر ذخیره می‌شود)</div>
   <b>پیام کلیدی</b><textarea id="msg" data-k="msg" placeholder="مثلاً: روند اصلاحات رو به بهبود است ولی پشتوانهٔ باز و آموزش پرسنل خط تولید نیازمند حمایت است.">${esc(LS('msg'))}</textarea>
   <b style="display:block;margin-top:12px">تصمیم‌ها و منابع مورد نیاز (هر خط یک مورد)</b><textarea id="ask" data-k="ask" placeholder="مثلاً: بودجهٔ تعویض سقف سولهٔ ۵&#10;تخصیص نیروی اجرایی برای ۳۷۰ مورد عدم‌انطباق باز&#10;تعیین نمایندهٔ ایمنی در هر سوله">${esc(LS('ask'))}</textarea>`);
  $('out').innerHTML=h;
  $('st').textContent=D.miss.length?'⚠ دریافت این جدول‌ها ناموفق بود: '+D.miss.join('، '):'';
  document.querySelectorAll('textarea[data-k]').forEach(t=>t.oninput=()=>{SV(t.dataset.k,t.value);const l=document.getElementById('lst');if(l)l.remove()})
}
const $=id=>document.getElementById(id);
(async()=>{await load();const ps=PRESETS();$('per').innerHTML=ps.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');$('per').onchange=render;render()})();
</script>
</body>
