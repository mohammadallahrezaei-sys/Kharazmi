  const tot=[['مورد عدم‌انطباق',D.fin.length],['بازرسی',D.ins.length],['حادثه (استعلاجی و بدون استعلاجی)',D.I.length],['جلسهٔ آموزشی',D.tr.length],['حضور آموزشی',D.ta.length],['بند صورتجلسه',D.ci.length],['اقدام روزانه',D.wl.length],['سابقهٔ اخطار/تشویق',D.ek.length]];
  h+=sl('',`<h2>نرم‌افزار جامع HSE خوارزمی</h2><div class="sub">همهٔ کار HSE در یک سامانه: ثبت، پیگیری، هشدار و گزارش خودکار</div>
   <div class="two"><div><b>ماژول‌ها</b><ul><li>چک‌لیست‌های بازرسی و پیگیری عدم‌انطباق با عکس قبل/بعد</li><li>میز کار روزانه، تقویم و وظایف دوره‌ای</li><li>بهداری، حوادث و شاخص‌های AFR / ASR / FSI</li><li>آموزش و فرم‌های چاپی (طرح درس، لیست امضا، پس از حادثه، پیمانکار)</li><li>صورتجلسهٔ کمیته با چاپ و اکسل همان فرم رسمی</li><li>اخطار و تشویق با فرم چاپی و هشدار تکرار</li><li>کارت خطر، ارزیابی واحدها و فرهنگ ایمنی</li><li>گزارش دوره‌ای، اسلایدهای قبل/بعد و گزارش واحدها</li></ul></div>
   <div><b>داده‌های ثبت‌شده در سامانه</b><table>${tot.map(([k,v])=>`<tr><td>${k}</td><td><b>${fa(v)}</b></td></tr>`).join('')}</table></div></div>`);
  h+=sl('',`<h2>پیام کلیدی و تصمیم‌های لازم از مدیریت</h2><div class="sub">این دو کادر را قبل از ارائه تکمیل کنید (فقط در همین مرورگر ذخیره می‌شود)</div>
   <b>پیام کلیدی</b><textarea id="msg" data-k="msg" placeholder="مثلاً: روند اصلاحات رو به بهبود است ولی پشتوانهٔ باز و آموزش پرسنل خط تولید نیازمند حمایت است.">${esc(LS('msg'))}</textarea>
   <b style="display:block;margin-top:12px">تصمیم‌ها و منابع مورد نیاز (هر خط یک مورد)</b><textarea id="ask" data-k="ask" placeholder="مثلاً: بودجهٔ تعویض سقف سولهٔ ۵&#10;تخصیص نیروی اجرایی برای عدم‌انطباق‌های باز&#10;تعیین نمایندهٔ ایمنی در هر سوله">${esc(LS('ask'))}</textarea>`);
  $('out').innerHTML=h;
  $('st').textContent=D.miss.length?'⚠ دریافت این جدول‌ها ناموفق بود: '+D.miss.join('، '):'';
  document.querySelectorAll('textarea[data-k]').forEach(t=>t.oninput=()=>SV(t.dataset.k,t.value))
}
const $=id=>document.getElementById(id);
(async()=>{await load();const ps=PRESETS();$('per').innerHTML=ps.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');$('per').onchange=render;$('cmp').onchange=render;render()})();
</script>
