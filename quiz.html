<!doctype html><html lang="fa" dir="rtl"><head><meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"><script src="auth.js"></script><script src="hse_nav.js" defer="defer"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آزمون ماهانهٔ ایمنی - نرم‌افزار جامع HSE</title><link rel="stylesheet" href="hse_ui.css"><style>.w{max-width:820px;margin:0 auto;padding:14px}.mu{color:var(--mu);font-size:12px}.c2{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0}.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1}.bt{font:inherit;font-size:13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px;cursor:pointer}.bt.on,.bt.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}.qo{display:block;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin:5px 0;cursor:pointer}.qo:has(input:checked){border-color:var(--ac);background:rgba(13,148,136,.08)}.qo.ok{border-color:#16a34a;background:rgba(22,163,74,.12)}.qo.bad{border-color:#dc2626;background:rgba(220,38,38,.1)}.big{font-size:34px;font-weight:800}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:right}.badge{display:inline-block;border-radius:99px;padding:1px 10px;font-size:11px;border:1px solid var(--bd)}</style></head><body><div class="w"><h1 style="">🎯 آزمون ماهانهٔ ایمنی</h1><div class="mu">۱۰ سؤال تخصصی (سناریو، محاسبه و استاندارد) برای کارشناسان HSE؛ از روز ۲۵ هر ماه شمسی تا آخر ماه باز است. نمره از ۲۰ و فقط یک‌بار در ماه ثبت می‌شود.</div><div id="mth" class="mu" style=""></div><div class="tabs"><button class="bt on" data-t="exam">آزمون</button><button class="bt" data-t="res">نتایج</button></div><div id="pane"></div></div><script src="eval_core.js"></script><script src="safety_bank.js"></script><script src="quiz_core.js"></script><script>const $=t=>document.querySelector(t),esc=t=>String(t).replace(/[&<>"]/g,t=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[t]));const fa=t=>Number(t).toLocaleString("fa-IR",{maximumFractionDigits:1});const B=window.SAFETY_BANK,Q=window.HSEQ,TODAY=HSEToday(),KEY=Q.monthKey(TODAY);let ME="",NAME="",MGR=false,TAB="exam",MINE,DBOK=true,PRACTICE=false;const nm=t=>HSEAuth.EXPERTS&&HSEAuth.EXPERTS[t]||(t||"").split("@")[0];async function rq(t,e={}){const a=await fetch(Q.SB+t,{...e,headers:{"Content-Type":"application/json",Prefer:"return=representation",...e.headers||{}}});if(!a.ok)throw new Error((await a.text()).slice(0,250));const s=await a.text();return s?JSON.parse(s):null}function notable(){return'<div class="c2" style="border-color:#dc2626">جدول نتایج ساخته نشده؛ فایل <b>hse_quiz.sql</b> را یک‌بار در Supabase SQL Editor اجرا کنید. تا آن موقع آزمون فقط به‌صورت تمرین (بدون ثبت نمره) ممکن است.</div>'}function paintExam(t,e,a){return t.map((t,s)=>{const n=t.q;return`<div class="c2"><b>${fa(s+1)}. ${esc(n.q)}</b>`+t.ord.map(t=>{let c="";if(a){c=t===n.a?" ok":e[s]===t?" bad":""}return`<label class="qo${c}"><input type="radio" name="q${s}" value="${t}"${e[s]===t?" checked":""}${a?" disabled":""}> ${esc(n.o[t])}</label>`}).join("")+(a?`<div class="mu" style="margin-top:6px">${esc(n.e||"")}${n.r?' <span class="badge">مرجع: '+esc(n.r)+"</span>":""}${n.d?' <a href="instructions/'+n.d+'-1p.pdf" target="_blank" rel="noopener">'+esc(B.docs[n.d]||n.d)+"</a>":""}</div>`:"")+"</div>"}).join("")}async function exam(){const t=$("#pane");if(MINE===undefined){DBOK=false}const e=Q.isOpen(TODAY);const a=Q.monthName(KEY);if(MINE){const e=Q.pick(KEY,B),s=MINE.answers||[];t.innerHTML=`<div class="c2" style="text-align:center"><div class="mu">نمرهٔ شما در آزمون ${esc(a)}</div><div class="big">${fa(MINE.score)} <span class="mu" style="font-size:14px">از ۲۰</span></div><div class="mu">${fa(MINE.correct)} پاسخ درست از ${fa(MINE.total)}</div></div>`+paintExam(e,s,true);return}if(!e&&!PRACTICE){const e=Q.OPEN_DAY-Q.jal(TODAY).d;t.innerHTML=(DBOK?"":notable())+`<div class="c2">آزمون ${esc(a)} از روز ${fa(Q.OPEN_DAY)}ام باز می‌شود (${fa(e)} روز دیگر). تا آن روز هر روز در صفحهٔ اصلی ۳ نکتهٔ تخصصی و یک چالش می‌بینید.<div style="margin-top:8px"><button class="bt" id="pr">تمرین آزاد (نمره ثبت نمی‌شود)</button></div></div>`;$("#pr").onclick=()=>{PRACTICE=true;exam()};return}const s=PRACTICE&&!e?Q.pick("prac"+Date.now()%1e5,B):Q.pick(KEY,B);const n=!PRACTICE&&DBOK;t.innerHTML=(n||PRACTICE?"":notable())+`<div class="c2 mu">${PRACTICE&&!e?"حالت تمرین — نمره ثبت نمی‌شود.":n?"آزمون ماه "+esc(a)+" — فقط یک‌بار می‌توانید شرکت کنید.":"ثبت نتیجه در دسترس نیست؛ تمرین."}</div><div id="qs">${paintExam(s,[],false)}</div><button class="bt p" id="sub" style="width:100%">ثبت پاسخ‌ها و دریافت نمره</button>`;$("#sub").onclick=async()=>{const t=s.map((t,e)=>{const a=document.querySelector(`input[name=q${e}]:checked`);return a?+a.value:null});const e=t.filter(t=>t===null).length;if(e&&!confirm(e+" سؤال بی‌پاسخ است و غلط حساب می‌شود. ثبت شود؟"))return;const a=t.filter((t,e)=>t===s[e].q.a).length,c=Q.score(a,s.length);$("#sub").disabled=true;if(n){try{await rq("hse_quiz_results",{method:"POST",body:JSON.stringify({email:ME,user_name:NAME,month:KEY,score:c,correct:a,total:s.length,answers:t})});MINE={score:c,correct:a,total:s.length,answers:t,month:KEY}}catch(t){alert("ثبت نشد: "+t.message+"\nاگر قبلاً شرکت کرده‌اید، صفحه را تازه کنید.");$("#sub").disabled=false;return}exam();window.scrollTo(0,0)}else{$("#pane").innerHTML=`<div class="c2" style="text-align:center"><div class="mu">نمرهٔ تمرین (ثبت نشد)</div><div class="big">${fa(c)} <span class="mu" style="font-size:14px">از ۲۰</span></div></div>`+paintExam(s,t,true)+`<button class="bt" onclick="PRACTICE=false;exam()">بازگشت</button>`;window.scrollTo(0,0)}}}async function results(){const t=$("#pane");t.innerHTML='<div class="c2 mu">در حال بارگذاری…</div>';let e=[];try{e=await HSEDB.getAll("hse_quiz_results?select=email,user_name,month,score,correct,total,taken_at&order=month.desc")}catch(e){t.innerHTML=notable();return}const a=e.filter(t=>t.email===ME);let s=`<div class="c2"><b>نتایج من</b>`+(a.length?`<table><tr><th>ماه</th><th>نمره از ۲۰</th><th>درست</th></tr>`+a.map(t=>`<tr><td>${esc(Q.monthName(t.month))}</td><td><b>${fa(t.score)}</b></td><td>${fa(t.correct)} از ${fa(t.total)}</td></tr>`).join("")+"</table>":'<div class="mu">هنوز در آزمونی شرکت نکرده‌اید.</div>')+"</div>";if(MGR){const t=[...new Set(e.map(t=>t.month))];s+=`<div class="c2"><b>نتایج همهٔ کاربران</b> (فقط مدیر)`+(t.length?t.map(t=>{const a=e.filter(e=>e.month===t).sort((t,e)=>e.score-t.score),s=a.reduce((t,e)=>t+Number(e.score),0)/a.length;return`<div style="margin-top:8px"><span class="badge">${esc(Q.monthName(t))}</span> میانگین <b>${fa(s)}</b> · ${fa(a.length)} نفر<table><tr><th>نام</th><th>نمره</th><th>درست</th><th>تاریخ</th></tr>`+a.map(t=>`<tr><td>${esc(t.user_name||nm(t.email))}</td><td><b>${fa(t.score)}</b></td><td>${fa(t.correct)} از ${fa(t.total)}</td><td>${new Date(t.taken_at).toLocaleDateString("fa-IR",{timeZone:"Asia/Tehran"})}</td></tr>`).join("")+"</table></div>"}).join(""):'<div class="mu">هنوز نتیجه‌ای ثبت نشده.</div>')+'<div class="mu" style="margin-top:8px">برای دادن فرصت دوباره به یک نفر، ردیفش را در جدول hse_quiz_results پاک کنید.</div></div>'}t.innerHTML=s}function show(){document.querySelectorAll(".tabs button").forEach(t=>t.classList.toggle("on",t.dataset.t===TAB));TAB==="exam"?exam():results()}document.querySelectorAll(".tabs button").forEach(t=>t.onclick=()=>{TAB=t.dataset.t;show()});HSEAuth.ready.then(async()=>{try{$("#mth").innerHTML="<b>موضوع‌های این ماه (سؤال‌های آزمون فقط از همین‌ها):</b> "+Q.monthThemes(KEY,B).map(t=>esc(B.themes[t].title)).join("، ")}catch(t){}ME=HSEAuth.email;NAME=nm(ME);MGR=HSEAuth.role==="manager";if(MGR&&!HSEAuth.EXPERTS[ME])NAME="مدیر HSE";MINE=await Q.mine(ME,KEY);show()});</script></body></html>
