<!doctype html>
<html lang="fa" dir="rtl">
<head>
     <script src="auth.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>میز کار HSE - نرم‌افزار جامع HSE</title>
<link rel="stylesheet" href="hse_ui.css">
<style>
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.tile{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;border-right:4px solid var(--bd)}
.tile b{font-size:22px;display:block;line-height:1.3}.tile span{font-size:11px;color:var(--mu)}
.tile.r{border-right-color:var(--bad)}.tile.y{border-right-color:var(--wa)}.tile.g{border-right-color:var(--ok)}
.it{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border-bottom:0}.it small{display:block;color:var(--mu);font-size:11px}
.bd{font-size:11px;padding:1px 8px;border-radius:99px;white-space:nowrap;align-self:flex-start;border:1px solid}
.bd.r{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,transparent)}.bd.y{color:var(--wa);border-color:color-mix(in srgb,var(--wa) 55%,transparent)}.bd.g{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.hero .bad{color:var(--bad)}.hero .wa{color:var(--wa)}.hero .ok,.clean .wa{color:var(--ok)}.clean .wa{color:var(--wa)}
button.tile{width:100%;text-align:right;font:inherit;cursor:pointer}
.tile.on{outline:2px solid var(--ac);outline-offset:1px}
.tile small{display:block;font-size:10px;color:var(--mu)}
.hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hero b{font-size:34px;line-height:1.2}.hero span{color:var(--mu);font-size:13px}
.clean{font-size:12px;color:var(--mu);margin:2px 0 10px}
.clean b{color:var(--ok);font-weight:600}
.pn{margin-bottom:12px}
.pn h2{display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 a{font-size:11px;font-weight:400;margin-inline-start:8px;color:var(--mu)}
</style>
</head>
<body>
<div class="w">
  <div class="top">
    <div><h1>🧭 میز کار HSE</h1><p>اول ببینید چه چیزی معوق است؛ روی هر کارت بزنید تا فهرستش باز شود — <span id="today"></span></p></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="p" onclick="load()">🔄 به‌روزرسانی</button><a class="btn" href="index.html">← بازگشت</a></div>
  </div>
  <div id="hero" class="hero"></div>
  <div id="tiles" class="tiles"></div>
  <div id="clean" class="clean"></div>
  <div id="secs"><div class="card">در حال بارگذاری...</div></div>
</div>
<script src="eval_core.js"></script>
<script>
const {esc,fa,getAll,monthKeys}=HSE;
const $=id=>document.getElementById(id);
const TODAY=new Date().toISOString().slice(0,10);
$('today').textContent=new Date().toLocaleDateString('fa-IR',{dateStyle:'full'});
const dd=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const fday=d=>{try{return new Date(String(d).slice(0,10)+'T00:00:00').toLocaleDateString('fa-IR',{dateStyle:'medium'})}catch(e){return d||''}};
/* ---- تاریخ شمسی ماژول تجهیزات (همان توابع آن ماژول) ---- */
const div=(a,b)=>~~(a/b),mod=(a,b)=>a-~~(a/b)*b;
const BRK=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy){let bl=BRK.length,gy=jy+621,leapJ=-14,jp=BRK[0],jm,jump=0,leap,leapG,march,n,i;
  if(jy<jp||jy>=BRK[bl-1])throw new Error('x');
  for(i=1;i<bl;i++){jm=BRK[i];jump=jm-jp;if(jy<jm)break;leapJ+=div(jump,33)*8+div(mod(jump,33),4);jp=jm}
  n=jy-jp;leapJ+=div(n,33)*8+div(mod(n,33)+3,4);if(mod(jump,33)===4&&jump-n===4)leapJ++;
  leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;
  if(jump-n<6)n=n-jump+div(jump+4,33)*33;leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;return{leap,gy,march}}
function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;return d}
function j2d(jy,jm,jd){const r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1}
const monthLen=(y,m)=>m<=6?31:(m<=11?30:(jalCal(y).leap===0?30:29));
const p2=n=>String(n).padStart(2,'0'),fmtJ=(y,m,d)=>`${y}/${p2(m)}/${p2(d)}`;
const nDig=s=>String(s||'').replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).trim();
function parseJ(s){const m=/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/.exec(nDig(s));if(!m)return null;const y=+m[1],mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||y<1300||y>1500||d>monthLen(y,mo))return null;return{y,m:mo,d}}
const jdnOf=s=>{const p=parseJ(s);return p?j2d(p.y,p.m,p.d):null};
function addMonthsJ(s,n){const p=parseJ(s);if(!p)return null;const t=p.y*12+(p.m-1)+n,y=div(t,12),m=mod(t,12)+1;return fmtJ(y,m,Math.min(p.d,monthLen(y,m)))}
const T=new Date(),TODAY_JDN=g2d(T.getFullYear(),T.getMonth()+1,T.getDate());
/* ---- ساخت بخش‌ها ---- */
const SECS=[];
function sec(id,title,link,items,note){SECS.push({id,title,link,items,note})}
const row=(t,sub,badge,cls)=>`<div class="it"><div>${t}<small>${sub||''}</small></div><span class="bd ${cls}">${badge}</span></div>`;
async function load(){
  SECS.length=0;$('secs').innerHTML='<div class="card">در حال بارگذاری...</div>';
  const [fin,inc,fu,emp,eq,ins,cards,units,mon,cul,rk]=await Promise.all([
    getAll('findings?select=id,status,created_at,due_date,location,question,severity,module,risk_id'),
    getAll('clinic_incidents?select=incident_date,body_part,corrective_action,action_status,action_due_date,location'),
    getAll('clinic_followups?select=*'),getAll('employees?select=id,emp_id,first_name,last_name,department,termination_date'),
    getAll('equipment?select=code,category,title,hall,location,active,requires_inspection,interval_months'),
    getAll('equipment_inspections?select=equipment_code,inspected_on,result,next_due,defects'),
    getAll('hse_cards?select=card_type,card_date,status,unit,description,reporter_name'),
    getAll('hse_units?select=id,name,active,aliases,manager'),getAll('hse_unit_monthly?select=unit_id,month_key'),
    getAll('culture_assessments?select=assessed_at'),getAll('risks?select=*&status=neq.archived')]);
  const RM={};(rk||[]).forEach(r=>RM[r.id]=r);
  // ۰) ریسک‌های نیازمند اقدام
  if(rk){
    const L=[];rk.forEach(r=>{const t=esc(r.hazard),sub=esc(r.unit)+' · امتیاز '+fa(r.score);
      if(r.status==='draft')L.push({k:r.high?'r':'y',s:r.score,h:row(t,sub,'در انتظار تأیید',r.high?'r':'y')});
      if(r.review_date&&r.review_date<TODAY)L.push({k:'r',s:r.score,h:row(t,sub,'بازبینی معوق','r')});
      if(r.high&&r.method!=='reba'&&r.method!=='rula'&&!(r.existing_controls||'').trim())L.push({k:'r',s:r.score,h:row(t,sub,'بدون کنترل فعلی','r')})});
    L.sort((a,b)=>b.s-a.s);sec('rk','ریسک‌های نیازمند اقدام','risks.html',L);
  } else sec('rk','ریسک‌های نیازمند اقدام','risks.html',null);
  // ۱) عدم‌انطباق‌های باز
  if(fin){
    const L=fin.filter(x=>x.status==='open'&&x.module!=='MED').map(x=>{const over=x.due_date?dd(TODAY,x.due_date):dd(TODAY,x.created_at.slice(0,10))-14;return{x,over}}).sort((a,b)=>((RM[b.x.risk_id]||{}).high?1:0)-((RM[a.x.risk_id]||{}).high?1:0)||b.over-a.over||(b.x.severity||0)-(a.x.severity||0));
    sec('fin','عدم‌انطباق‌های باز','checklists.html',L.map(({x,over})=>({k:over>0?'r':'y',h:row(esc(x.question||'—'),`${esc(x.location||'')} · ثبت: ${fday(x.created_at)}${x.severity?' · شدت '+fa(x.severity):''}${RM[x.risk_id]?' · ریسک '+fa(RM[x.risk_id].score):''}`,over>0?fa(over)+' روز معوق':(x.due_date?'تا '+fday(x.due_date):'در مهلت'),over>0?'r':'y')})),'پیگیری در «پیگیری عدم‌انطباق‌ها»');
  } else sec('fin','عدم‌انطباق‌های باز','checklists.html',null);
  // ۲) اقدام اصلاحی حوادث
  if(inc){
    const L=inc.filter(x=>x.corrective_action&&x.action_status!=='done').map(x=>({x,over:x.action_due_date?dd(TODAY,x.action_due_date):0})).sort((a,b)=>b.over-a.over);
    sec('inc','اقدام اصلاحی حوادث (باز)','clinic.html',L.map(({x,over})=>({k:over>0?'r':'y',h:row(esc(String(x.corrective_action).slice(0,90)),`حادثه ${fday(x.incident_date)}${x.body_part?' · '+esc(x.body_part):''}${x.location?' · '+esc(x.location):''}`,over>0?fa(over)+' روز معوق':(x.action_due_date?'تا '+fday(x.action_due_date):'بدون مهلت'),over>0?'r':'y')})));
  } else sec('inc','اقدام اصلاحی حوادث (باز)','clinic.html',null);
  // ۳) پیگیری طب کار
  if(fu){
    const nm={};(emp||[]).forEach(e=>nm[e.id]=`${e.first_name||''} ${e.last_name||''}`.trim());const gone=new Set((emp||[]).filter(e=>!HSEP.isActive(e)).map(e=>e.id));
    const L=fu.filter(x=>['pending','overdue'].includes(x.status)&&!gone.has(x.employee_id)).map(x=>({x,over:x.due_date?dd(TODAY,x.due_date):(x.status==='overdue'?1:0)})).sort((a,b)=>b.over-a.over);
    sec('fu','پیگیری‌های طب کار (باز)','clinic.html',L.map(({x,over})=>({k:over>0?'r':'y',h:row(esc((nm[x.employee_id]||x.employee_name||'—')),esc(x.reason||x.kind||''),over>0?fa(over)+' روز معوق':(x.due_date?'تا '+fday(x.due_date):'باز'),over>0?'r':'y')})));
  } else sec('fu','پیگیری‌های طب کار (باز)','clinic.html',null);
  // ۴) تجهیزات
  if(eq&&ins){
    const by={};ins.forEach(i=>(by[i.equipment_code]=by[i.equipment_code]||[]).push(i));
    const L=[];
    eq.forEach(e=>{if(!e.active||!e.requires_inspection)return;const l=(by[e.code]||[]).sort((a,b)=>a.inspected_on>b.inspected_on?1:a.inspected_on<b.inspected_on?-1:0),last=l[l.length-1];
      if(!last){L.push({e,st:'none',days:null,pr:3});return}
      const due=last.next_due||(last.result==='عدم تایید'?'':addMonthsJ(last.inspected_on,e.interval_months||12))||'',dj=due?jdnOf(due):null,days=dj!=null?dj-TODAY_JDN:null;
      if(last.result==='عدم تایید')L.push({e,st:'rejected',days,pr:0,due});else if(days!=null&&days<0)L.push({e,st:'overdue',days,pr:1,due});else if(days!=null&&days<=30)L.push({e,st:'soon',days,pr:2,due})});
    L.sort((a,b)=>a.pr-b.pr||(a.days??9999)-(b.days??9999));
    const lbl={rejected:['عدم تایید','r'],overdue:null,soon:null,none:['بدون بازرسی','y']};
    sec('eq','تجهیزات: عدم تایید، سررسید گذشته یا نزدیک','equipment.html',L.map(x=>{const s=x.st==='overdue'?[fa(-x.days)+' روز معوق','r']:x.st==='soon'?['تا '+fa(x.days)+' روز دیگر','y']:lbl[x.st];return{k:s[1],h:row(esc(x.e.title||x.e.code),`${esc(x.e.code)} · ${esc(x.e.hall||x.e.location||'')}${x.due?' · سررسید '+esc(x.due):''}`,s[0],s[1])}}));
  } else sec('eq','تجهیزات','equipment.html',null);
  // ۵) کارت‌های بی‌پاسخ
  if(cards){
    const L=cards.filter(c=>['pending','in_review'].includes(c.status)).map(c=>({c,age:dd(TODAY,c.card_date)})).sort((a,b)=>b.age-a.age);
    const TY={hazard:'خطر',near_miss:'شبه‌حادثه',suggestion:'پیشنهاد'};
    sec('cd','کارت‌های گزارش بدون نتیجه','cards.html',L.map(({c,age})=>({k:age>7?'r':'y',h:row(esc(String(c.description||'').slice(0,90)),`${TY[c.card_type]} · ${esc(c.unit||'بدون واحد')} · ${esc(c.reporter_name||'')}`,fa(age)+' روز پیش',age>7?'r':'y')})));
  } else sec('cd','کارت‌های گزارش بدون نتیجه','cards.html',null);
  // ۵.۵) داروی کمد کمک‌های اولیه (کمبود / انقضا)
  if(fin){
    const L=fin.filter(x=>x.status==='open'&&x.module==='MED').map(x=>({x,over:x.due_date?dd(TODAY,x.due_date):0})).sort((a,b)=>b.over-a.over);
    sec('med','داروی کمد: کمبود یا انقضا','checklists.html',L.map(({x,over})=>({k:over>0?'r':'y',h:row(esc(x.question||'—'),esc(x.location||''),over>0?fa(over)+' روز معوق':'باز',over>0?'r':'y')})));
  } else sec('med','داروی کمد: کمبود یا انقضا','checklists.html',null);
  // ۵.۸) سلامت داده: مواردی که ارتباط بین بخش‌ها را قطع می‌کنند و باعث ناقص‌شدن گزارش‌ها می‌شوند
  {
    const D=[],add=(n,t,sub,cls)=>{if(n>0)D.push({k:cls,h:row(t,sub,fa(n)+' مورد',cls)})};
    if(emp&&units){
      const match=HSE.unitMatcher(units.filter(u=>u.active!==false)),act=emp.filter(e=>HSEP.isActive(e));
      const bad=act.filter(e=>!(e.department||'').trim()||!match(e.department||'')),deps=[...new Set(bad.map(e=>(e.department||'').trim()||'بدون واحد'))];
      add(bad.length,'پرسنل فعال بدون واحد منطبق (در گزارش واحدها نمی‌آیند)',esc(deps.slice(0,6).join('، '))+(deps.length>6?'…':'')+' — در «سرپرست و واحدها» نام معادل اضافه کنید','r');
    }
    if(units){const nm=units.filter(u=>u.active!==false&&!(u.manager||'').trim());add(nm.length,'واحد فعال بدون سرپرست (ایمیل گزارش واحد بی‌مخاطب می‌شود)',esc(nm.slice(0,6).map(u=>u.name).join('، ')),'y')}
    if(fin){
      const o=fin.filter(x=>x.status==='open'&&x.module!=='MED');
      add(o.filter(x=>!(x.location||'').trim()||x.location==='نامشخص').length,'عدم‌انطباق باز بدون محل (در پراکندگی محل به «نامشخص» می‌رود)','محل را در پیگیری عدم‌انطباق‌ها ویرایش کنید','y');
      add(o.filter(x=>!x.due_date).length,'عدم‌انطباق باز بدون مهلت (معوق‌شدن دیر تشخیص داده می‌شود؛ پیش‌فرض ۱۴ روز)','مهلت را در پیگیری عدم‌انطباق‌ها ثبت کنید','y');
    }
    if(rk)add(rk.filter(r=>!(r.unit||'').trim()).length,'ریسک فعال بدون واحد','واحد را در ماژول ریسک‌ها تکمیل کنید','y');
    if(cards)add(cards.filter(c=>!(c.unit||'').trim()).length,'کارت گزارش بدون واحد (در شاخص مشارکت واحدها حساب نمی‌شود)','واحد کارت را در ماژول کارت‌ها تکمیل کنید','y');
    if(eq)add(eq.filter(e=>e.active&&e.requires_inspection&&!e.interval_months).length,'تجهیز نیازمند بازرسی بدون دورهٔ بازدید (پیش‌فرض ۱۲ ماه حساب می‌شود)','دوره را در ماژول تجهیزات ثبت کنید','y');
    sec('dq','سلامت داده و ارتباط بخش‌ها','unit_report.html',D);
  }
  // ۶) یادآورها
  const K=HSE.nowK(),rem=[];
  if(units&&mon){const act=units.filter(u=>u.active!==false),done=new Set(mon.filter(m=>m.month_key===K).map(m=>m.unit_id)),miss=act.filter(u=>!done.has(u.id));if(miss.length)rem.push({k:'y',h:row('ورودی ماهانه PPE و رفتار ناایمن ثبت نشده',`${miss.length} از ${act.length} واحد: ${esc(miss.slice(0,5).map(u=>u.name).join('، '))}${miss.length>5?' ...':''}`,'این ماه','y')})}
  if(cul){const last=cul.map(c=>c.assessed_at).sort().pop();const age=last?dd(TODAY,last):null;if(age==null||age>180)rem.push({k:'y',h:row('ارزیابی نردبان فرهنگ ایمنی',last?'آخرین ارزیابی '+fday(last):'هنوز ارزیابی ثبت نشده',age==null?'ثبت نشده':fa(Math.round(age/30))+' ماه پیش','y')})}
  sec('rm','یادآورها','evaluation.html',rem);
  draw();
}
const SHORT={dq:'سلامت داده',rk:'ریسک‌ها',fin:'عدم‌انطباق‌ها',inc:'اقدام حوادث',fu:'پیگیری طب کار',eq:'تجهیزات',cd:'کارت‌ها',med:'داروی کمد',rm:'یادآورها'};
let OPEN=(location.hash||'').replace('#','').replace(/^s_/,'')||null;
function draw(){
  const info=SECS.map(s=>{const it=s.items;return{...s,n:it?it.length:null,r:it?it.filter(i=>i.k==='r').length:null}});
  const act=info.filter(s=>s.n>0).sort((a,b)=>b.r-a.r||b.n-a.n),clean=info.filter(s=>s.n===0),na=info.filter(s=>s.n==null);
  const core=act.filter(s=>s.id!=='dq'),R=core.reduce((a,s)=>a+s.r,0),N=core.reduce((a,s)=>a+s.n,0);
  $('hero').innerHTML=core.length?`<b class="${R?'bad':'wa'}">${fa(R)}</b><span>مورد معوق${N-R?` · ${fa(N-R)} مورد در مهلت`:''}</span>`:'<b class="ok">✓</b><span>موردی معوق یا باز نیست</span>';
  $('tiles').innerHTML=act.map(s=>`<button type="button" class="tile ${s.r?'r':'y'} ${OPEN===s.id?'on':''}" data-s="${s.id}"><b>${fa(s.r||s.n)}</b><span>${SHORT[s.id]||esc(s.title)}</span><small>${s.r?`معوق${s.n-s.r?` · ${fa(s.n-s.r)} در مهلت`:''}`:'در مهلت'}</small></button>`).join('');
  $('clean').innerHTML=(clean.length?`<b>✓ بدون مورد:</b> ${clean.map(s=>SHORT[s.id]||esc(s.title)).join('، ')}`:'')+(na.length?` · <span class="wa">در دسترس نیست: ${na.map(s=>SHORT[s.id]||esc(s.title)).join('، ')}</span>`:'');
  const s=info.find(x=>x.id===OPEN);
  const old=$('secs');
  if(!s||!s.items||!s.items.length){old.innerHTML=act.length?'<div class="mu" style="text-align:center;padding:10px">برای دیدن فهرست، روی یکی از کارت‌های بالا بزنید.</div>':'';return}
  const top=s.items.slice(0,12),rest=s.items.slice(12);
  old.innerHTML=`<div class="card pn" id="s_${s.id}"><h2><span>${esc(s.title)}</span><span><a href="${s.link}">باز کردن ماژول ←</a> <a href="#" data-close="1">✕ بستن</a></span></h2>${s.note?`<div class="mu" style="margin-bottom:6px">${esc(s.note)}</div>`:''}${top.map(i=>i.h).join('')}${rest.length?`<details><summary class="mu" style="cursor:pointer;margin-top:6px">${fa(rest.length)} مورد دیگر</summary>${rest.map(i=>i.h).join('')}</details>`:''}</div>`;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-s]'),c=e.target.closest('[data-close]');
  if(c){e.preventDefault();OPEN=null;history.replaceState(null,'',location.pathname);draw();return}
  if(!t)return;
  OPEN=OPEN===t.dataset.s?null:t.dataset.s;history.replaceState(null,'',OPEN?'#'+OPEN:location.pathname);draw();
  if(OPEN)$('secs').scrollIntoView({behavior:'smooth',block:'start'});
});
load();
</script>
</body>
</html>
