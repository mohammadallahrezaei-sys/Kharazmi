* { box-sizing: border-box; transition: all 0.15s ease-in-out; }

small { color: var(--mu); display: block; font-size: 12px; }

input, select { width: 100%; font: inherit; color: var(--ink); background: var(--card-bg); border: 1.5px solid var(--ln); border-radius: 10px; padding: 10px 14px; margin-top: 8px; min-height: 46px; outline: none; }
input:focus, select:focus { border-color: var(--ac); box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
button, .btn-link { font: inherit; color: var(--ink); background: var(--card-bg); border: 1.5px solid var(--ln); border-radius: 12px; min-height: 48px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
button:hover, .btn-link:hover { background: var(--ln); }

body div#app { display: flex; flex-direction: column; }

.m b { display: block; font-size: 16px; font-weight: 700; color: var(--ink); }
.p { width: 100%; margin-top: 10px; background: var(--ac); border-color: var(--ac); color: #0f172a; font-weight: 700; border-radius: 12px; box-shadow: 0 4px 12px rgba(16,185,129,0.25); }
.p:hover { background: var(--ac-hover); border-color: var(--ac-hover); color: #fff; }

.ph { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

function jwtOk(t) {
  try { const p = JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); return !p.exp || p.exp * 1000 > Date.now(); } catch (e) { return false; }
}
function deepFind(o, key, d = 0) {
  if (!o || typeof o !== 'object' || d > 4) return null;
  if (typeof o[key] === 'string') return o[key];
  for (const k in o) { const r = deepFind(o[k], key, d + 1); if (r) return r; }
  return null;
}
function getSession() {
  let found = { t: '', e: '' };
  for (const st of [localStorage, sessionStorage]) {
    try {
      for (let i = 0; i < st.length; i++) {
        const raw = st.getItem(st.key(i)) || '';
        if (/^eyJ[\w-]+\.[\w-]+\.[\w-]+$/.test(raw) && jwtOk(raw) && raw !== KEY) { found.t = found.t || raw; continue; }
        if (raw[0] === '{' || raw[0] === '[') {
          const j = JSON.parse(raw), t = deepFind(j, 'access_token');
          if (t && jwtOk(t)) { found.t = t; found.e = deepFind(j, 'email') || found.e; return found; }
        }
      }
      found.e = found.e || st.getItem('em') || st.getItem('email') || '';
    } catch (e) { }
  }
  return found;
}

function shrink(f) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(f), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1000 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = im.width * k; c.height = im.height * k;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); c.toBlob(res, 'image/jpeg', 0.75);
    };
    im.onerror = () => rej(new Error('فایل نامعتبر است')); im.src = u;
  });
}

let STORE = null;
async function storageList() {
  const all = [];
  for (let off = 0; ; off += 1000) {
    const r = await fetch(URL_ + '/storage/v1/object/list/photos', { method: 'POST', headers: { ...AH(), 'Content-Type': 'application/json' }, body: JSON.stringify({ prefix: '', limit: 1000, offset: off, sortBy: { column: 'name', order: 'asc' } }) });
    if (!r.ok) throw new Error(await r.text());
    const rows = await r.json(); all.push(...rows.filter(x => x.id));
    if (rows.length < 1000) break;
  }
  return all.map(x => ({ name: x.name, size: (x.metadata && x.metadata.size) || 0 }));
}
const mb = b => fa((b / 1048576).toFixed(b > 1e8 ? 0 : 1));
const thrMB = () => +(localStorage.thr || 800);

async function moveToLocal() {
  const log = t => { const l = $('#smlog'); if (l) { l.textContent += t + '\n'; l.scrollTop = l.scrollHeight; } };
  if (!LDIR) return alert('اول پوشه‌ی ذخیره روی کامپیوتر را انتخاب کنید.');
  if (!LPERM && !(await localAllow())) return alert('دسترسی به پوشه داده نشد.');
  const del = false; /* حذف از سوپابیس از رابط کاربری برداشته شد */
  if (del && !confirm('پس از کپی موفق، تصاویر از سوپابیس حذف می‌شوند و فقط روی همین کامپیوتر (و همین پوشه) قابل مشاهده می‌مانند. موبایل و کامپیوترهای دیگر آن‌ها را نمی‌بینند. ادامه می‌دهید؟')) return;
  const btn = $('[data-a=smove]'); btn.disabled = true; $('#smlog').textContent = '';
  try {
    const items = await storageList(); log(fa(items.length) + ' فایل در سوپابیس.');
    const pgb = $('#smp'); pgb.hidden = false; pgb.max = items.length || 1; pgb.value = 0;
    const ok = [], fail = []; let n = 0;
    await pool(4, items, async it => {
      try {
        let have = await localFile(it.name);
        if (!have || (it.size && have.size != it.size)) {
          let r = await fetch(pubUrl(it.name)); if (!r.ok) r = await fetch(URL_ + '/storage/v1/object/authenticated/photos/' + it.name, { headers: AH() });
          if (!r.ok) throw new Error('دریافت ناموفق ' + r.status);
          const blob = await r.blob(), w = await (await LDIR.getFileHandle(it.name, { create: true })).createWritable();
          await w.write(blob); await w.close();
          have = await localFile(it.name);
          if (!have || (it.size && have.size != it.size)) throw new Error('حجم فایل ذخیره‌شده با اصل یکی نیست');
        }
        ok.push(it.name);
      } catch (e) { fail.push(it.name + ': ' + e.message); }
      pgb.value = ++n;
    });
    log(`کپی موفق: ${fa(ok.length)} | ناموفق: ${fa(fail.length)}`);
    fail.slice(0, 5).forEach(log);
    if (del && ok.length) {
      const names = ok.filter(x => x != 'no-photo-placeholder.jpg'); let gone = 0;
      for (let i = 0; i < names.length; i += 50) {
        const r = await fetch(URL_ + '/storage/v1/object/photos', { method: 'DELETE', headers: { ...AH(), 'Content-Type': 'application/json' }, body: JSON.stringify({ prefixes: names.slice(i, i + 50) }) });
        if (!r.ok) { log('حذف ناموفق: ' + (await r.text()).slice(0, 200)); break; }
        gone += (await r.json()).length;
      }
      log(`حذف‌شده از سوپابیس: ${fa(gone)} از ${fa(names.length)}` + (gone < names.length ? ' — اگر کمتر است، سیاست DELETE برای bucket «photos» لازم است.' : ''));
    }
    log('پایان.');
  } catch (e) { log('❌ ' + e.message); }
  btn.disabled = false; refreshUsage();
}

/* ---------- بخش گزارش مدیریتی امن‌سازی شده (بدون نیاز به eval) ---------- */
const SW = 1920, SH = 1080, NAVY = '#0f172a', BLUE = '#2563eb', RED = '#ef4444', GREEN = '#22c55e', FONT = "Vazirmatn,Tahoma,sans-serif";
const fl = d => new Intl.DateTimeFormat('fa-IR-u-ca-persian', { year: 'numeric', month: 'long', day: 'numeric' }).format(new Date(d));
const loadImg = s => new Promise(r => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => r(i); i.onerror = () => r(null); i.src = s; });

function wrapText(c, t, w) {
  const a = t.split(' '), o = []; let u = '';
  for (const x of a) { const v = u ? u + ' ' + x : x; if (c.measureText(v).width > w && u) { o.push(u); u = x; } else u = v; }
  if (u) o.push(u); return o;
}

function mkS() {
  const c = document.createElement('canvas'); c.width = SW; c.height = SH;
  const x = c.getContext('2d'); x.direction = 'rtl'; x.textAlign = 'right'; x.textBaseline = 'top'; return [c, x];
}

function frame(x, logo, n, tot, code) {
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, SW, SH);
  if (logo) x.drawImage(logo, SW - 320, 30, 260, 260 * logo.height / logo.width);
  x.fillStyle = BLUE; x.fillRect(0, 130, SW, 6);
  x.fillStyle = '#64748b'; x.font = '400 24px ' + FONT;
  x.direction = 'ltr'; x.textAlign = 'left'; x.fillText(code || '', 60, 1030);
  x.fillText(n + ' / ' + tot, SW - 120, 1030); x.textAlign = 'right'; x.direction = 'rtl';
}


/* گشت بازرسی = یک بازرس در یک روز (هر چک‌لیست محل یک رکورد جداست) */
function rounds(a) { return new Set((a || []).map(r => (r.inspector || '?') + '|' + new Date(r.created_at).toLocaleDateString('en-CA'))).size; }
/* چک‌لیست تکمیل‌شده: رکوردهای قدیمی بازدید روزانه (هر سوله جدا) = هر بازرس در هر روز یکی؛ بقیه هر رکورد یکی */
function checks(a) { const g = new Set(); let n = 0; (a || []).forEach(r => { if (r.module == 'D' && r.location !== ROUND_LOC) g.add((r.inspector || '?') + '|' + new Date(r.created_at).toLocaleDateString('en-CA')); else n++; }); return g.size + n; }

const sev_ = x => x.severity || dsev(x.question || '');
const od_ = x => x.due_date ? new Date(x.due_date + 'T23:59:59') < Date.now() : (Date.now() - new Date(x.created_at)) / 864e5 > 14;

function summarySlide(logo, n, tot, S) {
  const [c, x] = mkS();
  frame(x, logo, n, tot, 'SUMMARY');
  x.fillStyle = NAVY; x.font = '800 44px ' + FONT;
  x.fillText('خلاصه مدیریتی وضعیت HSE', SW - 60, 170);
  x.font = '400 24px ' + FONT; x.fillStyle = '#64748b';
  x.fillText('بازه: ' + S.bz + '  |  ' + fa(S.insCount) + ' گشت بازرسی  |  ' + fa(S.chkCount) + ' چک‌لیست', SW - 60, 230);
  const kp = [
    [fa(S.rate) + '٪', 'نرخ انطباق بازدیدها', S.rate >= 85 ? GREEN : RED],
    [fa(S.hi), 'باز با شدت زیاد/بحرانی', RED],
    [fa(S.overdue), 'گذشته از مهلت اصلاح', '#f59e0b'],
    [fa(S.noNotice), 'باز بدون اعلان رسمی', '#f59e0b']
  ], w = 420, g = 40;
  kp.forEach(([v, l, col], i) => {
    const bx = SW - 60 - w - i * (w + g), by = 280;
    x.fillStyle = '#f1f5f9'; x.fillRect(bx, by, w, 170);
    x.fillStyle = col; x.fillRect(bx + w - 10, by, 10, 170);
    x.fillStyle = NAVY; x.font = '800 64px ' + FONT; x.textAlign = 'center'; x.fillText(v, bx + w / 2, by + 20);
    x.font = '400 26px ' + FONT; x.fillStyle = '#64748b'; x.fillText(l, bx + w / 2, by + 115); x.textAlign = 'right';
  });
  const list = (title, rows, px, col) => {
    const pw = 880;
    x.fillStyle = col; x.fillRect(px, 490, pw, 56);
    x.fillStyle = '#fff'; x.font = '700 28px ' + FONT; x.textAlign = 'center'; x.fillText(title, px + pw / 2, 502); x.textAlign = 'right';
    if (!rows.length) { x.fillStyle = '#94a3b8'; x.font = '400 26px ' + FONT; x.textAlign = 'center'; x.fillText('داده‌ای نیست', px + pw / 2, 600); x.textAlign = 'right'; return; }
    const mx = Math.max(1, ...rows.map(r => r[1]));
    rows.forEach((r, k) => {
      const y = 570 + k * 88;
      x.fillStyle = NAVY; x.font = '600 28px ' + FONT; x.fillText(r[0], px + pw - 20, y);
      x.direction = 'ltr'; x.textAlign = 'left'; x.fillText(fa(r[1]), px + 20, y); x.textAlign = 'right'; x.direction = 'rtl';
      x.fillStyle = '#e2e8f0'; x.fillRect(px + 20, y + 46, pw - 40, 10);
      const bw = (pw - 40) * r[1] / mx; x.fillStyle = col; x.fillRect(px + pw - 20 - bw, y + 46, bw, 10);
    });
  };

/* ===== گزارش مدیریتی v2: فیلتر بازه/ماه/فصل/سال شمسی، بدون سقف اسلاید، خروجی PPTX چندبخشی ===== */
const JMN = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
function j2g(jy, jm, jd) {
  jy += 1595;
  let days = -355668 + 365 * jy + Math.floor(jy / 33) * 8 + Math.floor((jy % 33 + 3) / 4) + jd + (jm < 7 ? (jm - 1) * 31 : (jm - 7) * 30 + 186);
  let gy = 400 * Math.floor(days / 146097); days %= 146097;
  if (days > 36524) { days--; gy += 100 * Math.floor(days / 36524); days %= 36524; if (days >= 365) days++; }
  gy += 4 * Math.floor(days / 1461); days %= 1461;
  if (days > 365) { gy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  let gd = days + 1;
  const ml = [0, 31, (gy % 4 == 0 && gy % 100 != 0) || gy % 400 == 0 ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  let gm = 0; while (gm < 13 && gd > ml[gm]) { gd -= ml[gm]; gm++; }
  return [gy, gm, gd];
}
function jNow() { const o = {}; new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn', { year: 'numeric', month: 'numeric', day: 'numeric' }).formatToParts(new Date()).forEach(p => o[p.type] = +p.value); return o; }
const jStart = (y, m) => { const [a, b, c] = j2g(y, m, 1); return new Date(a, b - 1, c); };

/* وضعیت فیلترهای گزارش */
const R = { mode: 'days', days: 30, jy: 0, jm: 0, from: '', to: '', mod: '', st: '', ord: 'sev', per: 60 };
function rRange() {
  if (R.mode == 'days') return { from: R.days ? new Date(Date.now() - R.days * 864e5) : null, to: null, label: R.days ? fa(R.days) + ' روز گذشته' : 'تمام سوابق' };
  if (R.mode == 'j') {
    const y = +R.jy, m = +R.jm;
    if (m == 0) return { from: jStart(y, 1), to: jStart(y + 1, 1), label: 'سال ' + fa(y) };
    if (m > 100) { const q = m - 100, s = (q - 1) * 3 + 1; return { from: jStart(y, s), to: s + 3 > 12 ? jStart(y + 1, 1) : jStart(y, s + 3), label: 'فصل ' + ['بهار', 'تابستان', 'پاییز', 'زمستان'][q - 1] + ' ' + fa(y) }; }
    return { from: jStart(y, m), to: m == 12 ? jStart(y + 1, 1) : jStart(y, m + 1), label: JMN[m - 1] + ' ' + fa(y) };
  }
  const f = R.from ? new Date(R.from + 'T00:00:00') : null, t = R.to ? new Date(new Date(R.to + 'T00:00:00').getTime() + 864e5) : null;
  return { from: f, to: t, label: (f ? fl(f) : 'ابتدا') + ' تا ' + (R.to ? fl(R.to + 'T00:00:00') : 'اکنون') };
}
/* بخش‌های کوئری: تاریخ، ماژول، وضعیت */
function rDateQ() { const r = rRange(); let q = ''; if (r.from) q += '&created_at=gte.' + encodeURIComponent(r.from.toISOString()); if (r.to) q += '&created_at=lt.' + encodeURIComponent(r.to.toISOString()); return q; }
const rModQ = () => R.mod ? '&module=eq.' + encodeURIComponent(R.mod) : '';
const rQuery = () => rDateQ() + rModQ() + (R.st ? '&status=eq.' + R.st : '');

async function fetchAll(p) {
  const out = [];
  for (let off = 0; ;) {
    const rows = await api(p + (p.includes('?') ? '&' : '?') + 'limit=1000&offset=' + off);
    if (!rows.length) break; out.push(...rows); off += rows.length;
  }
  return out;
}
/* آخرین بازدید هر ماژول: یک درخواست کوچک برای هر ماژول (به تعداد کل بازدیدها وابسته نیست) */
async function lastVisits() {
  const rows = [];
  await Promise.all(M.map(async m => { try { const r = await api('inspections?select=module,created_at&module=eq.' + encodeURIComponent(m[0]) + '&order=created_at.desc&limit=1'); if (r[0]) rows.push(r[0]); } catch (e) { } }));
  return rows;
}
async function rCount(extra = '') {
  const r = await fetch(URL_ + '/rest/v1/findings?select=id&limit=1' + rQuery() + extra, { headers: { ...AH(), Prefer: 'count=exact' } });
  if (!r.ok) throw new Error(await r.text());
  const m = /\/(\d+)$/.exec(r.headers.get('content-range') || '');
  if (m) return +m[1];
  return (await fetchAll('findings?select=id&order=id.asc' + rQuery() + extra)).length;
}

/* عکس: اول مسیر public (سریع، بدون preflight)، بعد authenticated. بعد از ترسیم باید close() شود تا حافظه آزاد شود */
async function photoImg(p) {
  try { const lf = await localFile(p); if (lf) return await createImageBitmap(lf); } catch (e) { }
  for (const path of ['/storage/v1/object/public/photos/', '/storage/v1/object/authenticated/photos/']) {
    try {
      const r = await fetch(URL_ + path + p, path.includes('authenticated') ? { headers: AH() } : {});
      if (r.ok) return await createImageBitmap(await r.blob());
    } catch (e) { }
  }
  return null;
}
async function pool(n, items, fn) {
  let k = 0; const res = new Array(items.length);
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (k < items.length) { const i = k++; res[i] = await fn(items[i], i); } }));
  return res;
}

function panel(x, px, py, pw, ph, title, color, ims, empty) {
  x.fillStyle = color; x.fillRect(px, py, pw, 60);
  x.fillStyle = '#fff'; x.font = '700 28px ' + FONT; x.textAlign = 'center';
  x.fillText(title, px + pw / 2, py + 14); x.textAlign = 'right';
  const ay = py + 60, ah = ph - 60;
  x.fillStyle = '#f8fafc'; x.fillRect(px, ay, pw, ah);
  x.strokeStyle = '#e2e8f0'; x.lineWidth = 2; x.strokeRect(px, py, pw, ph);
  if (!ims.length) {
    x.fillStyle = '#94a3b8'; x.font = '400 26px ' + FONT; x.textAlign = 'center';
    x.fillText(empty, px + pw / 2, ay + ah / 2 - 13); x.textAlign = 'right'; return;
  }
  const g = 10, n = ims.length, cols = n == 1 ? 1 : 2, rows = Math.ceil(n / cols), cw = (pw - g * (cols + 1)) / cols, ch = (ah - g * (rows + 1)) / rows;
  ims.forEach((im, i) => {
    const r = Math.floor(i / cols), c = i % cols, bx = px + pw - g - (c + 1) * cw - c * g, by = ay + g + r * (ch + g), k = Math.min(cw / im.width, ch / im.height), w = im.width * k, h = im.height * k;
    x.fillStyle = '#e2e8f0'; x.fillRect(bx, by, cw, ch);
    x.drawImage(im, bx + (cw - w) / 2, by + (ch - h) / 2, w, h);
  });
}

const GEN = { cancel: false, busy: false };
async function genSlides() {
  if (GEN.busy) return;
  if (typeof PptxGenJS == 'undefined') return alert('کتابخانه ساخت PowerPoint بارگذاری نشده است؛ اینترنت را بررسی و صفحه را دوباره باز کنید.');

    <div id="parts" style="margin-top:12px;"></div>`;

    ]);
    if (!P.length) throw new Error('در این بازه و با این فیلترها موردی وجود ندارد.');
    const ok = I.reduce((a, x) => a + x.ok, 0), nc = I.reduce((a, x) => a + x.nc, 0), cl = P.filter(x => x.status == 'closed').length;
    const S = {

    };
    const F = [...P].sort(R.ord == 'date' ? (a, b) => new Date(b.created_at) - new Date(a.created_at)

}

    }
    const isPH = p => /^no-photo/.test(p), nob = x => !(x.photos_before || []).length || (x.photos_before || []).every(isPH),
      noa = x => x.status == 'closed' && (!(x.photos_after || []).length || (x.photos_after || []).every(isPH));
    let list = all;
    if (kind == 'photo') list = all.filter(x => nob(x) || noa(x));
    const L = x => (!x.location || x.location == 'نامشخص') ? 'محل نامشخص' : x.location;
    const hn = x => { const l = L(x); if (l == 'محل نامشخص') return 99999; const m = l.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).match(/\d+/); return m ? +m[0] : 5000; };
    list.sort((a, b) => hn(a) - hn(b) || L(a).localeCompare(L(b), 'fa') || String(a.notice_code || '~').localeCompare(String(b.notice_code || '~'), undefined, { numeric: true }) || String(a.qid).localeCompare(String(b.qid)));
    const title = kind == 'open' ? 'موارد باز عدم‌انطباق — بررسی میدانی' : 'موارد با عکس ناقص — برای تکمیل';
    const cnt = {}; list.forEach(x => cnt[L(x)] = (cnt[L(x)] || 0) + 1);
    let n = 0, cur = null, rowsH = '';
    for (const x of list) {
      const loc = L(x);
      if (loc != cur) { cur = loc; rowsH += `<tr class="g"><td colspan="6">${esc(loc)} — ${fa(cnt[loc])} مورد</td></tr>`; }
      n++;
      const eqc = x.equipment_code && x.equipment_code != '0' ? x.equipment_code : '';
      const qt = String(x.question || '').replace(/\s+/g, ' ');
      const eq = eqc && !qt.includes(eqc) ? ` <span class="s">[${esc(eqc)}]</span>` : '';
      const id = x.notice_code ? fa(x.notice_code) : '<span class="s">' + esc(x.qid) + '</span>';
      const st = kind == 'open' ? (x.notice_status ? esc(x.notice_status) : '—')
        : [nob(x) ? 'بدون عکس قبل' : '', noa(x) ? 'بدون عکس بعد' : ''].filter(Boolean).join('، ');
      const ck = kind == 'open' ? '☐ شد &nbsp;☐ نشد'
        : [nob(x) ? '☐ قبل' : '', noa(x) ? '☐ بعد' : ''].filter(Boolean).join(' &nbsp;');
      rowsH += `<tr><td class="c">${fa(n)}</td><td class="c">${id}</td><td>${esc(qt)}${eq}</td><td class="c">${st}${kind == 'photo' ? ' <span class="s">(' + (x.status == 'closed' ? 'بسته' : 'باز') + ')</span>' : ''}</td><td class="ck">${ck}</td><td class="nt"></td></tr>`;
    }
    const css = '@page{size:A4 landscape;margin:6mm}body{font-family:Vazirmatn,Tahoma,sans-serif;font-size:8pt;line-height:1.25;margin:6px;color:#000;background:#fff}h1{font-size:11pt;margin:0 0 2px;display:inline}.m{display:inline;color:#333;font-size:8pt;margin-right:10px}.pb{font:inherit;padding:5px 14px;margin:0 0 6px;cursor:pointer;border:1px solid #444;border-radius:5px;background:#eee}table{width:100%;border-collapse:collapse;margin-top:3px}thead{display:table-header-group}th{background:#ddd;border:1px solid #555;padding:1px 3px;font-size:7.5pt}td{border:1px solid #888;padding:1px 3px;vertical-align:middle}tr{page-break-inside:avoid}.c{text-align:center}.s{color:#555;font-size:6.5pt}.g td{background:#e6e6e6;font-weight:bold;font-size:8.5pt;padding:1px 4px}.ck{white-space:nowrap;text-align:center;width:19%}.nt{width:16%}@media print{.pb{display:none}body{margin:0}}';
    const th5 = kind == 'open' ? 'وضعیت اعلان' : 'وضعیت / کمبود', th6 = kind == 'open' ? 'نتیجه' : 'تکمیل شد';
    const html = `<!doctype html><html dir="rtl" lang="fa"><head><meta charset="utf-8"><title>${title}</title><style>${css}</style></head><body><button class="pb" onclick="window.print()">🖨️ چاپ</button><div><h1>${title}</h1><span class="m">تعداد: ${fa(list.length)} | ${fd(Date.now())}</span></div><table><thead><tr><th style="width:2.5%">#</th><th style="width:6%">اعلان</th><th>شرح مورد</th><th style="width:11%">${th5}</th><th>${th6}</th><th>توضیح</th></tr></thead><tbody>${rowsH || '<tr><td colspan="6" class="c">موردی یافت نشد.</td></tr>'}</tbody></table></body></html>`;
    w.document.open(); w.document.write(html); w.document.close(); w.focus();
  } catch (er) { w.close(); alert(er.message); }
}

document.onclick = async e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, y = scrollY;
  if (a == 'home') home();
  else if (a == 'history') historyList();
    else if (a == 'rep') renderManagementReport();
  else if (a == 'gen-slides') genSlides();
  else if (a == 'gen-cancel') GEN.cancel = true;
  else if (a == 'open') {
    cur = M.find(m => m[0] == t.dataset.k);
    const d = JSON.parse(localStorage.draft || '{}');
    if (d.k == cur[0]) { A = d.A || {}; N = d.N || {}; SV = d.SV || {}; RS = d.RS || {}; LC = d.LC || {}; EX = d.EX || {}; D.loc = d.loc || ''; D.extra = d.extra || {}; D.shift = d.shift || ''; }
    else { A = {}; N = {}; SV = {}; RS = {}; LC = {}; EX = {}; D.loc = ''; D.extra = {}; D.shift = ''; D.oth = false; }
    form();
  }
  else if (a == 'ans') { A[t.dataset.id] = t.dataset.v; save(); form(); scrollTo(0, y); }
  else if (a == 'addloc') { const b = t.dataset.id; EX[b] = EX[b] || []; const nx = Math.max(0, ...EX[b].map(k => +k.split('#')[1])) + 1; EX[b].push(b + '#' + nx); save(); form(); scrollTo(0, y); }
  else if (a == 'rmloc') { const k = t.dataset.id, b = baseId(k); EX[b] = (EX[b] || []).filter(x => x != k); delete N[k]; delete SV[k]; delete RS[k]; delete LC[k]; delete PH[k]; save(); form(); scrollTo(0, y); }
  else if (a == 'addph') { FT = { m: 'addph', id: t.dataset.id }; fi.click(); }
  else if (a == 'rmph') { PH[t.dataset.id].splice(+t.dataset.j, 1); form(); scrollTo(0, y); }
  else if (a == 'send') send();
  else if (a == 'finds') finds();
  else if (a == 'edit-insp') {
    const box = t.closest('.q').querySelector('.edit-area');
    box.hidden = !box.hidden;
    if (!box.hidden) {
      box.innerHTML = `
        <label style="font-size:12px; font-weight:700;">ویرایش محل:</label>
        <select id="edit-loc">${LOCS.map(l => `<option ${l == t.dataset.loc ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <label style="font-size:12px; font-weight:700; margin-top:8px;">ویرایش شیفت:</label>
        <select id="edit-sh">${SHIFTS.map(s => `<option ${s == t.dataset.sh ? 'selected' : ''}>${s}</option>`).join('')}</select>
        <button class="p" data-a="save-insp" data-id="${t.dataset.id}" data-oldloc="${t.dataset.loc}" data-oldsh="${t.dataset.sh}" style="margin-top:10px; min-height:38px; font-size:13px;">ذخیره تغییرات و درج لاگ</button>
      `;
    }
  }
  else if (a == 'save-insp') {
    const id = t.dataset.id, oldLoc = t.dataset.oldloc, oldSh = t.dataset.oldsh;
    const newLoc = $('#edit-loc').value, newSh = $('#edit-sh').value;
    if (oldLoc === newLoc && oldSh === newSh) return alert('تغییری ایجاد نشده است.');
    try {
      await api('inspections?id=eq.' + id, {
        method: 'PATCH',
        body: JSON.stringify({ location: newLoc, shift: newSh })
      });
      const logs = [];
      if (oldLoc !== newLoc) {
        logs.push({ inspection_id: id, inspector: mail, action_type: 'UPDATE_LOCATION', old_value: oldLoc, new_value: newLoc });
      }
      if (oldSh !== newSh) {
        logs.push({ inspection_id: id, inspector: mail, action_type: 'UPDATE_SHIFT', old_value: oldSh, new_value: newSh });
      }
      if (logs.length) {
        await api('inspection_logs', { method: 'POST', body: JSON.stringify(logs) });
      }
      alert('تغییرات با موفقیت ذخیره و در تاریخچه ثبت شد.');
      await historyList(); scrollTo(0, y);
    } catch (er) { alert('خطا در ذخیره تغییرات: ' + er.message); }
  }
  else if (a == 'ntc') {
    try {
      const id = t.dataset.id;
      if (t.checked) {
        const inp = t.closest('.q').querySelector('input[data-code]');
        const code = inp ? inp.value.trim() : '';
        if (!code && !t.defaultChecked) return alert('کد اعلان را وارد کنید.');
        await api('findings?id=eq.' + id, { method: 'PATCH', body: JSON.stringify({ notice_code: code || 'NOTICED', notice_at: new Date().toISOString() }) });
      } else {
        await api('findings?id=eq.' + id, { method: 'PATCH', body: JSON.stringify({ notice_code: null, notice_at: null }) });
      }
      await loadFinds(); scrollTo(0, y);
    } catch (er) { alert(er.message); }
  }
  else if (a == 'addaf') { FT = { m: 'addaf', id: t.dataset.id }; fi.click(); }
  else if (a == 'addbf') { FT = { m: 'addbf', id: t.dataset.id }; fi.click(); }
  else if (a == 'fedit') { EDIT = t.dataset.id; await loadFinds(); }
  else if (a == 'fcancel') { EDIT = null; await loadFinds(); scrollTo(0, y); }
  else if (a == 'fsave') {
    const card = t.closest('.q'), v = k => card.querySelector('[data-ef=' + k + ']').value;
    const body = { question: v('question').trim(), note: v('note').trim(), location: v('location').trim() || 'نامشخص', module: v('module'), severity: +v('severity'), category: v('category'), responsible: v('responsible').trim() || null, due_date: v('due_date') || null };
    if (!body.question) return alert('متن عدم‌انطباق نمی‌تواند خالی باشد.');
    try { await api('findings?id=eq.' + t.dataset.id, { method: 'PATCH', body: JSON.stringify(body) }); EDIT = null; await loadFinds(); scrollTo(0, y); }
    catch (er) { alert('خطا در ذخیره: ' + er.message); }
  }
  else if (a == 'delph') {
    const k = t.dataset.k == 'before' ? 'photos_before' : 'photos_after';
    if (!confirm('این عکس از این مورد حذف شود؟ (خود فایل از حافظه پاک نمی‌شود)')) return;
    try {
      const [x] = await api('findings?select=' + k + ',status&id=eq.' + t.dataset.id), nx = (x[k] || []).filter(p => p != t.dataset.p);
      if (k == 'photos_before' && !nx.length) return alert('هر مورد باید حداقل یک عکس «قبل» داشته باشد. ابتدا عکس جدید اضافه کنید، بعد عکس قبلی را حذف کنید.');
      if (k == 'photos_after' && !nx.length && x.status == 'closed') return alert('مورد بسته باید عکس پس از اصلاح داشته باشد. ابتدا آن را باز کنید یا عکس جدید اضافه کنید.');
      await api('findings?id=eq.' + t.dataset.id, { method: 'PATCH', body: JSON.stringify({ [k]: nx }) });
      await loadFinds(); scrollTo(0, y);
    } catch (er) { alert(er.message); }
  }
  else if (a == 'fst') { FQ.st = t.dataset.v; FQ.page = 0; await loadFinds(); }
  else if (a == 'fpage') { FQ.page = Math.max(0, FQ.page + +t.dataset.d); await loadFinds(); scrollTo(0, 0); }
  else if (a == 'fclear') { Object.assign(FQ, { q: '', mod: '', st: '', sev: '', cat: '', loc: '', ntc: '', ph: '', per: 'all', grp: '', ord: 'new', page: 0 }); finds(); }
  else if (a == 'rprint') printFinds(a, t.dataset.k);
  else if (a == 'lpick') { try { await localPick(); renderLocalState(); } catch (er) { if (er.name != 'AbortError') alert(er.message); } }
  else if (a == 'lallow') { await localAllow(); renderLocalState(); await loadFinds(); }
  else if (a == 'susage') refreshUsage();
  else if (a == 'smove') moveToLocal();

  else if (a == 'fix') {
    if (t.checked && !+t.dataset.pa) { t.checked = false; return alert('ثبت عکس پس از اصلاح الزام قانونی دارد.'); }
    if (t.checked && !t.closest('.q').querySelector('[data-rc]').value) { t.checked = false; return alert('ابتدا علت ریشه‌ای را انتخاب کنید.'); }
    try {
      await api('findings?id=eq.' + t.dataset.id, {
        method: 'PATCH',
        body: JSON.stringify({ status: t.checked ? 'closed' : 'open', closed_at: t.checked ? new Date().toISOString() : null })
      });
      await loadFinds(); scrollTo(0, y);
    } catch (er) { alert(er.message); }
  }
  else if (a == 'zoom') {
    const zm = $('#zm'); zm.innerHTML = `<img src="${t.src}">`; zm.hidden = false;
    zm.onclick = () => zm.hidden = true;
  }
};

document.oninput = async e => {
  const t = e.target, y = scrollY;
  if (t.dataset.rf) { const k = t.dataset.rf; R[k] = ['days', 'per', 'jy', 'jm'].includes(k) ? +t.value : t.value; renderManagementReport(); return; }
  if (t.dataset.sf == 'thr') { localStorage.thr = Math.max(50, +t.value || 800); refreshUsage(); return; }
  if (t.dataset.ff) {
    const k = t.dataset.ff; FQ[k] = ['jy', 'jm', 'size'].includes(k) ? +t.value : t.value; FQ.page = 0;
    if (k == 'per') $('#fj').hidden = FQ.per != 'j';
    clearTimeout(FTM); FTM = setTimeout(loadFinds, (k == 'q' || k == 'loc') ? 400 : 0); return;
  }
  if (t.dataset.code) { t.nextElementSibling.hidden = !t.value.trim(); return; }
  if (t.id == 'ls') { D.oth = t.value == '__o'; D.loc = D.oth ? '' : t.value; save(); form(); scrollTo(0, y); return; }
  if (t.id == 'sh') { D.shift = t.value; save(); return; }
  if (t.dataset.sv) { SV[t.dataset.sv] = +t.value; save(); form(); scrollTo(0, y); return; }
  if (t.dataset.rc) {
    try { await api('findings?id=eq.' + t.dataset.rc, { method: 'PATCH', body: JSON.stringify({ root_cause: t.value || null }) }); } catch (er) { alert(er.message); }
    return;
  }
  if (t.id == 'loc') D.loc = t.value;
  else if (t.dataset.ex) { D.extra = D.extra || {}; D.extra[t.dataset.ex] = t.value; }
  else if (t.dataset.note) N[t.dataset.note] = t.value;
  else if (t.dataset.rs) RS[t.dataset.rs] = t.value;
  else if (t.dataset.lc) LC[t.dataset.lc] = t.value;
  else return;
  save();
};

home().then(() => { if (location.hash == '#rep') renderManagementReport(); });
</script>
