function jwtOk(t) {
  try { const p = JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); return !p.exp || p.exp * 1000 > Date.now(); } catch (e) { return false; }
}
function deepFind(o, key, d = 0) {
  if (!o || typeof o !== 'object' || d > 4) return null;
  if (typeof o[key] === 'string') return o[key];
  for (const k in o) { const r = deepFind(o[k], key, d + 1); if (r) return r; }
  return null;
}
function getSession() {
  let found = { t: '', e: '' };
  for (const st of [localStorage, sessionStorage]) {
    try {
      for (let i = 0; i < st.length; i++) {
        const raw = st.getItem(st.key(i)) || '';
        if (/^eyJ[\w-]+\.[\w-]+\.[\w-]+$/.test(raw) && jwtOk(raw) && raw !== KEY) { found.t = found.t || raw; continue; }
        if (raw[0] === '{' || raw[0] === '[') {
          const j = JSON.parse(raw), t = deepFind(j, 'access_token');
          if (t && jwtOk(t)) { found.t = t; found.e = deepFind(j, 'email') || found.e; return found; }
        }
      }
      found.e = found.e || st.getItem('em') || st.getItem('email') || '';
    } catch (e) { }
  }
  return found;
}

function shrink(f) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(f), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1000 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = im.width * k; c.height = im.height * k;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); c.toBlob(res, 'image/jpeg', 0.75);
    };
    im.onerror = () => rej(new Error('فایل نامعتبر است')); im.src = u;
  });
}

async function up(b) {

}

async function stats(d = 90) {
  view('<p style="text-align:center;padding:40px;">در حال تحلیل داده‌ها...</p>');
  try {
    const s = d ? new Date(Date.now() - d * 864e5).toISOString() : '1970-01-01';
    const FS = 'module,location,qid,question,status,created_at,closed_at,notice_at,severity,category,root_cause,due_date,responsible';
    const [I, F, OF, LI] = await Promise.all([

      api('findings?select=' + FS + '&created_at=gte.' + s + '&limit=1000'),
      api('findings?select=' + FS + '&status=eq.open&limit=1000'),
      api('inspections?select=module,created_at&order=created_at.desc&limit=1000')

    const now = Date.now(), days = t => Math.floor((now - new Date(t)) / 864e5);
    const sv = x => x.severity || dsev(x.question || ''), ct = x => x.category || cat(x.module, x.question || '');
    const od = x => x.due_date ? new Date(x.due_date + 'T23:59:59') < now : days(x.created_at) > 14;
    const ok = I.reduce((a, r) => a + r.ok, 0), nc = I.reduce((a, r) => a + r.nc, 0), rate = pct(ok, ok + nc);
    const closed = F.filter(x => x.status == 'closed' && x.closed_at);
    const avgClose = closed.length ? Math.round(closed.reduce((a, x) => a + (new Date(x.closed_at) - new Date(x.created_at)) / 864e5, 0) / closed.length) : null;
    const overdue = OF.filter(od).length, hiOpen = OF.filter(x => sv(x) >= 3).length, noNotice = OF.filter(x => !x.notice_at).length;

    const last = {}; LI.forEach(r => last[r.module] = last[r.module] || r.created_at);
    const MD = M.map(m => {

      return { name: m[1], fq: m[2], cnt: ii.length, nc: n, r: pct(n, n + o), ds, late: ds === null ? 999 : (fq ? ds - fq : -1) };
    });
    const lateList = MD.filter(x => x.late > 0).sort((a, b) => b.late - a.late);
    const worstMod = MD.filter(x => x.cnt).sort((a, b) => b.r - a.r).slice(0, 6);

    const L = {}; LOCS.forEach(k => L[k] = { n: 0, nc: 0, risk: 0, open: 0, last: null });
    I.forEach(r => { if (r.location === ROUND_LOC) { LOCS.forEach(k => { const o = L[k]; o.n++; o.last = o.last || r.created_at; }); return; } const k = nl(r.location), o = L[k] = L[k] || { n: 0, nc: 0, risk: 0, open: 0, last: null }; o.n++; o.nc += r.nc; o.last = o.last || r.created_at; });
    OF.forEach(x => { const k = nl(x.location), o = L[k] = L[k] || { n: 0, nc: 0, risk: 0, open: 0, last: null }; o.open++; o.risk += sv(x) * 2 + (od(x) ? 3 : 0); });
    const LA = Object.entries(L).map(([k, o]) => { const ds = o.last ? days(o.last) : 999; return { k, ...o, ds, score: o.risk + o.nc + (ds > 30 ? 3 : ds > 14 ? 1 : 0) }; });
    const riskTop = [...LA].sort((a, b) => b.score - a.score).filter(x => x.score > 0).slice(0, 8);
    const lowCov = [...LA].sort((a, b) => a.n - b.n || b.ds - a.ds).slice(0, 6);

    const RC = {};
    F.forEach(x => { const k = x.module + '|' + x.qid, o = RC[k] = RC[k] || { q: x.question, m: nm(x.module), c: 0, locs: new Set() }; o.c++; o.locs.add(nl(x.location)); });
    const rec = Object.values(RC).filter(o => o.c > 1).sort((a, b) => b.c - a.c).slice(0, 8);

    const W = d ? Math.min(12, Math.ceil(d / 7)) : 12, tw = Array.from({ length: W }, () => ({ ok: 0, nc: 0 }));
    I.forEach(r => { const w = Math.floor(days(r.created_at) / 7); if (w < W) { tw[w].ok += r.ok; tw[w].nc += r.nc; } });
    const trend = tw.map((t, i) => ({ i, p: pct(t.nc, t.nc + t.ok) })).reverse();

    const ag = [OF.filter(x => days(x.created_at) <= 7).length, OF.filter(x => { const k = days(x.created_at); return k > 7 && k <= 30; }).length, OF.filter(x => days(x.created_at) > 30).length];
    const sevRows = [4, 3, 2, 1].map(v => [SEVN[v], OF.filter(x => sv(x) == v).length]);

    const respRows = cnt(OF.filter(x => x.responsible), x => x.responsible).slice(0, 6), inspRows = cnt(I.filter(r => r.inspector), r => r.inspector).slice(0, 6);

    const ins = [];

    if (lateList[0]) ins.push([lateList.length > 3 ? 1 : 0, `${fa(lateList.length)} چک‌لیست از برنامه عقب است؛ بیشترین تأخیر: «${lateList[0].name}»${lateList[0].ds === null ? ' (هرگز بازدید نشده)' : ''}.`]);

/* ---------- بخش گزارش مدیریتی امن‌سازی شده (بدون نیاز به eval) ---------- */
const SW = 1920, SH = 1080, NAVY = '#0f172a', BLUE = '#2563eb', RED = '#ef4444', GREEN = '#22c55e', FONT = "Vazirmatn,Tahoma,sans-serif";
const fl = d => new Intl.DateTimeFormat('fa-IR-u-ca-persian', { year: 'numeric', month: 'long', day: 'numeric' }).format(new Date(d));
const loadImg = s => new Promise(r => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => r(i); i.onerror = () => r(null); i.src = s; });
/* عکس را به‌صورت blob می‌گیرد (ابتدا مسیر authenticated، سپس public) تا canvas آلوده نشود */
async function photoSrc(p) {
  for (const path of ['/storage/v1/object/authenticated/photos/', '/storage/v1/object/public/photos/']) {
    try {
      const r = await fetch(URL_ + path + p, { headers: AH() });
      if (r.ok) return URL.createObjectURL(await r.blob());
    } catch (e) { }
  }
  return null;
}

function wrapText(c, t, w) {
  const a = t.split(' '), o = []; let u = '';
  for (const x of a) { const v = u ? u + ' ' + x : x; if (c.measureText(v).width > w && u) { o.push(u); u = x; } else u = v; }
  if (u) o.push(u); return o;
}

function mkS() {
  const c = document.createElement('canvas'); c.width = SW; c.height = SH;
  const x = c.getContext('2d'); x.direction = 'rtl'; x.textAlign = 'right'; x.textBaseline = 'top'; return [c, x];
}

function frame(x, logo, n, tot, code) {
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, SW, SH);
  if (logo) x.drawImage(logo, SW - 320, 30, 260, 260 * logo.height / logo.width);
  x.fillStyle = BLUE; x.fillRect(0, 130, SW, 6);
  x.fillStyle = '#64748b'; x.font = '400 24px ' + FONT;
  x.direction = 'ltr'; x.textAlign = 'left'; x.fillText(code || '', 60, 1030);
  x.fillText(n + ' / ' + tot, SW - 120, 1030); x.textAlign = 'right'; x.direction = 'rtl';
}

async function panel(x, px, py, pw, ph, title, color, srcs, empty) {
  x.fillStyle = color; x.fillRect(px, py, pw, 60);
  x.fillStyle = '#fff'; x.font = '700 28px ' + FONT; x.textAlign = 'center';
  x.fillText(title, px + pw / 2, py + 14); x.textAlign = 'right';
  const ay = py + 60, ah = ph - 60;
  x.fillStyle = '#f8fafc'; x.fillRect(px, ay, pw, ah);
  x.strokeStyle = '#e2e8f0'; x.lineWidth = 2; x.strokeRect(px, py, pw, ph);

  const ims = []; for (const u of srcs.slice(0, 4)) { const i = await loadImg(u); if (i) ims.push(i); }
  if (!ims.length) {
    x.fillStyle = '#94a3b8'; x.font = '400 26px ' + FONT; x.textAlign = 'center';
    x.fillText(empty, px + pw / 2, ay + ah / 2 - 13); x.textAlign = 'right'; return;
  }
  const g = 10, n = ims.length, cols = n == 1 ? 1 : 2, rows = Math.ceil(n / cols), cw = (pw - g * (cols + 1)) / cols, ch = (ah - g * (rows + 1)) / rows;
  ims.forEach((im, i) => {
    const r = Math.floor(i / cols), c = i % cols, bx = px + pw - g - (c + 1) * cw - c * g, by = ay + g + r * (ch + g), k = Math.min(cw / im.width, ch / im.height), w = im.width * k, h = im.height * k;
    x.fillStyle = '#e2e8f0'; x.fillRect(bx, by, cw, ch);
    x.drawImage(im, bx + (cw - w) / 2, by + (ch - h) / 2, w, h);
  });
}

/* گشت بازرسی = یک بازرس در یک روز (هر چک‌لیست محل یک رکورد جداست) */
function rounds(a) { return new Set((a || []).map(r => (r.inspector || '?') + '|' + new Date(r.created_at).toLocaleDateString('en-CA'))).size; }
let RPD = 30;
const MAXS = 60;
const sev_ = x => x.severity || dsev(x.question || '');
const od_ = x => x.due_date ? new Date(x.due_date + 'T23:59:59') < Date.now() : (Date.now() - new Date(x.created_at)) / 864e5 > 14;

function summarySlide(logo, n, tot, S) {
  const [c, x] = mkS();
  frame(x, logo, n, tot, 'SUMMARY');
  x.fillStyle = NAVY; x.font = '800 44px ' + FONT;
  x.fillText('خلاصه مدیریتی وضعیت HSE', SW - 60, 170);
  x.font = '400 24px ' + FONT; x.fillStyle = '#64748b';
  x.fillText('بازه: ' + S.bz + '  |  ' + fa(S.insCount) + ' گشت بازرسی  |  ' + fa(S.chkCount) + ' چک‌لیست', SW - 60, 230);
  const kp = [
    [fa(S.rate) + '٪', 'نرخ انطباق بازدیدها', S.rate >= 85 ? GREEN : RED],
    [fa(S.hi), 'باز با شدت زیاد/بحرانی', RED],
    [fa(S.overdue), 'گذشته از مهلت اصلاح', '#f59e0b'],
    [fa(S.noNotice), 'باز بدون اعلان رسمی', '#f59e0b']
  ], w = 420, g = 40;
  kp.forEach(([v, l, col], i) => {
    const bx = SW - 60 - w - i * (w + g), by = 280;
    x.fillStyle = '#f1f5f9'; x.fillRect(bx, by, w, 170);
    x.fillStyle = col; x.fillRect(bx + w - 10, by, 10, 170);
    x.fillStyle = NAVY; x.font = '800 64px ' + FONT; x.textAlign = 'center'; x.fillText(v, bx + w / 2, by + 20);
    x.font = '400 26px ' + FONT; x.fillStyle = '#64748b'; x.fillText(l, bx + w / 2, by + 115); x.textAlign = 'right';
  });
  const list = (title, rows, px, col) => {
    const pw = 880;
    x.fillStyle = col; x.fillRect(px, 490, pw, 56);
    x.fillStyle = '#fff'; x.font = '700 28px ' + FONT; x.textAlign = 'center'; x.fillText(title, px + pw / 2, 502); x.textAlign = 'right';
    if (!rows.length) { x.fillStyle = '#94a3b8'; x.font = '400 26px ' + FONT; x.textAlign = 'center'; x.fillText('داده‌ای نیست', px + pw / 2, 600); x.textAlign = 'right'; return; }
    const mx = Math.max(1, ...rows.map(r => r[1]));
    rows.forEach((r, k) => {
      const y = 570 + k * 88;
      x.fillStyle = NAVY; x.font = '600 28px ' + FONT; x.fillText(r[0], px + pw - 20, y);
      x.direction = 'ltr'; x.textAlign = 'left'; x.fillText(fa(r[1]), px + 20, y); x.textAlign = 'right'; x.direction = 'rtl';
      x.fillStyle = '#e2e8f0'; x.fillRect(px + 20, y + 46, pw - 40, 10);
      const bw = (pw - 40) * r[1] / mx; x.fillStyle = col; x.fillRect(px + pw - 20 - bw, y + 46, bw, 10);
    });
  };
  list('محل‌های دارای بیشترین عدم‌انطباق باز', S.topLocs, SW - 60 - 880, RED);
  list('دسته‌های پرتکرار عدم‌انطباق در بازه', S.topCats, 60, BLUE);
  return c.toDataURL('image/jpeg', 0.9);
}

async function slides(F, sub, bz, S) {
  try { if (document.fonts && document.fonts.load) await document.fonts.load('700 32px Vazirmatn'); } catch (e) { }
  const logo = await loadImg('logo.png'), cl = F.filter(x => x.status == 'closed').length, tot = F.length + 2, out = [];
  {
    const [c, x] = mkS(); x.fillStyle = NAVY; x.fillRect(0, 0, SW, SH);
    if (logo) x.drawImage(logo, SW - 360, 80, 280, 280 * logo.height / logo.width);
    x.font = '800 68px ' + FONT; x.fillStyle = '#ffffff'; x.fillText('گزارش وضعیت بازرسی و اصلاحات HSE', SW - 100, 320);
    x.font = '400 38px ' + FONT; x.fillStyle = '#94a3b8';
    x.fillText(sub, SW - 100, 420);
    x.fillText('بازه ارزیابی: ' + bz + '  |  تاریخ صدور: ' + fl(Date.now()), SW - 100, 480);
    const st = (i, n, l, col) => {
      const w = 480, bx = SW - 100 - w - i * (w + 40), by = 680;
      x.fillStyle = '#1e293b'; x.fillRect(bx, by, w, 240);
      x.fillStyle = col; x.fillRect(bx + w - 12, by, 12, 240);
      x.fillStyle = '#fff'; x.font = '800 88px ' + FONT; x.textAlign = 'center';
      x.fillText(fa(n), bx + w / 2, by + 30);
      x.font = '400 32px ' + FONT; x.fillStyle = '#94a3b8';
      x.fillText(l, bx + w / 2, by + 150); x.textAlign = 'right';
    };
    st(0, S.totalPeriod, 'کل عدم‌انطباق‌های بازه', '#f87171');
    st(1, cl, 'اقدام اصلاح‌شده', '#4ade80');
    st(2, S.totalPeriod - cl, 'موارد باز', '#fbbf24');
    out.push(c.toDataURL('image/jpeg', 0.9));
  }
  out.push(summarySlide(logo, 2, tot, S));
  for (let i = 0; i < F.length; i++) {
    const f = F[i], [c, x] = mkS();
    frame(x, logo, i + 3, tot, f.module + '-' + f.qid);
    x.fillStyle = NAVY; x.font = '800 36px ' + FONT;
    const qLines = wrapText(x, f.question, SW - 120);
    qLines.forEach((l, idx) => x.fillText(l, SW - 60, 180 + idx * 46));
    x.font = '400 24px ' + FONT; x.fillStyle = '#64748b';
    x.fillText('محل: ' + f.location + '  |  تاریخ ثبت: ' + fl(f.created_at) + (f.responsible ? '  |  مسئول پیگیری: ' + f.responsible : ''), SW - 60, 180 + qLines.length * 46 + 10);
    const pw = (SW - 140) / 2, ph = 620, py = 320;
    const bp = (await Promise.all((f.photos_before || []).slice(0, 4).map(photoSrc))).filter(Boolean);
    const ap = (await Promise.all((f.photos_after || []).slice(0, 4).map(photoSrc))).filter(Boolean);
    await panel(x, pw + 80, py, pw, ph, 'وضعیت پیش از اصلاح (عدم‌انطباق)', RED, bp, 'تصویری ثبت نشده است');
    await panel(x, 60, py, pw, ph, 'وضعیت پس از اصلاح و اقدام اصلاحی', GREEN, ap, 'اقدام اصلاحی انجام نشده است');
    [...bp, ...ap].forEach(u => URL.revokeObjectURL(u));
    out.push(c.toDataURL('image/jpeg', 0.9));
    if ($('#slides-progress')) $('#slides-progress').textContent = 'در حال تولید اسلایدها... ' + fa(i + 1) + ' از ' + fa(F.length);
  }
  return out;
}

const periodStart = d => d ? new Date(Date.now() - d * 864e5).toISOString() : '1970-01-01T00:00:00.000Z';
const periodLabel = d => d ? fa(d) + ' روز گذشته' : 'تمام سوابق';

async function genSlides() {
  const box = $('#slides-container'), btn = $('[data-a=gen-slides]');
  box.innerHTML = '<p id="slides-progress" style="text-align:center;">در حال تولید اسلایدها...</p>';
  btn.disabled = true;
  try {
    const s = periodStart(RPD), FS = 'module,location,qid,question,status,created_at,closed_at,notice_at,severity,category,responsible,due_date,photos_before,photos_after';
    const [P, OF, I] = await Promise.all([
      api('findings?select=' + FS + '&created_at=gte.' + s + '&order=created_at.desc&limit=1000'),
      api('findings?select=' + FS + '&status=eq.open&limit=1000'),
      api('inspections?select=ok,nc,inspector,created_at&created_at=gte.' + s + '&limit=1000')
    ]);
    const ok = I.reduce((a, r) => a + r.ok, 0), nc = I.reduce((a, r) => a + r.nc, 0);
    const S = {
      bz: periodLabel(RPD), totalPeriod: P.length, insCount: rounds(I), chkCount: I.length, rate: pct(ok, ok + nc),
      hi: OF.filter(x => sev_(x) >= 3).length, overdue: OF.filter(od_).length, noNotice: OF.filter(x => !x.notice_at).length,
      topLocs: cnt(OF, x => nl(x.location)).slice(0, 5),
      topCats: cnt(P, x => x.category || cat(x.module, x.question || '')).slice(0, 5)
    };
    const F = [...P].sort((a, b) => (a.status == 'open' ? 0 : 1) - (b.status == 'open' ? 0 : 1) || sev_(b) - sev_(a) || new Date(b.created_at) - new Date(a.created_at)).slice(0, MAXS);
    const imgs = await slides(F, 'گزارش عملکرد کارخانه', S.bz, S);
    box.innerHTML = '<h3 style="margin-bottom:10px;">اسلایدهای تولیدشده:</h3>' +
      (P.length > MAXS ? `<small style="margin-bottom:10px;">از ${fa(P.length)} مورد، ${fa(MAXS)} مورد اول نمایش داده شده است.</small>` : '') +
      imgs.map((src, idx) => `<div style="margin-bottom:15px;"><img src="${src}" style="width:100%; border-radius:8px; border:1px solid var(--ln);"><a href="${src}" download="slide-${idx + 1}.jpg" class="p" style="display:block; text-align:center; text-decoration:none; margin-top:6px;">📥 دانلود اسلاید ${fa(idx + 1)}</a></div>`).join('');
  } catch (e) { box.innerHTML = ''; alert('خطا در تولید اسلایدها: ' + e.message); }
  btn.disabled = false;
}

  else if (a == 'history') historyList();
  else if (a == 'stats') stats();
  else if (a == 'rep') renderManagementReport();
  else if (a == 'gen-slides') genSlides();
  else if (a == 'open') {
    cur = M.find(m => m[0] == t.dataset.k);
    const d = JSON.parse(localStorage.draft || '{}');
    if (d.k == cur[0]) { A = d.A || {}; N = d.N || {}; SV = d.SV || {}; RS = d.RS || {}; LC = d.LC || {}; D.loc = d.loc || ''; D.extra = d.extra || {}; D.shift = d.shift || ''; }
    else { A = {}; N = {}; SV = {}; RS = {}; LC = {}; D.loc = ''; D.extra = {}; D.shift = ''; D.oth = false; }
    form();
  }
  else if (a == 'ans') { A[t.dataset.id] = t.dataset.v; save(); form(); scrollTo(0, y); }
  else if (a == 'addph') { FT = { m: 'addph', id: t.dataset.id }; fi.click(); }
  else if (a == 'rmph') { PH[t.dataset.id].splice(+t.dataset.j, 1); form(); scrollTo(0, y); }
  else if (a == 'send') send();
  else if (a == 'finds') finds();
  else if (a == 'edit-insp') {
    const box = t.closest('.q').querySelector('.edit-area');
    box.hidden = !box.hidden;
    if (!box.hidden) {
      box.innerHTML = `
        <label style="font-size:12px; font-weight:700;">ویرایش محل:</label>
        <select id="edit-loc">${LOCS.map(l => `<option ${l == t.dataset.loc ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <label style="font-size:12px; font-weight:700; margin-top:8px;">ویرایش شیفت:</label>
        <select id="edit-sh">${SHIFTS.map(s => `<option ${s == t.dataset.sh ? 'selected' : ''}>${s}</option>`).join('')}</select>
        <button class="p" data-a="save-insp" data-id="${t.dataset.id}" data-oldloc="${t.dataset.loc}" data-oldsh="${t.dataset.sh}" style="margin-top:10px; min-height:38px; font-size:13px;">ذخیره تغییرات و درج لاگ</button>
      `;
    }
  }
  else if (a == 'save-insp') {
    const id = t.dataset.id, oldLoc = t.dataset.oldloc, oldSh = t.dataset.oldsh;
    const newLoc = $('#edit-loc').value, newSh = $('#edit-sh').value;
    if (oldLoc === newLoc && oldSh === newSh) return alert('تغییری ایجاد نشده است.');
    try {
      await api('inspections?id=eq.' + id, {
        method: 'PATCH',
        body: JSON.stringify({ location: newLoc, shift: newSh })
      });
      const logs = [];
      if (oldLoc !== newLoc) {
        logs.push({ inspection_id: id, inspector: mail, action_type: 'UPDATE_LOCATION', old_value: oldLoc, new_value: newLoc });
      }
      if (oldSh !== newSh) {
        logs.push({ inspection_id: id, inspector: mail, action_type: 'UPDATE_SHIFT', old_value: oldSh, new_value: newSh });
      }
      if (logs.length) {
        await api('inspection_logs', { method: 'POST', body: JSON.stringify(logs) });
      }
      alert('تغییرات با موفقیت ذخیره و در تاریخچه ثبت شد.');
      await historyList(); scrollTo(0, y);
    } catch (er) { alert('خطا در ذخیره تغییرات: ' + er.message); }
  }
  else if (a == 'ntc') {
    try {
      const id = t.dataset.id;
      if (t.checked) {
        const inp = t.closest('.q').querySelector('input[data-code]');
        const code = inp ? inp.value.trim() : '';
        if (!code && !t.defaultChecked) return alert('کد اعلان را وارد کنید.');
        await api('findings?id=eq.' + id, { method: 'PATCH', body: JSON.stringify({ notice_code: code || 'NOTICED', notice_at: new Date().toISOString() }) });
      } else {
        await api('findings?id=eq.' + id, { method: 'PATCH', body: JSON.stringify({ notice_code: null, notice_at: null }) });
      }
      await finds(); scrollTo(0, y);
    } catch (er) { alert(er.message); }
  }
  else if (a == 'addaf') { FT = { m: 'addaf', id: t.dataset.id }; fi.click(); }
  else if (a == 'fix') {
    if (t.checked && !+t.dataset.pa) { t.checked = false; return alert('ثبت عکس پس از اصلاح الزام قانونی دارد.'); }
    if (t.checked && !t.closest('.q').querySelector('[data-rc]').value) { t.checked = false; return alert('ابتدا علت ریشه‌ای را انتخاب کنید.'); }
    try {
      await api('findings?id=eq.' + t.dataset.id, {
        method: 'PATCH',
        body: JSON.stringify({ status: t.checked ? 'closed' : 'open', closed_at: t.checked ? new Date().toISOString() : null })
      });
      await finds(); scrollTo(0, y);
    } catch (er) { alert(er.message); }
  }
  else if (a == 'zoom') {
    const zm = $('#zm'); zm.innerHTML = `<img src="${t.src}">`; zm.hidden = false;
    zm.onclick = () => zm.hidden = true;
  }
};

document.oninput = async e => {
  const t = e.target, y = scrollY;
  if (t.id == 'rp') { RPD = +t.value; renderManagementReport(); return; }
  if (t.dataset.code) { t.nextElementSibling.hidden = !t.value.trim(); return; }
  if (t.id == 'ls') { D.oth = t.value == '__o'; D.loc = D.oth ? '' : t.value; save(); form(); scrollTo(0, y); return; }
  if (t.id == 'sh') { D.shift = t.value; save(); return; }
  if (t.dataset.sv) { SV[t.dataset.sv] = +t.value; save(); form(); scrollTo(0, y); return; }
  if (t.dataset.rc) {
    try { await api('findings?id=eq.' + t.dataset.rc, { method: 'PATCH', body: JSON.stringify({ root_cause: t.value || null }) }); } catch (er) { alert(er.message); }
    return;
  }
  if (t.id == 'loc') D.loc = t.value;
  else if (t.dataset.ex) { D.extra = D.extra || {}; D.extra[t.dataset.ex] = t.value; }
  else if (t.dataset.note) N[t.dataset.note] = t.value;
  else if (t.dataset.rs) RS[t.dataset.rs] = t.value;
  else if (t.dataset.lc) LC[t.dataset.lc] = t.value;
  else return;
  save();
};

if (!SS.t && tok === KEY) {
  home();
} else {
  home();
}
</script>
</body>
</html>
