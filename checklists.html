/* ===== انتخاب تجهیز از فهرست اعلان‌ها + هشدار اعلان/مورد تکراری ===== */
async function eqInit() {
  if (EQ_OK !== null) return EQ_OK;
  try { await api('equipment_list?select=code&limit=1'); EQ_OK = true; } catch (e) { EQ_OK = false; }
  return EQ_OK;
}
const clean_ = s => String(s || '').replace(/[ي]/g, 'ی').replace(/[ك]/g, 'ک').replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[‌]/g, ' ').replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
const toks_ = s => new Set(clean_(s).split(' ').filter(w => w.length > 2));
function sim_(a, b) { const A_ = toks_(a), B_ = toks_(b); if (!A_.size || !B_.size) return 0; let i = 0; A_.forEach(w => { if (B_.has(w)) i++; }); return i / Math.min(A_.size, B_.size); }
const eqOf = id => EQP[id] || D.eq || null;
const stOpen = s => !['خاتمه یافته', 'انجام شده', 'باطل شده'].includes(s);

async function eqLoad(code) {
  if (ENC[code]) return ENC[code];
  const q = encodeURIComponent(code);
  const [nt, fd_] = await Promise.all([
    api('notices?select=no,jdate,created_on,status,description&equipment_code=eq.' + q + '&status=neq.' + encodeURIComponent('باطل شده') + '&order=created_on.desc&limit=40').catch(() => []),
    api('findings?select=qid,question,status,notice_code,created_at&equipment_code=eq.' + q + '&status=eq.open&limit=20').catch(() => [])
  ]);
  return ENC[code] = { nt, fd: fd_ };
}
function eqNoticesHtml(id) {
  const e = eqOf(id); if (!e) return '';
  const c = ENC[e.code]; if (!c) return '<small>در حال بررسی اعلان‌های قبلی این تجهیز...</small>';
  const txt = (N[id] || '') + ' ' + ((cur && cur[6].find(q => cur[0] + '-' + q.id == baseId(id)) || {}).t || '');
  const ln = LNK[id];
  const rows = c.nt.map(x => ({ ...x, s: sim_(txt, x.description), op: stOpen(x.status) })).sort((a, b) => (b.op - a.op) || (b.s - a.s)).slice(0, 8);
  const fr = c.fd.filter(x => !ln || x.notice_code != ln.no);
  const open = c.nt.filter(x => stOpen(x.status)).length;
  return `<div class="eqn">
    ${ln ? `<div class="chip on" style="margin-bottom:6px;">🔗 به اعلان ${fa(ln.no)} پیوند شد (اعلان جدید ثبت نمی‌شود) <b data-a="equnlink" data-id="${esc(id)}">✕</b></div>` : ''}
    <small><b>سوابق این تجهیز:</b> ${fa(c.nt.length)} اعلان${open ? ` (<span style="color:var(--warn);">${fa(open)} باز</span>)` : ''}${fr.length ? ` · ${fa(fr.length)} عدم‌انطباق باز در این ماژول` : ''}</small>
    ${rows.map(x => `<div class="eqrow ${x.op && x.s >= .5 ? 'warn' : ''}">

        ${x.s >= .5 ? '<span class="bg r">⚠ مشابه</span>' : ''}<br>${esc((x.description || '').slice(0, 110))}
        ${x.op && !ln ? `<button class="l" data-a="eqlink" data-id="${esc(id)}" data-no="${esc(x.no)}" data-d="${esc(x.created_on)}" data-s="${esc(x.status)}" style="display:inline;">🔗 همین اعلان است؛ پیوند بزن</button>` : ''}
      </div>`).join('')}
    ${fr.map(x => `<div class="eqrow warn">عدم‌انطباق باز: ${esc((x.question || '').slice(0, 100))}${x.notice_code ? ` (اعلان ${esc(x.notice_code)})` : ''}</div>`).join('')}
  </div>`;
}
function eqBlock(id) {

  return `<div class="eqb">

async function eqPost() {

/* پیش از ثبت: اگر برای تجهیز، اعلان باز مشابه هست و پیوند نشده، تایید بگیر */
async function eqCheckDup(ncs, qt) {
  const lines = [];
  for (const i of ncs) {
    const e = eqOf(i); if (!e || LNK[i]) continue;
    try {
      const c = await eqLoad(e.code), txt = (N[i] || '') + ' ' + qt(baseId(i));
      c.nt.filter(x => stOpen(x.status) && sim_(txt, x.description) >= .5).forEach(x => lines.push(`• ${e.code}: اعلان ${x.no} (باز) — ${(x.description || '').slice(0, 70)}`));
      c.fd.filter(x => sim_(txt, x.question) >= .5).forEach(x => lines.push(`• ${e.code}: عدم‌انطباق باز — ${(x.question || '').slice(0, 70)}`));
    } catch (er) { }
  }
  return lines.length ? confirm('برای این تجهیز مورد باز مشابهی قبلاً ثبت شده است:\n' + [...new Set(lines)].slice(0, 6).join('\n') + '\n\nبا این حال مورد جدید ثبت شود؟\n(برای جلوگیری از تکرار «انصراف» بزنید و از دکمه «پیوند بزن» استفاده کنید)') : true;
}

async function moveToLocal() {

    const ok = [], fail = []; let n = 0;
    await pool(4, items, async it => {

        if (!have || (it.size && have.size != it.size)) {
          let r = await fetch(pubUrl(it.name)); if (!r.ok) r = await fetch(URL_ + '/storage/v1/object/authenticated/photos/' + it.name, { headers: AH() });
          if (!r.ok) throw new Error('دریافت ناموفق ' + r.status);
          const blob = await r.blob(), w = await (await LDIR.getFileHandle(it.name, { create: true })).createWritable();
          await w.write(blob); await w.close();
          have = await localFile(it.name);
          if (!have || (it.size && have.size != it.size)) throw new Error('حجم فایل ذخیره‌شده با اصل یکی نیست');
        }
        ok.push(it.name);
      } catch (e) { fail.push(it.name + ': ' + e.message); }

    });
    log(`کپی موفق: ${fa(ok.length)} | ناموفق: ${fa(fail.length)}`);
    fail.slice(0, 5).forEach(log);
    if (del && ok.length) {

        if (!r.ok) { log('حذف ناموفق: ' + (await r.text()).slice(0, 200)); break; }
        gone += (await r.json()).length;

      log(`حذف‌شده از سوپابیس: ${fa(gone)} از ${fa(names.length)}` + (gone < names.length ? ' — اگر کمتر است، سیاست DELETE برای bucket «photos» لازم است.' : ''));
    }
    log('پایان.');
  } catch (e) { log('❌ ' + e.message); }
  btn.disabled = false; refreshUsage();
}


/* ===== یافتن عدم‌انطباق‌های تکراری: محل یکسان + شباهت متن (نه لزوماً عین هم) ===== */
const DSTOP = new Set('در به از و با که این آن است شده شود می باید را برای یا هم تا بر یک های ها ای بی نیز بوده نشده نیست وجود دارد دارند بدون'.split(' '));
const dnorm = t => String(t || '').replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/[\u200c\u200f\u064b-\u065f]/g, ' ').replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
const dtok = t => { const a = dnorm(t).split(' ').filter(w => w.length > 1 && !DSTOP.has(w)).map(w => w.replace(/(ها|های|ان|ات)$/, '')); return new Set(a); };
function dsim(a, b) { if (!a.size || !b.size) return 0; let i = 0; a.forEach(w => { if (b.has(w)) i++; }); return Math.max(i / (a.size + b.size - i), i / Math.min(a.size, b.size) * .85); }
async function dups(all) {
  view('<p style="text-align:center; padding:40px;">در حال خواندن عدم‌انطباق‌ها و مقایسه...</p>');
  let rows = [];
  try {
    for (let o = 0; o < 20000; o += 1000) {
      const r = await api('findings?select=id,qid,module,question,note,location,status,severity,created_at,due_date&status=' + (all ? 'neq.cancelled' : 'eq.open') + '&order=id.asc&limit=1000&offset=' + o);
      rows = rows.concat(r || []); if (!r || r.length < 1000) break;
    }
  } catch (e) { view('<p class="q bad">خطا: ' + esc(e.message) + '</p><button class="l" data-a="finds">‹ بازگشت</button>'); return; }
  rows = rows.filter(x => x.module != 'MED');
  const by = {}; rows.forEach(x => { x._t = dtok((x.question || '') + ' ' + (x.note || '')); (by[nl(x.location).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))] = by[nl(x.location).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))] || []).push(x); });
  const groups = [];
  Object.entries(by).forEach(([loc, L]) => {
    const par = L.map((_, i) => i), f = i => par[i] == i ? i : (par[i] = f(par[i]));
    for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
      const same = dnorm((L[i].question || '') + ' ' + (L[i].note || '')) == dnorm((L[j].question || '') + ' ' + (L[j].note || ''));
      if (same || dsim(L[i]._t, L[j]._t) >= .6) par[f(i)] = f(j);
    }
    const m = {}; L.forEach((x, i) => (m[f(i)] = m[f(i)] || []).push(x));
    Object.values(m).filter(g => g.length > 1).forEach(g => groups.push({ loc, g: g.sort((a, b) => String(a.created_at).localeCompare(String(b.created_at))) }));
  });
  groups.forEach(x => {
    const rest = x.g.slice(), ord = [rest.shift()];
    while (rest.length) { const l = ord[ord.length - 1]; let bi = 0, bv = -1; rest.forEach((o, i) => { const v = dsim(l._t, o._t); if (v > bv) { bv = v; bi = i; } }); ord.push(rest.splice(bi, 1)[0]); }
    x.g = ord;
  });
  groups.forEach(x => x.g.forEach(r => {
    const ix = x.g.indexOf(r); let best = null, bs = -1; x.g.forEach((o, oi) => { if (o === r || (ix > 0 && oi != ix - 1)) return; const v = dnorm((r.question || '') + ' ' + (r.note || '')) == dnorm((o.question || '') + ' ' + (o.note || '')) ? 1 : dsim(r._t, o._t); if (v > bs) { bs = v; best = o; } });
    r._p = best; r._s = Math.round(Math.max(0, bs) * 100); r._w = best ? [...r._t].filter(w => best._t.has(w)) : [];
  }));
  groups.sort((a, b) => b.g.length - a.g.length);
  const stN = { open: 'باز', closed: 'اصلاح‌شده' };
  const hl = (txt, ws) => { const set = new Set(ws); return String(txt || '').split(/(\s+)/).map(w => { const k = dnorm(w).replace(/(ها|های|ان|ات)$/, ''); return set.has(k) && k ? `<mark style="background:#fde68a;color:#111;border-radius:3px;padding:0 2px">${esc(w)}</mark>` : esc(w); }).join(''); };
  const total = groups.reduce((t, x) => t + x.g.length - 1, 0);
  view(`<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;"><button class="l" data-a="finds" style="margin:0;">‹ بازگشت به پیگیری</button></div>
    <h2>🔍 عدم‌انطباق‌های تکراری ${all ? '(باز و اصلاح‌شده)' : '(باز)'}</h2>

    ${groups.map((x, n) => `<div class="q" style="margin-top:10px;"><b>${fa(n + 1)}. ${esc(x.loc)} — ${fa(x.g.length)} مورد مشابه</b>${x.g.map(r => `<div data-dr style="border-top:1px solid var(--bd); padding:6px 0; font-size:13px;"><span style="color:var(--mu)">#${esc(r.id)} · ${esc(mn(r.module) || r.module || '')} · ${fd(r.created_at)} · ${stN[r.status] || esc(r.status)}${r.due_date ? ' · مهلت ' + fd(r.due_date) : ''}</span><br>${hl(r.question || '—', r._w)}${r._p ? `<br><small style="color:var(--wa)">🔗 تکراریِ مورد ${x.g.indexOf(r._p) < x.g.indexOf(r) ? 'بالا' : 'پایین'} (#${esc(r._p.id)}) — شباهت ${fa(r._s)}٪${r._w.length ? ' · کلمات مشترک: ' + esc(r._w.join('، ')) : ''}</small>` : ''}${r.note ? `<br><small>شرح: ${hl(r.note, r._w)}</small>` : ''}${window.HSEAuth && HSEAuth.role === 'manager' ? `<br><button class="l" data-a="fdel" data-id="${r.id}" style="margin-top:4px; color:var(--bad); min-height:32px;">🗑 حذف این مورد</button>` : ''}</div>`).join('')}</div>`).join('') || '<div class="q">موردی تکراری پیدا نشد.</div>'}`);
  window._dtxt = groups.map((x, n) => `${n + 1}. ${x.loc} (${x.g.length} مورد)\n` + x.g.map(r => `   - #${r.id} [${r.status}] ${r.question || ''}${r.note ? ' | شرح: ' + r.note : ''}${r._p ? ' | مشابه #' + r._p.id + ' (' + r._s + '٪)' : ''}`).join('\n')).join('\n\n');
}

/* ===== تطبیق آمار با خروجی واحد فنی: همان دسته‌ها و بازه‌های سنی؛ جدا برای «دارای اعلان» (ثبت‌شده در سامانه فنی) و «بدون اعلان» ===== */
async function recon() {
  view('<p style="text-align:center; padding:40px;">در حال محاسبه...</p>');
  let rows = [];
  try {
    for (let o = 0; o < 40000; o += 1000) {
      const r = await api('findings?select=id,module,status,created_at,notice_code,notice_at,closed_at&order=id.asc&limit=1000&offset=' + o);
      rows = rows.concat(r || []); if (!r || r.length < 1000) break;
    }
  } catch (e) { view('<p class="q bad">خطا: ' + esc(e.message) + '</p><button class="l" data-a="finds">‹ بازگشت</button>'); return; }
  rows = rows.filter(x => x.module != 'MED');
  const now = Date.now(), age = x => Math.floor((now - new Date(x.notice_at || x.created_at)) / 864e5);
  const B = [['جدید ۰–۷ روز', 0, 7], ['در پیگیری ۸–۳۰', 8, 30], ['تأخیر ۳۱–۶۰', 31, 60], ['تأخیر جدی ۶۱–۹۰', 61, 90], ['تأخیر بحرانی بیش از ۹۰', 91, 1e9]];
  const grp = { all: rows, yes: rows.filter(x => x.notice_code || x.notice_at), no: rows.filter(x => !x.notice_code && !x.notice_at) };
  const calc = L => { const op = L.filter(x => x.status == 'open'), cl = L.filter(x => x.status == 'closed'), cn = L.filter(x => x.status == 'cancelled'); return { n: L.length, op, cl, cn, b: B.map(([, a, z]) => op.filter(x => age(x) >= a && age(x) <= z).length) }; };
  const R = { all: calc(grp.all), yes: calc(grp.yes), no: calc(grp.no) };
  const pc = (a, n) => n ? fa((a / n * 100).toFixed(2)) + '٪' : '—';
  const row = (t, f) => `<tr><td>${t}</td>${['all', 'yes', 'no'].map(k => `<td>${f(R[k])}</td>`).join('')}</tr>`;
  view(`<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;"><button class="l" data-a="finds" style="margin:0;">‹ بازگشت به پیگیری</button></div>
    <h2>📊 تطبیق با گزارش واحد فنی</h2>
    <p style="font-size:13px;">همان دسته‌های خروجی فنی (کل، در جریان، بسته، لغو و بازه‌های سنی). چون واحد فنی فقط مواردی را دارد که برایشان اعلان صادر شده، ستون <b>«دارای اعلان»</b> را با گزارش فنی مقایسه کنید. سن از تاریخ اعلان (اگر نبود تاریخ ثبت) حساب شده و موارد داروها شمرده نمی‌شوند.</p>
    <div style="overflow-x:auto"><table style="width:100%; border-collapse:collapse; font-size:13px;" class="rtb">
    <tr><th>شرح</th><th>همه موارد</th><th>دارای اعلان</th><th>بدون اعلان</th></tr>
    ${row('کل', r => fa(r.n))}${row('در جریان (باز)', r => fa(r.op.length))}${row('درصد در جریان', r => pc(r.op.length, r.n))}
    ${row('بسته (اصلاح‌شده)', r => fa(r.cl.length))}${row('درصد بسته', r => pc(r.cl.length, r.n))}
    ${row('لغو شده', r => fa(r.cn.length))}${row('درصد لغو', r => pc(r.cn.length, r.n))}
    ${B.map(([t], i) => row('باز: ' + t, r => fa(r.b[i]) + ' (' + pc(r.b[i], r.op.length) + ')')).join('')}
    </table></div>
    <div class="q" style="margin-top:10px; font-size:13px;"><b>مرجع گزارش فنی (تصویر شما):</b> کل ۶۳۴ · در جریان ۲۱۰ (۳۳٫۱۲٪) · بسته ۴۱۱ (۶۴٫۸۳٪) · لغو ۱۳ (۲٫۰۵٪) · سنی: ۱۰ / ۳۰ / ۲۶ / ۱۹ / ۱۲۵.</div>
    <div class="q" style="margin-top:12px;"><b>📎 مقایسهٔ دقیق با فایل اکسل اعلان‌های فنی</b>
      <small style="display:block; margin:4px 0;">فایل خروجی فنی را انتخاب کنید (فقط ردیف‌های اولویت HSE خوانده می‌شود). فایل در همین مرورگر پردازش می‌شود و جایی ارسال نمی‌شود.</small>
      <input type="file" id="techf" accept=".xlsx,.xls">
      <label style="display:block; margin-top:8px; font-size:13px;"><input type="checkbox" id="tqinc"> شامل اعلان‌هایی که این شخص ثبت کرده و موضوعشان مرتبط با HSE است (حتی اگر اولویت «HSE» نخورده)</label>
      <input id="tqrep" value="هفت لنگی" placeholder="بخشی از نام گزارش‌دهنده"></div>
    <div id="techout"></div>
    <small>اگر «دارای اعلان» از فنی بیشتر است: موارد تکراری یا اعلان‌دار دو بار ثبت‌شده. اگر در جریان بیشتر است: مواردی که فنی بسته ولی اینجا تأیید نشده. اگر بسته کمتر است: همین علت.</small>`);
}

/* ===== مقایسهٔ ردیف‌به‌ردیف با اکسل فنی (اعلان‌های اولویت HSE) بر اساس شمارهٔ اعلان ===== */
async function techCompare(file) {
  const out = $('#techout'); out.innerHTML = '<p>در حال خواندن فایل...</p>';
  try {
    let raw = window._traw;
    if (file) {
      if (!window.XLSX) await new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload = ok; sc.onerror = () => no(new Error('بارگذاری کتابخانهٔ اکسل ممکن نشد (اینترنت یا فیلتر).')); document.head.appendChild(sc); });
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' }), ws = wb.Sheets[wb.SheetNames[0]];
      raw = window._traw = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });
    }
    if (!raw) { out.innerHTML = ''; return; }
    const clean = v => String(v == null ? '' : v).replace(/[\u200e\u200f\u202a-\u202e]/g, '').trim();
    const dig = v => clean(v).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g, '');
    const rep = ($('#tqrep') ? $('#tqrep').value : '').trim(), inc = $('#tqinc') && $('#tqinc').checked;
    const HK = /ایمنی|ایمن|حفاظ|محافظ|کپسول|اطفا|آتش|چشم ?شوی|دوش|اضطراری|ارت|سقوط|نرده|گارد|علائم|تابلو|حریق|نشت|گاز|هود|تهویه|کمک ?های اول|شیمیایی|اسید|حادثه|خطر|حفاظت/;
    const cv = r => ({ no: dig(r['شماره']), date: clean(r['تاریخ ایجاد']), st: clean(r['وضعیت']), eq: clean(r['عنوان تجهیز']), txt: clean(r['شرح']), by: clean(r['گزارش دهنده']), pr: clean(r['اولویت']) });
    const all = raw.map(cv), allBy = {}; all.forEach(t => allBy[t.no] = t); const base = all.filter(t => t.pr == 'HSE');
    const cand = rep ? all.filter(t => t.pr != 'HSE' && t.by.includes(rep)) : [], candHse = cand.filter(t => HK.test(t.txt + ' ' + t.eq));
    const T = base.concat(inc ? candHse : []);
    if (!T.length) { out.innerHTML = '<div class="q bad">ردیفی با اولویت «HSE» در فایل پیدا نشد (ستون‌های «اولویت» و «شماره» لازم است).</div>'; return; }
    const tk = st => /خاتمه|انجام شده/.test(st) ? 'closed' : /باطل/.test(st) ? 'cancelled' : 'open';
    T.forEach(t => t.k = tk(t.st));
    let rows = []; for (let o = 0; o < 40000; o += 1000) { const r = await api('findings?select=id,module,question,note,location,status,notice_code&order=id.asc&limit=1000&offset=' + o); rows = rows.concat(r || []); if (!r || r.length < 1000) break; }
    rows = rows.filter(x => x.module != 'MED');
    const appBy = {}; rows.forEach(x => { const d = dig(x.notice_code); if (d) (appBy[d] = appBy[d] || []).push(x); });
    const techBy = {}; T.forEach(t => techBy[t.no] = t);
    const cnt = k => T.filter(t => t.k == k).length;
    const noApp = T.filter(t => !appBy[t.no]);
    const freeAll = rows.filter(x => !dig(x.notice_code) && x.status != 'cancelled');
    const free = rows.filter(x => !dig(x.notice_code) && x.status != 'cancelled');
    free.forEach(x => x._t = dtok((x.question || '') + ' ' + (x.note || '')));
    noApp.forEach(t => { const tt = dtok(t.txt + ' ' + t.eq); let b = null, bs = 0; free.forEach(x => { const v = dsim(tt, x._t); if (v > bs) { bs = v; b = x; } }); t._c = bs >= .5 ? b : null; t._s = Math.round(bs * 100); });
    const notInTech = rows.filter(x => dig(x.notice_code) && !techBy[dig(x.notice_code)]);
    const mism = []; T.forEach(t => (appBy[t.no] || []).forEach(x => { if (x.status != t.k) mism.push({ t, x }); }));
    const dupNo = Object.entries(appBy).filter(([n, L]) => L.length > 1 && techBy[n]); dupNo.forEach(([n, L]) => L.sort((a, b) => a.id - b.id));
    const stA = { open: 'باز', closed: 'اصلاح‌شده', cancelled: 'لغو' }, stT = { open: 'در جریان', closed: 'بسته', cancelled: 'باطل' };
    const DELB = x => window.HSEAuth && HSEAuth.role === 'manager' ? `<br><button class="l" data-a="fdel" data-id="${x.id}" style="margin-top:4px; color:var(--bad); min-height:32px;">🗑 حذف این مورد از برنامه</button>` : '';
    const lim = (a, f) => a.slice(0, 80).map(f).join('') + (a.length > 80 ? `<small>و ${fa(a.length - 80)} مورد دیگر...</small>` : '');
    const sec = (t, n, body) => `<details class="q" style="margin-top:8px;" ${n ? 'open' : ''}><summary style="cursor:pointer; font-weight:700;">${t} — ${fa(n)} مورد</summary>${body || '<small>موردی نیست ✅</small>'}</details>`;
    const li = h => `<div style="border-top:1px solid var(--bd); padding:6px 0; font-size:13px;">${h}</div>`;
    window._ttxt = [`اعلان فنی بدون مورد در برنامه (${noApp.length}):`, ...noApp.map(t => `#${t.no} ${t.date} [${t.st}] ${t.txt}${t._c ? ' | احتمالاً مورد #' + t._c.id + ' (' + t._s + '٪)' : ''}`)].join('\n');
    out.innerHTML = `<h3 style="margin-top:14px;">نتیجهٔ مقایسه با فایل فنی</h3>
      <div class="q" style="font-size:13px;">فایل فنی (اولویت HSE${inc ? ' + مرتبط‌های «' + esc(rep) + '»' : ''}): <b>${fa(T.length)}</b> اعلان — در جریان <b>${fa(cnt('open'))}</b> · بسته <b>${fa(cnt('closed'))}</b> · باطل <b>${fa(cnt('cancelled'))}</b><br>
      برنامه: <b>${fa(rows.length)}</b> مورد (غیر دارو)، از این‌ها <b>${fa(Object.values(appBy).reduce((n, L) => n + L.length, 0))}</b> مورد کد اعلان دارد؛ اعلان‌های فنی پیداشده در برنامه: <b>${fa(T.length - noApp.length)}</b> از ${fa(T.length)}.</div>
      ${rep ? `<div class="q" style="margin-top:6px; font-size:13px;">اعلان‌های ثبت‌شده توسط «${esc(rep)}» با اولویت غیر از HSE: <b>${fa(cand.length)}</b> — از این‌ها به‌نظر مرتبط با HSE (بر اساس کلمات کلیدی): <b>${fa(candHse.length)}</b> ${inc ? '(در مقایسه بالا لحاظ شد)' : '(هنوز لحاظ نشده؛ تیک بالا را بزنید)'}</div>
      ${sec('اعلان‌های ' + esc(rep) + ' که مرتبط با HSE تشخیص داده شد (بررسی کنید)', candHse.length, lim(candHse, t => li(`<b>#${esc(t.no)}</b> · ${esc(t.date)} · ${esc(t.st)} · ${esc(t.eq)}<br>${esc(t.txt)}`)))}` : ''}
      <button class="l" data-a="ttcopy" style="margin-top:6px;">📋 کپی فهرست اعلان‌های فاقد مورد در برنامه</button>
      ${sec('۱) اعلان فنی که در برنامه نیست (یا کدش وارد نشده)', noApp.length, lim(noApp, t => li(`<b>#${esc(t.no)}</b> · ${esc(t.date)} · ${esc(t.st)} · ${esc(t.eq)}<br>${esc(t.txt)}${t._c ? `<br><small style="color:var(--wa)">🔗 احتمالاً همان مورد #${esc(t._c.id)} برنامه (${fa(t._s)}٪، بدون کد اعلان): ${esc(t._c.question || '')}</small>` : ''}`)))}
      ${sec('۲) وضعیت متفاوت بین فنی و برنامه', mism.length, lim(mism, m => li(`<b>#${esc(m.t.no)}</b> فنی: ${stT[m.t.k]} (${esc(m.t.st)}) ↔ برنامه: ${stA[m.x.status] || esc(m.x.status)} (مورد #${esc(m.x.id)})<br>${esc(m.t.txt)}`)))}
      ${sec('۳) مورد برنامه که کد اعلانش در فایل فنی (HSE) نیست', notInTech.length, lim(notInTech, x => { const o = allBy[dig(x.notice_code)]; return `<div data-dr>${li(`مورد #${esc(x.id)} · کد «${esc(x.notice_code)}» · ${esc(x.question || '')}<br><small style="color:var(--wa)">${o ? 'این شماره در فایل فنی هست ولی اولویتش «' + esc(o.pr || 'بدون اولویت') + '» و گزارش‌دهنده «' + esc(o.by) + '» است — جزو ۶۳۴ نیست' : 'این شماره اصلاً در فایل فنی نیست (احتمالاً اشتباه تایپی)'}</small>` + DELB(x))}</div>`; }))}
      ${sec('۵) موارد برنامه بدون کد اعلان (هنوز در فنی ثبت نشده، یا تکراری)', freeAll.length, lim(freeAll, x => `<div data-dr>${li(`مورد #${esc(x.id)} · ${esc(stA[x.status] || x.status)} · ${esc(x.location || '')}<br>${esc(x.question || '')}` + DELB(x))}</div>`))}
      ${sec('۴) یک اعلان فنی که چند بار در برنامه ثبت شده (تکراری)', dupNo.length, lim(dupNo, ([n, L]) => li(`<b>اعلان #${esc(n)}</b> در ${fa(L.length)} مورد برنامه — یکی را نگه دارید و بقیه را حذف کنید<br><small>${esc(techBy[n].txt)}</small>` + L.map((x, i) => `<div data-dr style="margin-top:6px; padding:4px 0; border-top:1px dashed var(--bd);">${i == 0 ? '✅ نگه‌داشتن (قدیمی‌ترین) ' : '⚠️ تکراری '}#${esc(x.id)} · ${esc(stA[x.status] || x.status)} · ${esc(x.question || '')}${i ? DELB(x) : ''}</div>`).join(''))))}`;
  } catch (e) { out.innerHTML = '<div class="q bad">خطا: ' + esc(e.message) + '</div>'; }
}
document.addEventListener('change', e => { if (!e.target) return; if (e.target.id == 'techf' && e.target.files[0]) techCompare(e.target.files[0]); else if (e.target.id == 'tqinc' || e.target.id == 'tqrep') techCompare(null); });

/* ---------- بخش گزارش مدیریتی امن‌سازی شده (بدون نیاز به eval) ---------- */
const SW = 1920, SH = 1080, NAVY = '#0f172a', BLUE = '#2563eb', RED = '#ef4444', GREEN = '#22c55e', FONT = "Vazirmatn,Tahoma,sans-serif";
const fl = d => new Intl.DateTimeFormat('fa-IR-u-ca-persian', { year: 'numeric', month: 'long', day: 'numeric' }).format(new Date(d));
const loadImg = s => new Promise(r => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => r(i); i.onerror = () => r(null); i.src = s; });

function wrapText(c, t, w) {
  const a = t.split(' '), o = []; let u = '';
  for (const x of a) { const v = u ? u + ' ' + x : x; if (c.measureText(v).width > w && u) { o.push(u); u = x; } else u = v; }
  if (u) o.push(u); return o;
}

function mkS() {
  const c = document.createElement('canvas'); c.width = SW; c.height = SH;
  const x = c.getContext('2d'); x.direction = 'rtl'; x.textAlign = 'right'; x.textBaseline = 'top'; return [c, x];
}

function frame(x, logo, n, tot, code) {
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, SW, SH);
  if (logo) x.drawImage(logo, SW - 320, 30, 260, 260 * logo.height / logo.width);
  x.fillStyle = BLUE; x.fillRect(0, 130, SW, 6);
  x.fillStyle = '#64748b'; x.font = '400 24px ' + FONT;
  x.direction = 'ltr'; x.textAlign = 'left'; x.fillText(code || '', 60, 1030);
  x.fillText(n + ' / ' + tot, SW - 120, 1030); x.textAlign = 'right'; x.direction = 'rtl';
}


/* گشت بازرسی = یک بازرس در یک روز (هر چک‌لیست محل یک رکورد جداست) */
function rounds(a) { return new Set((a || []).map(r => (r.inspector || '?') + '|' + new Date(r.created_at).toLocaleDateString('en-CA'))).size; }
/* چک‌لیست تکمیل‌شده: رکوردهای قدیمی بازدید روزانه (هر سوله جدا) = هر بازرس در هر روز یکی؛ بقیه هر رکورد یکی */
function checks(a) { const g = new Set(); let n = 0; (a || []).forEach(r => { if (r.module == 'D' && r.location !== ROUND_LOC) g.add((r.inspector || '?') + '|' + new Date(r.created_at).toLocaleDateString('en-CA')); else n++; }); return g.size + n; }

const sev_ = x => x.severity || dsev(x.question || '');
const od_ = x => x.due_date ? new Date(x.due_date + 'T23:59:59') < Date.now() : (Date.now() - new Date(x.created_at)) / 864e5 > 14;

  ], w = 420, g = 40;

    const mx = Math.max(1, ...rows.map(r => r[1]));
    rows.forEach((r, k) => {

      x.direction = 'ltr'; x.textAlign = 'left'; x.fillText(fa(r[1]), px + 20, y); x.textAlign = 'right'; x.direction = 'rtl';
      x.fillStyle = '#e2e8f0'; x.fillRect(px + 20, y + 46, pw - 40, 10);

  list('محل‌های دارای بیشترین عدم‌انطباق باز', S.topLocs, SW - 60 - 880, RED);

/* ===== گزارش مدیریتی v2: فیلتر بازه/ماه/فصل/سال شمسی، بدون سقف اسلاید، خروجی PPTX چندبخشی ===== */
const JMN = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
function j2g(jy, jm, jd) {
  jy += 1595;
  let days = -355668 + 365 * jy + Math.floor(jy / 33) * 8 + Math.floor((jy % 33 + 3) / 4) + jd + (jm < 7 ? (jm - 1) * 31 : (jm - 7) * 30 + 186);
  let gy = 400 * Math.floor(days / 146097); days %= 146097;
  if (days > 36524) { days--; gy += 100 * Math.floor(days / 36524); days %= 36524; if (days >= 365) days++; }
  gy += 4 * Math.floor(days / 1461); days %= 1461;
  if (days > 365) { gy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  let gd = days + 1;
  const ml = [0, 31, (gy % 4 == 0 && gy % 100 != 0) || gy % 400 == 0 ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  let gm = 0; while (gm < 13 && gd > ml[gm]) { gd -= ml[gm]; gm++; }
  return [gy, gm, gd];
}
function jNow() { const o = {}; new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn', { year: 'numeric', month: 'numeric', day: 'numeric' }).formatToParts(new Date()).forEach(p => o[p.type] = +p.value); return o; }
const jStart = (y, m) => { const [a, b, c] = j2g(y, m, 1); return new Date(a, b - 1, c); };

/* وضعیت فیلترهای گزارش */
const R = { mode: 'days', days: 30, jy: 0, jm: 0, from: '', to: '', mod: '', st: '', ord: 'done', per: 60 };
function rRange() {
  if (R.mode == 'days') return { from: R.days ? new Date(Date.now() - R.days * 864e5) : null, to: null, label: R.days ? fa(R.days) + ' روز گذشته' : 'تمام سوابق' };
  if (R.mode == 'j') {
    const y = +R.jy, m = +R.jm;
    if (m == 0) return { from: jStart(y, 1), to: jStart(y + 1, 1), label: 'سال ' + fa(y) };
    if (m > 100) { const q = m - 100, s = (q - 1) * 3 + 1; return { from: jStart(y, s), to: s + 3 > 12 ? jStart(y + 1, 1) : jStart(y, s + 3), label: 'فصل ' + ['بهار', 'تابستان', 'پاییز', 'زمستان'][q - 1] + ' ' + fa(y) }; }
    return { from: jStart(y, m), to: m == 12 ? jStart(y + 1, 1) : jStart(y, m + 1), label: JMN[m - 1] + ' ' + fa(y) };
  }
  const f = R.from ? new Date(R.from + 'T00:00:00') : null, t = R.to ? new Date(new Date(R.to + 'T00:00:00').getTime() + 864e5) : null;
  return { from: f, to: t, label: (f ? fl(f) : 'ابتدا') + ' تا ' + (R.to ? fl(R.to + 'T00:00:00') : 'اکنون') };
}
/* بخش‌های کوئری: تاریخ، ماژول، وضعیت */
function rDateQ(fld = 'created_at') { const r = rRange(); let q = ''; if (r.from) q += '&' + fld + '=gte.' + encodeURIComponent(r.from.toISOString()); if (r.to) q += '&' + fld + '=lt.' + encodeURIComponent(r.to.toISOString()); return q; }
const rModQ = () => (R.mod ? '&module=eq.' + encodeURIComponent(R.mod) : '') + '&module=neq.MED';
const rQuery = () => rDateQ(R.ord == 'done' ? 'closed_at' : 'created_at') + rModQ() + (R.st ? '&status=eq.' + R.st : '&status=in.(open,closed)');

async function fetchAll(p) {
  const out = [];
  for (let off = 0; ;) {
    const rows = await api(p + (p.includes('?') ? '&' : '?') + 'limit=1000&offset=' + off);
    if (!rows.length) break; out.push(...rows); off += rows.length;
  }
  return out;
}
/* آخرین بازدید هر ماژول: یک درخواست برای ۶۰۰ بازدید اخیر؛ فقط برای ماژول‌هایی که در آن‌ها نبودند (بازدید کم‌تکرار) درخواست جدا */
async function lastVisits() {
  const rows = [], seen = new Set();
  try { (await api('inspections?select=module,created_at&order=created_at.desc&limit=600')).forEach(r => { if (!seen.has(r.module)) { seen.add(r.module); rows.push(r); } }); } catch (e) { }
  await Promise.all(M.filter(m => !seen.has(m[0])).map(async m => { try { const r = await api('inspections?select=module,created_at&module=eq.' + encodeURIComponent(m[0]) + '&order=created_at.desc&limit=1'); if (r[0]) rows.push(r[0]); } catch (e) { } }));
  return rows;
}
async function rCount(extra = '') {
  const r = await fetch(URL_ + '/rest/v1/findings?select=id&limit=1' + rQuery() + extra, { headers: { ...AH(), Prefer: 'count=exact' } });
  if (!r.ok) throw new Error(await r.text());
  const m = /\/(\d+)$/.exec(r.headers.get('content-range') || '');
  if (m) return +m[1];
  return (await fetchAll('findings?select=id&order=id.asc' + rQuery() + extra)).length;
}

/* عکس: اول مسیر public (سریع، بدون preflight)، بعد authenticated. بعد از ترسیم باید close() شود تا حافظه آزاد شود */
async function photoImg(p) {
  try { const lf = await localFile(p); if (lf) return await createImageBitmap(lf); } catch (e) { }
  for (const path of ['/storage/v1/object/public/photos/', '/storage/v1/object/authenticated/photos/']) {
    try {
      const r = await fetch(URL_ + path + p, path.includes('authenticated') ? { headers: AH() } : {});
      if (r.ok) return await createImageBitmap(await r.blob());
    } catch (e) { }
  }
  return null;
}
async function pool(n, items, fn) {
  let k = 0; const res = new Array(items.length);
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (k < items.length) { const i = k++; res[i] = await fn(items[i], i); } }));
  return res;
}

function panel(x, px, py, pw, ph, title, color, ims, empty) {
  x.fillStyle = color; x.fillRect(px, py, pw, 60);
  x.fillStyle = '#fff'; x.font = '700 28px ' + FONT; x.textAlign = 'center';
  x.fillText(title, px + pw / 2, py + 14); x.textAlign = 'right';
  const ay = py + 60, ah = ph - 60;
  x.fillStyle = '#f8fafc'; x.fillRect(px, ay, pw, ah);
  x.strokeStyle = '#e2e8f0'; x.lineWidth = 2; x.strokeRect(px, py, pw, ph);
  if (!ims.length) {
    x.fillStyle = '#94a3b8'; x.font = '400 26px ' + FONT; x.textAlign = 'center';
    x.fillText(empty, px + pw / 2, ay + ah / 2 - 13); x.textAlign = 'right'; return;
  }
  const g = 10, n = ims.length, cols = n == 1 ? 1 : 2, rows = Math.ceil(n / cols), cw = (pw - g * (cols + 1)) / cols, ch = (ah - g * (rows + 1)) / rows;
  ims.forEach((im, i) => {
    const r = Math.floor(i / cols), c = i % cols, bx = px + pw - g - (c + 1) * cw - c * g, by = ay + g + r * (ch + g), k = Math.min(cw / im.width, ch / im.height), w = im.width * k, h = im.height * k;
    x.fillStyle = '#e2e8f0'; x.fillRect(bx, by, cw, ch);
    x.drawImage(im, bx + (cw - w) / 2, by + (ch - h) / 2, w, h);
  });
}

async function buildPptx(imgs) {

const GEN = { cancel: false, busy: false };
const PV = { parts: [], imgs: [], i: 0 };
async function genSlides(preview) {
  if (GEN.busy) return;
  if (typeof PptxGenJS == 'undefined') { /* کتابخانه‌ی PowerPoint فقط هنگام نیاز بارگذاری می‌شود */
    await new Promise(r => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js'; sc.onload = sc.onerror = r; document.head.appendChild(sc); });
  }
  if (typeof PptxGenJS == 'undefined') return alert('کتابخانه ساخت PowerPoint بارگذاری نشده است؛ اینترنت را بررسی و صفحه را دوباره باز کنید.');
  const box = $('#slides-container'), btns = [...document.querySelectorAll('[data-a=gen-slides],[data-a=gen-preview]')];
  GEN.cancel = false; GEN.busy = true; btns.forEach(b => b.disabled = true); PV.parts = []; PV.imgs = []; PV.i = 0;
  box.innerHTML = `<progress id="gp" value="0" max="1" style="width:100%;"></progress>
    <p id="slides-progress" style="text-align:center;">در حال دریافت اطلاعات...</p>
    <button class="p np" data-a="gen-cancel" style="background:var(--card-bg); color:var(--ink); border:1.5px solid var(--ln);">⏹ توقف</button>
    <div id="parts" style="margin-top:12px;"></div>`;
  const prog = t => { const el = $('#slides-progress'); if (el) el.textContent = t; };
  try {
    const FS = 'module,location,qid,question,status,created_at,closed_at,notice_at,severity,category,responsible,due_date,photos_before,photos_after';
    const dq = rDateQ(), mq = rModQ(), r = rRange();
    const [P, OF, I] = await Promise.all([
      fetchAll('findings?select=' + FS + '&order=created_at.desc,id.asc' + rQuery()),
      fetchAll('findings?select=' + FS + '&status=eq.open&order=created_at.desc,id.asc' + mq),
      fetchAll('inspections?select=module,location,ok,nc,inspector,created_at&order=created_at.desc,id.asc' + dq + mq)
    ]);
    if (!P.length) throw new Error('در این بازه و با این فیلترها موردی وجود ندارد.');
    const ok = I.reduce((a, x) => a + x.ok, 0), nc = I.reduce((a, x) => a + x.nc, 0), cl = P.filter(x => x.status == 'closed').length;
    const S = {
      bz: r.label, totalPeriod: P.length, insCount: rounds(I), chkCount: checks(I), rate: pct(ok, ok + nc),
      hi: OF.filter(x => sev_(x) >= 3).length, overdue: OF.filter(od_).length, noNotice: OF.filter(x => !x.notice_at).length,
      topLocs: cnt(OF, x => nl(x.location)).slice(0, 5),
      topCats: cnt(P, x => x.category || cat(x.module, x.question || '')).slice(0, 5)
    };
    const byCr = (a, b) => new Date(a.created_at) - new Date(b.created_at);
    const mc = new Map(); P.forEach(x => { if (x.status == 'closed' && x.closed_at) { const [y, m] = jym(x.closed_at), k = y * 100 + m; mc.set(k, (mc.get(k) || 0) + 1); } });
    S.months = [...mc.keys()].sort((a, b) => a - b).map(k => ({ y: Math.floor(k / 100), m: k % 100, n: mc.get(k) }));
    S.noDate = P.filter(x => x.status == 'closed' && !x.closed_at).length; S.openN = P.filter(x => x.status == 'open').length;
    const body = [];
    if (R.ord == 'done') { /* ماه‌به‌ماه بر اساس تاریخ انجام: اسلاید عنوان ماه، سپس موارد همان ماه به ترتیب انجام */
      const mm = new Map();
      P.filter(x => x.status == 'closed' && x.closed_at).forEach(x => { const [y, m] = jym(x.closed_at), k = y * 100 + m; if (!mm.has(k)) mm.set(k, []); mm.get(k).push(x); });
      [...mm.keys()].sort((a, b) => a - b).forEach(k => {
        const arr = mm.get(k).sort((a, b) => new Date(a.closed_at) - new Date(b.closed_at));
        body.push({ t: 'd', label: jlab(Math.floor(k / 100), k % 100), sub: fa(arr.length) + ' اقدام اصلاحی در این ماه انجام شد', col: GREEN });
        arr.forEach(f => body.push({ t: 'f', f }));
      });
      const nd = P.filter(x => x.status == 'closed' && !x.closed_at).sort(byCr);
      if (nd.length) { body.push({ t: 'd', label: 'اصلاح‌شده بدون تاریخ انجام', sub: fa(nd.length) + ' مورد؛ تاریخ انجام در سیستم ثبت نشده است', col: '#f59e0b' }); nd.forEach(f => body.push({ t: 'f', f })); }
      const op = P.filter(x => x.status == 'open').sort((a, b) => sev_(b) - sev_(a) || byCr(b, a));
      if (op.length) { body.push({ t: 'd', label: 'موارد باز و در دست اقدام', sub: fa(op.length) + ' مورد هنوز اصلاح نشده است', col: RED }); op.forEach(f => body.push({ t: 'f', f })); }
    } else {
      const F = [...P].sort(R.ord == 'date' ? (a, b) => byCr(b, a)
        : R.ord == 'old' ? byCr
        : (a, b) => (a.status == 'open' ? 0 : 1) - (b.status == 'open' ? 0 : 1) || sev_(b) - sev_(a) || byCr(b, a));
      F.forEach(f => body.push({ t: 'f', f }));
    }
    try { if (document.fonts && document.fonts.load) await document.fonts.load('700 32px Vazirmatn'); } catch (e) { }
    const nStats = Math.max(1, Math.ceil(S.months.length / 16)), preN = 2 + nStats;
    const logo = await loadImg('logo.png'), per = +R.per || body.length, tot = preN + body.length, t0 = Date.now();
    const chunks = []; let cur = [];
    for (const it of body) { cur.push(it); if (cur.length >= per) { if (cur[cur.length - 1].t == 'd' && cur.length > 1) { const d = cur.pop(); chunks.push(cur); cur = [d]; } else { chunks.push(cur); cur = []; } } }
    if (cur.length) chunks.push(cur);
    const parts = chunks.length;
    let done = 0; const gp = $('#gp'); gp.max = body.length;
    for (let pi = 0; pi < parts && !GEN.cancel; pi++) {
      const chunk = chunks[pi], imgs = [], base = preN + chunks.slice(0, pi).reduce((a, c) => a + c.length, 0);
      if (pi == 0) { imgs.push(coverSlide(logo, 'گزارش عملکرد کارخانه', S.bz, S, cl)); imgs.push(summarySlide(logo, 2, tot, S)); for (let q = 0; q < nStats; q++) imgs.push(statsSlide(logo, 3 + q, tot, S, q, nStats)); }
      const res = await pool(6, chunk, async (it, i) => {
        const d = it.t == 'd' ? dividerSlide(logo, it, base + i + 1, tot) : await findingSlide(it.f, base + i + 1, tot, logo);
        done++; gp.value = done;
        const sec = (Date.now() - t0) / 1000, eta = Math.round(sec / done * (body.length - done));
        prog(`در حال تولید اسلایدها... ${fa(done)} از ${fa(body.length)} — فایل ${fa(pi + 1)} از ${fa(parts)} — حدود ${fa(Math.ceil(eta / 60))} دقیقه باقی‌مانده`);
        return d;
      });
      imgs.push(...res);
      if (preview) { PV.parts.push({ imgs }); continue; } /* حالت پیش‌نمایش: فایل بعد از تأیید کاربر ساخته می‌شود */
      prog(`در حال ساخت فایل ${fa(pi + 1)} از ${fa(parts)}...`);
      const blob = await buildPptx(imgs), url = URL.createObjectURL(blob), name = `HSE-report-${pi + 1}-of-${parts}.pptx`;
      $('#parts').insertAdjacentHTML('beforeend', `<a href="${url}" download="${name}" class="p" style="display:block; text-align:center; text-decoration:none; margin-top:8px;">📥 دانلود فایل ${fa(pi + 1)} از ${fa(parts)} (${fa(chunk.length + (pi == 0 ? preN : 0))} اسلاید، ${fa(Math.round(blob.size / 1048576))} مگابایت)</a>`);
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    }
    if (preview && PV.parts.length) { PV.imgs = PV.parts.flatMap(x => x.imgs); PV.i = 0; showPreview(); prog(GEN.cancel ? 'متوقف شد؛ پیش‌نمایش بخش ساخته‌شده در پایین است.' : '✅ آماده شد. اسلایدها را مرور کنید و سپس دانلود بزنید.'); }
    else prog(GEN.cancel ? 'متوقف شد؛ فایل‌های ساخته‌شده در پایین قابل دانلودند.' : '✅ تمام شد. اگر مرورگر چند دانلود را مسدود کرد، از دکمه‌های زیر دانلود کنید.');
  } catch (e) { prog(''); alert('خطا در تولید گزارش: ' + e.message); }
  GEN.busy = false; btns.forEach(b => b.disabled = false);
}

    let q = fQuery(true); q += kind == 'open' ? '&status=eq.open' : '&status=in.(open,closed)';

    catch (er) { alert(/assign/i.test(er.message) ? 'ابتدا فایل hse_equipment_inactive.sql را یک‌بار در Supabase اجرا کنید.\n' + er.message.slice(0, 160) : er.message); }
  }
  else if (a == 'fntc') { FQ.ntc = FQ.ntc == t.dataset.v ? '' : t.dataset.v; FQ.page = 0; const sl = document.querySelector('[data-ff=ntc]'); if (sl) sl.value = FQ.ntc; await loadFinds(); }
  else if (a == 'fst') { FQ.st = t.dataset.v; FQ.page = 0; await loadFinds(); }
  else if (a == 'fpage') { FQ.page = Math.max(0, FQ.page + +t.dataset.d); await loadFinds(); scrollTo(0, 0); }
  else if (a == 'fclear') { Object.assign(FQ, { q: '', mod: '', insp: '', st: '', sev: '', cat: '', loc: '', ntc: '', asg: '', ph: '', per: 'all', grp: '', ord: 'new', page: 0 }); finds(); }
  else if (a == 'rprint') printFinds(a, t.dataset.k);
  else if (a == 'lpick') { try { await localPick(); renderLocalState(); } catch (er) { if (er.name != 'AbortError') alert(er.message); } }
  else if (a == 'lallow') { await localAllow(); renderLocalState(); await loadFinds(); }
  else if (a == 'susage') refreshUsage();
  else if (a == 'smove') moveToLocal();

  else if (a == 'fix') {
    if (t.checked && !+t.dataset.pa) { t.checked = false; return alert('ثبت عکس پس از اصلاح الزام قانونی دارد.'); }
    if (t.checked && !t.closest('.q').querySelector('[data-rc]').value) { t.checked = false; return alert('ابتدا علت ریشه‌ای را انتخاب کنید.'); }
    try {
      await api('findings?id=eq.' + t.dataset.id, {
        method: 'PATCH',
        body: JSON.stringify({ status: t.checked ? 'closed' : 'open', closed_at: t.checked ? ((cdv => cdv ? new Date(cdv + 'T12:00:00+03:30').toISOString() : new Date().toISOString())((t.closest('.q').querySelector('[data-cd]') || {}).value)) : null })
      });
      await loadFinds(); scrollTo(0, y);
    } catch (er) { alert(er.message); }
  }
  else if (a == 'zoom') {
    const zm = $('#zm'); zm.innerHTML = `<img src="${t.src}">`; zm.hidden = false;
    zm.onclick = () => zm.hidden = true;
  }
};

document.oninput = async e => {
  const t = e.target, y = scrollY;
  if (t.dataset.qf) { const k = t.dataset.qf; QD[k] = k == 'sev' ? +t.value : t.value; if (k == 'sev') { const el = $('#qsla'); if (el) el.textContent = 'مهلت اصلاح بر اساس شدت: ' + fa(SLA[QD.sev]) + ' روز'; } return; }
  if (t.dataset.cd) { /* ثبت/اصلاح دستی تاریخ انجام برای موارد بسته‌شده */
    const q = t.closest('.q'), cb = q && q.querySelector('[data-a=fix]');
    if (!cb || !cb.checked || !t.value) return;
    try { await api('findings?id=eq.' + t.dataset.cd, { method: 'PATCH', body: JSON.stringify({ closed_at: new Date(t.value + 'T12:00:00+03:30').toISOString() }) }); await loadFinds(); scrollTo(0, y); } catch (er) { alert(er.message); }
    return;
  }
  if (t.dataset.rf) { const k = t.dataset.rf; R[k] = ['days', 'per', 'jy', 'jm'].includes(k) ? +t.value : t.value; renderManagementReport(); return; }
  if (t.dataset.eqs) { eqSearch(t.dataset.eqs, t.value); return; }
  if (t.dataset.sf == 'thr') { localStorage.thr = Math.max(50, +t.value || 800); refreshUsage(); return; }
  if (t.dataset.ff) {
    const k = t.dataset.ff; FQ[k] = ['jy', 'jm', 'size'].includes(k) ? +t.value : t.value; FQ.page = 0;
    if (k == 'per') $('#fj').hidden = FQ.per != 'j';
    clearTimeout(FTM); FTM = setTimeout(loadFinds, (k == 'q' || k == 'loc') ? 400 : 0); return;
  }
  if (t.dataset.code) { t.nextElementSibling.hidden = !t.value.trim(); return; }
  if (t.id == 'ls') { D.oth = t.value == '__o'; D.loc = D.oth ? '' : t.value; save(); form(); scrollTo(0, y); return; }
  if (t.id == 'sh') { D.shift = t.value; save(); return; }
  if (t.dataset.sv) { SV[t.dataset.sv] = +t.value; save(); form(); scrollTo(0, y); return; }
  if (t.dataset.rc) {
    try { await api('findings?id=eq.' + t.dataset.rc, { method: 'PATCH', body: JSON.stringify({ root_cause: t.value || null }) }); } catch (er) { alert(er.message); }
    return;
  }
  if (t.id == 'loc') D.loc = t.value;
  else if (t.dataset.ex) { D.extra = D.extra || {}; D.extra[t.dataset.ex] = t.value; }
  else if (t.dataset.note) N[t.dataset.note] = t.value;
  else if (t.dataset.rs) RS[t.dataset.rs] = t.value;
  else if (t.dataset.lc) LC[t.dataset.lc] = t.value;
  else return;
  save();
};

home().then(() => {
  if (location.hash == '#rep') renderManagementReport();
  else if (location.hash == '#cycle') { FQ.one = ''; FQ.st = 'open'; FQ.per = 'all'; finds(); }
  else if (/^#fu=/.test(location.hash)) { const id = decodeURIComponent(location.hash.slice(4)); FQ.one = id; FQ.st = ''; FQ.per = 'all'; finds().then(() => setTimeout(() => { if (document.querySelector('[data-a=fufu][data-id="' + id + '"]')) fuDialog(id); }, 400)); }
  else if (/^#visit=/.test(location.hash)) { const q = new URLSearchParams(location.hash.slice(1)), k = q.get('visit'); if (k == 'MED') medHome(); else startVisit(k, q.get('code'), q.get('title'), q.get('hall')).then(() => { if (k == 'CT' && q.get('ctr')) { D.extra.contractor_name = q.get('ctr'); D.extra.contract_no = q.get('cno') || 'ندارد'; D.loc = D.loc || q.get('ctr'); form(); } }); }
});
</script>
