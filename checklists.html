<style>

* { box-sizing: border-box; transition: all 0.15s ease-in-out; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.7 Vazirmatn, Tahoma, sans-serif; padding: 16px 16px 100px; }

h2 { font-size: 20px; font-weight: 800; margin: 16px 0 8px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
small { color: var(--mu); display: block; font-size: 12px; }

input, select { width: 100%; font: inherit; color: var(--ink); background: var(--card-bg); border: 1.5px solid var(--ln); border-radius: 10px; padding: 10px 14px; margin-top: 8px; min-height: 46px; outline: none; }

button, .btn-link { font: inherit; color: var(--ink); background: var(--card-bg); border: 1.5px solid var(--ln); border-radius: 12px; min-height: 48px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
button:hover, .btn-link:hover { background: var(--ln); }

body div#app { display: flex; flex-direction: column; }
.m:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--ac); }
.m b { display: block; font-size: 16px; font-weight: 700; color: var(--ink); }
.p { width: 100%; margin-top: 10px; background: var(--ac); border-color: var(--ac); color: #0f172a; font-weight: 700; border-radius: 12px; box-shadow: 0 4px 12px rgba(16,185,129,0.25); }
.p:hover { background: var(--ac-hover); border-color: var(--ac-hover); color: #fff; }
.l { border: 0; background: none; color: var(--mu); padding: 0; min-height: auto; font-size: 13px; }
.l:hover { color: var(--ac); background: none; }

.q { background: var(--card-bg); border: 1px solid var(--ln); border-radius: 14px; padding: 16px; margin-top: 12px; box-shadow: var(--shadow-sm); }
.q.bad { border-right: 5px solid var(--nc); border-color: var(--nc); }
.q.good { border-right: 5px solid var(--ok); border-color: var(--ok); }
.q p { margin: 0; font-weight: 600; font-size: 15px; }
.q select { font-size: 13px; }

.b { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }

function jwtOk(t) {
  try { const p = JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); return !p.exp || p.exp * 1000 > Date.now(); } catch (e) { return false; }
}
function deepFind(o, key, d = 0) {
  if (!o || typeof o !== 'object' || d > 4) return null;
  if (typeof o[key] === 'string') return o[key];
  for (const k in o) { const r = deepFind(o[k], key, d + 1); if (r) return r; }
  return null;
}
function getSession() {
  let found = { t: '', e: '' };
  for (const st of [localStorage, sessionStorage]) {
    try {
      for (let i = 0; i < st.length; i++) {
        const raw = st.getItem(st.key(i)) || '';
        if (/^eyJ[\w-]+\.[\w-]+\.[\w-]+$/.test(raw) && jwtOk(raw) && raw !== KEY) { found.t = found.t || raw; continue; }
        if (raw[0] === '{' || raw[0] === '[') {
          const j = JSON.parse(raw), t = deepFind(j, 'access_token');
          if (t && jwtOk(t)) { found.t = t; found.e = deepFind(j, 'email') || found.e; return found; }
        }
      }
      found.e = found.e || st.getItem('em') || st.getItem('email') || '';
    } catch (e) { }
  }
  return found;
}

function shrink(f) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(f), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1000 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = im.width * k; c.height = im.height * k;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); c.toBlob(res, 'image/jpeg', 0.75);
    };
    im.onerror = () => rej(new Error('فایل نامعتبر است')); im.src = u;
  });
}

async function up(b) {

async function stats(d = 90) {
  view('<p style="text-align:center;padding:40px;">در حال تحلیل داده‌ها...</p>');
  try {
    const s = d ? new Date(Date.now() - d * 864e5).toISOString() : '1970-01-01';
    const FS = 'module,location,qid,question,status,created_at,closed_at,notice_at,severity,category,root_cause,due_date,responsible';
    const [I, F, OF, LI] = await Promise.all([
      api('inspections?select=module,location,ok,nc,na,created_at,inspector,shift&created_at=gte.' + s + '&order=created_at.desc&limit=1000'),
      api('findings?select=' + FS + '&created_at=gte.' + s + '&limit=1000'),
      api('findings?select=' + FS + '&status=eq.open&limit=1000'),
      api('inspections?select=module,created_at&order=created_at.desc&limit=1000')
    ]);
    const now = Date.now(), days = t => Math.floor((now - new Date(t)) / 864e5);
    const sv = x => x.severity || dsev(x.question || ''), ct = x => x.category || cat(x.module, x.question || '');
    const od = x => x.due_date ? new Date(x.due_date + 'T23:59:59') < now : days(x.created_at) > 14;
    const ok = I.reduce((a, r) => a + r.ok, 0), nc = I.reduce((a, r) => a + r.nc, 0), rate = pct(ok, ok + nc);
    const closed = F.filter(x => x.status == 'closed' && x.closed_at);
    const avgClose = closed.length ? Math.round(closed.reduce((a, x) => a + (new Date(x.closed_at) - new Date(x.created_at)) / 864e5, 0) / closed.length) : null;
    const overdue = OF.filter(od).length, hiOpen = OF.filter(x => sv(x) >= 3).length, noNotice = OF.filter(x => !x.notice_at).length;

    const last = {}; LI.forEach(r => last[r.module] = last[r.module] || r.created_at);
    const MD = M.map(m => {
      const ii = I.filter(r => r.module == m[0]), n = ii.reduce((a, r) => a + r.nc, 0), o = ii.reduce((a, r) => a + r.ok, 0), fq = FQ[m[2]], ds = last[m[0]] ? days(last[m[0]]) : null;
      return { name: m[1], fq: m[2], cnt: ii.length, nc: n, r: pct(n, n + o), ds, late: ds === null ? 999 : (fq ? ds - fq : -1) };
    });
    const lateList = MD.filter(x => x.late > 0).sort((a, b) => b.late - a.late);
    const worstMod = MD.filter(x => x.cnt).sort((a, b) => b.r - a.r).slice(0, 6);

    const L = {}; LOCS.forEach(k => L[k] = { n: 0, nc: 0, risk: 0, open: 0, last: null });
    I.forEach(r => { const k = nl(r.location), o = L[k] = L[k] || { n: 0, nc: 0, risk: 0, open: 0, last: null }; o.n++; o.nc += r.nc; o.last = o.last || r.created_at; });
    OF.forEach(x => { const k = nl(x.location), o = L[k] = L[k] || { n: 0, nc: 0, risk: 0, open: 0, last: null }; o.open++; o.risk += sv(x) * 2 + (od(x) ? 3 : 0); });
    const LA = Object.entries(L).map(([k, o]) => { const ds = o.last ? days(o.last) : 999; return { k, ...o, ds, score: o.risk + o.nc + (ds > 30 ? 3 : ds > 14 ? 1 : 0) }; });
    const riskTop = [...LA].sort((a, b) => b.score - a.score).filter(x => x.score > 0).slice(0, 8);
    const lowCov = [...LA].sort((a, b) => a.n - b.n || b.ds - a.ds).slice(0, 6);

    const RC = {};
    F.forEach(x => { const k = x.module + '|' + x.qid, o = RC[k] = RC[k] || { q: x.question, m: nm(x.module), c: 0, locs: new Set() }; o.c++; o.locs.add(nl(x.location)); });
    const rec = Object.values(RC).filter(o => o.c > 1).sort((a, b) => b.c - a.c).slice(0, 8);

    const W = d ? Math.min(12, Math.ceil(d / 7)) : 12, tw = Array.from({ length: W }, () => ({ ok: 0, nc: 0 }));
    I.forEach(r => { const w = Math.floor(days(r.created_at) / 7); if (w < W) { tw[w].ok += r.ok; tw[w].nc += r.nc; } });
    const trend = tw.map((t, i) => ({ i, p: pct(t.nc, t.nc + t.ok) })).reverse();

    const ag = [OF.filter(x => days(x.created_at) <= 7).length, OF.filter(x => { const k = days(x.created_at); return k > 7 && k <= 30; }).length, OF.filter(x => days(x.created_at) > 30).length];
    const sevRows = [4, 3, 2, 1].map(v => [SEVN[v], OF.filter(x => sv(x) == v).length]);
    const catRows = cnt(F, ct), rcRows = cnt(closed.filter(x => x.root_cause), x => x.root_cause);
    const shRows = SHIFTS.map(h => { const ii = I.filter(r => r.shift == h); return [h + ' (' + fa(ii.length) + ' بازدید)', pct(ii.reduce((a, r) => a + r.nc, 0), ii.reduce((a, r) => a + r.nc + r.ok, 0))]; });
    const respRows = cnt(OF.filter(x => x.responsible), x => x.responsible).slice(0, 6), inspRows = cnt(I.filter(r => r.inspector), r => r.inspector).slice(0, 6);

    const ins = [];
    const crit = OF.filter(x => sv(x) == 4).length;
    if (crit) ins.push([1, `${fa(crit)} عدم‌انطباق «بحرانی» هنوز باز است؛ اقدام فوری لازم است.`]);
    if (overdue) ins.push([1, `${fa(overdue)} عدم‌انطباق از مهلت اصلاح خود گذشته است.`]);
    if (ag[2]) ins.push([1, `${fa(ag[2])} مورد بیش از ۳۰ روز باز است؛ به مدیریت ارجاع شود.`]);
    if (noNotice) ins.push([0, `${fa(noNotice)} عدم‌انطباق باز هنوز اعلان رسمی ندارد.`]);
    if (lateList[0]) ins.push([lateList.length > 3 ? 1 : 0, `${fa(lateList.length)} چک‌لیست از برنامه عقب است؛ بیشترین تأخیر: «${lateList[0].name}»${lateList[0].ds === null ? ' (هرگز بازدید نشده)' : ''}.`]);
    const unv = LA.filter(x => LOCS.includes(x.k) && !x.n).length;
    if (unv) ins.push([0, `${fa(unv)} محل از لیست محل‌ها در این بازه هیچ بازدیدی نداشته است.`]);
    if (riskTop[0]) ins.push([1, `پرریسک‌ترین محل: «${riskTop[0].k}» (${fa(riskTop[0].open)} مورد باز، ${fa(riskTop[0].nc)} عدم‌انطباق در بازه).`]);
    if (catRows[0]) ins.push([0, `بیشترین عدم‌انطباق‌ها در دسته «${catRows[0][0]}» (${fa(catRows[0][1])} مورد) است؛ آموزش یا ممیزی هدفمند برنامه‌ریزی شود.`]);
    if (rec[0]) ins.push([0, `مشکل تکراری: «${rec[0].q}» ${fa(rec[0].c)} بار ثبت شده؛ علت ریشه‌ای بررسی شود.`]);
    if (ok + nc && rate < 85) ins.push([1, `نرخ انطباق کل ${fa(rate)}٪ و کمتر از هدف ۸۵٪ است.`]);
    const tl = trend.filter(t => t.p); if (tl.length > 2 && tl[tl.length - 1].p > tl[0].p + 5) ins.push([1, 'روند عدم‌انطباق در هفته‌های اخیر صعودی است.']);

    const mxR = Math.max(1, ...riskTop.map(x => x.score)), mxN = Math.max(1, ...worstMod.map(x => x.nc));

/* ---------- بخش گزارش مدیریتی امن‌سازی شده (بدون نیاز به eval) ---------- */
const SW = 1920, SH = 1080, NAVY = '#0f172a', BLUE = '#2563eb', RED = '#ef4444', GREEN = '#22c55e', FONT = "Vazirmatn,Tahoma,sans-serif";
const fl = d => new Intl.DateTimeFormat('fa-IR-u-ca-persian', { year: 'numeric', month: 'long', day: 'numeric' }).format(new Date(d));
const loadImg = s => new Promise(r => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => r(i); i.onerror = () => r(null); i.src = s; });
/* عکس را به‌صورت blob می‌گیرد (ابتدا مسیر authenticated، سپس public) تا canvas آلوده نشود */
async function photoSrc(p) {
  for (const path of ['/storage/v1/object/authenticated/photos/', '/storage/v1/object/public/photos/']) {
    try {
      const r = await fetch(URL_ + path + p, { headers: AH() });
      if (r.ok) return URL.createObjectURL(await r.blob());
    } catch (e) { }
  }
  return null;
}

function wrapText(c, t, w) {
  const a = t.split(' '), o = []; let u = '';
  for (const x of a) { const v = u ? u + ' ' + x : x; if (c.measureText(v).width > w && u) { o.push(u); u = x; } else u = v; }
  if (u) o.push(u); return o;
}

function mkS() {
  const c = document.createElement('canvas'); c.width = SW; c.height = SH;
  const x = c.getContext('2d'); x.direction = 'rtl'; x.textAlign = 'right'; x.textBaseline = 'top'; return [c, x];
}

function frame(x, logo, n, tot, code) {
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, SW, SH);
  if (logo) { const lw = Math.min(260, 90 * logo.width / logo.height), lh = lw * logo.height / logo.width; x.drawImage(logo, SW - 60 - lw, 20, lw, lh); }
  x.fillStyle = BLUE; x.fillRect(0, 130, SW, 6);
  x.fillStyle = '#64748b'; x.font = '400 24px ' + FONT;
  x.direction = 'ltr'; x.textAlign = 'left'; x.fillText(code || '', 60, 1030);
  x.fillText(fa(n) + ' / ' + fa(tot), SW - 160, 1030); x.textAlign = 'right'; x.direction = 'rtl';
}

async function panel(x, px, py, pw, ph, title, color, srcs, empty) {
  x.fillStyle = color; x.fillRect(px, py, pw, 60);
  x.fillStyle = '#fff'; x.font = '700 28px ' + FONT; x.textAlign = 'center';
  x.fillText(title, px + pw / 2, py + 14); x.textAlign = 'right';
  const ay = py + 60, ah = ph - 60;
  x.fillStyle = '#f8fafc'; x.fillRect(px, ay, pw, ah);
  x.strokeStyle = '#e2e8f0'; x.lineWidth = 2; x.strokeRect(px, py, pw, ph);

  const ims = []; for (const u of srcs.slice(0, 4)) { const i = await loadImg(u); if (i) ims.push(i); }
  if (!ims.length) {
    x.fillStyle = '#94a3b8'; x.font = '400 26px ' + FONT; x.textAlign = 'center';
    x.fillText(empty, px + pw / 2, ay + ah / 2 - 13); x.textAlign = 'right'; return;
  }
  const g = 10, n = ims.length, cols = n == 1 ? 1 : 2, rows = Math.ceil(n / cols), cw = (pw - g * (cols + 1)) / cols, ch = (ah - g * (rows + 1)) / rows;
  ims.forEach((im, i) => {
    const r = Math.floor(i / cols), c = i % cols, bx = px + pw - g - (c + 1) * cw - c * g, by = ay + g + r * (ch + g), k = Math.min(cw / im.width, ch / im.height), w = im.width * k, h = im.height * k;
    x.fillStyle = '#e2e8f0'; x.fillRect(bx, by, cw, ch);
    x.drawImage(im, bx + (cw - w) / 2, by + (ch - h) / 2, w, h);
  });
}

let RPD = 30, RA = null;
const MAXS = 60;
const GREY = '#64748b', LINE = '#e2e8f0', BGS = '#f1f5f9', AMB = '#f59e0b';
const sev_ = x => x.severity || dsev(x.question || '');
const od_ = x => x.due_date ? new Date(x.due_date + 'T23:59:59') < Date.now() : (Date.now() - new Date(x.created_at)) / 864e5 > 14;
const fld = d => d ? fl(d) : '—';
const periodStart = d => d ? new Date(Date.now() - d * 864e5).toISOString() : '1970-01-01T00:00:00.000Z';
const periodLabel = d => d ? fa(d) + ' روز گذشته' : 'تمام سوابق';
const avgOf = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0;
const dayDiff = (a, b) => Math.max(0, Math.round((new Date(b) - new Date(a)) / 864e5));
const shortQ = (q, n = 60) => { q = String(q || ''); return q.length > n ? q.slice(0, n) + '…' : q; };

/* ================= تحلیل داده‌ها ================= */
async function analyze(d) {
  const s = periodStart(d);
  const FS = 'module,location,qid,question,note,status,created_at,closed_at,notice_at,notice_code,severity,category,root_cause,due_date,responsible,photos_before,photos_after';
  const [P, OF, CL, I, LI] = await Promise.all([
    api('findings?select=' + FS + '&created_at=gte.' + s + '&order=created_at.desc&limit=1000'),
    api('findings?select=' + FS + '&status=eq.open&limit=1000'),
    api('findings?select=' + FS + '&status=eq.closed&closed_at=gte.' + s + '&order=closed_at.desc&limit=1000'),
    api('inspections?select=module,location,ok,nc,na,created_at,inspector,shift&created_at=gte.' + s + '&order=created_at.desc&limit=1000'),
    api('inspections?select=module,created_at&order=created_at.desc&limit=1000')
  ]);
  const now = Date.now(), days = t => Math.floor((now - new Date(t)) / 864e5);
  const ctg = x => x.category || cat(x.module, x.question || '');
  const ok = I.reduce((a, r) => a + r.ok, 0), nc = I.reduce((a, r) => a + r.nc, 0), rate = pct(ok, ok + nc);

  const closedP = P.filter(x => x.status == 'closed').length, closeRate = pct(closedP, P.length);
  const cd = CL.filter(x => x.closed_at);
  const avgClose = cd.length ? Math.round(avgOf(cd.map(x => dayDiff(x.created_at, x.closed_at)))) : null;
  const withDue = cd.filter(x => x.due_date), onTime = withDue.filter(x => new Date(x.closed_at) <= new Date(x.due_date + 'T23:59:59')).length;
  const slaPct = withDue.length ? pct(onTime, withDue.length) : null;
  const avgBySev = [4, 3, 2, 1].map(v => { const a = cd.filter(x => sev_(x) == v).map(x => dayDiff(x.created_at, x.closed_at)); return { v, n: a.length, avg: a.length ? Math.round(avgOf(a)) : null }; });
  const rcRows = cnt(cd.filter(x => x.root_cause), x => x.root_cause);

  const hi = OF.filter(x => sev_(x) >= 3).length, crit = OF.filter(x => sev_(x) == 4).length, overdue = OF.filter(od_).length, noNotice = OF.filter(x => !x.notice_at).length;
  const ag = [OF.filter(x => days(x.created_at) <= 7).length, OF.filter(x => { const k = days(x.created_at); return k > 7 && k <= 30; }).length, OF.filter(x => days(x.created_at) > 30).length];
  const sevRows = [4, 3, 2, 1].map(v => [SEVN[v], OF.filter(x => sev_(x) == v).length]);

  const cg = {};
  P.forEach(x => { const k = ctg(x), o = cg[k] = cg[k] || { t: 0, c: 0 }; o.t++; if (x.status == 'closed') o.c++; });
  const catRows = Object.entries(cg).map(([k, o]) => [k, o.t, o.c]).sort((a, b) => b[1] - a[1]);

  const L = {}; LOCS.forEach(k => L[k] = { n: 0, nc: 0, risk: 0, open: 0, hi: 0 });
  I.forEach(r => { const k = nl(r.location), o = L[k] = L[k] || { n: 0, nc: 0, risk: 0, open: 0, hi: 0 }; o.n++; o.nc += r.nc; });
  OF.forEach(x => { const k = nl(x.location), o = L[k] = L[k] || { n: 0, nc: 0, risk: 0, open: 0, hi: 0 }; o.open++; if (sev_(x) >= 3) o.hi++; o.risk += sev_(x) * 2 + (od_(x) ? 3 : 0); });
  const LA = Object.entries(L).map(([k, o]) => ({ k, ...o, score: o.risk + o.nc }));
  const locRows = LA.filter(x => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 8);
  const unv = LA.filter(x => LOCS.includes(x.k) && !x.n).length;

  const last = {}; LI.forEach(r => last[r.module] = last[r.module] || r.created_at);
  const modAll = M.map(m => {
    const ii = I.filter(r => r.module == m[0]), n_ = ii.reduce((a, r) => a + r.nc, 0), o_ = ii.reduce((a, r) => a + r.ok, 0), fq = FQ[m[2]], ds = last[m[0]] ? days(last[m[0]]) : null;
    return { name: m[1], cnt: ii.length, nc: n_, ok: o_, r: pct(n_, n_ + o_), ds, late: ds === null ? 999 : (fq ? ds - fq : -1) };
  });
  const modRows = modAll.filter(x => x.cnt).sort((a, b) => b.r - a.r).slice(0, 8);
  const lateList = modAll.filter(x => x.late > 0).sort((a, b) => b.late - a.late);

  const W = d ? Math.min(12, Math.ceil(d / 7)) : 12, tw = Array.from({ length: W }, () => ({ ok: 0, nc: 0 }));
  I.forEach(r => { const w = Math.floor(days(r.created_at) / 7); if (w < W) { tw[w].ok += r.ok; tw[w].nc += r.nc; } });
  const trend = tw.map((t, i) => ({ i, tot: t.ok + t.nc, p: pct(t.nc, t.nc + t.ok), l: i ? fa(i) + ' هفته پیش' : 'هفته جاری' })).reverse();
  let trendDir = null;
  const tt = trend.filter(t => t.tot);
  if (tt.length >= 4) { const h = Math.floor(tt.length / 2), a1 = avgOf(tt.slice(0, h).map(t => t.p)), a2 = avgOf(tt.slice(h).map(t => t.p)); trendDir = a2 - a1 > 3 ? 'up' : a1 - a2 > 3 ? 'down' : 'flat'; }

  const shRows = SHIFTS.map(h => { const ii = I.filter(r => r.shift == h), n_ = ii.reduce((a, r) => a + r.nc, 0), o_ = ii.reduce((a, r) => a + r.ok, 0); return [h, pct(n_, n_ + o_), ii.length]; });

  const rg = {};
  OF.forEach(x => { const k = (x.responsible || '').trim() || 'بدون مسئول مشخص', o = rg[k] = rg[k] || { n: 0, od: 0 }; o.n++; if (od_(x)) o.od++; });
  const respRows = Object.entries(rg).map(([k, o]) => [k, o.n, o.od]).sort((a, b) => b[1] - a[1] || b[2] - a[2]);

  const RC = {};
  P.forEach(x => { const k = x.module + '|' + x.qid, o = RC[k] = RC[k] || { q: x.question, c: 0, locs: new Set() }; o.c++; o.locs.add(nl(x.location)); });
  const recur = Object.values(RC).filter(o => o.c > 1).sort((a, b) => b.c - a.c).slice(0, 6);

  const R = { d, bz: periodLabel(d), I, P, OF, CL, ok, nc, rate, insCount: I.length, closedP, closeRate, avgClose, slaPct, avgBySev, rcRows, hi, crit, overdue, noNotice, ag, sevRows, catRows, locRows, unv, modRows, lateList, trend, trendDir, shRows, respRows, recur };

  /* ---- تحلیل متنی ---- */
  const ins = [];
  ins.push(I.length
    ? [rate < 85 ? 1 : 0, `نرخ انطباق بازدیدها در این بازه ${fa(rate)}٪ است و ${rate >= 85 ? 'از هدف ۸۵٪ بالاتر است' : 'کمتر از هدف ۸۵٪ است'}؛ ${fa(nc)} مورد عدم‌انطباق از ${fa(ok + nc)} مورد ارزیابی‌شده ثبت شده است.`]
    : [0, 'در این بازه هیچ بازدیدی ثبت نشده است.']);
  ins.push([0, `${fa(P.length)} عدم‌انطباق در بازه ثبت شده که ${fa(closedP)} مورد (${fa(closeRate)}٪) آن اصلاح و بسته شده است.`]);
  if (OF.length) ins.push([hi || overdue ? 1 : 0, `در مجموع ${fa(OF.length)} مورد هنوز باز است؛ ${fa(hi)} مورد شدت زیاد یا بحرانی دارند و ${fa(overdue)} مورد از مهلت اصلاح گذشته‌اند.`]);
  if (avgClose !== null) ins.push([slaPct !== null && slaPct < 70 ? 1 : 0, `میانگین زمان اصلاح ${fa(avgClose)} روز است${slaPct !== null ? ` و ${fa(slaPct)}٪ اقدامات در مهلت مقرر بسته شده‌اند` : ''}.`]);
  if (catRows[0]) ins.push([0, `بیشترین عدم‌انطباق‌ها در دسته «${catRows[0][0]}» ثبت شده است (${fa(catRows[0][1])} مورد، ${fa(pct(catRows[0][1], P.length))}٪ از کل).`]);
  if (locRows[0]) ins.push([1, `پرریسک‌ترین محل «${locRows[0].k}» است (${fa(locRows[0].open)} مورد باز، ${fa(locRows[0].hi)} مورد با شدت زیاد/بحرانی).`]);
  if (trendDir) ins.push([trendDir == 'up' ? 1 : 0, `روند هفتگی درصد عدم‌انطباق نسبت به ابتدای بازه ${trendDir == 'up' ? 'صعودی (نامطلوب)' : trendDir == 'down' ? 'نزولی (مطلوب)' : 'تقریباً ثابت'} است.`]);
  if (recur[0]) ins.push([0, `مشکل تکراری: «${shortQ(recur[0].q, 70)}» ${fa(recur[0].c)} بار در ${fa(recur[0].locs.size)} محل ثبت شده و نیازمند اصلاح سیستمی است.`]);
  R.ins = ins;

  const rec = [];
  if (hi) rec.push([1, `${fa(hi)} عدم‌انطباق باز با شدت زیاد یا بحرانی در اولویت اول است؛ برای هر مورد مسئول، مهلت و اقدام موقت ایمن‌سازی تعیین و ظرف چند روز آینده گزارش شود.`]);
  if (overdue) rec.push([1, `برای ${fa(overdue)} مورد گذشته از مهلت، جلسه پیگیری هفتگی با مسئولین برگزار و تاریخ جدید یا دلیل تأخیر ثبت شود.`]);
  if (ag[2]) rec.push([1, `${fa(ag[2])} مورد بیش از ۳۰ روز باز مانده است؛ به مدیریت ارشد ارجاع شود تا منابع لازم (بودجه، تأمین یا نیروی تخصصی) تخصیص یابد.`]);
  if (noNotice) rec.push([2, `برای ${fa(noNotice)} عدم‌انطباق باز، اعلان رسمی صادر و کد آن در سامانه ثبت شود.`]);
  if (catRows[0]) rec.push([2, `در دسته «${catRows[0][0]}» که بیشترین تعداد عدم‌انطباق را دارد، آموزش یا ممیزی هدفمند برنامه‌ریزی شود.`]);
  if (locRows[0]) rec.push([2, `در «${locRows[0].k}» بازدید تکمیلی و بررسی علت‌های ریشه‌ای انجام شود${locRows[1] ? `؛ سپس «${locRows[1].k}»` : ''}.`]);
  if (recur[0]) rec.push([2, `مورد تکراری «${shortQ(recur[0].q, 50)}» با اقدام اصلاحی سیستمی (رویه، آموزش یا تغییر تجهیز) رفع شود، نه فقط اصلاح موردی.`]);
  if (rcRows[0]) rec.push([3, `علت ریشه‌ای غالب در اقدامات بسته‌شده «${rcRows[0][0]}» است (${fa(rcRows[0][1])} مورد)؛ اقدام پیشگیرانه متناسب با آن تعریف شود.`]);
  if (lateList[0]) rec.push([3, `${fa(lateList.length)} چک‌لیست از برنامه بازدید عقب است؛ بیشترین تأخیر برای «${lateList[0].name}» است. زمان‌بندی بازدیدها و مسئول هر کدام مشخص شود.`]);
  const shw = [...shRows].filter(r => r[2]).sort((a, b) => b[1] - a[1])[0];
  if (shw && shw[1] > rate && shRows.filter(r => r[2]).length > 1) rec.push([3, `نرخ عدم‌انطباق در شیفت «${shw[0]}» بالاتر از سایر شیفت‌هاست؛ نظارت و آموزش این شیفت تقویت شود.`]);
  if (unv) rec.push([3, `${fa(unv)} محل در این بازه هیچ بازدیدی نداشته است؛ در برنامه بازدید آینده گنجانده شوند.`]);
  if (!rec.length) rec.push([3, 'وضعیت فعلی نیاز به اقدام ویژه‌ای ندارد؛ بازدیدهای دوره‌ای طبق برنامه ادامه یابد.']);
  R.recs = rec.sort((a, b) => a[0] - b[0]);
  return R;
}

/* ================= ابزارهای ترسیم ================= */
function fit(x, t, mw) {
  t = String(t ?? '');
  if (x.measureText(t).width <= mw) return t;
  while (t.length > 1 && x.measureText(t + '…').width > mw) t = t.slice(0, -1);
  return t + '…';
}

function pg(logo, n, tot, code, title, sub) {
  const [c, x] = mkS();
  frame(x, logo, n, tot, code);
  x.fillStyle = NAVY; x.font = '800 44px ' + FONT; x.fillText(title, SW - 60, 150);
  x.fillStyle = GREY; x.font = '400 24px ' + FONT; x.fillText(sub, SW - 60, 208);
  return [c, x];
}

function tile(x, bx, by, w, h, v, l, col) {
  x.fillStyle = BGS; x.fillRect(bx, by, w, h);
  x.fillStyle = col; x.fillRect(bx + w - 10, by, 10, h);
  x.textAlign = 'center'; x.fillStyle = NAVY; x.font = '800 ' + Math.round(h * .38) + 'px ' + FONT; x.fillText(v, bx + (w - 10) / 2, by + h * .08);
  x.font = '400 24px ' + FONT; x.fillStyle = GREY; x.fillText(l, bx + (w - 10) / 2, by + h * .64); x.textAlign = 'right';
}

function hdr(x, px, py, pw, t, col) {
  x.fillStyle = col; x.fillRect(px, py, pw, 52);
  x.fillStyle = '#fff'; x.font = '700 26px ' + FONT; x.textAlign = 'center'; x.fillText(fit(x, t, pw - 30), px + pw / 2, py + 10); x.textAlign = 'right';
}

function emptyMsg(x, px, py, pw, t) {
  x.fillStyle = '#94a3b8'; x.font = '400 26px ' + FONT; x.textAlign = 'center'; x.fillText(t || 'داده‌ای برای این بخش ثبت نشده است', px + pw / 2, py + 30); x.textAlign = 'right';
}

/* rows: [برچسب، عدد برای طول نوار، متن مقدار] */
function bars(x, rows, px, py, pw, rh, colf) {
  if (!rows.length) return emptyMsg(x, px, py, pw);
  const mx = Math.max(1, ...rows.map(r => r[1]));
  rows.forEach((r, k) => {
    const y = py + k * rh;
    x.font = '600 24px ' + FONT; const vt = fit(x, r[2] ?? fa(r[1]), pw * .55), vw = x.measureText(vt).width;
    x.fillStyle = GREY; x.textAlign = 'left'; x.fillText(vt, px, y + 2); x.textAlign = 'right';
    x.fillStyle = NAVY; x.font = '600 26px ' + FONT; x.fillText(fit(x, r[0], pw - vw - 40), px + pw, y);
    x.fillStyle = LINE; x.fillRect(px, y + 40, pw, 14);
    const bw = pw * r[1] / mx;
    x.fillStyle = colf ? colf(r, k) : BLUE; x.fillRect(px + pw - bw, y + 40, bw, 14);
  });
}

/* rows: [برچسب، کل، اصلاح‌شده] */
function stackBars(x, rows, px, py, pw, rh) {
  if (!rows.length) return emptyMsg(x, px, py, pw);
  const mx = Math.max(1, ...rows.map(r => r[1]));
  rows.forEach((r, k) => {
    const y = py + k * rh;
    x.fillStyle = NAVY; x.font = '600 26px ' + FONT; x.fillText(fit(x, r[0], pw * .6), px + pw, y);
    x.fillStyle = GREY; x.font = '600 24px ' + FONT; x.textAlign = 'left'; x.fillText(fa(r[2]) + ' از ' + fa(r[1]) + ' اصلاح‌شده', px, y + 2); x.textAlign = 'right';
    x.fillStyle = LINE; x.fillRect(px, y + 40, pw, 14);
    const tw = pw * r[1] / mx, cw = r[1] ? tw * r[2] / r[1] : 0;
    x.fillStyle = RED; x.fillRect(px + pw - tw, y + 40, tw, 14);
    x.fillStyle = GREEN; x.fillRect(px + pw - cw, y + 40, cw, 14);
  });
}

function bullets(x, items, px, py, pw, font, lh, maxY) {
  x.font = font; let y = py;
  for (const [t, col] of items) {
    const lines = wrapText(x, t, pw - 34);
    if (y + lines.length * lh > maxY) break;
    x.fillStyle = col || BLUE; x.fillRect(px + pw - 14, y + lh * .3, 12, 12);
    x.fillStyle = NAVY; lines.forEach((l, i) => x.fillText(l, px + pw - 34, y + i * lh));
    y += lines.length * lh + 14;
  }
  return y;
}

function notePanel(x, px, py, pw, ph, items) {
  hdr(x, px, py, pw, 'برداشت تحلیلی', BLUE);
  x.fillStyle = '#f8fafc'; x.fillRect(px, py + 52, pw, ph - 52);
  x.strokeStyle = LINE; x.lineWidth = 2; x.strokeRect(px, py, pw, ph);
  if (!items.length) items = [['مورد قابل‌توجهی برای گزارش وجود ندارد.', '#94a3b8']];
  bullets(x, items, px + 20, py + 74, pw - 40, '500 26px ' + FONT, 38, py + ph - 10);
}

/* cols: [{h, w}] از راست به چپ؛ rows: آرایه‌ای از متن یا [متن، رنگ] */
function table(x, cols, rows, px, py, pw, rh) {
  x.fillStyle = NAVY; x.fillRect(px, py, pw, 48);
  let cx = px + pw; const pos = cols.map(c => { const o = { x: cx, w: pw * c.w }; cx -= o.w; return o; });
  x.fillStyle = '#fff'; x.font = '700 22px ' + FONT;
  cols.forEach((c, i) => x.fillText(c.h, pos[i].x - 14, py + 10));
  if (!rows.length) { x.fillStyle = '#f8fafc'; x.fillRect(px, py + 48, pw, 80); emptyMsg(x, px, py + 66, pw, 'موردی برای نمایش وجود ندارد'); }
  rows.forEach((r, k) => {
    const y = py + 48 + k * rh;
    x.fillStyle = k % 2 ? '#ffffff' : '#f8fafc'; x.fillRect(px, y, pw, rh);
    x.font = '400 22px ' + FONT;
    r.forEach((v, i) => {
      const t = Array.isArray(v) ? v[0] : v;
      x.fillStyle = Array.isArray(v) ? v[1] : NAVY;
      x.fillText(fit(x, t, pos[i].w - 28), pos[i].x - 14, y + rh / 2 - 13);
    });
  });
  x.strokeStyle = LINE; x.lineWidth = 2; x.strokeRect(px, py, pw, 48 + Math.max(rows.length * rh, rows.length ? 0 : 80));
}

function trendChart(x, tr, px, py, pw, ph, target) {
  const mxv = Math.max(target * 1.6, ...tr.map(t => t.p), 10), base = py + ph - 50, ch = ph - 110, slot = pw / tr.length;
  x.strokeStyle = LINE; x.lineWidth = 2; x.beginPath(); x.moveTo(px, base); x.lineTo(px + pw, base); x.stroke();
  tr.forEach((t, i) => {
    const bx = px + pw - (i + 1) * slot + slot * .18, bw = slot * .64, bh = t.tot ? Math.max(4, ch * t.p / mxv) : 4;
    x.fillStyle = !t.tot ? '#cbd5e1' : (t.p > target ? RED : GREEN); x.fillRect(bx, base - bh, bw, bh);
    x.textAlign = 'center'; x.fillStyle = NAVY; x.font = '700 22px ' + FONT; x.fillText(t.tot ? fa(t.p) + '٪' : '—', bx + bw / 2, base - bh - 34);
    x.fillStyle = GREY; x.font = '400 20px ' + FONT; x.fillText(t.l, bx + bw / 2, base + 12); x.textAlign = 'right';
  });
  const ty = base - ch * target / mxv;
  x.setLineDash([12, 8]); x.strokeStyle = RED; x.lineWidth = 3; x.beginPath(); x.moveTo(px, ty); x.lineTo(px + pw, ty); x.stroke(); x.setLineDash([]);
  x.fillStyle = RED; x.font = '600 22px ' + FONT; x.textAlign = 'left'; x.fillText('سقف مطلوب عدم‌انطباق: ' + fa(target) + '٪', px + 8, ty - 32); x.textAlign = 'right';
}

/* ================= اسلایدها ================= */
function coverSlide(logo, R, sub) {
  const [c, x] = mkS(); x.fillStyle = NAVY; x.fillRect(0, 0, SW, SH);
  if (logo) x.drawImage(logo, SW - 360, 80, 280, 280 * logo.height / logo.width);
  x.font = '800 68px ' + FONT; x.fillStyle = '#ffffff'; x.fillText('گزارش مدیریتی وضعیت بازرسی و اصلاحات HSE', SW - 100, 320);
  x.font = '400 38px ' + FONT; x.fillStyle = '#94a3b8';
  x.fillText(sub, SW - 100, 420);
  x.fillText('بازه ارزیابی: ' + R.bz + '  |  تاریخ صدور: ' + fl(Date.now()), SW - 100, 480);
  const st = (i, n, l, col) => {
    const w = 480, bx = SW - 100 - w - i * (w + 40), by = 680;
    x.fillStyle = '#1e293b'; x.fillRect(bx, by, w, 240);
    x.fillStyle = col; x.fillRect(bx + w - 12, by, 12, 240);
    x.fillStyle = '#fff'; x.font = '800 88px ' + FONT; x.textAlign = 'center';
    x.fillText(fa(n), bx + w / 2, by + 30);
    x.font = '400 32px ' + FONT; x.fillStyle = '#94a3b8';
    x.fillText(l, bx + w / 2, by + 150); x.textAlign = 'right';
  };
  st(0, R.P.length, 'عدم‌انطباق ثبت‌شده در بازه', '#f87171');
  st(1, R.closedP, 'اقدام اصلاح‌شده', '#4ade80');
  st(2, R.OF.length, 'کل موارد باز (تا امروز)', '#fbbf24');
  return c.toDataURL('image/jpeg', 0.9);
}

async function findingSlide(logo, f, n, tot) {
  const [c, x] = mkS();
  frame(x, logo, n, tot, String(f.qid || '').startsWith(f.module + '-') ? f.qid : f.module + '-' + f.qid);
  const closed = f.status == 'closed', s_ = sev_(f), over = !closed && od_(f);
  x.fillStyle = NAVY; x.font = '800 36px ' + FONT;
  const qLines = wrapText(x, f.question, 1480).slice(0, 2);
  qLines.forEach((l, i) => x.fillText(l, SW - 60, 160 + i * 46));
  const bc = closed ? GREEN : over ? RED : AMB, bt = closed ? 'اصلاح‌شده' : over ? 'گذشته از مهلت' : 'باز';
  x.fillStyle = bc; x.fillRect(60, 158, 280, 56);
  x.fillStyle = '#fff'; x.font = '700 28px ' + FONT; x.textAlign = 'center'; x.fillText(bt, 200, 168); x.textAlign = 'right';
  const my = 160 + qLines.length * 46 + 6;
  x.font = '400 24px ' + FONT; x.fillStyle = GREY;
  x.fillText('محل: ' + f.location + '  |  تاریخ ثبت: ' + fld(f.created_at) + '  |  چک‌لیست: ' + (nm(f.module) || f.module), SW - 60, my);
  const note = (f.note || '').trim();
  if (note) x.fillText(fit(x, 'شرح: ' + note, 1800), SW - 60, my + 34);
  const pw = (SW - 140) / 2, ph = 585, py = 345;
  const bp = (await Promise.all((f.photos_before || []).slice(0, 4).map(photoSrc))).filter(Boolean);
  const ap = (await Promise.all((f.photos_after || []).slice(0, 4).map(photoSrc))).filter(Boolean);
  /* چینش فارسی: قبل از اصلاح سمت راست، بعد از اصلاح سمت چپ */
  await panel(x, pw + 80, py, pw, ph, 'وضعیت پیش از اصلاح (عدم‌انطباق)', RED, bp, 'تصویری ثبت نشده است');
  await panel(x, 60, py, pw, ph, closed ? 'پس از اصلاح  |  تاریخ اصلاح: ' + fld(f.closed_at) : 'وضعیت پس از اصلاح', closed ? GREEN : AMB, ap, closed ? 'تصویری ثبت نشده است' : 'اقدام اصلاحی هنوز انجام نشده است');
  [...bp, ...ap].forEach(u => URL.revokeObjectURL(u));
  x.fillStyle = BGS; x.fillRect(60, 938, SW - 120, 80);
  x.fillStyle = NAVY; x.font = '500 24px ' + FONT;
  x.fillText('شدت: ' + SEVN[s_] + '  |  مسئول پیگیری: ' + (f.responsible || 'تعیین نشده') + '  |  مهلت اصلاح: ' + fld(f.due_date), SW - 80, 946);
  x.fillText('اعلان رسمی: ' + (f.notice_code || 'ثبت نشده') + '  |  علت ریشه‌ای: ' + (f.root_cause || 'ثبت نشده') + (closed && f.closed_at ? '  |  مدت اصلاح: ' + fa(dayDiff(f.created_at, f.closed_at)) + ' روز' : ''), SW - 80, 982);
  return c.toDataURL('image/jpeg', 0.9);
}

  try {
    const R = RA && RA.d === RPD ? RA : (RA = await analyze(RPD));
    try { if (document.fonts && document.fonts.load) await document.fonts.load('700 32px Vazirmatn'); } catch (e) { }
    const logo = await loadImg('logo.png'), pages = buildPages(R, logo);
    const F = [...R.P].sort((a, b) => (a.status == 'open' ? 0 : 1) - (b.status == 'open' ? 0 : 1) || sev_(b) - sev_(a) || new Date(b.created_at) - new Date(a.created_at)).slice(0, MAXS);
    const tot = 1 + pages.length + F.length, out = [coverSlide(logo, R, 'گزارش عملکرد کارخانه')], tick = async k => { const p = $('#slides-progress'); if (p) p.textContent = 'در حال تولید اسلایدها... ' + fa(k) + ' از ' + fa(tot); await new Promise(r => setTimeout(r, 0)); };

document.onclick = async e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, y = scrollY;
  if (a == 'home') home();
  else if (a == 'history') historyList();
  else if (a == 'stats') stats();
  else if (a == 'rep') renderManagementReport();
  else if (a == 'gen-slides') genSlides();
  else if (a == 'open') {
    cur = M.find(m => m[0] == t.dataset.k);
    const d = JSON.parse(localStorage.draft || '{}');
    if (d.k == cur[0]) { A = d.A || {}; N = d.N || {}; SV = d.SV || {}; RS = d.RS || {}; D.loc = d.loc || ''; D.extra = d.extra || {}; D.shift = d.shift || ''; }
    else { A = {}; N = {}; SV = {}; RS = {}; D.loc = ''; D.extra = {}; D.shift = ''; D.oth = false; }
    form();
  }
  else if (a == 'ans') { A[t.dataset.id] = t.dataset.v; save(); form(); scrollTo(0, y); }
  else if (a == 'addph') { FT = { m: 'addph', id: t.dataset.id }; fi.click(); }
  else if (a == 'rmph') { PH[t.dataset.id].splice(+t.dataset.j, 1); form(); scrollTo(0, y); }
  else if (a == 'send') send();
  else if (a == 'finds') finds();
  else if (a == 'edit-insp') {
    const box = t.closest('.q').querySelector('.edit-area');
    box.hidden = !box.hidden;
    if (!box.hidden) {
      box.innerHTML = `
        <label style="font-size:12px; font-weight:700;">ویرایش محل:</label>
        <select id="edit-loc">${LOCS.map(l => `<option ${l == t.dataset.loc ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <label style="font-size:12px; font-weight:700; margin-top:8px;">ویرایش شیفت:</label>
        <select id="edit-sh">${SHIFTS.map(s => `<option ${s == t.dataset.sh ? 'selected' : ''}>${s}</option>`).join('')}</select>
        <button class="p" data-a="save-insp" data-id="${t.dataset.id}" data-oldloc="${t.dataset.loc}" data-oldsh="${t.dataset.sh}" style="margin-top:10px; min-height:38px; font-size:13px;">ذخیره تغییرات و درج لاگ</button>
      `;
    }
  }
  else if (a == 'save-insp') {
    const id = t.dataset.id, oldLoc = t.dataset.oldloc, oldSh = t.dataset.oldsh;
    const newLoc = $('#edit-loc').value, newSh = $('#edit-sh').value;
    if (oldLoc === newLoc && oldSh === newSh) return alert('تغییری ایجاد نشده است.');
    try {
      await api('inspections?id=eq.' + id, {
        method: 'PATCH',
        body: JSON.stringify({ location: newLoc, shift: newSh })
      });
      const logs = [];
      if (oldLoc !== newLoc) {
        logs.push({ inspection_id: id, inspector: mail, action_type: 'UPDATE_LOCATION', old_value: oldLoc, new_value: newLoc });
      }
      if (oldSh !== newSh) {
        logs.push({ inspection_id: id, inspector: mail, action_type: 'UPDATE_SHIFT', old_value: oldSh, new_value: newSh });
      }
      if (logs.length) {
        await api('inspection_logs', { method: 'POST', body: JSON.stringify(logs) });
      }
      alert('تغییرات با موفقیت ذخیره و در تاریخچه ثبت شد.');
      await historyList(); scrollTo(0, y);
    } catch (er) { alert('خطا در ذخیره تغییرات: ' + er.message); }
  }
  else if (a == 'ntc') {
    try {
      const id = t.dataset.id;
      if (t.checked) {
        const inp = t.closest('.q').querySelector('input[data-code]');
        const code = inp ? inp.value.trim() : '';
        if (!code && !t.defaultChecked) return alert('کد اعلان را وارد کنید.');
        await api('findings?id=eq.' + id, { method: 'PATCH', body: JSON.stringify({ notice_code: code || 'NOTICED', notice_at: new Date().toISOString() }) });
      } else {
        await api('findings?id=eq.' + id, { method: 'PATCH', body: JSON.stringify({ notice_code: null, notice_at: null }) });
      }
      await finds(); scrollTo(0, y);
    } catch (er) { alert(er.message); }
  }
  else if (a == 'addaf') { FT = { m: 'addaf', id: t.dataset.id }; fi.click(); }
  else if (a == 'fix') {
    if (t.checked && !+t.dataset.pa) { t.checked = false; return alert('ثبت عکس پس از اصلاح الزام قانونی دارد.'); }
    if (t.checked && !t.closest('.q').querySelector('[data-rc]').value) { t.checked = false; return alert('ابتدا علت ریشه‌ای را انتخاب کنید.'); }
    try {
      await api('findings?id=eq.' + t.dataset.id, {
        method: 'PATCH',
        body: JSON.stringify({ status: t.checked ? 'closed' : 'open', closed_at: t.checked ? new Date().toISOString() : null })
      });
      await finds(); scrollTo(0, y);
    } catch (er) { alert(er.message); }
  }
  else if (a == 'zoom') {
    const zm = $('#zm'); zm.innerHTML = `<img src="${t.src}">`; zm.hidden = false;
    zm.onclick = () => zm.hidden = true;
  }
};

document.oninput = async e => {
  const t = e.target, y = scrollY;
  if (t.id == 'rp') { RPD = +t.value; renderManagementReport(); return; }
  if (t.dataset.code) { t.nextElementSibling.hidden = !t.value.trim(); return; }
  if (t.id == 'ls') { D.oth = t.value == '__o'; D.loc = D.oth ? '' : t.value; save(); form(); scrollTo(0, y); return; }
  if (t.id == 'sh') { D.shift = t.value; save(); return; }
  if (t.dataset.sv) { SV[t.dataset.sv] = +t.value; save(); form(); scrollTo(0, y); return; }
  if (t.dataset.rc) {
    try { await api('findings?id=eq.' + t.dataset.rc, { method: 'PATCH', body: JSON.stringify({ root_cause: t.value || null }) }); } catch (er) { alert(er.message); }
    return;
  }
  if (t.id == 'loc') D.loc = t.value;
  else if (t.dataset.ex) { D.extra = D.extra || {}; D.extra[t.dataset.ex] = t.value; }
  else if (t.dataset.note) N[t.dataset.note] = t.value;
  else if (t.dataset.rs) RS[t.dataset.rs] = t.value;
  else return;
  save();
};

if (!SS.t && tok === KEY) {
  home();
} else {
  home();
}
</script>
