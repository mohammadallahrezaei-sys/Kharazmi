<!doctype html>
<html lang="fa" dir="rtl">
<head>
<script src="auth.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مواد شیمیایی و گازها - نرم‌افزار جامع HSE</title>
<link rel="stylesheet" href="hse_ui.css">
<style>
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pic{height:34px;width:auto;vertical-align:middle;margin-inline-end:3px;background:#fff;border-radius:4px}
.sw{display:inline-block;padding:0 8px;border-radius:99px;font-size:12px;font-weight:700;color:#0f172a}
.sec{background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:6px}
.sec h4{margin:0 0 2px;font-size:12px;color:var(--mu);font-weight:500}
table.rt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
table.rt td,table.rt th{border:1px solid var(--bd);padding:4px 6px;vertical-align:top;text-align:right}
table.rt th{color:var(--mu);font-weight:500}
</style>
</head>
<body>
<div class="w">
  <div class="top">
    <div><h1>🧪 مواد شیمیایی و گازها</h1><p>برگه ایمنی، برچسب، موجودی و ارتباط با ریسک‌ها</p></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="p" id="bNew">+ ماده جدید</button><a class="btn" href="risks.html">ریسک‌ها</a><a class="btn" href="index.html">← بازگشت</a></div>
  </div>
  <div id="err" class="err"></div>
  <div class="g4" id="tiles" style="margin-bottom:10px"></div>
  <div class="card"><div class="g3"><div><label class="l">جستجو (نام، CAS، UN، کد)</label><input type="text" id="fQ"></div>
   <div><label class="l">نوع</label><select id="fK"><option value="">همه</option><option value="chemical">ماده شیمیایی</option><option value="gas">گاز سیلندری</option></select></div>
   <div><label class="l">فیلتر وضعیت</label><select id="fF"><option value="">همه</option><option value="rev">دارای ناسازگاری / نیاز به تأیید</option><option value="sds">بدون لینک SDS</option><option value="inv">بدون محل و موجودی</option><option value="risk">بدون ریسک ثبت‌شده</option></select></div></div></div>
  <div id="list"><div class="card">در حال بارگذاری...</div></div>
</div>

<div class="modal" id="modal"><div>
  <h2 style="margin:0 0 8px;font-size:15px" id="mT">ماده</h2>
  <div class="g3"><div><label class="l">نام فارسی (الزامی)</label><input type="text" id="eName"></div><div><label class="l">نام انگلیسی</label><input type="text" id="eEn" dir="ltr"></div><div><label class="l">کد HSE</label><input type="text" id="eCode" dir="ltr"></div></div>
  <div class="g3"><div><label class="l">نوع</label><select id="eKind"><option value="chemical">ماده شیمیایی</option><option value="gas">گاز سیلندری</option></select></div><div><label class="l">CAS</label><input type="text" id="eCas" dir="ltr"></div><div><label class="l">UN</label><input type="text" id="eUn" dir="ltr"></div></div>
  <div class="g3"><div><label class="l">فرمول</label><input type="text" id="eForm" dir="ltr"></div><div><label class="l">حالت / ظاهر</label><input type="text" id="eState"></div><div><label class="l">کلمه هشدار</label><select id="eSig"><option value="">—</option><option>خطر</option><option>احتیاط</option></select></div></div>
  <label class="l">علائم GHS</label><div id="eGhs" style="display:flex;gap:10px;flex-wrap:wrap"></div>
  <label class="l">لوزی NFPA (۰ تا ۴)</label>
  <div class="g4"><div><label class="l">سلامتی (آبی)</label><input type="number" min="0" max="4" id="nH"></div><div><label class="l">اشتعال (قرمز)</label><input type="number" min="0" max="4" id="nF"></div><div><label class="l">واکنش‌پذیری (زرد)</label><input type="number" min="0" max="4" id="nR"></div><div><label class="l">ویژه (سفید)</label><input type="text" id="nS" placeholder="OX / W / ACID / COR"></div></div>
  <div class="g2"><div><label class="l">LEL</label><input type="text" id="eLel"></div><div><label class="l">UEL</label><input type="text" id="eUel"></div></div>
  <label class="l">شرایط انبارداری</label><textarea id="eSto" rows="2"></textarea>
  <label class="l">جنبه زیست‌محیطی</label><textarea id="eEnv" rows="2"></textarea>
  <label class="l">جمله‌های خطر و احتیاط برچسب (هر جمله در یک خط)</label><textarea id="eLab" rows="4"></textarea>
  <details style="margin-top:6px"><summary class="mu" style="cursor:pointer">اطلاعات برگه A4 (اثرات، حفاظت فردی، کمک‌های اولیه، آتش‌نشانی)</summary><div id="eRoutes"></div>
   <label class="l">خطر اشتعال و انفجار</label><textarea id="eFire" rows="2"></textarea><label class="l">خاموش‌کننده</label><textarea id="eExt" rows="2"></textarea></details>
  <h3 style="font-size:13px;margin:10px 0 0;color:var(--ac)">موجودی و تأمین</h3>
  <div class="g3"><div><label class="l">محل نگهداری</label><input type="text" id="vLoc" list="ul"><datalist id="ul"></datalist></div><div><label class="l">مقدار فعلی</label><input type="number" step="any" id="vQ"></div><div><label class="l">واحد</label><input type="text" id="vU" placeholder="لیتر / کیلوگرم / سیلندر"></div></div>
  <div class="g3"><div><label class="l">حداکثر مجاز نگهداری</label><input type="number" step="any" id="vMax"></div><div><label class="l">تأمین‌کننده</label><input type="text" id="vSup"></div><div><label class="l">تاریخ SDS</label><input type="text" id="vSdsD" placeholder="1405/07/27" dir="ltr"></div></div>
  <label class="l">لینک SDS سازنده</label><input type="text" id="vSds" dir="ltr" placeholder="https://...">
  <label class="l">ناسازگاری / یادداشت نیازمند تأیید</label><textarea id="eNote" rows="2"></textarea>
  <div style="display:flex;gap:6px;margin-top:10px"><button class="p" id="eSave" style="flex:1">ذخیره</button><button id="eCancel">انصراف</button></div>
</div></div>

<script src="eval_core.js"></script>
<script>
const {esc,fa,getAll,req}=HSE;
const $=id=>document.getElementById(id);
/* ---- شماره تلفن‌های برگه (از برگه‌های A4 چاپ‌شده؛ در صورت تغییر اینجا ویرایش کنید) ---- */
const TEL_FIRE='115 - 115 - 140', TEL_EMG='115 - 115';
const PIC={"GHS03": "img/ghs03.png", "GHS05": "img/ghs05.png", "GHS06": "img/ghs06.png", "GHS04": "img/ghs04.png", "GHS02": "img/ghs02.png", "GHS08": "img/ghs08.png", "GHS09": "img/ghs09.png", "GHS07": "img/ghs07.png"};
const ICON={"heart": "img/ic-heart.jpg", "helmet": "img/ic-helmet.jpg", "firephone": "img/ic-firephone.jpg", "logo": "img/ic-logo.jpg", "cross": "img/ic-cross.jpg", "kit": "img/ic-kit.png"};
for(const _o of [PIC,ICON])for(const _k in _o)_o[_k]=new URL(_o[_k],location.href).href; /* تصاویر کوچک روی خود سایت (کش مرورگر) */
const GHSN={GHS02:'قابل اشتعال',GHS03:'اکسیدکننده',GHS04:'گاز تحت فشار',GHS05:'خورنده',GHS06:'سمی',GHS07:'هشدار/تحریک',GHS08:'خطر سلامت',GHS09:'خطر محیط زیست'};
const ROUTES=[['eye','تماس با چشم'],['skin','تماس با پوست'],['ingest','بلعیدن و خوردن'],['inhale','تنفس']];
let C=[],RK=[],editId=null,filt='';
const isMgr=()=>window.HSEAuth&&HSEAuth.role==='manager';
const pics=(g,h)=>(g||[]).map(c=>PIC[c]?`<img class="pic" style="height:${h||34}px" src="${PIC[c]}" alt="${GHSN[c]}" title="${GHSN[c]}">`:'').join('');
function nfpaSvg(c,s){const v=[c.nfpa_fire,c.nfpa_health,c.nfpa_reactivity],sp=c.nfpa_special||'';
  if(c.nfpa_health==null)return'';
  return`<svg width="${s}" height="${s}" viewBox="0 0 100 100" style="vertical-align:middle;flex:none;display:inline-block" xmlns="http://www.w3.org/2000/svg"><polygon points="50,2 74,26 50,50 26,26" fill="#e11d1d"/><polygon points="2,50 26,26 50,50 26,74" fill="#1d4ed8"/><polygon points="98,50 74,26 50,50 74,74" fill="#facc15"/><polygon points="50,98 26,74 50,50 74,74" fill="#fff"/><polygon points="50,2 98,50 50,98 2,50" fill="none" stroke="#000" stroke-width="2"/><g font-family="Tahoma,Arial" font-weight="700" text-anchor="middle" font-size="21"><text x="50" y="33" fill="#fff">${c.nfpa_fire}</text><text x="26" y="57" fill="#fff">${c.nfpa_health}</text><text x="74" y="57" fill="#000">${c.nfpa_reactivity}</text><text x="50" y="81" fill="#000" font-size="${sp.length>2?13:19}">${esc(sp)}</text>${sp==='W'?'<line x1="38" y1="67" x2="62" y2="67" stroke="#000" stroke-width="2.4"/>':''}</g></svg>`}
async function load(){
  await HSEAuth.ready;
  const [c,r]=await Promise.all([getAll('chemicals?select=*'),getAll('risks?select=id,hazard,unit,score,high,status,method,chemical_id&chemical_id=not.is.null')]);
  if(c==null){$('err').style.display='block';$('err').textContent='جدول مواد پیدا نشد. فایل 06_chemicals.sql را در Supabase اجرا کنید.';C=[]}else{$('err').style.display='none';C=c.filter(x=>x.status!=='archived')}
  RK=r||[];
  const locs=[...new Set(C.map(x=>x.location).filter(Boolean))];$('ul').innerHTML=locs.map(l=>`<option value="${esc(l)}">`).join('');
  render();
}
const risksOf=c=>RK.filter(r=>r.chemical_id==c.id&&r.status!=='archived');
const hasInv=c=>c.location&&c.quantity!=null;
function pass(c){const q=$('fQ').value.trim().toLowerCase(),k=$('fK').value;
  if(k&&c.kind!==k)return false;
  if(q&&![c.name,c.name_en,c.cas,c.un_number,c.code,c.formula].join(' ').toLowerCase().includes(q))return false;
  if(filt==='rev'&&!c.review_note)return false;if(filt==='sds'&&c.sds_url)return false;if(filt==='inv'&&hasInv(c))return false;if(filt==='risk'&&risksOf(c).length)return false;return true}
function render(){
  const T=[['all','کل ماده و گاز',C.length,''],['rev','ناسازگاری / نیاز به تأیید',C.filter(c=>c.review_note).length,C.some(c=>c.review_note)?'r':'g'],['sds','بدون لینک SDS',C.filter(c=>!c.sds_url).length,C.some(c=>!c.sds_url)?'y':'g'],['inv','بدون موجودی ثبت‌شده',C.filter(c=>!hasInv(c)).length,C.some(c=>!hasInv(c))?'y':'g'],['risk','بدون ریسک ثبت‌شده',C.filter(c=>c.kind==='chemical'&&!risksOf(c).length).length,'y']];
  $('tiles').innerHTML=T.map(t=>`<div class="tl ${t[3]}" data-f="${t[0]==='all'?'':t[0]}"><b>${fa(t[2])}</b><span>${t[1]}</span></div>`).join('');
  const L=C.filter(pass).sort((a,b)=>(a.kind===b.kind?0:a.kind==='chemical'?-1:1)||String(a.code||'zz').localeCompare(String(b.code||'zz'),'en',{numeric:true})||a.name.localeCompare(b.name,'fa'));
  $('list').innerHTML=L.length?L.map(c=>{const rs=risksOf(c),hi=rs.filter(r=>r.high).length;
   const ro=(o,k)=>o&&o[k]?`<td>${esc(o[k])}</td>`:'<td class="mu">—</td>';
   return`<details class="card"><summary style="cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center"><span>${nfpaSvg(c,38)} ${pics(c.ghs,26)}<b>${esc(c.name)}</b> <span class="mu">${esc(c.name_en||'')}${c.code?' · '+esc(c.code):''}${c.cas?' · CAS '+esc(c.cas):''}${c.un_number?' · UN '+esc(c.un_number):''}</span></span><span style="text-align:left;white-space:nowrap">${c.signal_word?`<span class="sw" style="background:${c.signal_word==='خطر'?'#f87171':'#fbbf24'}">${c.signal_word}</span> `:''}${c.review_note?'<span class="tag bad">ناسازگاری</span> ':''}${rs.length?`<span class="tag ${hi?'bad':''}">${fa(rs.length)} ریسک</span>`:''}</span></summary>
   <div style="margin-top:8px;border-top:1px solid var(--bd);padding-top:8px">
   ${c.review_note?`<div class="sec" style="border:1px solid var(--bad)"><h4>ناسازگاری / نیازمند تأیید</h4>${esc(c.review_note)}</div>`:''}
   <div class="mu">${c.formula?'فرمول: <span dir="ltr">'+esc(c.formula)+'</span> · ':''}${c.state?esc(c.state):''}${c.lel&&c.lel!=='ندارد'?' · LEL '+esc(c.lel)+' / UEL '+esc(c.uel||''):''}</div>
   ${(c.label_lines||[]).length?`<div class="sec"><h4>جمله‌های خطر و احتیاط (برچسب)</h4>${c.label_lines.map(x=>'• '+esc(x)).join('<br>')}</div>`:''}
   ${c.storage?`<div class="sec"><h4>شرایط انبارداری</h4>${esc(c.storage)}</div>`:''}${c.environment?`<div class="sec"><h4>جنبه زیست‌محیطی</h4>${esc(c.environment)}</div>`:''}
   ${c.effects?`<table class="rt"><tr><th></th><th>اثرات بر سلامت</th><th>حفاظت فردی</th><th>کمک‌های اولیه</th></tr>${ROUTES.map(([k,t])=>`<tr><th>${t}</th>${ro(c.effects,k)}${ro(c.ppe,k)}${ro(c.first_aid,k)}</tr>`).join('')}</table>`:''}
   ${c.fire_hazard?`<div class="sec"><h4>خطر آتش‌سوزی و انفجار / خاموش‌کننده</h4>${esc(c.fire_hazard)}<br>${esc(c.extinguisher||'')}</div>`:''}
   <div class="sec"><h4>موجودی و تأمین</h4>${hasInv(c)?`${esc(c.location)} · ${fa(c.quantity)} ${esc(c.quantity_unit||'')}${c.max_quantity!=null?' (حداکثر مجاز '+fa(c.max_quantity)+')':''}`:'<span class="wa">محل و مقدار ثبت نشده</span>'}${c.max_quantity!=null&&c.quantity>c.max_quantity?' <b class="bad">⚠ بیش از حداکثر مجاز</b>':''}${c.supplier?' · تأمین‌کننده: '+esc(c.supplier):''}<br>${c.sds_url?`<a href="${esc(c.sds_url)}" target="_blank" rel="noopener">SDS سازنده${c.sds_date?' ('+esc(c.sds_date)+')':''}</a>`:'<span class="wa">لینک SDS سازنده ثبت نشده</span>'}</div>
   <div class="sec"><h4>ریسک‌های مرتبط</h4>${rs.length?rs.map(r=>`<div>${r.high?'🔴':'🟢'} <a href="risks.html">${esc(String(r.hazard).slice(0,70))}</a> <span class="mu">· ${esc(r.unit)} · امتیاز ${fa(r.score)}</span></div>`).join(''):'<span class="mu">ریسکی به این ماده وصل نشده. در «ثبت ریسک» می‌توان ماده مرتبط را انتخاب کرد.</span>'}</div>
   <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button data-edit="${c.id}">ویرایش</button><button data-pl="${c.id}">🖨 برچسب A5</button>${c.effects?`<button data-ps="${c.id}">🖨 برگه A4</button>`:''}${isMgr()?`<button data-arc="${c.id}">بایگانی</button><button class="d" data-del="${c.id}">حذف</button>`:''}</div></div></details>`}).join(''):'<div class="card mu">موردی پیدا نشد.</div>';
}
$('tiles').onclick=e=>{const t=e.target.closest('[data-f]');if(!t)return;filt=t.dataset.f;$('fF').value=filt;render()};
['fQ','fK'].forEach(i=>$(i).oninput=render);$('fF').onchange=()=>{filt=$('fF').value;render()};
$('list').onclick=async e=>{const d=e.target.dataset;
  try{
  if(d.edit)openM(C.find(c=>c.id==d.edit));
  else if(d.pl)printLabel(C.find(c=>c.id==d.pl));
  else if(d.ps)printSheet(C.find(c=>c.id==d.ps));
  else if(d.arc&&confirm('این ماده بایگانی شود؟')){await req('chemicals?id=eq.'+d.arc,'PATCH',{status:'archived'},'return=minimal');load()}
  else if(d.del&&confirm('این ماده حذف شود؟ (اتصال ریسک‌ها برداشته می‌شود)')){await req('chemicals?id=eq.'+d.del,'DELETE',null,'return=minimal');load()}
  }catch(er){alert('خطا: '+er.message)}};
/* ---- ویرایش ---- */
$('eGhs').innerHTML=Object.keys(GHSN).map(k=>`<label style="display:flex;gap:4px;align-items:center"><input type="checkbox" value="${k}"><img class="pic" style="height:26px" src="${PIC[k]}"> ${GHSN[k]}</label>`).join('');
$('eRoutes').innerHTML=ROUTES.map(([k,t])=>`<div class="sec"><h4>${t}</h4><div class="g3"><div><label class="l">اثرات</label><textarea rows="2" data-r="effects.${k}"></textarea></div><div><label class="l">حفاظت فردی</label><textarea rows="2" data-r="ppe.${k}"></textarea></div><div><label class="l">کمک‌های اولیه</label><textarea rows="2" data-r="first_aid.${k}"></textarea></div></div></div>`).join('');
function openM(c){editId=c?c.id:null;$('mT').textContent=c?'ویرایش: '+c.name:'ماده جدید';
  const v=(id,x)=>$(id).value=x==null?'':x;
  v('eName',c&&c.name);v('eEn',c&&c.name_en);v('eCode',c&&c.code);v('eKind',c?c.kind:'chemical');v('eCas',c&&c.cas);v('eUn',c&&c.un_number);v('eForm',c&&c.formula);v('eState',c&&c.state);v('eSig',c&&c.signal_word);
  document.querySelectorAll('#eGhs input').forEach(i=>i.checked=!!(c&&(c.ghs||[]).includes(i.value)));
  v('nH',c&&c.nfpa_health);v('nF',c&&c.nfpa_fire);v('nR',c&&c.nfpa_reactivity);v('nS',c&&c.nfpa_special);v('eLel',c&&c.lel);v('eUel',c&&c.uel);v('eSto',c&&c.storage);v('eEnv',c&&c.environment);
  v('eLab',c&&(c.label_lines||[]).join('\n'));v('eFire',c&&c.fire_hazard);v('eExt',c&&c.extinguisher);
  document.querySelectorAll('[data-r]').forEach(t=>{const [a,b]=t.dataset.r.split('.');t.value=(c&&c[a]&&c[a][b])||''});
  v('vLoc',c&&c.location);v('vQ',c&&c.quantity);v('vU',c&&c.quantity_unit);v('vMax',c&&c.max_quantity);v('vSup',c&&c.supplier);v('vSdsD',c&&c.sds_date);v('vSds',c&&c.sds_url);v('eNote',c&&c.review_note);
  $('modal').classList.add('on')}
$('bNew').onclick=()=>openM(null);$('eCancel').onclick=()=>$('modal').classList.remove('on');
$('eSave').onclick=async()=>{
  const name=$('eName').value.trim();if(!name){alert('نام الزامی است.');return}
  const t=x=>$(x).value.trim()||null,n=x=>$(x).value===''?null:+$(x).value;
  for(const x of['nH','nF','nR']){const k=n(x);if(k!=null&&(k<0||k>4||k%1)){alert('اعداد NFPA باید ۰ تا ۴ باشند.');return}}
  const obj={effects:{},ppe:{},first_aid:{}};document.querySelectorAll('[data-r]').forEach(el=>{const [a,b]=el.dataset.r.split('.');if(el.value.trim())obj[a][b]=el.value.trim()});
  const has=o=>Object.keys(o).length?o:null;
  const b={name,name_en:t('eEn'),code:t('eCode'),kind:$('eKind').value,cas:t('eCas'),un_number:t('eUn'),formula:t('eForm'),state:t('eState'),signal_word:t('eSig'),ghs:[...document.querySelectorAll('#eGhs input:checked')].map(i=>i.value),
    nfpa_health:n('nH'),nfpa_fire:n('nF'),nfpa_reactivity:n('nR'),nfpa_special:t('nS'),lel:t('eLel'),uel:t('eUel'),storage:t('eSto'),environment:t('eEnv'),label_lines:$('eLab').value.split('\n').map(x=>x.trim()).filter(Boolean),
    effects:has(obj.effects),ppe:has(obj.ppe),first_aid:has(obj.first_aid),fire_hazard:t('eFire'),extinguisher:t('eExt'),location:t('vLoc'),quantity:n('vQ'),quantity_unit:t('vU'),max_quantity:n('vMax'),supplier:t('vSup'),sds_date:t('vSdsD'),sds_url:t('vSds'),review_note:t('eNote')};
  try{if(editId)await req('chemicals?id=eq.'+editId,'PATCH',b,'return=minimal');else{b.created_by=HSEAuth.email;await req('chemicals','POST',b,'return=minimal')}
    $('modal').classList.remove('on');load()}catch(e){alert('خطا در ذخیره: '+e.message)}};
/* ---- چاپ: مطابق قالب برگه A4 و برچسب A5 خودمان ---- */
const baseCss=`body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;color:#000;direction:rtl;-webkit-print-color-adjust:exact;print-color-adjust:exact}*{box-sizing:border-box}.pg{page-break-after:always;position:relative;overflow:hidden}.pg:last-child{page-break-after:auto}`;
function openPrint(title,css,html){const w=window.open('','_blank');if(!w){alert('اجازه‌ی باز شدن پنجره را بدهید.');return}
  w.document.write(`<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>${esc(title)}</title><link rel="stylesheet" href="${new URL('fonts.css',location.href).href}"><style>${baseCss}${css}</style></head><body>${html}<script>setTimeout(()=>{document.querySelectorAll('.fit').forEach(e=>{let f=parseFloat(e.style.fontSize)||10;while(e.scrollHeight>e.clientHeight+1&&f>5.5){f-=.3;e.style.fontSize=f+'pt'}});print()},1200)<\/script></body></html>`);w.document.close()}
function printLabel(c){
  const n=+prompt('تعداد نسخه برچسب:','1');if(!n||n<1)return;
  const g=(c.ghs||[]).slice(0,3),pos={3:[[-17,19.7],[19.7,18.3],[0,36.7]],2:[[-17,19.7],[19.7,18.3]],1:[[0,36.7]]}[g.length]||[],CX=38,CY=19.4,GS=39;
  const hasN=c.nfpa_health!=null,cl=(hasN?`<div style="position:absolute;left:${CX-18.4}mm;top:${CY-18.4}mm;width:36.8mm;height:36.8mm">${nfpaSvg(c,'36.8mm')}</div>`:'')+g.map((k,i)=>`<img src="${PIC[k]}" style="position:absolute;width:${GS}mm;left:${CX+pos[i][0]-GS/2}mm;top:${CY+pos[i][1]-GS/2}mm">`).join('');
  const L=(c.label_lines||[]).map(x=>String(x).replace(/\.{2,}$/,'.')),tot=L.join('').length,fz=tot>560?9.5:tot>420?10.8:tot>300?12:13;
  const one=`<div class="pg lb"><div class="hd"><div class="nm">${esc(c.name)}${c.name_en?` <span dir="ltr" style="font-weight:700">(${esc(c.name_en)})</span>`:''}</div><div class="sg">${c.signal_word?(c.signal_word==='خطر'?'(DANGER) خطر':'(Warning) احتیاط'):''}</div></div>
   <div class="r1"></div><div class="cl">${cl}</div>
   <div class="tx fit" style="font-size:${fz}pt"><div class="ids">${c.cas?`شماره CAS : <span dir="ltr">${esc(c.cas)}</span>`:''}</div><div class="ids">${c.un_number?`شماره UN : <span dir="ltr">${esc(c.un_number)}</span>`:''}</div>
   <ul style="font-size:inherit;margin:1mm 0 0">${L.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
   <div class="r2"></div><div class="ft"><b>واحد HSE</b><img src="${ICON.logo}" style="height:17mm;margin-top:1mm"></div></div>`;
  openPrint('برچسب '+c.name,`@page{size:A5 landscape;margin:0}.lb{width:210mm;height:148mm}.hd{position:absolute;top:11mm;right:10mm;left:10mm;display:flex;justify-content:space-between;align-items:baseline}.nm{font-size:23pt;font-weight:800}.sg{font-size:19pt;font-weight:800;direction:ltr}.r1{position:absolute;top:27mm;right:10mm;left:10mm;border-top:.7mm solid #000}.cl{position:absolute;left:14mm;top:33mm;width:80mm;height:80mm}.tx{position:absolute;right:10mm;top:31mm;width:108mm;height:80mm;overflow:hidden}.tx ul{font-size:inherit}.ids{font-size:.85em;line-height:1.7;text-align:right}ul{margin:1mm 0 0;padding-right:5mm;line-height:1.7;text-align:right}li{margin-bottom:.6mm}.r2{position:absolute;top:114mm;right:10mm;left:10mm;border-top:.7mm solid #000}.ft{position:absolute;top:116mm;right:10mm;font-size:12pt}`,one.repeat(n))}
function printSheet(c){
  const fs=t=>{const l=(t||'').length;return l>150?6.6:l>105?7.4:l>70?8.6:10};
  const cell=(cls,t,emptyLine)=>`<div class="cell fit ${cls}" style="font-size:${fs(t)}pt;overflow:hidden">${t?esc(t):(emptyLine?'<span style="border-top:.3mm solid #000;width:75%"></span>':'')}</div>`;
  const heights={eye:16,skin:22,ingest:24,inhale:22};
  const rows=ROUTES.map(([k,t])=>`<div class="rw" style="height:${heights[k]}mm"><div class="lab g">${t}</div>${cell('b',(c.effects||{})[k])}${cell('y',(c.ppe||{})[k],1)}${cell('g',(c.first_aid||{})[k])}</div>`).join('');
  const nfL=[['0','بی خطر'],['1','کم خطر'],['2','نسبتاً شدید'],['3','شدید'],['4','خیلی شدید']].map(a=>`<tr><td>${a[1]}</td><td><b>${a[0]}</b></td></tr>`).join('');
  const nfR=[['خطر آتش سوزی','#e11d1d'],['مخاطرات بهداشتی','#1d4ed8'],['واکنش پذیری','#facc15'],['خطرات ویژه','#fff']].map(a=>`<tr><td>${a[0]}</td><td style="background:${a[1]};width:7mm"></td></tr>`).join('');
  const html=`<div class="pg sh">
  <div class="ti"><img src="${ICON.logo}" style="height:16mm"><h1>برگه عمومی اطلاعات ایمنی مواد ( MSDS )</h1></div>
  <div class="hb"><div class="lbl">نام ماده</div><div class="fld" style="flex:1.25">${esc(c.name)}</div><div class="fld" style="flex:1.5">فرمول شیمیایی : <span dir="ltr">&nbsp;${esc(c.formula||'')}</span></div><div class="fld" style="width:26mm">کد: <span dir="ltr">&nbsp;${esc(c.code||'')}</span></div><div class="fld" style="width:31mm;line-height:1.3;text-align:center;white-space:nowrap"><div>CAS Num<span dir="ltr">${esc(c.cas||'—')}</span></div></div></div>
  <div class="tp"><div class="rws">
    <div class="r"><div class="lab g">خواص ظاهری</div><div class="bx fit" style="height:8mm;font-size:9.5pt;overflow:hidden">${esc(c.state||'')}</div></div>
    <div class="r"><div class="lab g">شرایط انبارداری</div><div class="bx fit" style="height:17mm;overflow:hidden;font-size:${fs(c.storage)}pt">${esc(c.storage||'')}</div></div>
    <div class="r"><div class="lab g">زیست محیطی</div><div class="bx fit" style="height:20mm;overflow:hidden;font-size:${fs(c.environment)}pt">${esc(c.environment||'')}</div></div>
    <div class="r"><div class="lab g">علایم ایمنی</div><div class="bx" style="height:17mm;justify-content:center;gap:3mm">${(c.ghs||[]).map(k=>`<img src="${PIC[k]}" style="height:13.5mm">`).join('')}</div></div></div>
   <div class="nf"><div class="ld">لوزی خطر</div>${nfpaSvg(c,'33mm')}
     <div class="lel"><span class="rd">LEL</span><span>${esc(c.lel||'ندارد')}</span></div><div class="lel"><span class="rd">UEL</span><span>${esc(c.uel||'ندارد')}</span></div>
     <div class="lg"><table>${nfL}</table><table><tr><th colspan="2">استاندارد NFPA</th></tr>${nfR}</table></div></div></div>
  <div class="mp"><div class="hh"><div class="lab0"></div><div class="h b"><b>اثرات ماده بر سلامتی</b><img src="${ICON.heart}"></div><div class="h y"><b>ایمنی و حفاظت فردی</b><img src="${ICON.helmet}"></div><div class="h g"><b>کمک‌های اولیه</b><img src="${ICON.kit}"></div></div>${rows}</div>
  <div class="fp"><div class="em"><img src="${ICON.cross}"><div class="rb">تلفن اورژانس</div><div class="tel">${TEL_EMG}</div></div><div class="rb" style="width:25mm;font-size:12pt;line-height:1.5">اطلاعات آتش نشانی</div>
   <div class="col"><div class="rb">خطر اشتعال و انفجار</div><div class="rb">خاموش کننده حریق</div></div><div class="col" style="flex:1"><div class="rb tx2 fit" style="overflow:hidden;font-size:${fs(c.fire_hazard)-.5}pt">${esc(c.fire_hazard||'')}</div><div class="rb tx2 fit" style="overflow:hidden;font-size:${fs(c.extinguisher)-.5}pt">${esc(c.extinguisher||'')}</div></div>
   <div class="em"><img src="${ICON.firephone}"><div class="tel">${TEL_FIRE}</div></div></div>
  <div class="sgt"><div>تهیه کننده :</div><div>تایید کننده :</div></div><div class="ds">توزیع نسخ : ۱ – H.S.E &nbsp; ۲ – انبار &nbsp; ۳ – واحد مصرف کننده</div></div>`;
  const css=`@page{size:A4;margin:0}.sh{width:210mm;height:297mm;padding:6mm 8mm;font-size:9pt;font-weight:700}
.ti{display:flex;align-items:center;justify-content:center;gap:14mm;height:15mm}.ti h1{margin:0;font-size:19pt;font-weight:800}
.hb{border:1.1mm solid #c00000;border-radius:5mm;padding:1.8mm;display:flex;gap:2mm;height:15mm;margin-top:1mm}.fld,.lbl{border:.3mm solid #000;border-radius:2.5mm;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10pt;background:#fff}.lbl{width:22mm;background:#fff}
.tp,.mp,.fp{margin-top:2.5mm;background:#c6d9f0;border:.3mm solid #7f9ec9;border-radius:7mm;padding:2.5mm}.tp{display:flex;gap:2.5mm;height:73mm}.rws{flex:1;display:flex;flex-direction:column;gap:2mm}.r{display:flex;gap:2mm;align-items:stretch}
.lab{width:24mm;border:.3mm solid #4d7c24;border-radius:3mm;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:9.5pt;flex:none}.g{background:linear-gradient(#e4f3d4,#8fcf55)}
.bx{flex:1;background:#fff;border:.3mm solid #000;border-radius:3mm;padding:1.5mm 3mm;display:flex;align-items:center;font-weight:600;line-height:1.55}
.nf{width:52mm;background:#e3edf9;border-radius:5mm;display:flex;flex-direction:column;align-items:center;gap:1mm;padding:1.5mm}.ld{border:.3mm solid #000;border-radius:2mm;background:#fff;padding:.3mm 4mm;font-weight:800;font-size:9.5pt}
.lel{display:flex;gap:1mm;width:26mm;align-self:flex-end;margin-inline-end:2mm}.lel span{flex:1;text-align:center;border:.3mm solid #000;background:#fff;font-size:7.5pt;font-weight:600}.lel .rd{background:#e11d1d;color:#fff;font-weight:800;flex:.8}
.lg{display:flex;gap:1.5mm;margin-top:auto;font-size:7pt;width:100%;justify-content:center}.lg table{border-collapse:collapse;background:#fff}.lg td,.lg th{border:.25mm solid #000;padding:0 1mm;text-align:center}.lg th{font-weight:800}
.mp{height:114mm;padding:2.5mm}.hh,.rw{display:flex;gap:2mm}.hh{height:25mm;margin-bottom:2mm}.lab0{width:24mm;flex:none}.h{border:.3mm solid #000;border-radius:4mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:1.5mm;font-size:10pt}.h img{height:15mm;border-radius:2mm}
.h.b{background:linear-gradient(#b9d3f1,#4f86c9);flex:19}.h.y{background:linear-gradient(#fff5a0,#f7d51d);flex:19}.h.g{background:linear-gradient(#bfe8a3,#49a63a);flex:44}.rw{margin-bottom:2mm}
.cell{border:.3mm solid #000;border-radius:3.5mm;padding:1.5mm 2.5mm;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;line-height:1.5}.cell.b{background:linear-gradient(#cfe0f6,#7aa6dc);flex:19}.cell.y{background:linear-gradient(#fffbc2,#f6df3d);flex:19}.cell.g{background:linear-gradient(#d6efc4,#5eb347);flex:44}
.fp{display:flex;gap:2mm;height:33mm;border-radius:6mm}.em{width:24mm;background:#fff;border:.3mm solid #000;border-radius:3mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:1mm;font-size:8pt;overflow:hidden}.em img{height:15mm;max-width:100%;object-fit:contain}
.rb{background:linear-gradient(#f26a63,#d52b24);color:#fff;border:.3mm solid #7a0b07;border-radius:3.5mm;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:9.5pt;padding:1mm 2mm}.col{width:33mm;display:flex;flex-direction:column;gap:2mm}.col .rb{flex:1}.tx2{line-height:1.45}.tel{background:#d52b24;color:#fff;width:100%;text-align:center;border-radius:1.5mm;font-size:8pt;direction:ltr}.em .rb{width:100%;font-size:7.5pt;padding:.5mm;margin-top:.5mm}
.sgt{margin-top:4mm;border:.4mm solid #000;display:flex;height:15mm;font-size:11pt}.sgt div{flex:1;padding:2mm 4mm}.sgt div:first-child{border-left:.4mm solid #000}.ds{margin-top:2mm;font-size:8.5pt;font-weight:500}`;
  openPrint('برگه '+c.name,css,html)}
load();
</script>
</body>
</html>
