<!doctype html><html lang="fa" dir="rtl"><head><meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"><script src="auth.js"></script><script src="hse_nav.js" defer="defer"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش کارهای روزانه - نرم‌افزار جامع HSE</title><link rel="stylesheet" href="hse_ui.css"><style>.w{max-width:860px;margin:0 auto;padding:14px}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}.card2{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}.t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}.mu{color:var(--mu);font-size:12px}.b2{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.b2.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}.b2.bad{border-color:var(--bad);color:var(--bad)}.bg{display:inline-block;border-radius:99px;padding:1px 10px;font-size:11px;border:1px solid var(--bd)}.bg.ok{color:var(--ok);border-color:var(--ok)}.bg.wa{color:var(--wa);border-color:var(--wa)}input,select,textarea{font:inherit;font-size:13px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);padding:7px 9px;width:100%}dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(94vw,520px);padding:14px;max-height:92vh}dialog::backdrop{background:rgba(15,23,42,.55)}label.f{display:block;font-size:12px;color:var(--mu);margin-top:8px}.jd{display:flex;gap:4px}.jd select{width:auto;flex:1}.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.ph .ld,.ph img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--bd);cursor:pointer;background:var(--soft)}.bar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.bar input,.bar select{width:auto;flex:1;min-width:120px}[hidden]{display:none!important}</style></head><body><div class="w"><div class="top"><div><h1 style="">📝 گزارش کارهای روزانه</h1><div class="mu">هر کاری که در طول روز انجام می‌شود (با عکس) برای گزارش به مدیریت ثبت شود</div></div><div><a href="index.html">← صفحه اصلی</a></div></div><div class="bar"><select id="fm"></select><select id="fc"></select><input id="q" placeholder="🔍 جستجو"><button class="b2 p" id="bAdd">＋ ثبت کار</button></div><div id="sum" class="mu"></div><div id="warn"></div><div id="list"></div></div><dialog id="dlg"></dialog><div id="toast" style=""></div><script src="eval_core.js"></script><script>const{fa:fa,esc:esc}=HSE,$=t=>document.querySelector(t),SB="https://priopguwfjawybffarhd.supabase.co";const CATS=["پیگیری اداره / سازمان (محیط‌زیست، کار، بهداشت)","خوداظهاری و مستندات","شارژ / تعمیر / تحویل تجهیزات ایمنی","هماهنگی و نظارت بر پیمانکار","تصفیه‌خانه و محیط‌زیست","آموزش و جلسه","بازدید و رسیدگی خارج از چک‌لیست","توسعه و بهبود نرم‌افزار HSE","برنامه‌ریزی و مدیریت واحد HSE","سایر"];let L=[],ME="",EDIT=null,PH=[];const todayISO=()=>(new Date).toLocaleDateString("en-CA");const jl=t=>t?new Date(t+"T12:00:00Z").toLocaleDateString("fa-IR-u-ca-persian",{year:"numeric",month:"long",day:"numeric",timeZone:"UTC"}):"—";const toast=t=>{const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display="none",2600)};async function rq(t,e={}){const a=await fetch(SB+"/rest/v1/"+t,{...e,headers:{"Content-Type":"application/json",Prefer:"return=representation",...e.headers||{}}});if(!a.ok)throw new Error((await a.text()).slice(0,250));const o=await a.text();return o?JSON.parse(o):null}const PF=new Intl.DateTimeFormat("en-u-ca-persian-nu-latn",{year:"numeric",month:"numeric",timeZone:"UTC"});const mk=t=>{const e=PF.formatToParts(new Date(t+"T12:00:00Z"));return e.find(t=>t.type==="year").value+"-"+String(+e.find(t=>t.type==="month").value).padStart(2,"0")};async function compress(t){if(!/^image\//.test(t.type))return t;return new Promise(e=>{const a=new Image,o=URL.createObjectURL(t);a.onload=()=>{const n=Math.min(1,1600/Math.max(a.width,a.height)),s=document.createElement("canvas");s.width=a.width*n;s.height=a.height*n;s.getContext("2d").drawImage(a,0,0,s.width,s.height);s.toBlob(a=>{URL.revokeObjectURL(o);e(a?new File([a],t.name.replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"}):t)},"image/jpeg",.82)};a.onerror=()=>e(t);a.src=o})}async function upload(t){const e=[];for(const a of t){if(a.size>15e6){toast("حجم عکس زیاد است: "+a.name);continue}const t=await compress(a),o=(t.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,""),n="worklog/"+crypto.randomUUID()+"."+o;const s=await fetch(SB+"/storage/v1/object/photos/"+n,{method:"POST",headers:{"Content-Type":t.type||"image/jpeg"},body:t});if(!s.ok){toast("آپلود نشد: "+(await s.text()).slice(0,80));continue}e.push(n)}return e}const BLOB={};async function blobUrl(t){if(BLOB[t])return BLOB[t];const e=await fetch(SB+"/storage/v1/object/authenticated/photos/"+t);if(!e.ok)throw new Error(e.status);return BLOB[t]=URL.createObjectURL(await e.blob())}const photoObserver="IntersectionObserver"in window?new IntersectionObserver(t=>t.forEach(t=>{if(!t.isIntersecting)return;const e=t.target;photoObserver.unobserve(e);blobUrl(e.dataset.p).then(t=>{e.src=t}).catch(()=>{e.dataset.failed="1"})}),{rootMargin:"180px"}):null;function hydrate(t){t.querySelectorAll("[data-p]").forEach(t=>{if(t.dataset.done)return;t.dataset.done=1;if(photoObserver)photoObserver.observe(t);else blobUrl(t.dataset.p).then(e=>{t.src=e}).catch(()=>{t.dataset.failed="1"})})}async function load(){try{L=await HSE.getAll("work_log?select=id,work_date,category,title,status,description,photos,created_at,created_by&order=work_date.desc,created_at.desc")||[];$("#warn").innerHTML=""}catch(t){L=[]}if(!Array.isArray(L)){L=[]}const t=[...new Set(L.map(t=>mk(t.work_date)).concat(HSE.nowK?[HSE.nowK()]:[]))].sort().reverse();const e=$("#fm").value;$("#fm").innerHTML='<option value="">همهٔ ماه‌ها</option>'+t.map(t=>`<option value="${t}">${HSE.monthLabel(t)}</option>`).join("");$("#fm").value=e||(t.includes(HSE.nowK())?HSE.nowK():"");$("#fc").innerHTML='<option value="">همهٔ دسته‌ها</option>'+CATS.map(t=>`<option>${esc(t)}</option>`).join("");draw()}function draw(){const t=$("#fm").value,e=$("#fc").value,a=$("#q").value.trim().toLowerCase();const o=L.filter(o=>(!t||mk(o.work_date)===t)&&(!e||o.category===e)&&(!a||[o.title,o.description,o.category].join(" ").toLowerCase().includes(a)));$("#sum").textContent=`${fa(o.length)} کار ثبت شده${o.filter(t=>(t.photos||[]).length).length?` · ${fa(o.filter(t=>(t.photos||[]).length).length)} مورد دارای عکس`:""}`;$("#list").innerHTML=o.map(t=>`<div class="card2"><div class="t"><div><b>${esc(t.title)}</b> <span class="bg ${t.status==="done"?"ok":"wa"}">${t.status==="done"?"انجام شد":"در جریان"}</span>\n    <div class="mu">${jl(t.work_date)} · ${esc(t.category||"")}</div></div><div style="display:flex;gap:6px"><button class="b2" data-a="edit" data-id="${t.id}">✏️</button><button class="b2 bad" data-a="del" data-id="${t.id}">🗑</button></div></div>\n    ${t.description?`<div style="margin-top:6px;white-space:pre-line">${esc(t.description)}</div>`:""}\n    ${(t.photos||[]).length?`<div class="ph">${t.photos.map(t=>`<img data-p="${esc(t)}" alt="" loading="lazy">`).join("")}</div>`:""}</div>`).join("")||'<div class="card2 mu">موردی ثبت نشده است.</div>';hydrate($("#list"))}function drawPh(){$("#ph").innerHTML=PH.map((t,e)=>`<span style="position:relative"><img data-p="${esc(t)}" alt=""><button type="button" class="b2 bad" data-rm="${e}" style="position:absolute;top:2px;left:2px;padding:0 6px">✕</button></span>`).join("");hydrate($("#ph"))}function openForm(t){EDIT=t?L.find(e=>e.id===t):null;const e=EDIT||{work_date:todayISO(),status:"done"};PH=[...e.photos||[]];$("#dlg").innerHTML=`<b>${t?"ویرایش":"ثبت کار انجام‌شده"}</b>\n   <label class="f">تاریخ</label><div id="fD" class="jd"><select></select><select></select><select></select></div>\n   <label class="f">دسته<select id="fC">${CATS.map(t=>`<option ${e.category===t?"selected":""}>${esc(t)}</option>`).join("")}</select></label>\n   <label class="f">عنوان کار * (مثلاً «همراهی پیمانکار برای ثبت خوداظهاری زیست‌محیطی»)<input id="fT" value="${esc(e.title||"")}"></label>\n   <label class="f">شرح (اقدام انجام‌شده، نتیجه، همراهان)<textarea id="fS" rows="4">${esc(e.description||"")}</textarea></label>\n   <label class="f">وضعیت<select id="fSt"><option value="done" ${e.status!=="progress"?"selected":""}>انجام شد</option><option value="progress" ${e.status==="progress"?"selected":""}>در جریان</option></select></label>\n   <div class="ph" id="ph"></div><label class="b2" style="display:inline-block;margin-top:8px">📷 افزودن عکس<input id="fF" type="file" accept="image/*" multiple hidden></label>\n   <div id="fE" class="mu" style="color:var(--bad)"></div>\n   <div style="display:flex;gap:8px;margin-top:12px"><button class="b2" id="fX">انصراف</button><button class="b2 p" id="fOK" style="margin-inline-start:auto">ذخیره</button></div>`;HSE.jdInit($("#fD"));HSE.jdSet($("#fD"),e.work_date||todayISO());drawPh();$("#dlg").showModal();$("#fX").onclick=()=>$("#dlg").close();$("#fF").onchange=async t=>{$("#fE").textContent="در حال بارگذاری عکس…";PH.push(...await upload([...t.target.files]));$("#fE").textContent="";t.target.value="";drawPh()};$("#fOK").onclick=async()=>{const e=$("#fT").value.trim();if(!e)return $("#fE").textContent="عنوان را بنویسید";const a={work_date:HSE.jdGet($("#fD"))||todayISO(),category:$("#fC").value,title:e,description:$("#fS").value.trim()||null,status:$("#fSt").value,photos:PH};try{if(t)await rq("work_log?id=eq."+t,{method:"PATCH",body:JSON.stringify(a),headers:{Prefer:"return=minimal"}});else await rq("work_log",{method:"POST",body:JSON.stringify({...a,created_by:ME}),headers:{Prefer:"return=minimal"}});$("#dlg").close();toast("ثبت شد");await load()}catch(t){$("#fE").textContent=/relation|does not exist|work_log/.test(t.message)?"جدول ساخته نشده؛ فایل hse_worklog.sql را یک‌بار در Supabase اجرا کنید.":t.message}}}document.addEventListener("click",async t=>{const e=t.target.closest("[data-rm]");if(e){PH.splice(+e.dataset.rm,1);return drawPh()}const a=t.target.closest(".ph img");if(a&&a.src){window.open(a.src,"_blank");return}const o=t.target.closest("[data-a],#bAdd");if(!o)return;try{if(o.id==="bAdd")return openForm(null);const t=o.dataset.id;if(o.dataset.a==="edit")openForm(t);else if(o.dataset.a==="del"){if(!confirm("این مورد حذف شود؟"))return;await rq("work_log?id=eq."+t,{method:"DELETE",headers:{Prefer:"return=minimal"}});await load()}}catch(t){toast("خطا: "+t.message.slice(0,120))}});["fm","fc"].forEach(t=>$("#"+t).onchange=draw);$("#q").oninput=draw;HSEAuth.ready.then(()=>{ME=HSEAuth.email||"";load().catch(()=>{$("#warn").innerHTML='<div class="card2"><span class="bg wa">جدول ساخته نشده</span> فایل hse_worklog.sql را یک‌بار در Supabase اجرا کنید.</div>'})});</script></body></html>
