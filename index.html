<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSE خوارزمی</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap">
<style>
:root{--bg:#f3f4f7;--c:#fff;--ink:#14213d;--mu:#5b6478;--ln:#dde1ea;--ac:#1f4fd8;--ok:#157a3d;--nc:#c5221f}
@media(prefers-color-scheme:dark){:root{--bg:#0f1524;--c:#182036;--ink:#e8ecf7;--mu:#9aa5bf;--ln:#2a3552;--ac:#6f95ff;--ok:#5fd18a;--nc:#ff7b76}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 Vazirmatn,Tahoma,sans-serif;padding:12px 14px 80px}
#app{max-width:640px;margin:auto}h2{font-size:17px;margin:12px 0 4px}small{color:var(--mu);display:block}
input{width:100%;font:inherit;color:var(--ink);background:var(--c);border:1px solid var(--ln);border-radius:8px;padding:9px;margin-top:8px;min-height:44px}
button{font:inherit;color:var(--ink);background:var(--c);border:1.5px solid var(--ln);border-radius:10px;min-height:46px;cursor:pointer}
.m,.p,.l{display:block;width:100%;margin-top:8px;padding:8px 12px;text-align:right}.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700;text-align:center}.l{border:0;background:none;color:var(--mu);text-align:right}
.q{background:var(--c);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-top:8px}.q.bad{border-color:var(--nc)}.q p{margin:0}
.b{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.b .on{font-weight:700}.on.ok{color:var(--ok);border-color:var(--ok)}.on.nc{color:var(--nc);border-color:var(--nc)}.on.na{color:var(--mu)}.e{color:var(--nc)}
.ph{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.th{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--ln);padding:0}.th img{width:100%;height:100%;object-fit:cover}.th b{position:absolute;top:0;left:0;background:#000a;color:#fff;width:24px;line-height:24px;text-align:center}
.ad{border:1.5px dashed var(--ac);color:var(--ac);padding:0 12px;min-height:44px}.fx{display:flex;gap:8px;align-items:center;margin-top:10px;min-height:44px;font-weight:700}.fx input{width:24px;height:24px;margin:0;min-height:0}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cmp img{width:100%;border-radius:8px;margin-top:4px}.tb{width:100%;border-collapse:collapse;font-size:13px}.tb td,.tb th{border-bottom:1px solid var(--ln);padding:4px;text-align:right}select{font:inherit;padding:6px;margin-top:8px}
#zm{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:9}#zm[hidden]{display:none}#zm img{max-width:96%;max-height:96%}
@media print{.np{display:none!important}body{padding:0;background:#fff;color:#000}}
[hidden]{display:none!important}
.rp{background:#fff;color:#14213d;border:1px solid #dde1ea;border-radius:12px;overflow:hidden;margin-top:10px}.rp small{color:#5b6478}.rh{background:#14213d;color:#fff;padding:16px}.rh h2{margin:0;font-size:18px}.rp .rh small{color:#cbd3e6}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px}.kp div{border:1px solid #dde1ea;border-radius:10px;padding:8px;text-align:center}.kp b{display:block;font-size:22px}.kp span{font-size:12px;color:#5b6478}
.rs{padding:0 12px 12px}.rs h3{font-size:14px;margin:12px 0 6px;border-right:4px solid #1f4fd8;padding-right:8px}.rp .tb th{background:#eef1f8}.bar{height:6px;background:#e3e7f0;border-radius:3px;overflow:hidden;min-width:50px}.bar i{display:block;height:100%;background:#157a3d}
.fd{border:1px solid #dde1ea;border-radius:10px;padding:10px;margin-top:8px;break-inside:avoid}.fd.o{border-right:4px solid #c5221f}.fd.c{border-right:4px solid #157a3d}.fd p{margin:2px 0}
.bg{display:inline-block;font-size:11px;border-radius:999px;padding:0 8px;margin-left:4px;border:1px solid #bbb}.bg.g{color:#157a3d;border-color:#157a3d}.bg.r{color:#c5221f;border-color:#c5221f}
.step{font-weight:700;font-size:13px;margin-top:12px;color:var(--ac)}
@page{size:A4 landscape;margin:0}@media print{body{padding:0;background:#fff}.np{display:none!important}#sl img{width:100%;border-radius:0;margin:0;display:block;page-break-after:always}}
