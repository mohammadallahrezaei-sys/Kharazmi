function shrink(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(res,'image/jpeg',.72)};im.onerror=()=>rej(new Error('فایل عکس نیست'));im.src=u})}
async function up(b){const p=(crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random().toString(36).slice(2))+'.jpg',r=await fetch(URL_+'/storage/v1/object/photos/'+p,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+tok,'Content-Type':'image/jpeg'},body:b});if(!r.ok)throw new Error('آپلود عکس ناموفق بود');return p}
const pimg=async p=>{const r=await fetch(URL_+'/storage/v1/object/authenticated/photos/'+p,{headers:{apikey:KEY,Authorization:'Bearer '+tok}});return URL.createObjectURL(await r.blob())};
const li=()=>document.querySelectorAll('img[data-p]').forEach(async i=>{try{i.src=await pimg(i.dataset.p)}catch(e){}});
const th=a=>(a||[]).map(p=>`<span class=th><img data-a=zoom data-p="${p}"></span>`).join(''),big=a=>(a||[]).map(p=>`<img data-a=zoom data-p="${p}">`).join(''),nm=k=>(M.find(m=>m[0]==k)||[])[1],mn=k=>esc(nm(k));
fi.onchange=async()=>{const fs=[...fi.files].slice(0,4),y=scrollY;fi.value='';if(!FT)return;try{
 if(FT.m=='addph'){for(const f of fs){const a=PH[FT.id]=PH[FT.id]||[];if(a.length<4){const b=await shrink(f);a.push({b,u:URL.createObjectURL(b)})}}form();scrollTo(0,y)}
 else{const ps=[];for(const f of fs)ps.push(await up(await shrink(f)));const[x]=await api('findings?select=photos_after&id=eq.'+FT.id);await api('findings?id=eq.'+FT.id,{method:'PATCH',body:JSON.stringify({photos_after:[...(x.photos_after||[]),...ps]})});await finds();scrollTo(0,y)}}catch(e){alert(e.message)}};
async function finds(){view('<p>در حال بارگذاری…</p>');try{const r=await api('findings?order=status.desc,created_at.desc&limit=200');
 view(`<button class=l data-a=home>‹ بازگشت</button><h2>پیگیری عدم‌انطباق‌ها (${r.filter(x=>x.status=='open').length} باز)</h2>`+(r.map(x=>`<div class="q ${x.status=='open'?'bad':''}"><p>${esc(x.question)}</p><small>${mn(x.module)} · ${esc(x.location)} · ${fd(x.created_at)} · ${esc(x.inspector)}</small>${x.note?`<p>${esc(x.note)}</p>`:''}<small>قبل از اصلاح</small><div class=ph>${th(x.photos_before)}</div><small>پس از اصلاح</small><div class=ph>${th(x.photos_after)}<button class=ad data-a=addaf data-id=${x.id}>+ عکس پس از اصلاح</button></div><label class=fx><input type=checkbox data-a=fix data-id=${x.id} ${x.status=='closed'?'checked':''}> اصلاح شد ${x.closed_at?fd(x.closed_at):''}</label></div>`).join('')||'<p>موردی ثبت نشده است.</p>'));li()}catch(e){alert(e.message)}}
async function rep(d=30){view('<p>در حال تهیه گزارش…</p>');try{
 const s=d?new Date(Date.now()-d*864e5).toISOString():'1970-01-01',[I,F]=await Promise.all([api('inspections?select=module&created_at=gte.'+s+'&limit=5000'),api('findings?created_at=gte.'+s+'&order=status.desc,created_at.desc&limit=500')]);
 const O=F.filter(x=>x.status=='open'),op=O.length,cl=F.length-op,pc=F.length?Math.round(cl/F.length*100):0,bz=d?d+' روز اخیر':'همه',
 R=M.map(m=>[m[1],I.filter(r=>r.module==m[0]).length,F.filter(x=>x.module==m[0]).length,O.filter(x=>x.module==m[0]).length]);
 RT=`گزارش مدیریتی HSE خوارزمی — ${fd(Date.now())}\nبازه: ${bz}\nبازدید ${I.length} | عدم‌انطباق ${F.length} | باز ${op} | اصلاح‌شده ${cl} (${pc}٪)\n\n`+R.filter(r=>r[1]||r[2]).map(r=>`${r[0]}: ${r[1]} بازدید، ${r[2]} عدم‌انطباق، ${r[3]} باز`).join('\n')+'\n\nموارد باز:\n'+(O.map(x=>`- ${nm(x.module)} | ${x.location} | ${x.question}${x.note?' ← '+x.note:''}`).join('\n')||'—');
 const e=encodeURIComponent(RT);
 view(`<div class=np><button class=l data-a=home>‹ بازگشت</button><select id=rd><option value=7>۷ روز اخیر<option value=30>۳۰ روز اخیر<option value=90>۹۰ روز اخیر<option value=0>همه</select></div><h2>گزارش مدیریتی HSE خوارزمی</h2><small>${fd(Date.now())} · ${bz}</small><p>بازدید <b>${I.length}</b> · عدم‌انطباق <b>${F.length}</b> · باز <b>${op}</b> · اصلاح‌شده <b>${cl}</b> (${pc}٪)</p><table class=tb><tr><th>بخش<th>بازدید<th>عدم‌انطباق<th>باز</tr>${R.map(r=>`<tr><td>${r[0]}<td>${r[1]}<td>${r[2]}<td>${r[3]}</tr>`).join('')}</table><h2>جزئیات</h2>`
 +F.map(x=>`<div class="q ${x.status=='open'?'bad':''}"><p>${esc(x.question)}</p><small>${mn(x.module)} · ${esc(x.location)} · ${fd(x.created_at)} · ${x.status=='open'?'باز':'اصلاح شد '+fd(x.closed_at)}</small>${x.note?`<p>${esc(x.note)}</p>`:''}${(x.photos_before||[]).length||(x.photos_after||[]).length?`<div class=cmp><div><small>قبل</small>${big(x.photos_before)}</div><div><small>بعد</small>${big(x.photos_after)}</div></div>`:''}</div>`).join('')
 +`<div class=np><button class=p onclick=print()>چاپ / ذخیره PDF</button><button class=p data-a=cp>کپی متن گزارش</button>${[['t.me/share/url?url=%20&text=','تلگرام'],['wa.me/?text=','واتساپ'],['eitaa.com/share/url?text=','ایتا']].map(([u,t])=>`<a class="l" target=_blank rel=noopener href="https://${u}${e}">ارسال متن در ${t}</a>`).join('')}</div>`);
 $('#rd').value=d;$('#rd').onchange=ev=>rep(+ev.target.value);li()}catch(e){alert(e.message)}}
$('#zm').onclick=()=>$('#zm').hidden=true;
document.onclick=async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,y=scrollY;
 if(a=='login')login();else if(a=='logout')logout();else if(a=='home')home();else if(a=='finds')finds();else if(a=='send')send();
 else if(a=='open'){cur=M.find(m=>m[0]==t.dataset.k);const d=JSON.parse(localStorage.draft||'{}');if(d.k==cur[0]){A=d.A;N=d.N;D.loc=d.loc}else{A={};N={};D.loc=''}form()}
 else if(a=='ans'){A[t.dataset.id]=t.dataset.v;save();form();scrollTo(0,y)}

 else if(a=='addph'||a=='addaf'){FT={id:t.dataset.id,m:a};fi.click()}
 else if(a=='rmph'){PH[t.dataset.id].splice(+t.dataset.j,1);form();scrollTo(0,y)}
 else if(a=='cp')navigator.clipboard.writeText(RT).then(()=>alert('گزارش کپی شد'))
 else if(a=='fix'){try{await api('findings?id=eq.'+t.dataset.id,{method:'PATCH',body:JSON.stringify(t.checked?{status:'closed',closed_at:new Date().toISOString(),closed_by:mail}:{status:'open',closed_at:null,closed_by:null})});await finds();scrollTo(0,y)}catch(e){alert(e.message)}}};
document.oninput=e=>{const t=e.target;if(t.id=='loc')D.loc=t.value;else if(t.dataset.note)N[t.dataset.note]=t.value;else return;save()};
tok?home():loginV();
