<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نرم‌افزار جامع HSE - گسترش فناوری خوارزمی</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<style> body { font-family: 'Vazirmatn', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4">
    <div class="max-w-md w-full mx-auto space-y-4 mt-6">
        
        <!-- هدر و لوگوی خوارزمی -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl text-center">
            <div class="mb-3 flex justify-center">
                <img src="logo.png" alt="گسترش فناوری خوارزمی" class="w-20 h-auto rounded-lg shadow" onerror="this.style.display='none'">
            </div>
            <h1 class="text-xl font-black text-white mb-1">نرم‌افزار جامع HSE</h1>
            <p class="text-xs text-slate-400">سامانه یکپارچه مدیریت ایمنی، بهداشت و تجهیزات</p>
        </div>

        <!-- ویجت هوشمند هشدار عدم‌انطباق‌های باز -->
        <div id="alertWidget" class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 shadow-lg flex items-center justify-between transition-all">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div id="alertIcon" class="w-10 h-10 rounded-xl flex items-center justify-center font-bold text-lg bg-emerald-500/10 text-emerald-400">
                    ✓
                </div>
                <div>
                    <h3 id="alertTitle" class="text-sm font-bold text-white">وضعیت ایمنی کارخانه</h3>
                    <p id="alertDesc" class="text-xs text-slate-400">در حال بررسی عدم‌انطباق‌های باز...</p>
                </div>
            </div>
            <a href="checklists.html" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs transition-colors font-medium">
                مدیریت
            </a>
        </div>

        <!-- ماژول‌های اصلی سامانه -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-3">
            <h2 class="text-sm font-bold text-slate-300 mb-2">ماژول‌های عملیاتی</h2>
            
            <a href="checklists.html" class="block w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold rounded-xl transition-colors shadow-md text-center text-sm">
                📋 ماژول چک‌لیست‌ها و بازرسی
            </a>
            <a href="employees.html" class="block w-full py-3 px-4 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-xl transition-colors text-center text-sm">
                👥 ماژول بانک پرسنل (Supabase)
            </a>
        </div>
    </div>

    <!-- فوتر سامانه و ذکر نام طراح -->
    <footer class="bg-slate-800/50 border-t border-slate-700 text-center py-4 text-xs text-slate-400 mt-8 rounded-xl">
        نرم‌افزار جامع HSE &copy; 2026 - گسترش فناوری خوارزمی | طراح نرم‌افزار: <span class="text-emerald-400 font-bold">محمد اله رضایی</span>
    </footer>

<script>
const URL_ = 'https://priopguwfjawybffarhd.supabase.co', KEY = 'sb_publishable_fKFQePO9qiFhj4qU3Vq4lQ_OAFi7rfu';

async function checkOpenFindings() {
    try {
        const res = await fetch(`${URL_}/rest/v1/findings?status=eq.open&select=id`, {
            headers: { apikey: KEY, Authorization: `Bearer ${KEY}` }
        });
        const data = await res.json();
        const count = data.length || 0;

        const widget = document.getElementById('alertWidget');
        const icon = document.getElementById('alertIcon');
        const title = document.getElementById('alertTitle');
        const desc = document.getElementById('alertDesc');

        if (count > 0) {
            widget.className = "bg-red-950/40 border border-red-500/40 rounded-2xl p-4 shadow-lg flex items-center justify-between transition-all animate-pulse";
            icon.className = "w-10 h-10 rounded-xl flex items-center justify-center font-bold text-lg bg-red-500/20 text-red-400";
            icon.innerHTML = "⚠️";
            title.innerHTML = `هشدار: ${count} مورد عدم‌انطباق باز`;
            desc.innerHTML = "نیازمند پیگیری، اعلان و اقدام اصلاحی فوری";
        } else {
            widget.className = "bg-emerald-950/30 border border-emerald-500/30 rounded-2xl p-4 shadow-lg flex items-center justify-between transition-all";
            icon.className = "w-10 h-10 rounded-xl flex items-center justify-center font-bold text-lg bg-emerald-500/20 text-emerald-400";
            icon.innerHTML = "✓";
            title.innerHTML = "وضعیت ایمنی مطلوب";
            desc.innerHTML = "هیچ عدم‌انطباق باز و معلقی وجود ندارد.";
        }
    } catch (e) {
        document.getElementById('alertDesc').innerHTML = "آماده‌به‌کار (متصل به دیتابیس)";
    }
}

checkOpenFindings();
</script>
</body>
</html>
