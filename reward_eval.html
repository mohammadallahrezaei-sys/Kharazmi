<!doctype html><html lang="fa" dir="rtl"><head><meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"><meta charset="utf-8"><script src="auth.js" data-roles="manager"></script><script src="report_tabs.js" defer="defer"></script><script src="hse_nav.js" defer="defer"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>شایستگی تشویق پرسنل</title><link rel="stylesheet" href="hse_ui.css"><style>.np{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.np select{width:auto}.np a:not(.btn){color:var(--ac)}:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--ok:#059669;--wa:#d97706;--bad:#dc2626;--ac:#0f766e}@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--bd:#334155;--ok:#34d399;--wa:#fbbf24;--bad:#f87171;--ac:#2dd4bf}}*{box-sizing:border-box}body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.8}.w{max-width:1000px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 8px;color:var(--ac)}button,select{font-family:inherit;font-size:13px;padding:6px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;overflow-x:auto}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.k{border:1px solid var(--bd);border-radius:10px;padding:8px 10px}.k b{display:block;font-size:22px}.k span{font-size:12px;color:var(--mu)}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:4px 6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}.c{text-align:center}.mu{color:var(--mu);font-size:12px}.ok{color:var(--ok)}.wa{color:var(--wa)}.bad{color:var(--bad)}@media print{body{background:#fff;color:#000}.np{display:none}}</style></head><body><div class="w"><div class="top"><div><h1>شایستگی تشویق پرسنل</h1><div class="mu">مدل هم‌خانواده با «واحد نمونه»: ایمنی × مشارکت</div></div><div class="np"><select id="psel"></select> <button onclick="print();">چاپ / PDF</button> <a href="index.html">← صفحه اصلی</a> <a href="report.html">گزارش مدیریتی</a></div></div><div id="out" class="card">در حال دریافت اطلاعات...</div></div><script src="eval_core.js"></script><script>const P={SAFETY_T:80,PART_T:20,PEN:{verbal:10,written:40,minor:10,major:50},TIER:t=>t<=0?0:t===1?3:t===2?6:t===3?8:10};const{fa:fa,esc:esc,jk:jk,getAll:getAll,norm:norm,MN:MN}=HSE;let B=null;const QN=["بهار","تابستان","پاییز","زمستان"];function periods(){const t=HSE.monthKeys(12),e=t.slice(0,6).map(t=>[t,[t],HSE.monthLabel(t)]);let[s,a]=HSE.nowK().split("-").map(Number),n=Math.ceil(a/3);for(let t=0;t<4;t++){const t=[0,1,2].map(t=>s+"-"+String((n-1)*3+1+t).padStart(2,"0"));e.push(["q"+s+n,t,"فصل "+QN[n-1]+" "+fa(s)]);if(--n<1){n=4;s--}}return e}async function load(){const[t,e,s,a,n,r]=await Promise.all(["employees?select=*","hse_cards?select=*","trainings?select=id,training_type,training_date","training_attendees?select=training_id,employee_id","ekhtars?select=record_type,record_date,employee_id","clinic_incidents?select=incident_date,severity,employee_id"].map(getAll));B={emp:t||[],cards:e||[],tr:s||[],ta:a||[],ek:n||[],inc:r||[],miss:[["employees",t],["hse_cards",e],["trainings",s],["ekhtars",n]].filter(t=>t[1]==null).map(t=>t[0])};const i=periods(),c=document.getElementById("psel");c.innerHTML=i.map(t=>`<option value="${t[0]}">${t[2]}</option>`).join("");c.onchange=()=>render(i.find(t=>t[0]===c.value));render(i[0])}function calc(t){const e=e=>t.includes(jk(e)),s=B.cards[0]&&Object.keys(B.cards[0]).find(t=>/^(employee_id|emp_id|reporter_id|reported_by|reporter|submitted_by|person_id|employee|reporter_name|employee_name)$/i.test(t));const a=B.emp[0]&&Object.keys(B.emp[0]).find(t=>/^(name|full_name|fullname|employee_name)$/i.test(t));const n=t=>a&&t[a]||((t.first_name||"")+" "+(t.last_name||"")).trim()||String(t.id);const r={},i={};B.emp.forEach(t=>{r[String(t.id)]=t;i[norm(n(t))]=t});const c={};const l=HSE.monthRange(t.slice().sort().pop()).b;B.emp.filter(t=>HSEP.isActive(t,l)).forEach(t=>c[t.id]={e:t,name:n(t),hz:0,nm:0,sg:0,talks:new Set,trn:new Set,vb:0,wr:0,mi:0,mj:0,rw:0});if(s)B.cards.filter(t=>t.status!=="rejected"&&e(t.card_date)).forEach(t=>{const e=t[s],a=r[String(e)]||i[norm(e)];if(!a)return;const n=c[a.id];if(t.card_type==="hazard"||t.card_type==="health_hazard")n.hz++;else if(t.card_type==="near_miss")n.nm++;else if(t.card_type==="suggestion")n.sg++});const d={};B.tr.filter(t=>e(t.training_date)).forEach(t=>d[t.id]=t);B.ta.forEach(t=>{const e=d[t.training_id],s=c[t.employee_id];if(!e||!s)return;(e.training_type==="safety_talk"?s.talks:s.trn).add(t.training_id)});B.ek.filter(t=>e(t.record_date)&&c[t.employee_id]).forEach(t=>{const e=c[t.employee_id];if(t.record_type==="تشویق")e.rw++;else if(t.record_type==="اخطار کتبی")e.wr++;else e.vb++});B.inc.filter(t=>e(t.incident_date)&&c[t.employee_id]).forEach(t=>{const e=c[t.employee_id];if(t.severity==="minor")e.mi++;else e.mj++});const o=Object.values(c).map(t=>{const e=P.TIER,s={hz:e(t.hz),nm:e(t.nm),sg:e(t.sg),tk:e(t.talks.size),tr:e(t.trn.size)};const a=Math.min(100,(s.hz+s.nm+s.sg+s.tk+s.tr)/50*100);const n=Math.max(0,100-t.vb*P.PEN.verbal-t.wr*P.PEN.written-t.mi*P.PEN.minor-t.mj*P.PEN.major);const r=t.wr===0&&t.mj===0&&n>=P.SAFETY_T&&a>=P.PART_T;return{...t,tk:t.talks.size,tn:t.trn.size,safety:n,part:a,elig:r,score:r?Math.sqrt(n*a):0}});return{rows:o,ck:s}}function render(t){if(B.miss.length){out.innerHTML=`<div class="bad">دریافت این جدول‌ها ممکن نشد: ${B.miss.join("، ")}</div>`;return}const{rows:e,ck:s}=calc(t[1]),a=e.filter(t=>t.elig).sort((t,e)=>e.score-t.score),n=a.filter(t=>!t.rw),r=e.filter(t=>!t.elig&&t.rw),i=e.filter(t=>t.rw).length;const c=(t,e,s)=>`<div class="k"><b class="${s||""}">${fa(t)}</b><span>${e}</span></div>`;const l=(t,e)=>`<tr><td>${esc(t.name)}</td><td class="c">${fa(t.hz)}</td><td class="c">${fa(t.nm)}</td><td class="c">${fa(t.sg)}</td><td class="c">${fa(t.tk)}</td><td class="c">${fa(t.tn)}</td>\n    <td class="c ${t.vb+t.wr+t.mi+t.mj?"bad":""}">${fa(t.vb)}/${fa(t.wr)}</td><td class="c">${fa(t.mi+t.mj)}</td><td class="c">${fa(Math.round(t.safety))}</td><td class="c">${fa(Math.round(t.part))}</td><td class="c">${fa(Math.round(t.score))}</td><td>${e}</td></tr>`;const d='<tr><th>نام</th><th class="c">خطر</th><th class="c">شبه‌حادثه</th><th class="c">پیشنهاد</th><th class="c">گفتگوی ایمنی</th><th class="c">آموزش</th><th class="c">تذکر/اخطار</th><th class="c">حادثه</th><th class="c">ایمنی</th><th class="c">مشارکت</th><th class="c">امتیاز</th><th>وضعیت</th></tr>';out.outerHTML=`<div id="out">\n  ${s?`<div class="mu" style="margin-bottom:8px">ستون گزارش‌دهنده‌ی کارت‌ها: <b>${esc(s)}</b> (اگر درست نیست، در کد تغییر دهید)</div>`:`<div class="card wa">⚠ جدول hse_cards ستونی برای «گزارش‌دهنده» ندارد (کارت‌ها فقط به واحد وصل‌اند). تا این ستون اضافه نشود، خطر/شبه‌حادثه/پیشنهاد صفر حساب می‌شود و فقط آموزش و رفتار ایمن اثر دارد.</div>`}\n  <div class="card"><div class="g">${c(e.length,"پرسنل")}${c(a.length,"واجد شرایط تشویق","ok")}${c(i,"تشویق ثبت‌شده")}${c(n.length,"شایسته ولی تشویق ثبت‌نشده",n.length?"wa":"ok")}${c(r.length,"تشویق بدون احراز معیار",r.length?"bad":"ok")}</div></div>\n  <div class="card"><h2>واجدین شرایط (رتبه‌بندی)</h2>${a.length?`<table>${d}${a.map(t=>l(t,t.rw?'<span class="ok">✓ تشویق شده</span>':'<span class="wa">⏳ ثبت نشده</span>')).join("")}</table>`:'<div class="mu">در این دوره فردی معیارها را کسب نکرده است.</div>'}</div>\n  ${r.length?`<div class="card"><h2>تشویق ثبت‌شده بدون احراز معیار</h2><table>${d}${r.map(t=>l(t,'<span class="bad">⚠ بررسی شود</span>')).join("")}</table></div>`:""}\n  <div class="card mu">معیار: <b>ایمنی</b> = ۱۰۰ منهای ${fa(P.PEN.verbal)} به ازای هر تذکر، ${fa(P.PEN.written)} هر اخطار کتبی، ${fa(P.PEN.minor)} هر حادثه‌ی جزئی و ${fa(P.PEN.major)} هر حادثه‌ی غیرجزئی. <b>مشارکت</b> = مجموع امتیاز (حداکثر ۱۰ برای هر یک) از خطر، شبه‌حادثه، پیشنهاد، گفتگوی ایمنی و سایر آموزش‌ها، از ۵۰. <b>شرط ورود</b>: ایمنی ≥ ${fa(P.SAFETY_T)}، مشارکت ≥ ${fa(P.PART_T)}، بدون اخطار کتبی و بدون حادثه‌ی غیرجزئی. <b>امتیاز</b> = جذر(ایمنی × مشارکت)، مثل واحد نمونه. کارت‌های ردشده شمرده نمی‌شوند. ستون تذکر/اخطار به شکل «تذکر/اخطار کتبی» است.</div></div>`}load();</script></body></html>
