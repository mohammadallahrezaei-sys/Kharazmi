<!doctype html><html lang="fa" dir="rtl"><head><meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"><script src="auth.js"></script><script src="hse_nav.js" defer="defer"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دستورالعمل ارزیابی ریسک - نرم‌افزار جامع HSE</title><link rel="stylesheet" href="hse_ui.css"><style>.doc{max-width:900px;margin:0 auto;line-height:2;font-size:14px}.doc h2{font-size:16px;margin:22px 0 6px;padding-top:10px;border-top:1px solid var(--bd)}.doc h3{font-size:14px;margin:14px 0 4px}.doc table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}.doc td,.doc th{border:1px solid var(--bd);padding:5px 8px;text-align:right;vertical-align:top}.doc th{background:var(--soft)}.src{display:inline-block;font-size:11px;padding:0 8px;border-radius:99px;border:1px solid var(--bd);margin-inline-start:6px;white-space:nowrap}.src.co{border-color:#38bdf8;color:#38bdf8}.src.chem{border-color:#34d399;color:#34d399}.src.rec{border-color:#fbbf24;color:#fbbf24}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}.steps li{margin:6px 0}.cc td:first-child{width:28%;background:var(--soft);font-weight:700}@media print{#nav,.noprint,.top{display:none!important}.doc{max-width:none}body{background:#fff;color:#000}}</style></head><body><div class="w"><div class="top"><div><h1>📘 دستورالعمل ارزیابی و مدیریت ریسک</h1><p>متن دستورالعمل و جدول‌ها از همان منبعی ساخته می‌شود که فرم «ثبت ریسک» استفاده می‌کند</p></div><div class="noprint" style=""><button id="bPrint" class="p">🖨 چاپ / ذخیرهٔ PDF</button><a class="btn" href="risks.html">← ثبت ریسک</a></div></div><div class="doc" id="doc"><div class="card">در حال بارگذاری...</div></div></div><script src="eval_core.js"></script><script src="risk_plan.js?v=3"></script><script src="chem_data.js"></script><script src="risk_std.js"></script><script>const{esc:esc,fa:fa,getAll:getAll}=HSE,S=HSERiskStd,P=HSERiskPlan,$=t=>document.getElementById(t);let PR=null;const PST={planned:"برنامه‌ریزی‌شده",drafting:"در حال تدوین",review:"در حال بررسی",approved:"ابلاغ‌شده"};const tag=t=>`<span class="src ${t}">${S.SRC[t]}</span>`;const ol=(t,e)=>t.map((t,e)=>e?`<tr><td>${fa(e)}</td><td>${esc(t)}</td></tr>`:"").join("");const dot=t=>`<span class="dot" style="background:${t}"></span>`;function scaleTable(){return`<table><tr><th>امتیاز</th><th>شدت (S)</th><th>احتمال وقوع (O)</th></tr>${S.SEV10.map((t,e)=>e?`<tr><td>${fa(e)}</td><td>${esc(S.SEV10[e])}</td><td>${esc(S.OCC10[e])}</td></tr>`:"").join("")}</table>`}function hazopTable(){return`<table><tr><th>امتیاز</th><th>شدت</th><th>احتمال</th></tr>${[1,2,3,4,5].map(t=>`<tr><td>${fa(t)}</td><td>${esc(S.SEV5[t])}</td><td>${esc(S.LIK5[t])}</td></tr>`).join("")}</table>`}function threshTable(){return`<table><tr><th>روش</th><th>شرط</th><th>سطح</th><th>منبع</th></tr>`+Object.keys(S.THRESH).map(t=>S.THRESH[t].map((e,a)=>`<tr>${a?"":`<td rowspan="${S.THRESH[t].length}"><b>${S.MN[t]}</b></td>`}<td>${esc(e[0])}</td><td>${dot(e[2])}${esc(e[1])}</td><td>${a?"":tag("co")}</td></tr>`).join("")).join("")+`</table>`}function methodTable(){return`<table><tr><th>موضوع / دسته</th><th>روش</th><th>توضیح</th><th>منبع</th></tr>${S.METHOD_RULES.map(t=>`<tr><td>${esc(t[0])}</td><td><b>${esc(t[1])}</b></td><td>${esc(t[2])}</td><td>${t[3]===S.SRC.co?tag("co"):tag("chem")}</td></tr>`).join("")}</table>`}function chemTables(){const t=S.CHEM,e=(t,e)=>`<h3>${t}</h3><table><tr><th>شاخص</th><th>شرح</th></tr>${e.filter(t=>t[1]!=null).map(t=>`<tr><td>${fa(t[1])}</td><td>${esc(t[0])}</td></tr>`).join("")}</table>`;return`<h3>درجه خطر ماده (HR)</h3><table><tr><th>HR</th><th>توصیف اثرات</th></tr>${t.HR.map((t,e)=>e?`<tr><td>${fa(e)}</td><td>${esc(t)}</td></tr>`:"").join("")}</table>`+e("شاخص فشار بخار (مایعات و گازها)",t.vp)+e("شاخص اندازهٔ ذرات (جامدات)",t.size)+e("شاخص نسبت آستانهٔ بویایی به حد مجاز مواجهه",t.odor)+e("شاخص اقدامات کنترلی موجود",t.ctrl)+e("شاخص مدت مواجهه در هفته",t.dur)+e("شاخص مقدار مصرف در هفته",t.qty)}function chemLevelTable(){return`<table><tr><th>√(HR×ER)</th><th>سطح</th><th>اقدام پیگیری</th></tr>${[["< ۱٫۵",1],["۱٫۵ تا < ۲٫۵",2],["۲٫۵ تا < ۳٫۵",3],["۳٫۵ تا < ۴٫۵",4],["≥ ۴٫۵",5]].map(([t,e])=>{const a=S.chemClass(e);return`<tr><td>${t}</td><td>${dot(a.c)}${esc(a.t)}</td><td>${a.mon?"درخواست پایش هوا / اندازه‌گیری مواد شیمیایی":"نیازی به پایش هوا نیست"}</td></tr>`}).join("")}</table>`}function reviewTable(){const t=S.DEF;return`<table><tr><th>سطح ریسک</th><th>بازبینی دوره‌ای</th><th>مهلت اقدام اصلاحی</th><th>منبع</th></tr>${["high","mid","low"].map(e=>`<tr><td>${S.LEVEL_NAME[e]}</td><td>حداکثر ${fa(t.reviewMonths[e])} ماه</td><td>${fa(t.actionDays[e])} روز</td><td>${tag("rec")}</td></tr>`).join("")}</table>`}function body(){return`\n<table class="cc"><tr><td>عنوان سند</td><td>دستورالعمل ارزیابی و مدیریت ریسک ایمنی، بهداشت شغلی، ارگونومی و محیط زیست</td></tr>\n<tr><td>شماره سند</td><td>${PR&&PR.doc_no?esc(PR.doc_no):"(در «برنامهٔ دستورالعمل‌ها» تعیین شود)"}</td></tr><tr><td>ویرایش / وضعیت</td><td>۰۱ — ${PR?esc(PST[PR.status]||PR.status)+(PR.status!=="approved"&&PR.target_date?" · موعد تدوین: "+esc(new Date(String(PR.target_date).slice(0,10)+"T12:00:00Z").toLocaleDateString("fa-IR",{dateStyle:"medium",timeZone:"UTC"})):"")+(PR.owner?" · مسئول: "+esc(PR.owner):""):"پیش‌نویس برای تأیید مدیر HSE"} <span class="noprint">— <a href="procedures.html">برنامهٔ دستورالعمل‌ها</a>${PR&&HSEAuth.role==="manager"&&(PR.status==="planned"||PR.status==="drafting")?' · <button id="bToReview">ارسال برای بررسی</button>':""}</span></td></tr><tr><td>تاریخ تهیه</td><td>${esc((new Date).toLocaleDateString("fa-IR",{dateStyle:"long"}))}</td></tr>\n<tr><td>تهیه‌کننده / تأیید</td><td>کارشناس HSE / مدیر HSE</td></tr></table>\n<div class="mu noprint">راهنمای منبع هر بند: ${tag("co")} ${tag("chem")} ${tag("rec")} — بندهای «پیشنهادی» تا تأیید مدیر الزام رسمی نیستند؛ مهلت‌ها در <b>risk_std.js</b> (<code>DEF</code>) قابل تغییرند.</div>\n\n<h2>۱. هدف</h2><p>یکسان‌سازی روش شناسایی، ارزیابی، کنترل و بازبینی ریسک‌ها در همهٔ سوله‌ها و واحدها، به‌گونه‌ای که نتیجهٔ ارزیابی‌های افراد و زمان‌های مختلف قابل مقایسه، قابل ممیزی و مبنای تصمیم‌گیری باشد.</p>\n<h2>۲. دامنه</h2><p>همهٔ واحدها و سوله‌های فعال (فهرست «واحدها»)، فعالیت‌های عادی و غیرعادی، تجهیزات و ماشین‌آلات، مواد شیمیایی، فعالیت پیمانکاران و وضعیت‌های اضطراری. ریسک‌ها در پنج گروه دسته‌بندی می‌شوند: ایمنی، بهداشت شغلی، ارگونومی، محیط زیست، اضطراری (و سایر).</p>\n<h2>۳. تعاریف</h2><ul>\n<li><b>خطر:</b> منبع یا وضعیتی با قابلیت ایجاد آسیب. <b>ریسک:</b> ترکیب شدت پیامد و احتمال وقوع آن.</li>\n<li><b>S، O:</b> شدت و احتمال وقوع (۱ تا ۱۰). <b>امتیاز ریسک</b> = S × O (حداکثر ۱۰۰). <i>توجه: معیار «کشف (D)» و شاخص RPN در این ویرایش حذف شده است.</i></li>\n<li><b>ریسک باقیمانده:</b> ریسک پس از اجرای اقدام اصلاحی که با ارزیابی مجدد S/O به‌دست می‌آید.</li>\n<li><b>HR / ER:</b> درجهٔ خطر ماده و میزان مواجهه در روش نیمه‌کمی شیمیایی.</li></ul>\n<h2>۴. مسئولیت‌ها</h2><table><tr><th>نقش</th><th>مسئولیت</th></tr>\n<tr><td>کارشناس HSE</td><td>ارزیابی ریسک‌های <b>ایمنی</b> سوله‌ها طبق برنامه؛ ثبت دقیق خطر، پیامد، علل، کنترل موجود و امتیازها؛ پیگیری اقدام‌ها.</td></tr>\n<tr><td>مدیر HSE</td><td>ارزیابی ریسک‌های <b>بهداشت شغلی و ارگونومی</b>؛ تعیین بازهٔ هر سوله در «برنامهٔ سوله‌ها»؛ تأیید یا بایگانی ریسک‌ها؛ بازگرداندن ارزیابی ناکافی.</td></tr>\n<tr><td>سرپرست واحد / سوله</td><td>همکاری در شناسایی خطر، تأمین دسترسی و اجرای اقدام‌های اصلاحی در مهلت تعیین‌شده.</td></tr>\n<tr><td>مدیریت</td><td>تأمین منابع اقدام‌های اصلاحی با اولویت ریسک‌های بالا.</td></tr></table>\n\n<h2>۵. روش اجرا</h2>\n<h3>۵-۱ برنامه‌ریزی ${tag("rec")}</h3><p>برای هر سوله یک <b>بازهٔ زمانی</b> بر اساس تعداد ماشین‌آلات (تجهیزات ثبت‌شده + اعلان‌ها + عدم‌انطباق‌ها) و تعداد پرسنل در «برنامهٔ سوله‌ها» تعیین می‌شود و در تقویم کاری کارشناس (ایمنی) و مدیر (بهداشتی و ارگونومی) می‌آید.</p>\n<h3>۵-۲ شناسایی خطر ${tag("rec")}</h3><ol class="steps"><li>بازدید حضوری از سوله و گفت‌وگو با سرپرست و اپراتورها.</li><li>مرور منابع موجود: فهرست ماشین‌آلات و اعلان‌های تعمیراتی، عدم‌انطباق‌های بازبینی‌ها، حوادث و شبه‌حوادث، کارت‌های ایمنی، ارزیابی‌های قبلی همان سوله.</li><li>برای هر نوع ماشین از «پیشنهاد ریسک» سامانه استفاده شود؛ پیشنهادها فقط راهنما هستند و نمی‌توانند جای مشاهدهٔ محل را بگیرند.</li><li>خطر به‌صورت «منبع + رویداد» نوشته شود (مثال: «برخورد لیفتراک با عابر در مسیر مشترک»)، نه عبارت کلی مانند «بی‌احتیاطی».</li></ol>\n<h3>۵-۳ انتخاب روش ${tag("co")}</h3>${methodTable()}\n<h3>۵-۴ برآورد ریسک با FMEA ${tag("co")}</h3><p>برای هر خطر، S و O بر اساس جدول زیر انتخاب می‌شود و امتیاز ریسک (S × O) محاسبه می‌شود. امتیازدهی بر اساس «کنترل‌های موجود» انجام می‌شود، نه کنترل‌هایی که قرار است اجرا شوند. اگر شدت، یا احتمال با میانهٔ ارزیابی‌های قبلی همان دسته ۳ امتیاز یا بیشتر اختلاف داشته باشد، ثبت دلیل الزامی است ${tag("rec")}.</p>${scaleTable()}\n<h3>HAZOP ${tag("co")}</h3><p>برای انحراف‌های فرایندی؛ امتیاز = شدت × احتمال (۱ تا ۵).</p>${hazopTable()}\n<h3>۵-۵ سطح ریسک و معیار پذیرش</h3>${threshTable()}\n<p>ریسک «بالا / اولویت‌دار» پذیرفتنی نیست و بدون اقدام اصلاحی (با مسئول و مهلت) ثبت نهایی نمی‌شود ${tag("rec")}.</p>\n<h3>۵-۶ مواجهه با آلاینده‌های شیمیایی (روش نیمه‌کمی) ${tag("chem")}</h3><p>برای موادی که دارای الزام قانونی یا نگرانی بهداشتی هستند: HR از فهرست مواد (۶۱۰ ماده) گرفته می‌شود؛ شاخص‌های مواجهه (فشار بخار یا اندازهٔ ذرات، نسبت آستانهٔ بویایی به حد مجاز، اقدام کنترلی، مدت مواجهه، مقدار مصرف) انتخاب می‌شود. <b>ER</b> = میانگین هندسی شاخص‌های موجود (شاخص‌های در دسترس‌نبودن حذف می‌شوند) و <b>سطح ریسک</b> = √(HR × ER).</p>${chemLevelTable()}\n<p>برای هر ماده، نیاز به معاینات سلامت شغلی هم از فهرست مواد مشخص می‌شود. ماشین‌حساب زیر همان محاسبهٔ کاربرگ را انجام می‌دهد.</p>\n<div class="card noprint" id="chemCalc"></div>\n<details class="noprint"><summary class="mu" style="cursor:pointer">جدول‌های کامل شاخص‌های روش شیمیایی</summary>${chemTables()}</details>\n<h3>۵-۷ تعیین کنترل ${tag("rec")}</h3><p>اقدام اصلاحی بر اساس سلسله‌مراتب کنترل انتخاب می‌شود: <b>حذف خطر ← جایگزینی ← کنترل مهندسی ← کنترل اداری ← وسایل حفاظت فردی</b>. برای ریسک بالا، کنترل اداری یا PPE به‌تنهایی کافی نیست مگر اینکه دلیل ناممکن بودن سطوح بالاتر ثبت شود. برای هر اقدام: شرح، نوع اقدام، مسئول و مهلت ثبت می‌شود.</p>\n<h3>۵-۸ ارزیابی مجدد (ریسک باقیمانده) ${tag("co")}</h3><p>پس از اجرای اقدام، S/O مجدداً امتیازدهی می‌شود. ریسک باقیمانده باید کمتر از ریسک اولیه باشد؛ در غیر این صورت اقدام مؤثر نبوده و بازنگری می‌شود.</p>\n<h3>۵-۹ تأیید و ثبت ${tag("co")}</h3><p>ریسک ثبت‌شده توسط کارشناس «در انتظار تأیید» می‌ماند تا مدیر تأیید کند؛ ویرایش ریسک تأییدشده آن را دوباره به این وضعیت برمی‌گرداند.</p>\n<h3>۵-۱۰ بازبینی دوره‌ای ${tag("rec")}</h3>${reviewTable()}<p>ریسک‌ها در موارد زیر خارج از دوره بازبینی می‌شوند: وقوع حادثه یا شبه‌حادثه مرتبط، تغییر در ماشین‌آلات، فرایند یا مواد، و عدم‌انطباق مکرر در همان سوله.</p>\n<h3>۵-۱۱ ارتباط با سایر فرایندها ${tag("co")}</h3><p>ریسک می‌تواند به عدم‌انطباق‌ها، حوادث و کارت‌های ایمنی پیوند بخورد؛ حادثه‌ای که برای آن ریسک «پایین» ثبت شده بود، نشانهٔ نیاز به بازبینی ارزیابی است.</p>\n\n<h2>۶. مستندات و سوابق</h2><p>سوابق در سامانه نگهداری می‌شود: متن ریسک، امتیازها، کنترل‌ها، تاریخ ارزیابی و بازبینی، تأیید مدیر و پیوند به عدم‌انطباق/حادثه. گزارش انطباق زیر برای ممیزی استفاده می‌شود.</p>\n\n<h2>۷. شاخص‌های پایش (زنده از داده‌های سامانه)</h2><div id="kpi" class="card">در حال محاسبه...</div>\n<p class="mu">تهیه‌شده از منطق سامانه و اسناد قبلی. قبل از ابلاغ رسمی، بندهای «پیشنهادی» را مدیر HSE تأیید یا اصلاح کند و شماره سند اختصاص یابد.</p>`}const f2=t=>fa(t.toFixed(2)).replace(".","٫");function chemCalc(){const t=S.CHEM,e=(t,e)=>`<select id="${t}" class="fld">${e.map((t,e)=>`<option value="${e}">${esc(t[0])}</option>`).join("")}</select>`;$("chemCalc").innerHTML=`<b>ماشین‌حساب ارزیابی مواجهه شیمیایی</b><div class="g2" style="margin-top:6px"><div><label class="l">نام ماده (از فهرست)</label><input id="cN" list="cL" type="text" placeholder="مثلاً: اسید سولفوریک"><datalist id="cL">${(window.HSEChemList||[]).map(t=>`<option value="${esc(t[0])}">`).join("")}</datalist></div>\n  <div><label class="l">حالت فیزیکی</label><select id="cF"><option value="l">مایع / گاز</option><option value="s">جامد (گرد و غبار)</option></select></div></div>\n  <div id="cMan" class="g3" style="display:none;margin-top:6px"><div><label class="l">HR (ماده در فهرست نیست)</label><select id="cHR">${[1,2,3,4,5].map(t=>`<option value="${t}">${fa(t)}</option>`).join("")}</select></div><div><label class="l">شاخص فشار بخار</label>${e("cVP",t.vp)}</div><div><label class="l">شاخص نسبت بویایی/حد مجاز</label>${e("cOD",t.odor)}</div></div>\n  <div class="g3" style="margin-top:6px"><div id="cSzW" style="display:none"><label class="l">اندازهٔ ذرات</label>${e("cSZ",t.size)}</div><div><label class="l">اقدام کنترلی موجود</label>${e("cCT",t.ctrl)}</div><div><label class="l">مدت مواجهه در هفته</label>${e("cDU",t.dur)}</div><div><label class="l">مقدار مصرف در هفته</label>${e("cQT",t.qty)}</div></div>\n  <div id="cOut" style="margin-top:10px"></div>`;const a=(t,e)=>{const a=t[+$(e).value];return a?a[1]:null};const l=()=>{const e=S.chemFind($("cN").value),l=$("cF").value==="s";$("cMan").style.display=$("cN").value.trim()&&!e?"":"none";$("cSzW").style.display=l?"":"none";let n,d,c;if(e){n=e[1];d=l?null:e[2];c=e[3]}else{n=+$("cHR").value;d=l?null:a(t.vp,"cVP");c=a(t.odor,"cOD")}const s=[d,l?a(t.size,"cSZ"):null,c,a(t.ctrl,"cCT"),a(t.dur,"cDU"),a(t.qty,"cQT")],i=S.chemER(s),r=S.chemQ(n,i),o=S.chemClass(r);$("cOut").innerHTML=!$("cN").value.trim()?'<span class="mu">نام ماده را انتخاب کنید.</span>':o?`<div class="card" style="border-color:${o.c}"><b>HR = ${fa(n)}</b> · شاخص‌های به‌کاررفته: ${s.filter(t=>typeof t==="number").map(fa).join("، ")||"—"} · <b>ER = ${f2(i)}</b> · <b>√(HR×ER) = ${f2(r)}</b><div style="margin-top:6px">${dot(o.c)}<b>سطح ریسک: ${o.t}</b> — ${o.mon?"درخواست پایش هوا / اندازه‌گیری مواد شیمیایی":"نیازی به پایش هوا نیست"}${e?` · معاینات سلامت شغلی: <b>${e[4]?"ضروری است":"ضروری نیست"}</b>`:""}</div>${e?"":'<div class="mu">ماده در فهرست نیست؛ HR و شاخص‌ها را دستی وارد کردید.</div>'}</div>`:'<span class="mu">شاخص کافی برای محاسبه نیست.</span>'};$("chemCalc").addEventListener("input",l);$("chemCalc").addEventListener("change",l);l()}async function kpi(){let t=null;try{t=await getAll("risks?select=*")}catch(t){}let e=null;try{e=await getAll("hse_units?select=id,name,aliases,active")}catch(t){}if(!t){$("kpi").textContent="جدول ریسک خوانده نشد.";return}const a=HSEToday(),l=t.filter(t=>t.status!=="archived");const n=t=>({...t,score:t.score||(t.method==="fmea"?S.calc("fmea",t.severity,t.likelihood):t.manual_score)});const d=l.map(n),c={};let s=0,i=0,r=0,o=0;d.forEach(t=>{const e=S.lvl(t),l=S.check(t,{isNew:false,today:a});if(e.h){s++;if(!(t.planned_controls||"").trim())i++}if(t.review_date&&t.review_date<a)r++;if(!l.length)o++;l.forEach(t=>c[t.msg]=(c[t.msg]||0)+1)});const h=d.length?Math.round(o*100/d.length):0,b=P.counts(e||[],l),p=P.activeUnits(e||[]);const u=t=>p.length?p.filter(e=>(b[e.id+"|"+t]||0)>0).length:0;$("kpi").innerHTML=`<table><tr><th>شاخص</th><th>مقدار</th></tr>\n   <tr><td>ریسک‌های فعال ثبت‌شده</td><td>${fa(d.length)}</td></tr>\n   <tr><td>مطابق کامل با دستورالعمل (بدون هیچ مورد ناانطباقی)</td><td><b>${fa(h)}٪</b> (${fa(o)} از ${fa(d.length)})</td></tr>\n   <tr><td>ریسک بالا/اولویت‌دار</td><td>${fa(s)} — بدون اقدام اصلاحی: <b class="${i?"bad":"ok"}">${fa(i)}</b></td></tr>\n   <tr><td>بازبینی معوق</td><td><b class="${r?"bad":"ok"}">${fa(r)}</b></td></tr>\n   <tr><td>پوشش سوله‌ها</td><td>ایمنی ${fa(u("safety"))} از ${fa(p.length)} · بهداشتی ${fa(u("health"))} از ${fa(p.length)} · ارگونومی ${fa(u("ergo"))} از ${fa(p.length)}</td></tr></table>\n   ${Object.keys(c).length?`<h3>شایع‌ترین موارد ناانطباقی</h3><table><tr><th>مورد</th><th>تعداد</th></tr>${Object.entries(c).sort((t,e)=>e[1]-t[1]).slice(0,8).map(([t,e])=>`<tr><td>${esc(t)}</td><td>${fa(e)}</td></tr>`).join("")}</table>`:'<div class="ok">همهٔ ریسک‌ها با دستورالعمل مطابق‌اند.</div>'}`}HSEAuth.ready.then(async()=>{try{const t=await getAll("hse_procedures?select=*");PR=(Array.isArray(t)?t:[]).find(t=>t.active!==false&&/ارزیابی ریسک/.test(t.title||""))||null}catch(t){}$("doc").innerHTML=body();chemCalc();kpi();$("bPrint").onclick=()=>window.print();const t=$("bToReview");if(t)t.onclick=async()=>{if(!confirm("وضعیت این دستورالعمل در «برنامهٔ دستورالعمل‌ها» به «در حال بررسی» تغییر کند؟ (ابلاغ نهایی از همان صفحه انجام می‌شود)"))return;try{await HSE.req("hse_procedures?id=eq."+PR.id,"PATCH",{status:"review"},"return=minimal");PR.status="review";$("doc").innerHTML=body();chemCalc();kpi()}catch(t){alert("خطا: "+t.message)}}});</script></body></html>
