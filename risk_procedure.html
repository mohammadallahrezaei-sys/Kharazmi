<script>
const {esc,fa,getAll}=HSE,S=HSERiskStd,P=HSERiskPlan,$=id=>document.getElementById(id);
const tag=k=>`<span class="src ${k}">${S.SRC[k]}</span>`;
const ol=(a,n)=>a.map((t,i)=>i?`<tr><td>${fa(i)}</td><td>${esc(t)}</td></tr>`:'').join('');
const dot=c=>`<span class="dot" style="background:${c}"></span>`;

function scaleTable(){return `<table><tr><th>امتیاز</th><th>شدت (S)</th><th>احتمال وقوع (O)</th><th>کشف (D)</th></tr>${S.SEV10.map((_,i)=>i?`<tr><td>${fa(i)}</td><td>${esc(S.SEV10[i])}</td><td>${esc(S.OCC10[i])}</td><td>${esc(S.DET10[i])}</td></tr>`:'').join('')}</table>`}
function hazopTable(){return `<table><tr><th>امتیاز</th><th>شدت</th><th>احتمال</th></tr>${[1,2,3,4,5].map(i=>`<tr><td>${fa(i)}</td><td>${esc(S.SEV5[i])}</td><td>${esc(S.LIK5[i])}</td></tr>`).join('')}</table>`}
function threshTable(){return `<table><tr><th>روش</th><th>شرط</th><th>سطح</th><th>منبع</th></tr>`+Object.keys(S.THRESH).map(m=>S.THRESH[m].map((r,i)=>`<tr>${i?'':`<td rowspan="${S.THRESH[m].length}"><b>${S.MN[m]}</b></td>`}<td>${esc(r[0])}</td><td>${dot(r[2])}${esc(r[1])}</td><td>${i?'':tag('co')}</td></tr>`).join('')).join('')+`</table>`}
function methodTable(){return `<table><tr><th>موضوع / دسته</th><th>روش</th><th>توضیح</th><th>منبع</th></tr>${S.METHOD_RULES.map(r=>`<tr><td>${esc(r[0])}</td><td><b>${esc(r[1])}</b></td><td>${esc(r[2])}</td><td>${r[3]===S.SRC.co?tag('co'):tag('chem')}</td></tr>`).join('')}</table>`}
function chemTables(){const C=S.CHEM,t=(h,a)=>`<h3>${h}</h3><table><tr><th>شاخص</th><th>شرح</th></tr>${a.filter(x=>x[1]!=null).map(x=>`<tr><td>${fa(x[1])}</td><td>${esc(x[0])}</td></tr>`).join('')}</table>`;
  return `<h3>درجه خطر ماده (HR)</h3><table><tr><th>HR</th><th>توصیف اثرات</th></tr>${C.HR.map((x,i)=>i?`<tr><td>${fa(i)}</td><td>${esc(x)}</td></tr>`:'').join('')}</table>`+t('شاخص فشار بخار (مایعات و گازها)',C.vp)+t('شاخص اندازهٔ ذرات (جامدات)',C.size)+t('شاخص نسبت آستانهٔ بویایی به حد مجاز مواجهه',C.odor)+t('شاخص اقدامات کنترلی موجود',C.ctrl)+t('شاخص مدت مواجهه در هفته',C.dur)+t('شاخص مقدار مصرف در هفته',C.qty)}
function chemLevelTable(){return `<table><tr><th>√(HR×ER)</th><th>سطح</th><th>اقدام پیگیری</th></tr>${[['< ۱٫۵',1],['۱٫۵ تا < ۲٫۵',2],['۲٫۵ تا < ۳٫۵',3],['۳٫۵ تا < ۴٫۵',4],['≥ ۴٫۵',5]].map(([r,n])=>{const c=S.chemClass(n);return `<tr><td>${r}</td><td>${dot(c.c)}${esc(c.t)}</td><td>${c.mon?'درخواست پایش هوا / اندازه‌گیری مواد شیمیایی':'نیازی به پایش هوا نیست'}</td></tr>`}).join('')}</table>`}

function reviewTable(){const D=S.DEF;return `<table><tr><th>سطح ریسک</th><th>بازبینی دوره‌ای</th><th>مهلت اقدام اصلاحی</th><th>منبع</th></tr>${['high','mid','low'].map(k=>`<tr><td>${S.LEVEL_NAME[k]}</td><td>حداکثر ${fa(D.reviewMonths[k])} ماه</td><td>${fa(D.actionDays[k])} روز</td><td>${tag('rec')}</td></tr>`).join('')}</table>`}

function body(){return `
<table class="cc"><tr><td>عنوان سند</td><td>دستورالعمل ارزیابی و مدیریت ریسک ایمنی، بهداشت شغلی، ارگونومی و محیط زیست</td></tr>
<tr><td>شماره سند</td><td>(توسط مدیر / واحد کنترل مدارک تعیین شود)</td></tr><tr><td>ویرایش / وضعیت</td><td>۰۱ — پیش‌نویس برای تأیید مدیر HSE</td></tr><tr><td>تاریخ تهیه</td><td>${esc(new Date().toLocaleDateString('fa-IR',{dateStyle:'long'}))}</td></tr>
<tr><td>تهیه‌کننده / تأیید</td><td>کارشناس HSE / مدیر HSE</td></tr></table>
<div class="mu noprint">راهنمای منبع هر بند: ${tag('co')} ${tag('chem')} ${tag('rec')} — بندهای «پیشنهادی» تا تأیید مدیر الزام رسمی نیستند؛ مهلت‌ها در <b>risk_std.js</b> (<code>DEF</code>) قابل تغییرند.</div>

<h2>۱. هدف</h2><p>یکسان‌سازی روش شناسایی، ارزیابی، کنترل و بازبینی ریسک‌ها در همهٔ سوله‌ها و واحدها، به‌گونه‌ای که نتیجهٔ ارزیابی‌های افراد و زمان‌های مختلف قابل مقایسه، قابل ممیزی و مبنای تصمیم‌گیری باشد.</p>
<h2>۲. دامنه</h2><p>همهٔ واحدها و سوله‌های فعال (فهرست «واحدها»)، فعالیت‌های عادی و غیرعادی، تجهیزات و ماشین‌آلات، مواد شیمیایی، فعالیت پیمانکاران و وضعیت‌های اضطراری. ریسک‌ها در پنج گروه دسته‌بندی می‌شوند: ایمنی، بهداشت شغلی، ارگونومی، محیط زیست، اضطراری (و سایر).</p>
<h2>۳. تعاریف</h2><ul>
<li><b>خطر:</b> منبع یا وضعیتی با قابلیت ایجاد آسیب. <b>ریسک:</b> ترکیب شدت پیامد و احتمال وقوع آن.</li>
<li><b>S، O، D:</b> شدت، احتمال وقوع و احتمال کشف پیش از وقوع (۱ تا ۱۰). <b>RPN</b> = S × O × D.</li>
<li><b>ریسک باقیمانده:</b> ریسک پس از اجرای اقدام اصلاحی که با ارزیابی مجدد S/O/D به‌دست می‌آید.</li>
<li><b>HR / ER:</b> درجهٔ خطر ماده و میزان مواجهه در روش نیمه‌کمی شیمیایی.</li></ul>
<h2>۴. مسئولیت‌ها</h2><table><tr><th>نقش</th><th>مسئولیت</th></tr>
<tr><td>کارشناس HSE</td><td>ارزیابی ریسک‌های <b>ایمنی</b> سوله‌ها طبق برنامه؛ ثبت دقیق خطر، پیامد، علل، کنترل موجود و امتیازها؛ پیگیری اقدام‌ها.</td></tr>
<tr><td>مدیر HSE</td><td>ارزیابی ریسک‌های <b>بهداشت شغلی و ارگونومی</b>؛ تعیین بازهٔ هر سوله در «برنامهٔ سوله‌ها»؛ تأیید یا بایگانی ریسک‌ها؛ بازگرداندن ارزیابی ناکافی.</td></tr>
<tr><td>سرپرست واحد / سوله</td><td>همکاری در شناسایی خطر، تأمین دسترسی و اجرای اقدام‌های اصلاحی در مهلت تعیین‌شده.</td></tr>
<tr><td>مدیریت</td><td>تأمین منابع اقدام‌های اصلاحی با اولویت ریسک‌های بالا.</td></tr></table>

<h2>۵. روش اجرا</h2>
<h3>۵-۱ برنامه‌ریزی ${tag('rec')}</h3><p>برای هر سوله یک <b>بازهٔ زمانی</b> بر اساس تعداد ماشین‌آلات (تجهیزات ثبت‌شده + اعلان‌ها + عدم‌انطباق‌ها) و تعداد پرسنل در «برنامهٔ سوله‌ها» تعیین می‌شود و در تقویم کاری کارشناس (ایمنی) و مدیر (بهداشتی و ارگونومی) می‌آید.</p>
<h3>۵-۲ شناسایی خطر ${tag('rec')}</h3><ol class="steps"><li>بازدید حضوری از سوله و گفت‌وگو با سرپرست و اپراتورها.</li><li>مرور منابع موجود: فهرست ماشین‌آلات و اعلان‌های تعمیراتی، عدم‌انطباق‌های بازبینی‌ها، حوادث و شبه‌حوادث، کارت‌های ایمنی، ارزیابی‌های قبلی همان سوله.</li><li>برای هر نوع ماشین از «پیشنهاد ریسک» سامانه استفاده شود؛ پیشنهادها فقط راهنما هستند و نمی‌توانند جای مشاهدهٔ محل را بگیرند.</li><li>خطر به‌صورت «منبع + رویداد» نوشته شود (مثال: «برخورد لیفتراک با عابر در مسیر مشترک»)، نه عبارت کلی مانند «بی‌احتیاطی».</li></ol>
<h3>۵-۳ انتخاب روش ${tag('co')}</h3>${methodTable()}
<h3>۵-۴ برآورد ریسک با FMEA ${tag('co')}</h3><p>برای هر خطر، S و O و D بر اساس جدول زیر انتخاب می‌شود و RPN محاسبه می‌شود. امتیازدهی بر اساس «کنترل‌های موجود» انجام می‌شود، نه کنترل‌هایی که قرار است اجرا شوند. اگر شدت، یا احتمال با میانهٔ ارزیابی‌های قبلی همان دسته ۳ امتیاز یا بیشتر اختلاف داشته باشد، ثبت دلیل الزامی است ${tag('rec')}.</p>${scaleTable()}
<h3>HAZOP ${tag('co')}</h3><p>برای انحراف‌های فرایندی؛ امتیاز = شدت × احتمال (۱ تا ۵).</p>${hazopTable()}
<h3>۵-۵ سطح ریسک و معیار پذیرش</h3>${threshTable()}
<p>ریسک «بالا / اولویت‌دار» پذیرفتنی نیست و بدون اقدام اصلاحی (با مسئول و مهلت) ثبت نهایی نمی‌شود ${tag('rec')}.</p>
<h3>۵-۶ مواجهه با آلاینده‌های شیمیایی (روش نیمه‌کمی) ${tag('chem')}</h3><p>برای موادی که دارای الزام قانونی یا نگرانی بهداشتی هستند: HR از فهرست مواد (۶۱۰ ماده) گرفته می‌شود؛ شاخص‌های مواجهه (فشار بخار یا اندازهٔ ذرات، نسبت آستانهٔ بویایی به حد مجاز، اقدام کنترلی، مدت مواجهه، مقدار مصرف) انتخاب می‌شود. <b>ER</b> = میانگین هندسی شاخص‌های موجود (شاخص‌های در دسترس‌نبودن حذف می‌شوند) و <b>سطح ریسک</b> = √(HR × ER).</p>${chemLevelTable()}
<p>برای هر ماده، نیاز به معاینات سلامت شغلی هم از فهرست مواد مشخص می‌شود. ماشین‌حساب زیر همان محاسبهٔ کاربرگ را انجام می‌دهد.</p>
<div class="card noprint" id="chemCalc"></div>
<details class="noprint"><summary class="mu" style="cursor:pointer">جدول‌های کامل شاخص‌های روش شیمیایی</summary>${chemTables()}</details>
<h3>۵-۷ تعیین کنترل ${tag('rec')}</h3><p>اقدام اصلاحی بر اساس سلسله‌مراتب کنترل انتخاب می‌شود: <b>حذف خطر ← جایگزینی ← کنترل مهندسی ← کنترل اداری ← وسایل حفاظت فردی</b>. برای ریسک بالا، کنترل اداری یا PPE به‌تنهایی کافی نیست مگر اینکه دلیل ناممکن بودن سطوح بالاتر ثبت شود. برای هر اقدام: شرح، نوع اقدام، مسئول و مهلت ثبت می‌شود.</p>
<h3>۵-۸ ارزیابی مجدد (ریسک باقیمانده) ${tag('co')}</h3><p>پس از اجرای اقدام، S/O/D مجدداً امتیازدهی می‌شود. ریسک باقیمانده باید کمتر از ریسک اولیه باشد؛ در غیر این صورت اقدام مؤثر نبوده و بازنگری می‌شود.</p>
<h3>۵-۹ تأیید و ثبت ${tag('co')}</h3><p>ریسک ثبت‌شده توسط کارشناس «در انتظار تأیید» می‌ماند تا مدیر تأیید کند؛ ویرایش ریسک تأییدشده آن را دوباره به این وضعیت برمی‌گرداند.</p>
<h3>۵-۱۰ بازبینی دوره‌ای ${tag('rec')}</h3>${reviewTable()}<p>ریسک‌ها در موارد زیر خارج از دوره بازبینی می‌شوند: وقوع حادثه یا شبه‌حادثه مرتبط، تغییر در ماشین‌آلات، فرایند یا مواد، و عدم‌انطباق مکرر در همان سوله.</p>
<h3>۵-۱۱ ارتباط با سایر فرایندها ${tag('co')}</h3><p>ریسک می‌تواند به عدم‌انطباق‌ها، حوادث و کارت‌های ایمنی پیوند بخورد؛ حادثه‌ای که برای آن ریسک «پایین» ثبت شده بود، نشانهٔ نیاز به بازبینی ارزیابی است.</p>

<h2>۶. مستندات و سوابق</h2><p>سوابق در سامانه نگهداری می‌شود: متن ریسک، امتیازها، کنترل‌ها، تاریخ ارزیابی و بازبینی، تأیید مدیر و پیوند به عدم‌انطباق/حادثه. گزارش انطباق زیر برای ممیزی استفاده می‌شود.</p>

<h2>۷. شاخص‌های پایش (زنده از داده‌های سامانه)</h2><div id="kpi" class="card">در حال محاسبه...</div>
<p class="mu">تهیه‌شده از منطق سامانه و اسناد قبلی. قبل از ابلاغ رسمی، بندهای «پیشنهادی» را مدیر HSE تأیید یا اصلاح کند و شماره سند اختصاص یابد.</p>`}

const f2=x=>fa(x.toFixed(2)).replace('.','٫'); /* ممیز فارسی */
/* ماشین‌حساب شیمیایی */
function chemCalc(){
  const C=S.CHEM,sel=(id,a)=>`<select id="${id}" class="fld">${a.map((x,i)=>`<option value="${i}">${esc(x[0])}</option>`).join('')}</select>`;
  $('chemCalc').innerHTML=`<b>ماشین‌حساب ارزیابی مواجهه شیمیایی</b><div class="g2" style="margin-top:6px"><div><label class="l">نام ماده (از فهرست)</label><input id="cN" list="cL" type="text" placeholder="مثلاً: اسید سولفوریک"><datalist id="cL">${(window.HSEChemList||[]).map(x=>`<option value="${esc(x[0])}">`).join('')}</datalist></div>
  <div><label class="l">حالت فیزیکی</label><select id="cF"><option value="l">مایع / گاز</option><option value="s">جامد (گرد و غبار)</option></select></div></div>
  <div id="cMan" class="g3" style="display:none;margin-top:6px"><div><label class="l">HR (ماده در فهرست نیست)</label><select id="cHR">${[1,2,3,4,5].map(i=>`<option value="${i}">${fa(i)}</option>`).join('')}</select></div><div><label class="l">شاخص فشار بخار</label>${sel('cVP',C.vp)}</div><div><label class="l">شاخص نسبت بویایی/حد مجاز</label>${sel('cOD',C.odor)}</div></div>
  <div class="g3" style="margin-top:6px"><div id="cSzW" style="display:none"><label class="l">اندازهٔ ذرات</label>${sel('cSZ',C.size)}</div><div><label class="l">اقدام کنترلی موجود</label>${sel('cCT',C.ctrl)}</div><div><label class="l">مدت مواجهه در هفته</label>${sel('cDU',C.dur)}</div><div><label class="l">مقدار مصرف در هفته</label>${sel('cQT',C.qty)}</div></div>
  <div id="cOut" style="margin-top:10px"></div>`;
  const val=(a,id)=>{const x=a[+$(id).value];return x?x[1]:null};
  const run=()=>{
    const c=S.chemFind($('cN').value),solid=$('cF').value==='s';
    $('cMan').style.display=$('cN').value.trim()&&!c?'':'none';$('cSzW').style.display=solid?'':'none';
    let hr,vp,od;if(c){hr=c[1];vp=solid?null:c[2];od=c[3]}else{hr=+$('cHR').value;vp=solid?null:val(C.vp,'cVP');od=val(C.odor,'cOD')}
    const idx=[vp,solid?val(C.size,'cSZ'):null,od,val(C.ctrl,'cCT'),val(C.dur,'cDU'),val(C.qty,'cQT')],er=S.chemER(idx),q=S.chemQ(hr,er),k=S.chemClass(q);
    $('cOut').innerHTML=!$('cN').value.trim()?'<span class="mu">نام ماده را انتخاب کنید.</span>':k?`<div class="card" style="border-color:${k.c}"><b>HR = ${fa(hr)}</b> · شاخص‌های به‌کاررفته: ${idx.filter(x=>typeof x==='number').map(fa).join('، ')||'—'} · <b>ER = ${f2(er)}</b> · <b>√(HR×ER) = ${f2(q)}</b><div style="margin-top:6px">${dot(k.c)}<b>سطح ریسک: ${k.t}</b> — ${k.mon?'درخواست پایش هوا / اندازه‌گیری مواد شیمیایی':'نیازی به پایش هوا نیست'}${c?` · معاینات سلامت شغلی: <b>${c[4]?'ضروری است':'ضروری نیست'}</b>`:''}</div>${c?'':'<div class="mu">ماده در فهرست نیست؛ HR و شاخص‌ها را دستی وارد کردید.</div>'}</div>`:'<span class="mu">شاخص کافی برای محاسبه نیست.</span>'};
  $('chemCalc').addEventListener('input',run);$('chemCalc').addEventListener('change',run);run();
}

/* شاخص‌های زندهٔ انطباق */
async function kpi(){
  let R=null;try{R=await getAll('risks?select=*')}catch(e){}
  let U=null;try{U=await getAll('hse_units?select=id,name,aliases,active')}catch(e){}
  if(!R){$('kpi').textContent='جدول ریسک خوانده نشد.';return}
  const today=HSEToday(),act=R.filter(r=>r.status!=='archived');
  const L=r=>({...r,score:r.score||(r.method==='fmea'?S.calc('fmea',r.severity,r.likelihood,r.detection):r.manual_score)});
  const rows=act.map(L),bad={};let hi=0,hiNoAct=0,overdue=0,clean=0;
  rows.forEach(r=>{const lv=S.lvl(r),ch=S.check(r,{isNew:false,today});if(lv.h){hi++;if(!(r.planned_controls||'').trim())hiNoAct++}if(r.review_date&&r.review_date<today)overdue++;if(!ch.length)clean++;ch.forEach(e=>bad[e.msg]=(bad[e.msg]||0)+1)});
  const pct=rows.length?Math.round(clean*100/rows.length):0,cnt=P.counts(U||[],act),un=P.activeUnits(U||[]);
  const cov=g=>un.length?un.filter(u=>(cnt[u.id+'|'+g]||0)>0).length:0;
  $('kpi').innerHTML=`<table><tr><th>شاخص</th><th>مقدار</th></tr>
   <tr><td>ریسک‌های فعال ثبت‌شده</td><td>${fa(rows.length)}</td></tr>
   <tr><td>مطابق کامل با دستورالعمل (بدون هیچ مورد ناانطباقی)</td><td><b>${fa(pct)}٪</b> (${fa(clean)} از ${fa(rows.length)})</td></tr>
   <tr><td>ریسک بالا/اولویت‌دار</td><td>${fa(hi)} — بدون اقدام اصلاحی: <b class="${hiNoAct?'bad':'ok'}">${fa(hiNoAct)}</b></td></tr>
   <tr><td>بازبینی معوق</td><td><b class="${overdue?'bad':'ok'}">${fa(overdue)}</b></td></tr>
   <tr><td>پوشش سوله‌ها</td><td>ایمنی ${fa(cov('safety'))} از ${fa(un.length)} · بهداشتی ${fa(cov('health'))} از ${fa(un.length)} · ارگونومی ${fa(cov('ergo'))} از ${fa(un.length)}</td></tr></table>
   ${Object.keys(bad).length?`<h3>شایع‌ترین موارد ناانطباقی</h3><table><tr><th>مورد</th><th>تعداد</th></tr>${Object.entries(bad).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([m,n])=>`<tr><td>${esc(m)}</td><td>${fa(n)}</td></tr>`).join('')}</table>`:'<div class="ok">همهٔ ریسک‌ها با دستورالعمل مطابق‌اند.</div>'}`;
}
HSEAuth.ready.then(()=>{$('doc').innerHTML=body();chemCalc();kpi();$('bPrint').onclick=()=>window.print()});
</script>
