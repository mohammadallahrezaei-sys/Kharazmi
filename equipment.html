<title>ماژول تجهیزات و بازرسی‌های دوره‌ای - HSE خوارزمی</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#0f766e;--pri-ink:#fff;--field:#f8fafc;
--ok:#059669;--warn:#b45309;--bad:#dc2626;--info:#2563eb;--na:#64748b;
--okbg:color-mix(in srgb,var(--ok) 13%,var(--card));--warnbg:color-mix(in srgb,var(--warn) 14%,var(--card));--badbg:color-mix(in srgb,var(--bad) 12%,var(--card));--infobg:color-mix(in srgb,var(--info) 12%,var(--card));--nabg:color-mix(in srgb,var(--na) 12%,var(--card));color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--mut:#94a3b8;--line:#334155;--pri:#14b8a6;--pri-ink:#042f2e;--field:#172033;
--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--info:#60a5fa;--na:#94a3b8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:14px;line-height:1.6}
header{max-width:1280px;margin:0 auto;padding:16px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{width:44px;height:auto;border-radius:8px}
header>div{flex:1 1 200px;min-width:0}
header h1{font-size:20px;margin:0;font-weight:800;line-height:1.5}
header .sub{font-size:13px;color:var(--mut)}
header .sp{flex:1}
header a{color:var(--pri);text-decoration:none;border:1px solid var(--pri);background:var(--card);border-radius:12px;padding:6px 12px;font-size:12px;font-weight:700}
.mode{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--nabg);color:var(--mut)}
.mode.local{background:var(--warnbg);color:var(--warn)}
main{max-width:1280px;margin:0 auto;padding:16px}
.banner{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner button{margin-inline-start:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:right;cursor:pointer;font:inherit;color:inherit;border-inline-start:5px solid var(--line)}
.kpi b{display:block;font-size:26px;line-height:1.2}
.kpi span{color:var(--mut);font-size:12.5px}
.kpi.on{outline:2px solid var(--pri)}
.kpi.k-overdue{border-inline-start-color:var(--bad)}.kpi.k-soon{border-inline-start-color:#d9a400}.kpi.k-rejected{border-inline-start-color:var(--bad)}
.kpi.k-none{border-inline-start-color:var(--na)}.kpi.k-defect{border-inline-start-color:#d9a400}.kpi.k-all{border-inline-start-color:var(--pri)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
input,select,textarea,button{font:inherit}
input[type=text],input[type=search],input[type=number],select,textarea{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px}
textarea{width:100%;min-height:64px}
.bar input[type=search]{flex:1;min-width:180px}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 14px;min-height:38px;cursor:pointer}
button.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:600}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.tw{overflow:auto;max-height:68vh}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
thead th{position:sticky;top:0;background:var(--card);z-index:2;font-size:12.5px;color:var(--mut);cursor:pointer;white-space:nowrap;box-shadow:0 1px 0 var(--line)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--nabg)}
td.code{font-family:ui-monospace,Consolas,monospace;direction:ltr;text-align:right;white-space:nowrap;font-size:12.5px}
td small{display:block;color:var(--mut);font-size:12px}
tr.s-overdue td:first-child+td,tr.s-rejected td:first-child+td{border-inline-start:4px solid var(--bad)}
tr.s-soon td:first-child+td{border-inline-start:4px solid #d9a400}
.b{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;white-space:nowrap}
.b.ok{background:var(--okbg);color:var(--ok)}.b.bad{background:var(--badbg);color:var(--bad)}.b.warn{background:var(--warnbg);color:var(--warn)}
.b.na{background:var(--nabg);color:var(--na)}.b.info{background:var(--infobg);color:var(--info)}
.count{color:var(--mut);margin:8px 2px;font-size:13px}
.store{margin-top:14px;padding:12px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.meter{flex:1;min-width:200px;height:10px;background:var(--nabg);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--pri)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:0;width:min(780px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:3}
.dh h2{font-size:16px;margin:0;flex:1}
.db{padding:14px 16px;overflow:auto;max-height:calc(92vh - 62px)}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none}
.tabs button.on{border-bottom-color:var(--pri);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mut)}
label.f input,label.f select{color:var(--ink)}
.hint{font-size:12px;color:var(--mut)}
.insp{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.insp .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.insp .r .sp{flex:1}
.files{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.fl{display:flex;gap:8px;align-items:center;font-size:12.5px;background:var(--nabg);border-radius:8px;padding:4px 10px}
.fl .sp{flex:1}
.kv{display:grid;grid-template-columns:1fr 2fr auto;gap:6px;margin-bottom:6px}
.sheet{background:var(--nabg);border-radius:10px;padding:10px 12px;margin:10px 0}
#toast{position:fixed;inset-inline:0;bottom:16px;display:flex;justify-content:center;pointer-events:none;z-index:99}
#toast div{background:#222;color:#fff;padding:8px 18px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s}
#toast div.on{opacity:1}
@media(max-width:640px){main{padding:10px}.kv{grid-template-columns:1fr 1fr auto}}
</style>

<body>
<header>
  <img src="logo-sm.png" alt="" onerror="this.style.display='none'">
  <div><h1>تجهیزات و بازرسی‌های دوره‌ای</h1><div class="sub">جرثقیل، بالابر، لیفتراک، مخازن تحت فشار، دیگ بخار، چاه ارت، کپسول‌ها</div></div>

<main>

    </tr></thead>

</main>

<dialog id="dlg"><div class="dh"><h2 id="dt"></h2><button id="dx" aria-label="بستن">✕</button></div><div class="db" id="dbody"></div></dialog>
<div id="toast"><div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
'use strict';
/* =====================  تنظیمات  =====================
   آدرس و کلید همان مقدار index.html است (کلید publishable، مخصوص استفاده در سمت کاربر).
   اگر خالی بماند، صفحه در «حالت آزمایشی محلی» کار می‌کند (فقط روی همین مرورگر، بدون Supabase). */
const CFG={
  SUPABASE_URL:'https://priopguwfjawybffarhd.supabase.co',
  SUPABASE_KEY:'sb_publishable_fKFQePO9qiFhj4qU3Vq4lQ_OAFi7rfu',
  BUCKET:'equipment-docs',
  IMG_MAX_PX:1280,      // بیشترین ابعاد عکس پیوست
  IMG_TARGET_KB:150,    // هدف حجم هر عکس بعد از فشرده‌سازی
  IMG_HARD_KB:300,      // بیشتر از این پذیرفته نمی‌شود
  PDF_MAX_KB:600,       // سقف حجم PDF
  MAX_FILES:2,          // حداکثر فایل برای هر بازرسی
  QUOTA_MB:1000,        // سقف رایگان Supabase Storage (فقط برای نمایش نوار حجم)
  SOON_DAYS:30,
  DEFAULT_INTERVAL:12   // ماه - فرض پیش‌فرض؛ برای هر تجهیز قابل تغییر است
};
/* داده‌ی اولیه‌ی تجهیزات فقط هنگام بارگذاری اولیه خوانده می‌شود (seed_equipment.json) */
let SEED=null;const loadSeed=async()=>SEED||(SEED=await(await fetch('seed_equipment.json')).json());

/* =====================  تاریخ شمسی  ===================== */
const div=(a,b)=>~~(a/b), mod=(a,b)=>a-~~(a/b)*b;
const BRK=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy){let bl=BRK.length,gy=jy+621,leapJ=-14,jp=BRK[0],jm,jump=0,leap,leapG,march,n,i;
  if(jy<jp||jy>=BRK[bl-1])throw new Error('سال نامعتبر');
  for(i=1;i<bl;i++){jm=BRK[i];jump=jm-jp;if(jy<jm)break;leapJ+=div(jump,33)*8+div(mod(jump,33),4);jp=jm}
  n=jy-jp;leapJ+=div(n,33)*8+div(mod(n,33)+3,4);if(mod(jump,33)===4&&jump-n===4)leapJ++;
  leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;
  if(jump-n<6)n=n-jump+div(jump+4,33)*33;leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;return{leap,gy,march}}
function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;return d}
function d2g(j0){let j=4*j0+139361631;j+=div(div(4*j0+183187720,146097)*3,4)*4-3908;const i=div(mod(j,1461),4)*5+308;
  const gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1,gy=div(j,1461)-100100+div(8-gm,6);return{gy,gm,gd}}
function j2d(jy,jm,jd){const r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1}
function d2j(jdn){const gy=d2g(jdn).gy;let jy=gy-621;const r=jalCal(jy),j1=g2d(gy,3,r.march);let k=jdn-j1,jm,jd;
  if(k>=0){if(k<=185){return{jy,jm:1+div(k,31),jd:mod(k,31)+1}}k-=186}else{jy--;k+=179;if(r.leap===1)k++}
  jm=7+div(k,30);jd=mod(k,30)+1;return{jy,jm,jd}}
const isLeapJ=y=>jalCal(y).leap===0;
const monthLen=(y,m)=>m<=6?31:(m<=11?30:(isLeapJ(y)?30:29));
const p2=n=>String(n).padStart(2,'0');
const fmtJ=(y,m,d)=>`${y}/${p2(m)}/${p2(d)}`;
function normDigits(s){return String(s||'').replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).trim()}
function parseJ(s){const m=/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/.exec(normDigits(s));if(!m)return null;
  const y=+m[1],mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||y<1300||y>1500||d>monthLen(y,mo))return null;return{y,m:mo,d}}
const normJ=s=>{const p=parseJ(s);return p?fmtJ(p.y,p.m,p.d):null};
const jdnOf=s=>{const p=parseJ(s);return p?j2d(p.y,p.m,p.d):null};
function todayJ(){const t=new Date();const jd=g2d(t.getFullYear(),t.getMonth()+1,t.getDate());const j=d2j(jd);return fmtJ(j.jy,j.jm,j.jd)}
function addMonthsJ(s,n){const p=parseJ(s);if(!p)return null;let t=p.y*12+(p.m-1)+n;const y=div(t,12),m=mod(t,12)+1;return fmtJ(y,m,Math.min(p.d,monthLen(y,m)))}
const TODAY=todayJ(), TODAY_JDN=jdnOf(TODAY);

/* =====================  لایه داده  ===================== */
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=='x'?r:(r&3|8)).toString(16)});
const LSK='khz_equipment_v1';
const memFiles=new Map();
let sb=null;
const REMOTE=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_KEY&&window.supabase);
if(REMOTE)sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);
async function fetchAll(table,order){let out=[],from=0;for(;;){const{data,error}=await sb.from(table).select('*').order(order).range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000}return out}
async function seedRows(){await loadSeed();const eqs=SEED.equipment.map(e=>({...e}));const ins=[];
  for(const[c,list]of Object.entries(SEED.history))for(const h of list)ins.push({id:uuid(),equipment_code:c,inspected_on:h.date,result:h.result||'',approved_capacity:h.approved||'',defects:h.defects||'',next_due:h.next||'',inspector:'',notes:'',link:'',attachments:[],source:h.src||''});
  return{eqs,ins}}
const DB={
  async load(){
    if(REMOTE){const[eq,ins]=await Promise.all([fetchAll('equipment','code'),fetchAll('equipment_inspections','inspected_on')]);return{eq,ins}}
    let raw=null;try{raw=JSON.parse(localStorage.getItem(LSK))}catch(e){}
    if(!raw){const s=await seedRows();raw={eq:s.eqs,ins:s.ins};try{localStorage.setItem(LSK,JSON.stringify(raw))}catch(e){}}
    return{eq:raw.eq,ins:raw.ins}},
  persist(){if(REMOTE)return;try{localStorage.setItem(LSK,JSON.stringify({eq:S.eq,ins:S.ins},(k,v)=>k==='_i'?undefined:v))}catch(e){toast('ذخیره محلی پر شد')}},
  async seed(){const s=await seedRows();
    if(REMOTE){for(let i=0;i<s.eqs.length;i+=100){const{error}=await sb.from('equipment').upsert(s.eqs.slice(i,i+100),{onConflict:'code'});if(error)throw error}
      for(let i=0;i<s.ins.length;i+=100){const{error}=await sb.from('equipment_inspections').insert(s.ins.slice(i,i+100));if(error)throw error}}
    return s},
  async saveEquip(row){if(REMOTE){const{error}=await sb.from('equipment').upsert(row,{onConflict:'code'});if(error)throw error}},
  async addInsp(rows){if(REMOTE){const{error}=await sb.from('equipment_inspections').insert(rows);if(error)throw error}},
  async delInsp(id){if(REMOTE){const{error}=await sb.from('equipment_inspections').delete().eq('id',id);if(error)throw error}},
  async setAtt(id,att){if(REMOTE){const{error}=await sb.from('equipment_inspections').update({attachments:att}).eq('id',id);if(error)throw error}},
  async upload(path,blob){if(REMOTE){const{error}=await sb.storage.from(CFG.BUCKET).upload(path,blob,{contentType:blob.type,upsert:false});if(error)throw error}else memFiles.set(path,blob)},
  async remove(paths){if(!paths.length)return;if(REMOTE){const{error}=await sb.storage.from(CFG.BUCKET).remove(paths);if(error)throw error}else paths.forEach(p=>memFiles.delete(p))},
  async url(path){if(REMOTE){const{data,error}=await sb.storage.from(CFG.BUCKET).createSignedUrl(path,3600);if(error)throw error;return data.signedUrl}
    const b=memFiles.get(path);return b?URL.createObjectURL(b):null}
};

/* =====================  وضعیت و محاسبات  ===================== */
const S={eq:[],ins:[],by:new Map(),sel:new Set(),f:{q:'',cat:'__main',hall:'',state:''},sort:{k:'prio',dir:1}};
const LIFT=new Set(['جرثقیل سقفی','جرثقیل دروازه‌ای','بالابر','لیفتراک','جک پالت']);
const CATS=['جرثقیل سقفی','جرثقیل دروازه‌ای','بالابر','لیفتراک','جک پالت','مخزن تحت فشار','اتوکلاو','دیگ بخار','چاه ارت','سیستم همبندی','فایرباکس','کپسول آتش‌نشانی'];
const EXTCAT='کپسول آتش‌نشانی';
const PRIO={rejected:0,overdue:1,soon:2,none:3,ok:4,na:5};
const STLBL={rejected:['عدم تایید','bad'],overdue:['سررسید گذشته','bad'],soon:['سررسید نزدیک','warn'],none:['بدون بازرسی','na'],ok:['مجاز','ok'],na:['خارج از بازرسی','na']};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function index(){S.by=new Map();for(const i of S.ins){if(!S.by.has(i.equipment_code))S.by.set(i.equipment_code,[]);S.by.get(i.equipment_code).push(i)}
  for(const l of S.by.values())l.sort((a,b)=>(a.inspected_on>b.inspected_on?1:a.inspected_on<b.inspected_on?-1:0));
  for(const e of S.eq){e._i=info(e)}}
function info(e){const l=S.by.get(e.code)||[],last=l[l.length-1];const r={last,n:l.length,state:'none',due:'',days:null,files:l.reduce((a,x)=>a+(x.attachments||[]).length,0)};
  if(!e.active||!e.requires_inspection){r.state='na';return r}
  if(!last){r.state='none';return r}
  r.due=last.next_due||(last.result==='عدم تایید'?'':addMonthsJ(last.inspected_on,e.interval_months||CFG.DEFAULT_INTERVAL))||'';
  const dj=r.due?jdnOf(r.due):null;if(dj!=null)r.days=dj-TODAY_JDN;
  if(last.result==='عدم تایید')r.state='rejected';
  else if(r.days!=null&&r.days<0)r.state='overdue';
  else if(r.days!=null&&r.days<=CFG.SOON_DAYS)r.state='soon';
  else r.state='ok';
  return r}
const inScope=e=>S.f.cat==='__all'||(S.f.cat==='__main'?e.category!==EXTCAT:e.category===S.f.cat);

function sorted(list){const{k,dir}=S.sort;const val={prio:e=>[PRIO[e._i.state],e._i.due||'9999'],code:e=>e.code,title:e=>e.title,category:e=>CATS.indexOf(e.category),hall:e=>e.hall||'~',

/* =====================  فشرده‌سازی پیوست  ===================== */
async function compressImage(file){let bmp;try{bmp=await createImageBitmap(file)}catch(e){throw new Error('این فرمت تصویر پشتیبانی نمی‌شود؛ JPG یا PNG بفرستید')}
  let maxpx=CFG.IMG_MAX_PX,q=.62,blob;
  for(let k=0;k<10;k++){const sc=Math.min(1,maxpx/Math.max(bmp.width,bmp.height));const w=Math.max(1,Math.round(bmp.width*sc)),h=Math.max(1,Math.round(bmp.height*sc));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(bmp,0,0,w,h);
    blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));if(!blob)throw new Error('فشرده‌سازی ناموفق بود');
    if(blob.size<=CFG.IMG_TARGET_KB*1024)break;if(q>.42)q-=.08;else maxpx=Math.round(maxpx*.82)}
  if(bmp.close)bmp.close();
  if(blob.size>CFG.IMG_HARD_KB*1024)throw new Error('حتی بعد از فشرده‌سازی از '+CFG.IMG_HARD_KB+' کیلوبایت بزرگ‌تر است؛ فقط لینک بگذارید');
  return blob}
async function prepFile(file){
  if(file.type==='application/pdf'){if(file.size>CFG.PDF_MAX_KB*1024)throw new Error(`PDF بیشتر از ${CFG.PDF_MAX_KB} کیلوبایت است؛ عکس بگیرید یا فقط لینک بگذارید`);return{blob:file,ext:'pdf',type:'application/pdf'}}
  if(file.type.startsWith('image/')){const b=await compressImage(file);return{blob:b,ext:'jpg',type:'image/jpeg'}}
  throw new Error('فقط عکس یا PDF مجاز است')}
const kb=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';

  const rows=[...S.sel].map(c=>{const e=S.eq.find(x=>x.code===c);    return{id:uuid(),equipment_code:c,inspected_on:date,result:$('#bRes').value,approved_capacity:'',defects:$('#bDef').value,next_due:'',inspector:$('#bBy').value.trim(),notes:$('#bNote').value.trim(),link:'',attachments:[],source:'ثبت گروهی'}});
  $('#bSave').disabled=true;try{await DB.addInsp(rows);S.ins.push(...rows);S.sel.clear();DB.persist();index();render();dlg.close();toast(rows.length+' بازرسی ثبت شد')}catch(err){toast('خطا: '+(err.message||err));$('#bSave').disabled=false}}
function openNew(){showDlg('تجهیز جدید',`<div class="grid"><label class="f">کد تجهیز (یکتا)<input type="text" id="nCode" dir="ltr"></label><label class="f">دسته${sel('nCat',CATS,CATS[0])}</label>
  <label class="f">عنوان<input type="text" id="nTitle"></label><label class="f">سالن / محل<input type="text" id="nHall"></label>
  <label class="f">محل دقیق<input type="text" id="nLoc"></label><label class="f">دوره بازرسی (ماه)<input type="number" id="nInt" value="${CFG.DEFAULT_INTERVAL}" min="1"></label></div>
  <div style="margin-top:10px"><button class="pri" id="nSave">افزودن</button></div>`)}
async function saveNew(){const code=$('#nCode').value.trim().replace(/\s+/g,'');if(!code)return toast('کد لازم است');if(S.eq.some(e=>e.code===code))return toast('این کد قبلاً ثبت شده');
  const row={code,category:$('#nCat').value,title:$('#nTitle').value.trim()||code,hall:$('#nHall').value.trim(),location:$('#nLoc').value.trim(),parent_name:'',parent_code:'',active:true,requires_inspection:true,interval_months:Math.max(1,+$('#nInt').value||12),specs:{},notes:''};
  try{await DB.saveEquip(row);S.eq.push(row);DB.persist();index();fillFilters();render();dlg.close();toast('اضافه شد');openEquip(code)}catch(err){toast('خطا: '+(err.message||err))}}
async function cleanOld(){const olds=[];for(const[c,l]of S.by)l.forEach((x,idx)=>{if(idx<l.length-1&&(x.attachments||[]).length)olds.push(x)});
  const files=olds.flatMap(x=>x.attachments),size=files.reduce((a,f)=>a+(f.size||0),0);
  if(!olds.length)return;if(!confirm(`${files.length} فایل (${kb(size)}) از بازرسی‌های قدیمی حذف شود؟\nثبت بازرسی‌ها و تاریخ‌ها می‌ماند؛ فقط فایل پیوست آن‌ها پاک می‌شود. فایل آخرین بازرسی هر تجهیز دست نمی‌خورد.`))return;
  try{await DB.remove(files.map(f=>f.path));for(const x of olds){await DB.setAtt(x.id,[]);x.attachments=[]}DB.persist();index();render();toast('پاکسازی شد')}catch(err){toast('خطا: '+(err.message||err))}}
async function delInsp(id){const x=S.ins.find(i=>i.id===id);if(!x||!confirm('این ثبت بازرسی (و فایل‌های پیوستش) حذف شود؟'))return;
  try{await DB.remove((x.attachments||[]).map(a=>a.path));await DB.delInsp(id);S.ins=S.ins.filter(i=>i.id!==id);DB.persist();index();render();toast('حذف شد');openEquip(cur.code,'insp')}catch(err){toast('خطا: '+(err.message||err))}}
function csv(){const rows=sorted(visible());const h=['کد','دسته','عنوان','سالن','محل دقیق','وضعیت','آخرین بازرسی','نتیجه','ایرادات','سررسید بعدی','تعداد بازرسی','دوره (ماه)','یادداشت'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const body=rows.map(e=>{const i=e._i,l=i.last||{};return[e.code,e.category,e.title,e.hall,e.location,STLBL[i.state][0],l.inspected_on||'',l.result||'',l.defects||'',i.due||'',i.n,e.interval_months||'',e.notes].map(q).join(',')});
  const blob=new Blob(['﻿'+[h.map(q).join(','),...body].join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`تجهیزات_${TODAY.replace(/\//g,'-')}.csv`;a.click()}

/* =====================  رویدادها  ===================== */
$('#q').addEventListener('input',e=>{S.f.q=e.target.value;render()});
$('#fcat').addEventListener('change',e=>{S.f.cat=e.target.value;render()});
$('#fhall').addEventListener('change',e=>{S.f.hall=e.target.value;render()});
$('#fstate').addEventListener('change',e=>{S.f.state=e.target.value;render()});
$('#kpis').addEventListener('click',e=>{const b=e.target.closest('.kpi');if(!b)return;S.f.state=b.dataset.st;$('#fstate').value=S.f.state;render()});
document.querySelector('thead').addEventListener('click',e=>{const t=e.target.closest('th[data-k]');if(!t)return;S.sort=S.sort.k===t.dataset.k?{k:t.dataset.k,dir:-S.sort.dir}:{k:t.dataset.k,dir:1};render()});
$('#selAll').addEventListener('change',e=>{const l=visible();l.forEach(x=>e.target.checked?S.sel.add(x.code):S.sel.delete(x.code));render()});
$('#tb').addEventListener('click',e=>{const tr=e.target.closest('tr[data-c]');if(!tr)return;const c=tr.dataset.c;
  if(e.target.classList.contains('sel')){e.target.checked?S.sel.add(c):S.sel.delete(c);$('#nsel').textContent=S.sel.size;$('#bBulk').disabled=!S.sel.size;const bc=$('#bClear');bc.style.display=S.sel.size?'':'none';bc.textContent=`لغو انتخاب (${S.sel.size})`;return}
  openEquip(c)});
$('#bAdd').onclick=openNew;$('#bBulk').onclick=openBulk;$('#bCsv').onclick=csv;$('#bClear').onclick=()=>{S.sel.clear();render()};$('#dx').onclick=()=>dlg.close();
$('#store').addEventListener('click',e=>{if(e.target.id==='bClean')cleanOld()});
dlg.addEventListener('change',e=>{if(e.target.id==='eAct'){const w=$('#eRsnW');if(w)w.style.display=e.target.value==='فعال'?'none':''}});
dlg.addEventListener('click',async e=>{const t=e.target;
  if(t===dlg){dlg.close();return}
  if(t.dataset.tab){openEquip(cur.code,t.dataset.tab);return}
  if(t.id==='fSave')return saveInsp();if(t.id==='eSave')return saveSpec();if(t.id==='bSave')return saveBulk();if(t.id==='nSave')return saveNew();
  if(t.dataset.del)return delInsp(t.dataset.del);
  if(t.dataset.rmp!=null){pending.splice(+t.dataset.rmp,1);drawPending();return}
  if(t.dataset.open){try{const u=await DB.url(t.dataset.open);if(u)window.open(u,'_blank','noopener');else toast('فایل در حالت آزمایشی فقط تا بستن صفحه نگه داشته می‌شود')}catch(err){toast('خطا: '+(err.message||err))}return}
  if(t.id==='eAddSpec'){$('#eSpecs').insertAdjacentHTML('beforeend','<div class="kv"><input type="text" placeholder="نام"><input type="text" placeholder="مقدار"><button data-rm>✕</button></div>');return}
  if(t.dataset.rm!=null){t.closest('.kv').remove()}});

/* =====================  شروع  ===================== */
async function init(){
  $('#mode').textContent=REMOTE?'متصل به Supabase':'حالت آزمایشی محلی';$('#mode').classList.toggle('local',!REMOTE);
  const bn=$('#banners');
  if(!REMOTE)bn.innerHTML='<div class="banner">Supabase تنظیم نشده است؛ داده‌ها فقط روی همین مرورگر ذخیره می‌شوند و پیوست‌ها با بستن صفحه از بین می‌روند. آدرس و کلید را در بخش CFG بالای فایل بگذارید.</div>';
  try{const d=await DB.load();S.eq=d.eq;S.ins=d.ins}catch(err){console.error(err);bn.innerHTML=`<div class="banner">خطا در خواندن از Supabase: ${esc(err.message||err)} — آیا فایل setup.sql را اجرا کرده‌اید؟</div>`;return}
  if(REMOTE&&!S.eq.length){bn.insertAdjacentHTML('beforeend',`<div class="banner">جدول تجهیزات خالی است.<button class="pri" id="bSeed">بارگذاری تجهیزات و سوابق اولیه</button></div>`);
    $('#bSeed').onclick=async()=>{$('#bSeed').disabled=true;try{const s=await DB.seed();S.eq=s.eqs;S.ins=s.ins;bn.innerHTML='';index();fillFilters();render();toast('بارگذاری شد')}catch(err){toast('خطا: '+(err.message||err));$('#bSeed').disabled=false}}}
  index();fillFilters();render();
  const c=new URLSearchParams(location.search).get('code');if(c)openEquip(c)}
init();
</script>
</body>
