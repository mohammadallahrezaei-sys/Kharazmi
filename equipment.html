sJ(t,e.interval_months||CFG.DEFAULT_INTERVAL)?s:"",inspector:$("#fBy").value.trim(),notes:$("#fNote").value.trim(),link:a,attachments:o,source:""};await DB.addInsp([n]);S.ins.push(n);DB.persist();index();render();toast("بازرسی ثبت شد");openEquip(e.code,"insp")}catch(e){console.error(e);if(r.length)DB.remove(r).catch(()=>{});toast("خطا در ثبت: "+(e.message||e));i.disabled=false}}async function saveSpec(){const e=cur;const t=$("#eAct").value==="فعال",n=$("#eRsn").value.trim();if(!t&&!n)return toast("علت غیرفعال شدن را بنویسید");const s={};document.querySelectorAll("#eSpecs .kv").forEach(e=>{const[t,n]=e.querySelectorAll("input");if(t.value.trim())s[t.value.trim()]=n.value.trim()});const a={...e,title:$("#eTitle").value.trim()||e.title,hall:$("#eHall").value.trim(),location:$("#eLoc").value.trim(),interval_months:Math.max(1,+$("#eInt").value||CFG.DEFAULT_INTERVAL),active:t,inactive_reason:t?null:n,inactive_at:t?null:e.active?HSEToday():e.inactive_at||HSEToday(),requires_inspection:$("#eReq").value==="بله",notes:$("#eNote").value.trim(),specs:s};delete a._i;try{try{await DB.saveEquip(a)}catch(e){if(!/inactive_/.test(String(e.message||e)))throw e;if(!t)throw new Error("ستون‌های علت غیرفعال‌سازی ساخته نشده؛ فایل hse_equipment_inactive.sql را در Supabase اجرا کنید");const n={...a};delete n.inactive_reason;delete n.inactive_at;await DB.saveEquip(n)}Object.assign(e,a);DB.persist();index();fillFilters();render();toast("ذخیره شد");openEquip(e.code,"spec")}catch(e){toast("خطا: "+(e.message||e))}}function openBulk(){const e=[...S.sel];showDlg(`ثبت بازرسی گروهی برای ${e.length} تجهیز`,`<div class="grid"><label class="f">تاریخ بازرسی<input type="text" id="bDate" value="${TODAY}" dir="ltr"></label>\n   <label class="f">نتیجه${sel("bRes",["تایید","تایید مشروط","عدم تایید"],"تایید")}</label>\n   <label class="f">ایرادات${sel("bDef",["ندارد","در حال رسیدگی"],"ندارد")}</label>\n   <label class="f">بازرس / شرکت<input type="text" id="bBy"></label></div>\n   <label class="f" style="margin-top:8px">یادداشت<textarea id="bNote"></textarea></label>\n   <div class="hint" style="margin-top:6px">سررسید بعدی هر تجهیز از دوره بازرسی خودش محاسبه می‌شود. پیوست در ثبت گروهی نیست؛ برای پیوست از صفحه خود تجهیز اقدام کنید.</div>\n   <div style="margin-top:10px"><button class="pri" id="bSave">ثبت ${e.length} بازرسی</button></div>`)}async function saveBulk(){const e=normJ($("#bDate").value);if(!e)return toast("تاریخ نامعتبر است");const t=[...S.sel].map(t=>{const n=S.eq.find(e=>e.code===t);return{id:uuid(),equipment_code:t,inspected_on:e,result:$("#bRes").value,approved_capacity:"",defects:$("#bDef").value,next_due:"",inspector:$("#bBy").value.trim(),notes:$("#bNote").value.trim(),link:"",attachments:[],source:"ثبت گروهی"}});$("#bSave").disabled=true;try{await DB.addInsp(t);S.ins.push(...t);S.sel.clear();DB.persist();index();render();dlg.close();toast(t.length+" بازرسی ثبت شد")}catch(e){toast("خطا: "+(e.message||e));$("#bSave").disabled=false}}function openNew(){showDlg("تجهیز جدید",`<div class="grid"><label class="f">کد تجهیز (یکتا)<input type="text" id="nCode" dir="ltr"></label><label class="f">دسته${sel("nCat",CATS,CATS[0])}</label>\n  <label class="f">عنوان<input type="text" id="nTitle"></label><label class="f">سالن / محل<input type="text" id="nHall"></label>\n  <label class="f">محل دقیق<input type="text" id="nLoc"></label><label class="f">دوره بازرسی (ماه)<input type="number" id="nInt" value="${CFG.DEFAULT_INTERVAL}" min="1"></label></div>\n  <div style="margin-top:10px"><button class="pri" id="nSave">افزودن</button></div>`)}async function saveNew(){const e=$("#nCode").value.trim().replace(/\s+/g,"");if(!e)return toast("کد لازم است");if(S.eq.some(t=>t.code===e))return toast("این کد قبلاً ثبت شده");const t={code:e,category:$("#nCat").value,title:$("#nTitle").value.trim()||e,hall:$("#nHall").value.trim(),location:$("#nLoc").value.trim(),parent_name:"",parent_code:"",active:true,requires_inspection:true,interval_months:Math.max(1,+$("#nInt").value||12),specs:{},notes:""};try{await DB.saveEquip(t);S.eq.push(t);DB.persist();index();fillFilters();render();dlg.close();toast("اضافه شد");openEquip(e)}catch(e){toast("خطا: "+(e.message||e))}}async function cleanOld(){const e=[];for(const[t,n]of S.by)n.forEach((t,s)=>{if(s<n.length-1&&(t.attachments||[]).length)e.push(t)});const t=e.flatMap(e=>e.attachments),n=t.reduce((e,t)=>e+(t.size||0),0);if(!e.length)return;if(!confirm(`${t.length} فایل (${kb(n)}) از بازرسی‌های قدیمی حذف شود؟\nثبت بازرسی‌ها و تاریخ‌ها می‌ماند؛ فقط فایل پیوست آن‌ها پاک می‌شود. فایل آخرین بازرسی هر تجهیز دست نمی‌خورد.`))return;try{await DB.remove(t.map(e=>e.path));for(const t of e){await DB.setAtt(t.id,[]);t.attachments=[]}DB.persist();index();render();toast("پاکسازی شد")}catch(e){toast("خطا: "+(e.message||e))}}async function delInsp(e){const t=S.ins.find(t=>t.id===e);if(!t||!confirm("این ثبت بازرسی (و فایل‌های پیوستش) حذف شود؟"))return;try{await DB.remove((t.attachments||[]).map(e=>e.path));await DB.delInsp(e);S.ins=S.ins.filter(t=>t.id!==e);DB.persist();index();render();toast("حذف شد");openEquip(cur.code,"insp")}catch(e){toast("خطا: "+(e.message||e))}}function csv(){const e=sorted(visible());const t=["کد","دسته","عنوان","سالن","محل دقیق","وضعیت","آخرین بازرسی","نتیجه","ایرادات","سررسید بعدی","تعداد بازرسی","دوره (ماه)","یادداشت"];const n=e=>'"'+String(e==null?"":e).replace(/"/g,'""')+'"';const s=e.map(e=>{const t=e._i,s=t.last||{};return[e.code,e.category,e.title,e.hall,e.location,STLBL[t.state][0],s.inspected_on||"",s.result||"",s.defects||"",t.due||"",t.n,e.interval_months||"",e.notes].map(n).join(",")});const a=new Blob(["\ufeff"+[t.map(n).join(","),...s].join("\r\n")],{type:"text/csv;charset=utf-8"});const i=document.createElement("a");i.href=URL.createObjectURL(a);i.download=`تجهیزات_${TODAY.replace(/\//g,"-")}.csv`;i.click()}$("#q").addEventListener("input",e=>{S.f.q=e.target.value;render()});$("#fcat").addEventListener("change",e=>{S.f.cat=e.target.value;render()});$("#fhall").addEventListener("change",e=>{S.f.hall=e.target.value;render()});$("#fstate").addEventListener("change",e=>{S.f.state=e.target.value;render()});$("#kpis").addEventListener("click",e=>{const t=e.target.closest(".kpi");if(!t)return;S.f.state=t.dataset.st;$("#fstate").value=S.f.state;render()});document.querySelector("thead").addEventListener("click",e=>{const t=e.target.closest("th[data-k]");if(!t)return;S.sort=S.sort.k===t.dataset.k?{k:t.dataset.k,dir:-S.sort.dir}:{k:t.dataset.k,dir:1};render()});$("#selAll").addEventListener("change",e=>{const t=visible();t.forEach(t=>e.target.checked?S.sel.add(t.code):S.sel.delete(t.code));render()});$("#tb").addEventListener("click",e=>{const t=e.target.closest("tr[data-c]");if(!t)return;const n=t.dataset.c;if(e.target.classList.contains("sel")){e.target.checked?S.sel.add(n):S.sel.delete(n);$("#nsel").textContent=S.sel.size;$("#bBulk").disabled=!S.sel.size;const t=$("#bClear");t.style.display=S.sel.size?"":"none";t.textContent=`لغو انتخاب (${S.sel.size})`;return}openEquip(n)});$("#bAdd").onclick=openNew;$("#bBulk").onclick=openBulk;$("#bCsv").onclick=csv;$("#bClear").onclick=()=>{S.sel.clear();render()};$("#dx").onclick=()=>dlg.close();$("#store").addEventListener("click",e=>{if(e.target.id==="bClean")cleanOld()});dlg.addEventListener("change",e=>{if(e.target.id==="eAct"){const t=$("#eRsnW");if(t)t.style.display=e.target.value==="فعال"?"none":""}});dlg.addEventListener("click",async e=>{const t=e.target;if(t===dlg){dlg.close();return}if(t.dataset.tab){openEquip(cur.code,t.dataset.tab);return}if(t.id==="fSave")return saveInsp();if(t.id==="eSave")return saveSpec();if(t.id==="bSave")return saveBulk();if(t.id==="nSave")return saveNew();if(t.dataset.del)return delInsp(t.dataset.del);if(t.dataset.rmp!=null){pending.splice(+t.dataset.rmp,1);drawPending();return}if(t.dataset.open){try{const e=await DB.url(t.dataset.open);if(e)window.open(e,"_blank","noopener");else toast("فایل در حالت آزمایشی فقط تا بستن صفحه نگه داشته می‌شود")}catch(e){toast("خطا: "+(e.message||e))}return}if(t.id==="eAddSpec"){$("#eSpecs").insertAdjacentHTML("beforeend",'<div class="kv"><input type="text" placeholder="نام"><input type="text" placeholder="مقدار"><button data-rm>✕</button></div>');return}if(t.dataset.rm!=null){t.closest(".kv").remove()}});async function init(){$("#mode").textContent=REMOTE?"متصل به Supabase":"حالت آزمایشی محلی";$("#mode").classList.toggle("local",!REMOTE);const e=$("#banners");if(!REMOTE)e.innerHTML='<div class="banner">Supabase تنظیم نشده است؛ داده‌ها فقط روی همین مرورگر ذخیره می‌شوند و پیوست‌ها با بستن صفحه از بین می‌روند. آدرس و کلید را در بخش CFG بالای فایل بگذارید.</div>';try{const e=await DB.load();S.eq=e.eq;S.ins=e.ins}catch(t){console.error(t);e.innerHTML=`<div class="banner">خطا در خواندن از Supabase: ${esc(t.message||t)} — آیا فایل setup.sql را اجرا کرده‌اید؟</div>`;return}if(REMOTE&&!S.eq.length){e.insertAdjacentHTML("beforeend",`<div class="banner">جدول تجهیزات خالی است.<button class="pri" id="bSeed">بارگذاری تجهیزات و سوابق اولیه</button></div>`);$("#bSeed").onclick=async()=>{$("#bSeed").disabled=true;try{const t=await DB.seed();S.eq=t.eqs;S.ins=t.ins;e.innerHTML="";index();fillFilters();render();toast("بارگذاری شد")}catch(e){toast("خطا: "+(e.message||e));$("#bSeed").disabled=false}}}index();fillFilters();render();const t=new URLSearchParams(location.search).get("code");if(t)openEquip(t)}init();</script></body></html>
