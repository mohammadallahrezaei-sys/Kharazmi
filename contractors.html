<!doctype html><html lang="fa" dir="rtl"><head><meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"><script src="auth.js"></script><script src="hse_nav.js" defer="defer"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پیمانکاران - نرم‌افزار جامع HSE</title><link rel="stylesheet" href="hse_ui.css"><style>.w{max-width:860px;margin:0 auto;padding:14px}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}.card2{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}.t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}.mu{color:var(--mu);font-size:12px}.b2{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.b2.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}.b2.bad{border-color:var(--bad);color:var(--bad)}.b2.ok{border-color:var(--ok);color:var(--ok)}.bg{display:inline-block;border-radius:99px;padding:1px 10px;font-size:11px;border:1px solid var(--bd)}.bg.ok{color:var(--ok);border-color:var(--ok)}.bg.bad{color:var(--bad);border-color:var(--bad)}.bg.wa{color:var(--wa);border-color:var(--wa)}.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1}.tabs .on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}input,select,textarea{font:inherit;font-size:13px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);padding:7px 9px;width:100%}dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(94vw,520px);padding:14px}dialog::backdrop{background:rgba(15,23,42,.55)}label.f{display:block;font-size:12px;color:var(--mu);margin-top:8px}.jd{display:flex;gap:4px}.jd select{width:auto;flex:1}.wr{border:1px solid var(--bd);border-radius:10px;padding:6px 10px;margin-top:6px;font-size:13px}.wr.k{border-color:var(--bad)}.rep{background:var(--badbg,#fee2e2);border:1px solid var(--bad);color:var(--tx);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px}[hidden]{display:none!important}</style></head><body><div class="w"><div class="top"><div><h1 style="">🏗️ پیمانکاران</h1><div class="mu">ثبت ورود و پایان کار، چک‌لیست روزانهٔ ایمنی در تقویم و سابقهٔ اخطارها</div></div><div><a href="index.html">← صفحه اصلی</a></div></div><div class="tabs"><button class="b2 on" data-tab="active">در حال کار</button><button class="b2" data-tab="finished">پایان‌یافته</button><button class="b2 p" id="bAdd" style="">＋ پیمانکار جدید</button></div><input id="q" placeholder="🔍 جستجو نام شرکت، قرارداد، مسئول…"><div id="warn"></div><div id="list"></div></div><dialog id="dlg"></dialog><div id="toast" style=""></div><script src="eval_core.js"></script><script>const{fa:fa,esc:esc}=HSE,$=t=>document.querySelector(t),SB="https://priopguwfjawybffarhd.supabase.co/rest/v1/";let C=[],W=[],TAB="active",ME="";const nk=t=>String(t||"").replace(/[يى]/g,"ی").replace(/ك/g,"ک").replace(/[\u200c\s]+/g," ").trim().toLowerCase();const warnsOf=t=>{const e=new Set(C.filter(e=>nk(e.name)===nk(t.name)).map(t=>t.id));return W.filter(t=>e.has(t.contractor_id))};const todayISO=()=>(new Date).toLocaleDateString("en-CA");const jl=t=>t?new Date(t+"T12:00:00Z").toLocaleDateString("fa-IR-u-ca-persian",{year:"numeric",month:"numeric",day:"numeric",timeZone:"UTC"}):"—";const toast=t=>{const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display="none",2600)};async function rq(t,e={}){const a=await fetch(SB+t,{...e,headers:{"Content-Type":"application/json",Prefer:"return=representation",...e.headers||{}}});if(!a.ok)throw new Error((await a.text()).slice(0,250));const n=await a.text();return n?JSON.parse(n):null}async function load(){try{[C,W]=await Promise.all([HSE.getAll("contractors?select=*&order=start_date.desc"),HSE.getAll("contractor_warnings?select=*&order=warn_date.desc")]);C=C||[];W=W||[];$("#warn").innerHTML=""}catch(t){C=[];W=[]}if(!Array.isArray(C)){C=[]}draw()}function draw(){const t=$("#q").value.trim().toLowerCase(),e=C.filter(e=>(e.status||"active")===TAB&&(!t||[e.name,e.contract_no,e.contact_name,e.scope].join(" ").toLowerCase().includes(t)));$("#list").innerHTML=e.map(t=>{const e=warnsOf(t),a=e.filter(t=>t.record_type==="اخطار کتبی").length;return`<div class="card2"><div class="t"><div><b>${esc(t.name)}</b> ${e.length?`<span class="bg ${a?"bad":"wa"}">${fa(e.length)} سابقهٔ انضباطی${a?` (${fa(a)} اخطار کتبی)`:""}</span>`:""}\n      <div class="mu">قرارداد: ${esc(t.contract_no||"—")} · مسئول: ${esc(t.contact_name||"—")} ${t.phone?'· <span dir="ltr">'+esc(t.phone)+"</span>":""} · ${t.workers?fa(t.workers)+" نفر · ":""}ورود: ${jl(t.start_date)}${t.end_date?" · پایان: "+jl(t.end_date):""}</div>\n      ${t.scope?`<div class="mu">شرح کار: ${esc(t.scope)}</div>`:""}</div>\n     <div style="display:flex;gap:6px;flex-wrap:wrap">${t.status==="active"?`<a class="b2 p" href="checklists.html#visit=CT&ctr=${encodeURIComponent(t.name)}&cno=${encodeURIComponent(t.contract_no||"")}">✔ چک‌لیست امروز</a>`:""}\n      <button class="b2" data-a="warn" data-id="${t.id}">⚠ اخطار</button><button class="b2" data-a="edit" data-id="${t.id}">✏️</button>\n      ${t.status==="active"?`<button class="b2 ok" data-a="fin" data-id="${t.id}">🏁 پایان کار</button>`:`<button class="b2" data-a="reopen" data-id="${t.id}">↩ بازگشایی</button>`}</div></div>\n     ${e.length?`<details style="margin-top:6px"><summary class="mu" style="cursor:pointer">سابقهٔ اخطارها</summary>${e.map(t=>`<div class="wr ${t.record_type==="اخطار کتبی"?"k":""}"><b>${esc(t.record_type)}</b> · ${jl(t.warn_date)} — ${esc(t.reason)}${t.description?' <span class="mu">'+esc(t.description)+"</span>":""}</div>`).join("")}</details>`:""}</div>`}).join("")||'<div class="card2 mu">موردی نیست.</div>'}function dateField(t,e){return`<div id="${t}" class="jd"><select></select><select></select><select></select></div>`}function openForm(t){const e=t?C.find(e=>e.id===t):{start_date:todayISO(),status:"active"};$("#dlg").innerHTML=`<b>${t?"ویرایش پیمانکار":"ثبت ورود پیمانکار"}</b>\n   <label class="f">نام شرکت پیمانکار *<input id="fN" value="${esc(e.name||"")}" list="cn"></label><datalist id="cn">${[...new Set(C.map(t=>t.name))].map(t=>`<option value="${esc(t)}">`).join("")}</datalist>\n   <label class="f">شمارهٔ قرارداد<input id="fC" value="${esc(e.contract_no||"")}"></label>\n   <label class="f">نام مسئول / سرپرست گروه<input id="fP" value="${esc(e.contact_name||"")}"></label>\n   <label class="f">تلفن<input id="fT" dir="ltr" value="${esc(e.phone||"")}"></label>\n   <label class="f">شرح کار / محل کار<textarea id="fS" rows="2">${esc(e.scope||"")}</textarea></label>\n   <label class="f">تعداد نفرات<input id="fW" type="number" min="0" value="${e.workers||""}"></label>\n   <label class="f">تاریخ ورود به کارخانه</label>${dateField("fD")}\n   <div id="fE" class="mu" style="color:var(--bad)"></div>\n   <div style="display:flex;gap:8px;margin-top:12px"><button class="b2" id="fX">انصراف</button><button class="b2 p" id="fS2" style="margin-inline-start:auto">ذخیره</button></div>`;HSE.jdInit($("#fD"));HSE.jdSet($("#fD"),e.start_date||todayISO());$("#dlg").showModal();$("#fX").onclick=()=>$("#dlg").close();$("#fS2").onclick=async()=>{const e=$("#fN").value.trim();if(!e)return $("#fE").textContent="نام شرکت را بنویسید";const a={name:e,contract_no:$("#fC").value.trim()||null,contact_name:$("#fP").value.trim()||null,phone:$("#fT").value.trim()||null,scope:$("#fS").value.trim()||null,workers:+$("#fW").value||null,start_date:HSE.jdGet($("#fD"))||todayISO()};try{if(t)await rq("contractors?id=eq."+t,{method:"PATCH",body:JSON.stringify(a),headers:{Prefer:"return=minimal"}});else await rq("contractors",{method:"POST",body:JSON.stringify({...a,created_by:ME||null}),headers:{Prefer:"return=minimal"}});$("#dlg").close();toast("ثبت شد");await load()}catch(t){$("#fE").textContent=/relation|does not exist|contractors/.test(t.message)?"جدول ساخته نشده؛ فایل hse_contractors.sql را یک‌بار در Supabase اجرا کنید.":t.message}}}function openWarn(t){const e=C.find(e=>e.id===t),a=warnsOf(e),n=a.filter(t=>t.record_type==="اخطار کتبی").length;$("#dlg").innerHTML=`<b>ثبت اخطار برای «${esc(e.name)}»</b>\n   ${a.length?`<div class="rep">⚠ این پیمانکار قبلاً ${fa(a.length)} بار تذکر/اخطار گرفته است${n?` (${fa(n)} اخطار کتبی)`:""}؛ این مورد <b>تکرار</b> است.${a.slice(0,4).map(t=>`<div>• ${jl(t.warn_date)} — ${esc(t.record_type)}: ${esc(t.reason)}</div>`).join("")}</div>`:'<div class="mu" style="margin-top:6px">سابقهٔ قبلی ندارد.</div>'}\n   <label class="f">نوع<select id="wT"><option>اخطار کتبی</option><option>تذکر شفاهی</option></select></label>\n   <label class="f">علت / موضوع *<input id="wR"></label>\n   <label class="f">توضیح<input id="wD"></label>\n   <label class="f">تاریخ اخطار</label>${dateField("wDt")}\n   <div id="wE" class="mu" style="color:var(--bad)"></div>\n   <div style="display:flex;gap:8px;margin-top:12px"><button class="b2" id="wX">انصراف</button><button class="b2 bad" id="wS" style="margin-inline-start:auto">ثبت اخطار</button></div>`;HSE.jdInit($("#wDt"));HSE.jdSet($("#wDt"),todayISO());$("#dlg").showModal();$("#wX").onclick=()=>$("#dlg").close();$("#wS").onclick=async()=>{const e=$("#wR").value.trim();if(!e)return $("#wE").textContent="علت را بنویسید";try{await rq("contractor_warnings",{method:"POST",body:JSON.stringify({contractor_id:t,record_type:$("#wT").value,reason:e,description:$("#wD").value.trim()||null,warn_date:HSE.jdGet($("#wDt"))||todayISO(),registered_by:ME||null}),headers:{Prefer:"return=minimal"}});$("#dlg").close();toast("اخطار ثبت شد");await load()}catch(t){$("#wE").textContent=t.message}}}document.addEventListener("click",async t=>{const e=t.target.closest("[data-tab],[data-a],#bAdd");if(!e)return;try{if(e.id==="bAdd")return openForm(null);if(e.dataset.tab){TAB=e.dataset.tab;document.querySelectorAll(".tabs [data-tab]").forEach(t=>t.classList.toggle("on",t===e));return draw()}const t=e.dataset.id,a=e.dataset.a;if(a==="edit")openForm(t);else if(a==="warn")openWarn(t);else if(a==="fin"){if(!confirm("کار این پیمانکار تمام شد؟ از تقویم چک‌لیست روزانه حذف می‌شود."))return;await rq("contractors?id=eq."+t,{method:"PATCH",body:JSON.stringify({status:"finished",end_date:todayISO()}),headers:{Prefer:"return=minimal"}});toast("پایان کار ثبت شد");await load()}else if(a==="reopen"){await rq("contractors?id=eq."+t,{method:"PATCH",body:JSON.stringify({status:"active",end_date:null}),headers:{Prefer:"return=minimal"}});await load()}}catch(t){toast("خطا: "+t.message.slice(0,120))}});$("#q").oninput=draw;HSEAuth.ready.then(()=>{ME=HSEAuth.email||"";load().catch(()=>{$("#warn").innerHTML='<div class="card2"><span class="bg bad">جدول ساخته نشده</span> فایل hse_contractors.sql را یک‌بار در Supabase SQL Editor اجرا کنید.</div>'})});</script></body></html>
