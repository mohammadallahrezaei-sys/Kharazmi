<!doctype html>
<html lang="fa" dir="rtl">
<head>
     <script src="auth.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ماژول آموزش - نرم‌افزار جامع HSE</title>
<link rel="stylesheet" href="tw.css">
<link rel="stylesheet" href="hse_ui.css">
</head>
<body class="p-4 max-w-2xl mx-auto">
<header class="hd">
  <img src="logo-sm.png" alt="لوگو" onerror="this.style.display='none'">
  <div><h1>🎓 ماژول آموزش HSE</h1><div class="mu">بدو استخدام · دوره‌ای · حین کار · پس از حادثه · پیمانکاران</div></div>
  <div class="hd-act"><button id="btnNew" class="px-3 py-1.5 bg-emerald-600 text-slate-950 font-bold rounded-xl text-xs">+ ثبت جلسه</button><a href="index.html" class="back">← بازگشت</a></div>
</header>
<div id="err" class="hidden bg-red-950/40 border border-red-500/40 text-red-300 text-xs rounded-xl p-3 mb-3"></div>
<div id="stats" class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3"></div>
<details id="gap" class="bg-slate-800 border border-slate-700 rounded-xl mb-3 text-xs"><summary class="p-3 cursor-pointer" id="gapSum"></summary><div id="gapList" class="px-3 pb-3 text-slate-300"></div></details>
<select id="flt" class="fld mb-3"></select>
<div id="list" class="space-y-2 pb-10"><p class="text-center text-slate-400 text-sm py-6">در حال بارگذاری...</p></div>

<div id="modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
 <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 max-w-lg w-full max-h-[92vh] overflow-y-auto">
  <h2 class="font-bold mb-3">ثبت جلسه آموزشی</h2>
  <div class="space-y-2">
   <select id="fType" class="fld"></select>
   <input id="fTitle" class="fld" placeholder="عنوان دوره (مثلاً کار در ارتفاع)">
   <div class="grid grid-cols-2 gap-2"><div id="fDate" style="display:flex;gap:4px"><select id="dD" class="fld" style="width:30%"></select><select id="dM" class="fld"></select><select id="dY" class="fld" style="width:34%"></select></div><input id="fHours" type="number" min="0" step="0.5" value="1" class="fld" placeholder="مدت (ساعت)"></div>
   <input id="fTrainer" class="fld" placeholder="مدرس / برگزارکننده">
   <input id="fContr" class="fld hidden" placeholder="نام شرکت پیمانکار">
   <select id="fInc" class="fld hidden"></select>
   <input id="fSearch" class="fld" placeholder="جستجوی پرسنل شرکت‌کننده (نام یا کد)">
   <div id="fPick" class="max-h-36 overflow-y-auto bg-slate-900 rounded-xl border border-slate-700 text-xs"></div>
   <div id="fChips" class="flex flex-wrap gap-1 text-[11px]"></div>
   <textarea id="fExtra" rows="2" class="fld" placeholder="شرکت‌کنندگان خارج از بانک پرسنل (پیمانکاران) - هر نفر در یک خط"></textarea>
   <input id="fNotes" class="fld" placeholder="توضیحات (اختیاری)">
  </div>
  <div class="flex gap-2 mt-3"><button id="fSave" class="flex-1 py-2 bg-emerald-600 text-slate-950 font-bold rounded-xl text-sm">ثبت</button><button id="fCancel" class="px-4 py-2 bg-slate-700 rounded-xl text-sm">انصراف</button></div>
 </div>
</div>
<footer>نرم‌افزار جامع HSE &copy; 2026 - گسترش فناوری خوارزمی | طراح نرم‌افزار: <b>محمد اله رضایی</b></footer>
<script>
const URL_='https://priopguwfjawybffarhd.supabase.co',KEY='sb_publishable_fKFQePO9qiFhj4qU3Vq4lQ_OAFi7rfu';
const H={apikey:KEY,Authorization:`Bearer ${KEY}`},JH={...H,'Content-Type':'application/json'};
const $=id=>document.getElementById(id);
const T={onboarding:'بدو استخدام',periodic:'دوره‌ای',on_job:'حین کار',post_incident:'پس از حادثه',contractor:'پیمانکاران',safety_talk:'جلسه کوتاه ایمنی'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const fday=d=>{try{return new Date(d+'T00:00:00').toLocaleDateString('fa-IR',{dateStyle:'medium'})}catch(e){return d}};
const api=async(p,o)=>{const r=await fetch(`${URL_}/rest/v1/${p}`,{headers:H,...o});if(!r.ok)throw new Error(await r.text());const tx=await r.text();return tx?JSON.parse(tx):null};
let emps=[],trs=[],att=[],incs=[],sel=new Map();
const name=e=>`${e.first_name||''} ${e.last_name||''}`.trim();
async function load(){
  try{
    [emps,trs,att,incs]=await Promise.all([api('employees?select=*&limit=2000'),api('trainings?order=training_date.desc&limit=3000'),api('training_attendees?select=*&limit=20000'),api('clinic_incidents?select=id,incident_date,location&order=incident_date.desc&limit=200').catch(()=>[])]);
    $('err').classList.add('hidden');
  }catch(e){$('err').textContent='خطا: '+e.message+' — اگر جدول‌های trainings و training_attendees ساخته نشده، فایل training_setup.sql را در Supabase اجرا کنید.';$('err').classList.remove('hidden');trs=[];att=[]}
  render();
}
function render(){
  const ft=$('flt').value||'all',byT=t=>trs.filter(x=>x.training_type===t).length;
  const hrs=trs.reduce((s,t)=>s+(+t.duration_hours||0)*att.filter(a=>a.training_id===t.id).length,0);
  $('stats').innerHTML=[[trs.length,'جلسه'],[att.length,'حضور ثبت‌شده'],[fa(Math.round(hrs)),'نفر-ساعت'],[byT('post_incident'),'آموزش پس از حادثه']].map(([n,l])=>`<div class="bg-slate-800 border border-slate-700 rounded-xl p-2 text-center"><div class="text-lg font-bold text-emerald-400">${typeof n==='number'?fa(n):n}</div><div class="text-[11px] text-slate-400">${l}</div></div>`).join('');
  const cut=new Date(Date.now()-365*864e5).toISOString().slice(0,10),recent=new Set(trs.filter(t=>t.training_date>=cut).map(t=>t.id));
  const cov=new Set(att.filter(a=>recent.has(a.training_id)&&a.employee_id).map(a=>a.employee_id)),act=emps.filter(e=>HSEP.isActive(e)),miss=act.filter(e=>!cov.has(e.id));
  $('gapSum').textContent=`پوشش آموزش ۱۲ ماه اخیر: ${fa(act.length?Math.round(act.filter(e=>cov.has(e.id)).length/act.length*100):0)}٪ — ${fa(miss.length)} نفر بدون آموزش`;
  $('gapList').innerHTML=miss.slice(0,300).map(e=>`${esc(name(e))} (${esc(e.emp_id)}${e.department?' · '+esc(e.department):''})`).join('')||'همه پرسنل آموزش دیده‌اند.';
  const L=trs.filter(t=>ft==='all'||t.training_type===ft);
  $('list').innerHTML=L.length?L.map(t=>{const A=att.filter(a=>a.training_id===t.id),names=A.map(a=>{const e=emps.find(x=>x.id===a.employee_id);return e?name(e):a.person_name}).filter(Boolean);
   return `<details class="bg-slate-800 border border-slate-700 rounded-xl"><summary class="p-3 cursor-pointer flex justify-between gap-2"><div><p class="font-bold text-sm">${esc(t.title)}</p><p class="text-[11px] text-slate-400">${fday(t.training_date)} · ${fa(t.duration_hours||0)} ساعت${t.trainer?' · مدرس: '+esc(t.trainer):''}${t.contractor_name?' · پیمانکار: '+esc(t.contractor_name):''}</p></div><div class="text-left shrink-0"><span class="text-[11px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full">${T[t.training_type]}</span><div class="text-[11px] text-slate-400 mt-1">${fa(A.length)} نفر</div></div></summary>
   <div class="px-3 pb-3 text-xs text-slate-300 border-t border-slate-700 pt-2">${names.map(esc).join('، ')||'—'}${t.notes?`<p class="text-slate-400 mt-1">${esc(t.notes)}</p>`:''}<div class="mt-2 flex gap-4 items-center"><a href="training_print.html?id=${t.id}" target="_blank" class="text-emerald-400 text-[11px] font-bold">🖨 فرم چاپی (امضا)</a><button data-del="${t.id}" class="text-rose-400 text-[11px]">حذف جلسه</button></div></div></details>`}).join(''):'<p class="text-center text-slate-500 text-sm py-6">جلسه‌ای ثبت نشده.</p>';
}
$('flt').innerHTML='<option value="all">همه انواع آموزش</option>'+Object.entries(T).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
$('flt').onchange=render;
$('fType').innerHTML=Object.entries(T).map(([k,v])=>`<option value="${k}">آموزش ${v}</option>`).join('');
$('fType').onchange=()=>{$('fContr').classList.toggle('hidden',$('fType').value!=='contractor');$('fInc').classList.toggle('hidden',$('fType').value!=='post_incident')};
function chips(){$('fChips').innerHTML=[...sel.values()].map(e=>`<span class="bg-emerald-500/10 text-emerald-300 border border-emerald-500/30 rounded-full px-2 py-0.5">${esc(name(e))} ✕</span>`).join('');[...$('fChips').children].forEach((c,i)=>c.onclick=()=>{sel.delete([...sel.keys()][i]);chips();pick()})}
function pick(){const q=$('fSearch').value.trim().toLowerCase();$('fPick').innerHTML=emps.filter(e=>HSEP.isActive(e)&&(!q||(name(e)+' '+e.emp_id).toLowerCase().includes(q))).slice(0,40).map(e=>`<div data-p="${e.id}" class="px-3 py-1.5 cursor-pointer hover:bg-slate-700 ${sel.has(e.id)?'text-emerald-400':''}">${sel.has(e.id)?'✓ ':''}${esc(name(e))} <span class="text-slate-500">(${esc(e.emp_id)})</span></div>`).join('')}
$('fSearch').oninput=pick;
$('fPick').onclick=ev=>{const d=ev.target.closest('[data-p]');if(!d)return;const e=emps.find(x=>x.id===d.dataset.p);sel.has(e.id)?sel.delete(e.id):sel.set(e.id,e);chips();pick()};
/* تقویم شمسی: سه لیست سال/ماه/روز؛ ذخیره به‌صورت تاریخ میلادی ISO */
const JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const JF=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric',timeZone:'UTC'});
const toJ=d=>{const p=JF.formatToParts(d),g=t=>+p.find(x=>x.type===t).value;return[g('year'),g('month'),g('day')]};
function jToISO(y,m,d){const st=Date.UTC(y+621,2,17);for(let i=0;i<400;i++){const t=new Date(st+i*864e5),j=toJ(t);if(j[0]===y&&j[1]===m&&j[2]===d)return t.toISOString().slice(0,10)}return null}
function getDate(){const y=+$('dY').value,m=+$('dM').value;let d=+$('dD').value,iso=jToISO(y,m,d);if(!iso&&d>29){d=29;$('dD').value=29;iso=jToISO(y,m,d)}return iso}
function setDate(iso){const [y,m,d]=toJ(new Date(iso+'T00:00:00Z')),ty=toJ(new Date())[0];
  $('dY').innerHTML=[ty-1,ty,ty+1].map(v=>`<option value="${v}">${fa(v)}</option>`).join('');
  $('dM').innerHTML=JM.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('');
  $('dD').innerHTML=Array.from({length:31},(_,i)=>`<option value="${i+1}">${fa(i+1)}</option>`).join('');
  $('dY').value=y;$('dM').value=m;$('dD').value=d}
$('btnNew').onclick=()=>{sel.clear();chips();pick();setDate(new Date().toISOString().slice(0,10));
  $('fInc').innerHTML='<option value="">حادثه مرتبط (اختیاری)</option>'+incs.map(i=>`<option value="${i.id}">${fday((i.incident_date||'').slice(0,10))} - ${esc(i.location)}</option>`).join('');
  $('modal').classList.remove('hidden');$('modal').classList.add('flex')};
$('fCancel').onclick=()=>{$('modal').classList.add('hidden');$('modal').classList.remove('flex')};
$('fSave').onclick=async()=>{
  const title=$('fTitle').value.trim(),extra=$('fExtra').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!title||!getDate()||(!sel.size&&!extra.length)){alert('عنوان، تاریخ و حداقل یک شرکت‌کننده لازم است.');return}
  const ty=$('fType').value;
  try{
    const [t]=await api('trainings',{method:'POST',headers:{...JH,Prefer:'return=representation'},body:JSON.stringify({training_type:ty,title,training_date:getDate(),duration_hours:+$('fHours').value||0,trainer:$('fTrainer').value.trim()||null,contractor_name:ty==='contractor'?($('fContr').value.trim()||null):null,incident_id:ty==='post_incident'?($('fInc').value||null):null,notes:$('fNotes').value.trim()||null})});
    await api('training_attendees',{method:'POST',headers:{...JH,Prefer:'return=minimal'},body:JSON.stringify([...[...sel.keys()].map(id=>({training_id:t.id,employee_id:id})),...extra.map(n=>({training_id:t.id,person_name:n}))])});
    $('fCancel').onclick();['fTitle','fTrainer','fContr','fExtra','fNotes'].forEach(i=>$(i).value='');load();
  }catch(e){alert('خطا در ثبت: '+e.message)}
};
$('list').onclick=async ev=>{const id=ev.target.dataset.del;if(id&&confirm('این جلسه و فهرست حاضرین حذف شود؟')){try{await api('trainings?id=eq.'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}};
load();
</script>
</body>
</html>
