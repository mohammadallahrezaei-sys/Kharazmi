<!doctype html><html lang="fa" dir="rtl"><head><meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"><script src="auth.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فرم چاپی آموزش HSE</title><link rel="stylesheet" href="fonts.css"><style>*{box-sizing:border-box}body{margin:0;background:#e5e7eb;font-family:Vazirmatn,Tahoma,sans-serif;color:#000;font-size:12px;line-height:1.9}.bar{position:sticky;top:0;background:#0f172a;color:#fff;padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:5}.bar a,.bar button,.bar select{font-family:inherit;font-size:12px;padding:5px 12px;border-radius:8px;border:0;cursor:pointer;text-decoration:none}.bar button{background:#10b981;color:#052e16;font-weight:700}.bar a{background:#334155;color:#fff}.hint{font-size:11px;color:#cbd5e1}.pg{width:210mm;min-height:297mm;margin:10px auto;background:#fff;padding:12mm 12mm;position:relative}.hd{text-align:center;margin-bottom:6px}.hd .bs{font-size:12px}.hd h1{font-size:16px;margin:2px 0}.hd .org{font-size:12px}.logo{position:absolute;top:10mm;left:12mm;height:16mm}table{width:100%;border-collapse:collapse;margin:6px 0}td,th{border:1px solid #000;padding:3px 6px;vertical-align:top;text-align:right}th{background:#f1f5f9;font-weight:700}.sec{font-weight:800;background:#e2e8f0}.ed{display:inline-block;min-width:40px;border-bottom:1px dashed #94a3b8;outline:0}.ed:focus{background:#fef9c3}.blk{min-height:22px}.ck{font-family:sans-serif}ul.c{margin:2px 0;padding-inline-start:16px}ul.c li{margin:0}.sig td{height:34px}.cm{font-size:11px;text-align:justify}@media print{body{background:#fff}.bar{display:none}.pg{margin:0;box-shadow:none;page-break-after:always;width:auto;min-height:0;padding:0}.ed{border:0}@page{size:A4;margin:10mm}}</style></head><body><div class="bar np"><b>فرم چاپی آموزش</b> <select id="tpl"></select> <button onclick="print();">🖨 چاپ</button> <a href="training.html">← بازگشت</a> <span class="hint">خانه‌های خط‌چین را قبل از چاپ می‌توانید کلیک کنید و تایپ کنید (محل، هدف، عناوین و...).</span></div><div id="root"><div class="pg">در حال بارگذاری...</div></div><script src="train_lists.js"></script><script>const URL_="https://priopguwfjawybffarhd.supabase.co",KEY="sb_publishable_fKFQePO9qiFhj4qU3Vq4lQ_OAFi7rfu";const H={apikey:KEY,Authorization:`Bearer ${KEY}`};const api=async t=>{const e=await fetch(`${URL_}/rest/v1/${t}`,{headers:H});if(!e.ok)throw new Error(await e.text());return e.json()};const esc=t=>String(t??"").replace(/[&<>"']/g,t=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[t]));const fa=t=>String(t).replace(/\d/g,t=>"۰۱۲۳۴۵۶۷۸۹"[t]);const fd=t=>{try{return t?new Date(t.slice(0,10)+"T00:00:00").toLocaleDateString("fa-IR",{year:"numeric",month:"2-digit",day:"2-digit"}):""}catch(e){return t||""}};const T={onboarding:"بدو استخدام",periodic:"دوره‌ای",on_job:"حین کار",post_incident:"پس از حادثه",contractor:"پیمانکاران",safety_talk:"جلسه کوتاه ایمنی"};const TPL={L:"طرح درس + لیست امضا",S:"لیست حضور و امضا",O:"فرم آموزش توجیهی (هر نفر یک برگ)",P:"فرم آموزش پس از حادثه",C:"فرم آموزش پیمانکاران"};const DEF={periodic:"L",on_job:"S",onboarding:"O",post_incident:"P",contractor:"C",safety_talk:"S"};const SEV={minor:"جزئی",moderate:"متوسط",severe:"شدید",fatal:"فوتی"};const mk=(t,e)=>`<span class="ck">${(t.checks||[]).includes(e)?"☑":"☐"}</span> `;const ed=(t,e)=>`<span class="ed" contenteditable="true"${e?` style="min-width:${e}px"`:""}>${esc(t)}</span>`;const blk=(t,e)=>`<div class="ed blk" contenteditable="true" style="display:block;min-height:${e||22}px">${esc(t)}</div>`;let S,P,INC;const head=(t,e)=>`<img class="logo" src="logo.png" alt="" onerror="this.style.display='none'"><div class="hd"><div class="bs">بسمه تعالی</div><h1>${t}</h1><div class="org">شرکت گسترش فناوری خوارزمی${e?" — "+e:""}</div></div>`;const foot=(t,e,n)=>`<table class="sig"><tr><td>${t}<br><br></td><td>${e}<br><br></td><td>${n}<br><br></td></tr></table>`;const metaRow=(...t)=>`<tr>${t.map(([t,e])=>`<td><b>${t}:</b> ${e}</td>`).join("")}</tr>`;function sigTable(t,e){const n=Math.max(P.length+2,e||12);let a='<table><tr><th style="width:30px">ردیف</th>'+t.map(t=>`<th>${t[0]}</th>`).join("")+'<th style="width:90px">امضا</th></tr>';for(let e=0;e<n;e++){const n=P[e];a+=`<tr class="sig"><td>${fa(e+1)}</td>${t.map(t=>`<td>${n?esc(t[1](n)):""}</td>`).join("")}<td></td></tr>`}return a+"</table>"}const std=[["نام و نام خانوادگی",t=>t.name],["کد پرسنلی",t=>t.emp_id],["کد ملی",t=>t.nid],["عنوان شغلی",t=>t.job]];function tL(){const t=S.lesson||{},e=Array.isArray(t.topics)?t.topics:[],n=Array.isArray(t.sub)?t.sub:[];const a=Array.from({length:Math.max(7,e.length)},(t,n)=>{const a=e[n]||{};return`<tr><td>${blk(a.t||"",24)}</td><td>${blk(a.m||"",24)}</td><td>${blk(a.d||"",24)}</td><td>${blk(a.a||"",24)}</td></tr>`}).join("");return`<div class="pg">${head("فرم طرح درس آموزش HSE","واحد بهداشت، ایمنی و محیط زیست")}\n  <div style="text-align:left;font-size:11px">تاریخ: <b>${fd(S.training_date)}</b></div>\n  <table>\n   ${metaRow(["موضوع آموزشی",esc(S.title)],["محل آموزش",ed(t.place||"",120)])}\n   ${metaRow(["گروه هدف",ed(t.group||"",120)],["مدت آموزش",fa(S.duration_hours?Math.round(S.duration_hours*60):"")+" دقیقه"])}\n   ${metaRow(["تعداد فراگیران",fa(P.length)+" نفر"],["آموزش‌دهنده",esc(S.trainer||"")])}\n   <tr><td colspan="2"><b>هدف اصلی:</b>${blk(t.goal||"",44)}</td></tr>\n   <tr><td colspan="2"><b>اهداف فرعی:</b>${blk(n.map(t=>"- "+t).join("\n"),70)}</td></tr>\n  </table>\n  <table><tr><th>عناوین آموزشی</th><th style="width:22%">روش آموزش</th><th style="width:12%">مدت (دقیقه)</th><th style="width:22%">وسایل آموزشی</th></tr>${a}</table>\n  <table><tr><td><b>تکالیف فراگیران:</b>${blk(t.homework||"",34)}</td></tr><tr><td><b>ارزشیابی:</b>${blk(t.eval||"",34)}</td></tr></table>\n  ${S.notes?`<div class="cm">توضیحات: ${esc(S.notes)}</div>`:""}\n  </div>\n  <div class="pg">${head("لیست اسامی و امضای فراگیران",esc(S.title))}\n  <div style="text-align:left;font-size:11px">تاریخ: <b>${fd(S.training_date)}</b> | مدرس: <b>${esc(S.trainer||"")}</b></div>\n  ${sigTable(std,18)}</div>`}function tS(){const t=S.lesson||{};return`<div class="pg">${head("فرم آموزش و لیست حضور و امضا","آموزش "+T[S.training_type])}\n  <table>${metaRow(["موضوع آموزش",esc(S.title)],["تاریخ",fd(S.training_date)])}\n  ${metaRow(["محل آموزش",ed(t.place||"",120)],["مدت",fa(S.duration_hours?Math.round(S.duration_hours*60):"")+" دقیقه"])}\n  <tr><td colspan="2"><b>مدرس / برگزارکننده:</b> ${esc(S.trainer||"")}${S.contractor_name?` &nbsp;|&nbsp; <b>پیمانکار:</b> ${esc(S.contractor_name)}`:""}</td></tr>\n  <tr><td colspan="2"><b>عناوین آموزش داده‌شده:</b>${blk(S.notes||"",48)}</td></tr></table>\n  ${sigTable([["نام و نام خانوادگی",t=>t.name],["کد پرسنلی",t=>t.emp_id],["واحد / عنوان شغلی",t=>[t.dept,t.job].filter(Boolean).join(" / ")]],14)}\n  ${foot("نام و امضای مدرس:","نام و امضای مسئول واحد HSE:","نام و امضای مدیر واحد:")}</div>`}const CM=["رعایت نکات و دستورات HSE که در جلسه آموزشی فرا گرفته‌ام را در طول مدت خدمت در شرکت رعایت خواهم نمود.","هنگام کار با مواد شیمیایی، همیشه دستورالعمل‌های ایمنی مربوط به هر ماده را رعایت کرده، از ریخت‌وپاش یا مخلوط کردن مواد بدون مجوز و آموزش خودداری خواهم کرد.","در صورت داشتن بیماری مزمن از قبیل صرع، قند خون، سرگیجه‌های مزمن و ... موارد را با واحد HSE در میان خواهم گذاشت.","قبل از شروع فعالیت، بسته به نوع کار، تجهیزات حفاظت فردی مناسب را تحویل گرفته و خود را ملزم به استفاده از آنها می‌دانم.","هنگام کار با مواد شیمیایی، از تجهیزات حفاظت فردی مربوطه استفاده خواهم نمود.","در هنگام فعالیت در ارتفاع، از کمربند ایمنی استفاده خواهم نمود.","به علائم هشداردهنده نصب‌شده در کارخانه توجه کامل خواهم نمود.","از دست‌کاری سیستم‌های برقی و تابلو برق خودداری خواهم نمود.","از کشیدن سیگار در تمامی محیط کارخانه خودداری خواهم نمود.","هرگز از ابزار و وسایل معیوب استفاده نخواهم کرد و در صورت خرابی، تعمیر آن را بر عهده تعمیرکار مربوطه خواهم گذاشت.","هرگز ابزار کار و وسایل خود را در محل‌های مرتفع که احتمال افتادن آنها وجود دارد، رها نخواهم کرد.","از دویدن و شوخی در محیط کار خودداری خواهم کرد.","در صورت مشاهده موارد و شرایط ناایمن، بلافاصله نفرات HSE را مطلع خواهم نمود.","از وسایل و دستگاه‌هایی که توان استفاده و تخصص لازم در آن را ندارم استفاده نخواهم کرد.","در صورت مشاهده شبه‌حادثه، آن را حتماً به واحد HSE اعلام خواهم نمود.","در صورت بروز حادثه در محل کار، مراتب را سریعاً به سرپرست خود اطلاع خواهم داد تا مراحل قانونی انجام گردد.","آشغال‌های موجود را در سطل‌های زباله تعبیه‌شده در قسمت‌های مختلف کارخانه ریخته و نظافت را رعایت خواهم نمود.","پس از اتمام کار نسبت به جمع‌آوری ابزار کار و نظافت محدوده کاری و چیدمان صحیح آنها اقدام خواهم نمود.","از انجام کارهای خطرناک که باعث به خطر افتادن سلامتی خود و دیگران می‌شود، اجتناب کرده و یا با هماهنگی واحد HSE انجام خواهم داد."];function tO(){const t=S.lesson||{},e=OB.length/2;const n=Array.from({length:e},(n,a)=>`<tr><td>${mk(t,a)}${OB[a]}</td><td>${mk(t,a+e)}${OB[a+e]}</td></tr>`).join("");return(P.length?P:[{}]).map(e=>`<div class="pg">${head("فرم آموزش توجیهی HSE","بدو استخدام / حین انتقال / پس از حادثه / پیمانکار")}\n  <table>\n   <tr><td class="sec" rowspan="1" style="width:90px">الف) مشخصات فردی</td><td><b>نام و نام خانوادگی:</b> ${esc(e.name||"")}</td><td><b>شماره پرسنلی:</b> ${esc(e.emp_id||"")}</td><td><b>واحد/قسمت:</b> ${esc(e.dept||"")}</td></tr>\n   <tr><td class="sec">ب) مشخصات دوره آموزشی</td><td><b>تاریخ آموزش:</b> ${fd(S.training_date)}</td><td><b>مدت آموزش:</b> ${fa(S.duration_hours?Math.round(S.duration_hours*60):"")} دقیقه</td><td><b>محل برگزاری:</b> ${ed(t.place||"",90)}</td></tr>\n  </table>\n  <table><tr><td class="sec" colspan="2">ج) محتوای آموزشی (موارد آموزش داده‌شده را علامت بزنید)</td></tr>${n}\n   <tr><td colspan="2"><b>آموزش حین کار</b> — تاریخ: ${ed("",70)} محل آموزش: ${ed("",90)}<br>عناوین آموزش داده‌شده: ${ed("",320)}</td></tr></table>\n  <table><tr><td class="sec">د) تعهدنامه آموزشی</td></tr><tr><td class="cm">\n   اینجانب <b>${esc(e.name||"..........................")}</b> فرزند <b>${esc(e.father||"..............")}</b> از تاریخ ${ed("",80)} جهت شغل <b>${esc(e.job||"..............")}</b> در شرکت گسترش فناوری خوارزمی مشغول به کار گشته و در جلسه آموزش توجیهی HSE شرکت نموده و با <b>قوانین ایمنی، بهداشتی و محیط‌زیستی</b> آن آشنایی پیدا کرده‌ام و همچنین <b>تعهد می‌نمایم</b> که کلیه قوانین عنوان‌شده در جلسه آموزشی توجیهی HSE و نیز موارد ذیل را رعایت نموده و در صورت تخلف از قوانین مذکور این اختیار را به شرکت خواهم داد که مطابق آیین‌نامه کمیته انضباطی با اینجانب برخورد گردد.\n   <ul class="c">${CM.map(t=>`<li>${t}</li>`).join("")}</ul></td></tr></table>\n  <table class="sig"><tr><td>نام و نام خانوادگی فرد آموزش‌دیده: ${esc(e.name||"")}<br>امضا و اثر انگشت:<br><br></td><td>نام و نام خانوادگی مدرس: ${esc(S.trainer||"")}<br>امضاء:<br><br></td><td>نام و نام خانوادگی مسئول واحد HSE:<br>امضاء:<br><br></td></tr></table></div>`).join("")}function tP(){const t=S.lesson||{},e=INC||{},n=String(e.description||"").replace(/\n?\[[^\]]*\]/g,"").trim();return`<div class="pg">${head("فرم آموزش پس از حادثه","واحد بهداشت، ایمنی و محیط زیست")}\n  <table><tr><td class="sec" colspan="3">الف) مشخصات حادثه</td></tr>\n   ${metaRow(["تاریخ حادثه",e.incident_date?fd(e.incident_date):ed("",80)],["محل حادثه",esc(e.location||"")||ed("",90)],["شدت",SEV[e.severity]||ed("",50)])}\n   ${metaRow(["حادثه‌دیده",esc(e.victim||"")||ed("",90)],["عضو آسیب‌دیده",esc(e.body_part||"")||ed("",70)],["گزارش به تأمین اجتماعی",e.social_security_reported?"بله":"خیر / نامشخص"])}\n   <tr><td colspan="3"><b>شرح حادثه:</b>${blk(n,40)}</td></tr>\n   <tr><td colspan="3"><b>عوامل ناایمن (عمل / شرایط):</b>${blk([e.unsafe_act,e.unsafe_condition].filter(Boolean).join(" — "),30)}</td></tr>\n   <tr><td colspan="3"><b>علت ریشه‌ای:</b>${blk(t.root||"",28)}</td></tr>\n   <tr><td colspan="3"><b>اقدام اصلاحی:</b>${blk(e.corrective_action||"",28)}</td></tr></table>\n  <table><tr><td class="sec" colspan="2">ب) مشخصات آموزش</td></tr>\n   ${metaRow(["موضوع",esc(S.title)],["تاریخ آموزش",fd(S.training_date)])}\n   ${metaRow(["مدت",fa(S.duration_hours?Math.round(S.duration_hours*60):"")+" دقیقه"],["محل برگزاری",ed(t.place||"",100)])}\n   <tr><td colspan="2"><b>مدرس:</b> ${esc(S.trainer||"")}</td></tr></table>\n  <table><tr><td class="sec">ج) محورهای آموزش (علامت بزنید)</td></tr>${PI.map((e,n)=>`<tr><td>${mk(t,n)}${e}</td></tr>`).join("")}\n   <tr><td><span class="ck">${t.other?"☑":"☐"}</span> سایر: ${ed(t.other||"",300)}</td></tr></table>\n  <div class="cm">اینجانب با امضای این برگ تأیید می‌کنم در جلسه آموزشی بالا شرکت کرده و علل حادثه و روش‌های پیشگیری از تکرار آن را فراگرفته‌ام و آنها را رعایت خواهم نمود.</div></div>\n  <div class="pg">${head("لیست حاضرین آموزش پس از حادثه",esc(S.title))}\n  <div style="text-align:left;font-size:11px">تاریخ آموزش: <b>${fd(S.training_date)}</b></div>\n  ${sigTable(std,15)}${foot("نام و امضای مدرس:","نام و امضای مسئول واحد HSE:","نام و امضای مدیر واحد:")}</div>`}function tC(){const t=S.lesson||{};return`<div class="pg">${head("فرم آموزش ایمنی پیمانکاران","واحد بهداشت، ایمنی و محیط زیست")}\n  <table>${metaRow(["شرکت پیمانکار",esc(S.contractor_name||"")||ed("",120)],["تاریخ آموزش",fd(S.training_date)])}\n  ${metaRow(["محدوده کار / پروژه",ed(t.scope||"",150)],["مدت آموزش",fa(S.duration_hours?Math.round(S.duration_hours*60):"")+" دقیقه"])}\n  ${metaRow(["محل برگزاری",ed(t.place||"",120)],["مدرس",esc(S.trainer||"")])}</table>\n  <table><tr><td class="sec" colspan="2">محتوای آموزشی (علامت بزنید)</td></tr>\n  ${Array.from({length:CT.length/2},(e,n)=>`<tr><td>${mk(t,n)}${CT[n]}</td><td>${mk(t,n+CT.length/2)}${CT[n+CT.length/2]}</td></tr>`).join("")}</table>\n  <div class="cm"><b>تعهدنامه:</b> اینجانبان با امضای ذیل تأیید می‌نماییم که در جلسه آموزش ایمنی شرکت گسترش فناوری خوارزمی شرکت کرده و مطالب فوق را فراگرفته‌ایم و متعهد می‌شویم قوانین HSE کارخانه، دستورات واحد HSE و شرایط مجوز کار را رعایت نماییم. در صورت تخلف، شرکت مجاز به توقف کار و برخورد مطابق قرارداد خواهد بود.</div>\n  ${sigTable([["نام و نام خانوادگی",t=>t.name],["کد ملی",t=>t.nid],["سمت / تخصص",t=>t.job],["شماره تماس",t=>t.phone]],12)}\n  <table class="sig"><tr><td>نماینده پیمانکار — نام و امضا:</td><td>مدرس — نام و امضا:</td><td>مسئول واحد HSE — نام و امضا:</td></tr></table></div>`}const F={L:tL,S:tS,O:tO,P:tP,C:tC};function draw(){$("root").innerHTML=F[$("tpl").value]()}const $=t=>document.getElementById(t);(async()=>{const t=new URLSearchParams(location.search).get("id");if(!t){$("root").innerHTML='<div class="pg">شناسه جلسه مشخص نیست. از صفحه‌ی آموزش، دکمه‌ی «فرم چاپی» را بزنید.</div>';return}try{[S]=await api("trainings?id=eq."+encodeURIComponent(t));if(!S)throw new Error("جلسه پیدا نشد");const e=await api("training_attendees?training_id=eq."+encodeURIComponent(t)+"&select=*");const n=e.map(t=>t.employee_id).filter(Boolean);const a=n.length?await api("employees?select=*&id=in.("+n.join(",")+")"):[];P=e.map(t=>{const e=a.find(e=>e.id===t.employee_id);return e?{name:`${e.first_name||""} ${e.last_name||""}`.trim(),emp_id:e.emp_id||"",nid:e.national_id||"",job:e.job_title||"",dept:e.department||"",father:e.father_name||"",phone:e.phone_mobile||""}:{name:t.person_name||"",emp_id:"",nid:"",job:"",dept:"",father:"",phone:""}});P.sort((t,e)=>String(t.emp_id).localeCompare(String(e.emp_id),undefined,{numeric:true}));if(S.incident_id){try{[INC]=await api("clinic_incidents?id=eq."+S.incident_id+"&select=*");if(INC&&INC.employee_id){const[t]=await api("employees?select=first_name,last_name&id=eq."+INC.employee_id);if(t)INC.victim=`${t.first_name||""} ${t.last_name||""}`.trim()}}catch(t){}}$("tpl").innerHTML=Object.entries(TPL).map(([t,e])=>`<option value="${t}">${e}</option>`).join("");$("tpl").value=DEF[S.training_type]||"S";$("tpl").onchange=draw;draw()}catch(t){$("root").innerHTML='<div class="pg">خطا: '+esc(t.message)+"</div>"}})();</script></body></html>
