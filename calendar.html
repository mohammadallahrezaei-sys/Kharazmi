<script>
const URL_='https://priopguwfjawybffarhd.supabase.co',KEY='sb_publishable_fKFQePO9qiFhj4qU3Vq4lQ_OAFi7rfu';
const {SCHED,MODS,EQC,EQ_START}=window.HSE_SCHED;
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WD=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const WORKDAYS=[6,0,1,2,3]; /* شنبه تا چهارشنبه (تعطیلات رسمی تقویم در برنامه لحاظ نشده) */
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const PF=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric',timeZone:'UTC'});
const jal=d=>{const p=PF.formatToParts(d),g=t=>+p.find(x=>x.type===t).value;return[g('year'),g('month'),g('day')]};
const kOf=d=>{const j=jal(d);return j[0]+'-'+String(j[1]).padStart(2,'0')};
const today=new Date().toLocaleDateString('en-CA');
const nowK=kOf(new Date(today+'T12:00:00Z'));
const addDays=(iso,n)=>new Date(new Date(iso+'T12:00:00Z').getTime()+n*864e5).toISOString().slice(0,10);
const addM=(iso,n)=>{const d=new Date(iso+'T12:00:00Z');d.setUTCMonth(d.getUTCMonth()+n);return d.toISOString().slice(0,10)};
const dowOf=iso=>new Date(iso+'T12:00:00Z').getUTCDay();
const isWork=iso=>WORKDAYS.includes(dowOf(iso));
const lbl=iso=>new Date(iso+'T12:00:00Z').toLocaleDateString('fa-IR',{day:'numeric',month:'long',timeZone:'UTC'});
const TICK_START='2026-10-28';
const _MD={};
function monthDays(K){if(_MD[K])return _MD[K];const y=+K.slice(0,4),st=Date.UTC(y+621,2,10),o=[];
  for(let i=0;i<400;i++){const t=new Date(st+i*864e5),j=jal(t);if(j[0]+'-'+String(j[1]).padStart(2,'0')===K)o.push({iso:t.toISOString().slice(0,10),j:j[2]})}return _MD[K]=o}
const prevK=K=>{let y=+K.slice(0,4),m=+K.slice(5)-1;if(m<1){m=12;y--}return y+'-'+String(m).padStart(2,'0')};
const nextK=K=>{let y=+K.slice(0,4),m=+K.slice(5)+1;if(m>12){m=1;y++}return y+'-'+String(m).padStart(2,'0')};

const MODT={CR:'جرثقیل',LF:'بالابر',FK:'لیفتراک',PV:'مخزن تحت فشار',AC:'اتوکلاو',BL:'دیگ بخار',PJ:'جک پالت'};
let TICKS=new Set(),HTK=new Set(),RKP=null,CTR=[],INS=[],EQ=[],EQ_COL=true,K=nowK,SEL=today,TASKS=[],OBL=[],PROC=[],HRT=null,X={ek:[],tk:[],inc:[],fin:[],fu:[],on:false};
if(/[?&]embed=1/.test(location.search)){document.documentElement.classList.add('emb')}

async function hd(){let t=KEY;try{t=(await HSEAuth.token())||KEY}catch(e){}return{apikey:KEY,Authorization:'Bearer '+t}}
const getAll=t=>HSEDB.getAll(t);

async function load(){
  const since=HSEToday(-500),base='inspections?select=module,location,created_at&order=created_at.desc&created_at=gte.'+since;
  let ins=await getAll(base.replace('location,','location,equipment_code,'));
  if(!ins){EQ_COL=false;ins=await getAll(base)||[]}
  INS=ins.map(x=>({m:x.module,loc:x.location||'',code:x.equipment_code||null,d:new Date(x.created_at).toLocaleDateString('en-CA')}));
  /* برنامهٔ ارزیابی ریسک سوله‌ها: ایمنی برای کارشناس، بهداشتی و ارگونومی برای مدیر (risk_plan.js) */
  RKP=null;if(window.HSERiskPlan&&(HSEAuth.role==='expert'||HSEAuth.role==='manager')){const [ru,rr,rp]=await Promise.all([getAll('hse_units?select=id,name,aliases,active').catch(()=>null),getAll('risks?select=unit,category,status').catch(()=>null),getAll('risk_plan?select=*').catch(()=>null)]);if(ru&&rr)RKP={units:ru,risks:rr,rows:rp||[]}}
  HTK=new Set((await getAll("daily_ticks?select=tick_date&key=eq.hrtrain").catch(()=>null)||[]).map(x=>String(x.tick_date).slice(0,10)));
  TICKS=new Set((await getAll("daily_ticks?select=tick_date&key=eq.chlorination").catch(()=>null)||[]).map(x=>String(x.tick_date).slice(0,10)));
  CTR=(await getAll('contractors?select=id,name,contract_no,scope,start_date,end_date,status').catch(()=>null)||[]).filter(c=>c.start_date);
  try{const R=await computeHR();HRT=R?R.list.filter(p=>p.actions.some(a=>a.startsWith('آموزش'))):[]}catch(e){HRT=null}
  OBL=(await getAll('hse_obligations?select=id,title,next_due,active').catch(()=>null)||[]).filter(o=>o.active!==false&&o.next_due);
  PROC=HSEAuth.role==='manager'?(await getAll('hse_procedures?select=id,title,status,target_date,active').catch(()=>null)||[]).filter(p=>p.active!==false&&p.status!=='approved'&&p.target_date):[];
  const cats=[...new Set(Object.values(EQC).flatMap(v=>v[0]))];
  EQ=await getAll('equipment?select=code,title,category,hall&active=eq.true&category=in.('+cats.map(c=>'"'+c+'"').join(',')+')&order=code.asc')||[];
  /* کارهای دیگری که در امتیاز کارشناس حساب می‌شوند (فقط برای ورود کارشناس) */
  const ME=HSEAuth.role==='expert'?HSEAuth.email:HSEAuth.role==='manager'?Object.keys(HSEAuth.EXPERTS||{})[0]:'';
  if(ME){const me=encodeURIComponent(ME),g=q=>getAll(q).catch(()=>null);
    const [ek,tk,inc,fin]=await Promise.all([g('ekhtars?select=record_type,record_date&registered_by=eq.'+me),
      g('trainings?select=training_date,trainer&training_type=eq.safety_talk&training_date=gte.'+since),
      g('clinic_incidents?select=id,incident_date,expert_opinion,description&incident_date=gte.'+since).then(r=>r||g('clinic_incidents?select=id,incident_date,description&incident_date=gte.'+since)),
      g('findings?select=id,question,note,status,due_date,assigned_to,assigned_at&module=neq.MED&status=neq.cancelled&or=(inspector.eq.'+me+',assigned_to.eq.'+me+')')]);
    const ofin=(await g('findings?select=id,question,note,created_at,notice_code&status=eq.open&module=neq.MED')||[]).filter(f=>{const n=String(f.notice_code||'').trim();return n&&n.toUpperCase()!=='NOTICED'}),ffu=ofin.length?await g('finding_followups?select=finding_id,next_due,followed_at&order=followed_at.desc'):[];
    const lastFu={};(ffu||[]).forEach(f=>{if(!lastFu[f.finding_id])lastFu[f.finding_id]=f});
    X.fu=ofin.map(f=>{const l=lastFu[String(f.id)];return{id:f.id,txt:String(f.note||f.question||'').split('|')[0].trim().slice(0,60),due:l&&l.next_due?String(l.next_due).slice(0,10):HSEC.defDue(new Date(f.created_at).toLocaleDateString('en-CA')),n:l?1:0}});
    X={fu:X.fu,ek:ek||[],tk:(tk||[]).filter(x=>!/رضایی/.test(x.trainer||'')),inc:inc||[],fin:fin||[],on:true}}
  $('warn').innerHTML=EQ_COL?'':'<div class="cerr">ستون کد تجهیز در جدول بازدیدها نیست؛ فایل <b>hse_inspections_equipment.sql</b> را در Supabase اجرا کنید تا بازدید هر دستگاه تیک بخورد. فعلاً فقط کارهای روزانه و ماهانه‌ی جدول تیک می‌خورند.</div>';
}
/* روز کاری نزدیک به تاریخ هدف داخل ماه (اول عقب‌تر، بعد جلوتر) */
function adjust(iso,days){let i=days.findIndex(d=>d.iso===iso);if(i<0)i=iso<days[0].iso?0:days.length-1;
  for(let k=i;k>=0;k--)if(isWork(days[k].iso))return days[k].iso;for(let k=i;k<days.length;k++)if(isWork(days[k].iso))return days[k].iso;return days[i].iso}
const doneOn=(mk,a,b)=>INS.filter(x=>mk.includes(x.m)&&x.d>=a&&x.d<=b).map(x=>x.d).sort().pop()||null;

function build(K){
  const days=monthDays(K),a=days[0].iso,b=days[days.length-1].iso,T=[];
  /* ۱) کارهای روزانه */
  days.filter(d=>isWork(d.iso)).forEach(d=>{
    T.push({id:'D'+d.iso,date:d.iso,due:d.iso,t:'بازدید روزانه ایمنی (گشت کل کارخانه)',sub:'روزانه',mk:'D',done:INS.some(x=>x.m==='D'&&x.d===d.iso),kind:'daily'});
    if(K>='1405-07'&&K<='1405-12')T.push({id:'K'+d.iso,date:d.iso,due:d.iso,t:'رستوران و آشپزخانه',sub:'روزانه',mk:'KIT',done:INS.some(x=>x.m==='KIT'&&x.d===d.iso),kind:'daily'})});
  /* ۲) چک‌لیست‌های ماهانه‌ی جدول (ردیف‌های هم‌چک‌لیست ادغام می‌شوند؛ تجهیزات حیاتی در بخش سررسید دستگاه‌ها می‌آیند) */
  const EQROWS=new Set(Object.keys(EQC).flatMap(k=>MODS[k]||[])),groups={};
  SCHED.forEach((it,i)=>{if(it.daily||EQROWS.has(i))return;const mk=Object.keys(MODS).filter(k=>MODS[k].includes(i));if(!mk.length)return;
    const inT=K>='1405-07'&&K<='1405-12',w=inT?it.m[K]:((!it.every||(+K.slice(5))%it.every===it.phase%it.every)?it.m['1405-10']||it.m['1405-09']:null);if(!w)return;const sig=mk.join(',');
    const g=groups[sig]||(groups[sig]={mk,t:[],a:w[0],b:w[1]});if(!g.t.includes(it.t))g.t.push(it.t);g.a=Math.min(g.a,w[0]);g.b=Math.max(g.b,w[1])});
  Object.values(groups).forEach(g=>{const A=Math.min(g.a,days.length),B=Math.min(g.b,days.length),pl=A+(B-A>4?Math.floor((B-A)/4):0),
    plan=adjust(days[pl-1].iso,days),due=days[B-1].iso,dn=doneOn(g.mk,a,b);
    T.push({id:'M'+g.mk,date:plan,due,t:g.t.join(' و '),sub:'مهلت: '+lbl(due)+(A!==B?' (بازه‌ی '+fa(A)+' تا '+fa(B)+')':''),mk:g.mk[0],done:!!dn,doneAt:dn,kind:'month'})});
  /* ۳) سررسید بازدید هر دستگاه */
  const SP=HSE_SCHED.spread(Object.fromEntries(Object.entries(EQC).map(([mk,[cs]])=>[mk,EQ.filter(e=>cs.includes(e.category)).map(e=>e.code)])));
  if(EQ_COL)for(const [mk,[cs,n]] of Object.entries(EQC)){
    const list=EQ.filter(e=>cs.includes(e.category)),last={};INS.filter(x=>x.m===mk&&x.code).forEach(x=>{if(!last[x.code]||x.d>last[x.code])last[x.code]=x.d});
    list.forEach((e,i)=>{
      const visits=INS.filter(x=>x.m===mk&&x.code===e.code&&x.d>=a&&x.d<=b).map(x=>x.d);
      visits.forEach(v=>T.push({id:'E'+mk+e.code+v,date:v,due:v,t:`بازدید ${MODT[mk]} — ${e.code}`,sub:e.title||'',mk,code:e.code,title:e.title,hall:e.hall,done:true,doneAt:v,kind:'equip'}));
      if(visits.length)return;
      let due=last[e.code]?addM(last[e.code],n):SP[mk+'|'+e.code];
      if(K>nowK)while(due<a)due=addM(due,n); /* ماه‌های آینده: تکرار دوره‌ای برنامه */
      if(due>b)return;
      T.push({id:'E'+mk+e.code,date:adjust(due<a?a:due,days),due,t:`بازدید ${MODT[mk]} — ${e.code}`,sub:(e.title||'')+' · سررسید: '+lbl(due),mk,code:e.code,title:e.title,hall:e.hall,done:false,kind:'equip'})});
  }
  /* ۳-آ) روشن‌کردن روزانهٔ سیستم کلرزنی تصفیه‌خانه: فقط تیک زده می‌شود و در آمار می‌آید */
  if(HSEAuth.role&&days)days.filter(d=>isWork(d.iso)&&d.iso>=TICK_START).forEach(d=>T.push({id:'CL'+d.iso,date:d.iso,due:d.iso,t:'روشن کردن سیستم کلرزنی تصفیه‌خانه',sub:'روزانه · فقط تیک بزنید',done:TICKS.has(d.iso),kind:'daily',tick:'chlorination'}));
  /* ۳-ب) چک‌لیست روزانهٔ پیمانکاران حاضر در کارخانه (از روز ورود تا ثبت پایان کار) */
  CTR.forEach(c=>{const s=c.start_date,e=c.end_date||(c.status==='finished'?s:b);
    days.filter(d=>isWork(d.iso)&&d.iso>=s&&d.iso<=e).forEach(d=>T.push({id:'CT'+c.id+d.iso,date:d.iso,due:d.iso,t:'چک‌لیست ایمنی پیمانکار — '+c.name,sub:'روزانه · '+(c.scope||'').slice(0,50),mk:'CT',done:INS.some(x=>x.m==='CT'&&x.d===d.iso&&x.loc.includes(c.name)),kind:'daily',go:'checklists.html#visit=CT&ctr='+encodeURIComponent(c.name)+'&cno='+encodeURIComponent(c.contract_no||'')}))});
  /* ۳-پ) ارزیابی ریسک سوله‌ها: هر سوله یک «بازه» دارد (بر اساس تعداد تجهیز و پرسنل؛ جدول risk_plan که مدیر در صفحهٔ ثبت ریسک می‌سازد).
        ایمنی ← کارشناس · بهداشتی و ارگونومی ← مدیر. با ثبت ریسک برای هر حوزه، آن حوزه از برنامه خارج می‌شود (risk_plan.js) */
  if(RKP){HSERiskPlan.tasks(RKP.rows,RKP.units,RKP.risks,HSEAuth.role,{isWork,addDays,today,a,b}).forEach(x=>{const k=x.rk;
      T.push({...x,sub:'بازه: '+lbl(k.start)+' تا '+lbl(k.end)+(k.late?' · بازه تمام شده و ارزیابی ثبت نشده':' · روز '+fa(k.idx)+' از '+fa(k.n))+' · '+fa(k.eq)+' تجهیز · '+fa(k.ppl)+' نفر پرسنل'})});
    if(HSEAuth.role==='manager'&&!RKP.rows.length&&HSERiskPlan.anyPending(RKP.units,RKP.risks)&&today>=a&&today<=b)T.push({id:'RKP0',date:today,due:today,t:'برنامهٔ ارزیابی ریسک سوله‌ها هنوز تدوین نشده',sub:'بازهٔ هر سوله را بر اساس تعداد تجهیز و پرسنل بسازید',mk:'RK',done:false,kind:'month',go:'risks.html'})}
  /* ۴) کارهای مؤثر بر امتیاز: آموزش کوتاه هفتگی، اخطار/تشویق، نظر حادثه، عدم‌انطباق و ارجاع‌ها */
  if(X.on){
    const wk=iso=>addDays(iso,-((dowOf(iso)+1)%7)),pre=K.replace('-','/')+'/',nz=s=>String(s||'').replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c));
    const inM=iso=>iso>=a&&iso<=b,wd=days.filter(d=>isWork(d.iso));

  const me=String(HSEAuth.email||'').toLowerCase(),since=HSEToday(-500),g=q=>getAll(q).catch(()=>null);
  const [wl,vr,tr,cm,inc,fup,rk,cd,eq,eqi,cu,ob]=await Promise.all([
    g('work_log?select=work_date,created_by'),g('verify_rounds?select=week_start,result'),
    g('trainings?select=training_date,training_type,title&training_date=gte.'+since),
    g('committee_meetings?select=jdate,next_date&order=jdate.desc'),
    g('clinic_incidents?select=id,incident_date,corrective_action,action_status,action_due_date'),g('clinic_followups?select=*').then(r=>HSEAuth.visibleFollowups(r)),
    g('risks?select=id,status,review_date&status=neq.archived'),g('hse_cards?select=id,card_date,status&status=eq.pending'),
    g('equipment?select=code,requires_inspection,interval_months&active=eq.true'),g('equipment_inspections?select=equipment_code,inspected_on,result,next_due'),
    g('culture_assessments?select=assessed_at'),g('hse_obligations?select=id,title,next_due,active')]);
  /* برنامهٔ ارزیابی ریسک سوله‌ها (risk_plan.js): برای مدیر، حوزه‌های بهداشتی و ارگونومی */
  RKP=null;if(window.HSERiskPlan){const [ru,rr,rp]=await Promise.all([g('hse_units?select=id,name,aliases,active'),g('risks?select=unit,category,status'),g('risk_plan?select=*')]);if(ru&&rr)RKP={units:ru,risks:rr,rows:rp||[]}}
  const own=(wl||[]).filter(x=>String(x.created_by||'').toLowerCase()===me).map(x=>d10(x.work_date));
  MG={wlOk:wl!==null,wl:new Set(own),wlFirst:own.slice().sort()[0]||today,vr:vr||[],vrFirst:(vr||[]).map(r=>d10(r.week_start)).sort()[0]||wkOf(today),
    tr:tr||[],cm:cm||null,inc:inc||[],fup:fup||[],rk:rk||[],cd:cd||[],eq:eq||[],eqi:eqi||[],cu:cu||[],ob:(ob||[]).filter(o=>o.active!==false&&o.next_due)};
  $('warn').innerHTML=MG.wlOk?'':'<div class="cerr">جدول کارهای روزانه ساخته نشده؛ فایل <b>hse_worklog.sql</b> را یک‌بار در Supabase اجرا کنید.</div>';
}
function buildMgr(K){
  const days=monthDays(K),a=days[0].iso,b=days[days.length-1].iso,T=[],wd=days.filter(d=>isWork(d.iso)),inM=iso=>iso>=a&&iso<=b,cur=K===nowK,lastW=wd[wd.length-1].iso;
  /* ۱) ثبت کارهای روزانه (از اولین ثبت خودِ مدیر؛ شاخص «ثبت و گزارش کارهای روزانه» در ارزیابی) */
  wd.forEach(d=>{if(d.iso<MG.wlFirst)return;T.push({id:'WL'+d.iso,date:d.iso,due:d.iso,t:'ثبت گزارش کارهای روزانه',sub:'شاخص «ثبت و گزارش کارهای روزانه»',done:MG.wl.has(d.iso),kind:'daily',go:'worklog.html'})});
  /* ۲) بازدید تأییدی هفتگی از کار کارشناس (از اولین هفته‌ی ثبت‌شده) */
  const weeks={};wd.forEach(d=>{(weeks[wkOf(d.iso)]=weeks[wkOf(d.iso)]||[]).push(d.iso)});
  Object.entries(weeks).forEach(([ws,l])=>{const last=l[l.length-1];if(ws<MG.vrFirst)return;
    T.push({id:'WV'+ws,date:last,due:last,t:'بازدید تأییدی هفتگی از بازدید کارشناس',sub:'برنامه‌ریزی و ثبت نتیجه در «بازدید تأییدی هفتگی»',done:MG.vr.some(r=>d10(r.week_start)===ws&&r.result!=='planned'),kind:'score',go:'weekly_verify.html'})});
  /* ۳) آموزش ماهانه: حداقل ۴ جلسه (همان حداقل ارزیابی) */
  const trn=MG.tr.filter(t=>inM(d10(t.training_date))&&t.training_type!=='safety_talk').length;
  for(let i=0;i<4;i++)T.push({id:'TM'+i,date:lastW,due:lastW,t:`برگزاری جلسه آموزشی (${fa(i+1)} از ۴)`,sub:'شاخص «آموزش» · مهلت: '+lbl(lastW),done:trn>=i+1,kind:'score',go:'training.html'});
  /* ۴) جلسه‌ی کمیته: تاریخ جلسه‌ی بعدی ثبت‌شده در آخرین صورتجلسه */
  const lm=MG.cm&&MG.cm[0],nx=lm&&jIso(lm.next_date);
  if(nx&&(inM(nx)||(nx<a&&cur)))T.push({id:'CM'+nx,date:adjust(nx<a?a:nx,days),due:nx,t:'برگزاری جلسه‌ی کمیته حفاظت فنی',sub:'تاریخ ثبت‌شده در صورتجلسه: '+lbl(nx),done:false,kind:'month',go:'committee.html'});
  /* ۵) اقدام اصلاحی حوادث و پیگیری طب کار (هر مورد لینک مستقیم دارد) */
  MG.inc.filter(x=>x.corrective_action&&x.action_due_date).forEach(x=>{const due=d10(x.action_due_date),dn=x.action_status==='done';if(!(inM(due)||(due<a&&cur&&!dn)))return;
    T.push({id:'IC'+x.id,date:adjust(due<a?a:due,days),due,t:'اقدام اصلاحی حادثه: '+String(x.corrective_action).slice(0,50),sub:'شاخص «اقدام اصلاحی و پیگیری طب کار» · مهلت: '+lbl(due),done:dn,kind:'score',go:'clinic.html#inc='+encodeURIComponent(x.id)})});
  MG.fup.filter(x=>x.due_date&&x.status!=='cancelled').forEach(x=>{const due=d10(x.due_date),dn=x.status==='done';if(!(inM(due)||(due<a&&cur&&!dn)))return;
    T.push({id:'FP'+x.id,date:adjust(due<a?a:due,days),due,t:'پیگیری طب کار',sub:'شاخص «اقدام اصلاحی و پیگیری طب کار» · مهلت: '+lbl(due),done:dn,kind:'score',go:'clinic.html#fu='+encodeURIComponent(x.id)})});
  /* ۵-ب) ارزیابی ریسک سوله‌ها: هر سوله یک «بازه» دارد؛ برای مدیر حوزه‌های بهداشتی و ارگونومی (همان منطق build() کارشناس) */
  if(RKP){HSERiskPlan.tasks(RKP.rows,RKP.units,RKP.risks,HSEAuth.role,{isWork,addDays,today,a,b}).forEach(x=>{const k=x.rk;
      T.push({...x,sub:'بازه: '+lbl(k.start)+' تا '+lbl(k.end)+(k.late?' · بازه تمام شده و ارزیابی ثبت نشده':' · روز '+fa(k.idx)+' از '+fa(k.n))+' · '+fa(k.eq)+' تجهیز · '+fa(k.ppl)+' نفر پرسنل'})});
    if(HSEAuth.role==='manager'&&!RKP.rows.length&&HSERiskPlan.anyPending(RKP.units,RKP.risks)&&today>=a&&today<=b)T.push({id:'RKP0',date:today,due:today,t:'برنامهٔ ارزیابی ریسک سوله‌ها هنوز تدوین نشده',sub:'بازهٔ هر سوله را بر اساس تعداد تجهیز و پرسنل بسازید',mk:'RK',done:false,kind:'month',go:'risks.html'})}
  /* ۶) فقط ماه جاری — وضعیت لحظه‌ای که با رفع شدن، کار از تقویم حذف می‌شود */
  if(cur){
    const rk=MG.rk.filter(x=>x.status==='draft').length,rod=MG.rk.filter(x=>x.review_date&&d10(x.review_date)<today).length;
    if(rk||rod)T.push({id:'RV',date:today,due:today,lateF:rod>0,t:`ریسک‌ها: ${fa(rk)} پیش‌نویس منتظر تأیید${rod?` و ${fa(rod)} بازبینی معوق`:''}`,sub:'شاخص «سلامت ثبت ریسک»',done:false,kind:'score',go:'risks.html'});
    const cp=MG.cd.filter(c=>c.card_date&&d10(c.card_date)<=today),old=cp.filter(c=>(new Date(today)-new Date(d10(c.card_date)))/864e5>7).length;
    if(cp.length)T.push({id:'CD',date:today,due:today,lateF:old>0,t:`${fa(cp.length)} کارت گزارش خطر/پیشنهاد بدون نتیجه${old?` (${fa(old)} مورد بیش از ۷ روز)`:''}`,sub:'شاخص «پاسخ به کارت‌ها» · حداکثر ۷ روز',done:false,kind:'score',go:'cards.html'});
    const req=MG.eq.filter(e=>e.requires_inspection!==false),by={};MG.eqi.forEach(x=>(by[x.equipment_code]=by[x.equipment_code]||[]).push(x));
    let bad=0;req.forEach(e=>{const l=(by[e.code]||[]).sort((p,q)=>String(p.inspected_on)<String(q.inspected_on)?-1:1).pop();if(!l||l.result==='عدم تایید'){bad++;return}
      const due=jIso(l.next_due)||jIso(jAddM(l.inspected_on,e.interval_months||12));if(due&&due<today)bad++});
    if(bad)T.push({id:'EI',date:today,due:today,lateF:true,t:`${fa(bad)} دستگاه بدون بازرسی رسمی معتبر (سررسید گذشته، عدم تأیید یا بدون بازرسی)`,sub:'شاخص «تجهیزات حیاتی با بازرسی معتبر»',done:false,kind:'score',go:'equipment.html'});
    const cut=addDays(today,-365),dr=MG.tr.filter(t=>/مانور|تمرین اضطراری|تخلیه اضطراری/.test(t.title||'')&&d10(t.training_date)>cut).length;
    if(dr<2)T.push({id:'DR',date:lastW,due:lastW,t:`برگزاری مانور اضطراری (${fa(dr)} از ۲ در ۱۲ ماه اخیر)`,sub:'شاخص «مانور و تمرین اضطراری»',done:false,kind:'score',go:'training.html'});
    const lc=MG.cu.map(c=>d10(c.assessed_at)).filter(Boolean).sort().pop(),age=lc?Math.round((new Date(today)-new Date(lc))/864e5):null;
    if(age==null||age>150)T.push({id:'CU',date:lastW,due:lastW,t:'ارزیابی نردبان فرهنگ ایمنی',sub:'شاخص «فرهنگ ایمنی» · '+(age==null?'تاکنون ثبت نشده':'آخرین ارزیابی '+fa(Math.round(age/30))+' ماه پیش')+' (حداکثر هر ۶ ماه)',done:false,kind:'score',go:'culture.html'})}
  /* ۷) تعهدات دوره‌ای */
  MG.ob.forEach(o=>{const due=d10(o.next_due);if(!(inM(due))&&!(due<a&&cur))return;T.push({id:'OB'+o.id,date:adjust(due<a?a:due,days),due,t:'تعهد دوره‌ای: '+o.title,sub:'مهلت: '+lbl(due),done:false,kind:'month',go:'obligations.html'})});
  T.forEach(x=>{x.late=!x.done&&(!!x.lateF||x.date<today)});return T}
function render(){
  TASKS=MODE==='mgr'?buildMgr(K):build(K);const days=monthDays(K);
  $('mt').textContent=MN[+K.slice(5)-1]+' '+fa(K.slice(0,4));
  const by={};TASKS.forEach(x=>(by[x.date]=by[x.date]||[]).push(x));
  const tot=TASKS.length,dn=TASKS.filter(x=>x.done).length,lt=TASKS.filter(x=>x.late&&!unrec(x)).length,ms=TASKS.filter(x=>x.late&&unrec(x)).length,tdy=by[today]||[];
  $('sum').innerHTML=`<div>کارهای امروز<b>${fa(tdy.filter(x=>x.done).length)} از ${fa(tdy.length)}</b></div><div>این ماه<b>${fa(dn)} از ${fa(tot)}</b><div class="bar"><i style="width:${tot?Math.round(dn/tot*100):0}%"></i></div></div><div>عقب‌افتاده<b style="color:${lt?'var(--bad)':'var(--ok)'}">${fa(lt)}</b></div>${ms?`<div>ثبت‌نشده<b style="color:var(--mu)">${fa(ms)}</b></div>`:''}`;
  const first=(dowOf(days[0].iso)+1)%7; /* ستون اول = شنبه */
  let h=WD.map(w=>`<div class="chd">${w}</div>`).join('')+'<div class="cd out"></div>'.repeat(first);
  days.forEach(d=>{const L=by[d.iso]||[],done=L.filter(x=>x.done).length,work=isWork(d.iso),cl=!L.length?'':done===L.length?'ok':L.some(x=>x.late)?'bad':'wa';
    h+=`<button class="cd ${work?'':'off'} ${d.iso===today?'today':''} ${d.iso===SEL?'sel':''}" data-d="${d.iso}"><span class="cn">${fa(d.j)}</span>${L.length?`<span class="cc ${cl}">${fa(done)}/${fa(L.length)}</span>`:''}</button>`});
  $('grid').innerHTML=h;
  const L=by[SEL]||[];
  $('focus').innerHTML=K===nowK?focusHTML():'';
  $('day').innerHTML=(K===nowK&&SEL===today)?'':`<div class="card"><h2>${WD[(dowOf(SEL)+1)%7]} ${lbl(SEL)}${SEL===today?' <span class="ctag">امروز</span>':''}</h2>${L.length?[...L].sort((p,q)=>(p.done-q.done)||(p.kind<q.kind?-1:1)).map(taskHTML).join(''):`<div class="mu" style="color:var(--mu)">${isWork(SEL)?'کاری برای این روز برنامه‌ریزی نشده است.':'روز تعطیل (پنجشنبه یا جمعه).'}</div>`}</div>`;
  const LT=TASKS.filter(x=>x.late&&x.date!==SEL).sort((p,q)=>p.date<q.date?-1:1);
  const S2=lateSplit(LT),LN=LT.length-S2.mis.length,LR=[...S2.grp.map(grpRow),...S2.single.map(x=>taskHTML({...x,sub:(x.sub||'')+' · برنامه: '+lbl(x.date)}))];
  $('late').innerHTML=(LT.length&&K!==nowK)?`<div class="card" style="margin-top:12px">${LN?`<h2 style="color:var(--bad)">عقب‌افتاده‌های این ماه (${fa(LN)})</h2>${LR.slice(0,40).join('')}${LR.length>40?`<div class="mu" style="color:var(--mu)">و ${fa(LR.length-40)} مورد دیگر</div>`:''}`:''}${S2.mis.length?`<details data-fk="miss" ${FO.miss?'open':''}><summary>🕘 روزهای ثبت‌نشده — قابل جبران نیست (${fa(S2.mis.length)} روز)</summary>${missRows(S2.mis)}<div class="mu" style="color:var(--mu);margin-top:6px">${MISS_NOTE}</div></details>`:''}</div>`:'';
}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-tick]');if(!b)return;const d=b.dataset.tick,kk=b.dataset.key||'chlorination',SET=kk==='hrtrain'?HTK:TICKS;b.disabled=true;
  try{const h=await hd();h['Content-Type']='application/json';
    if(SET.has(d)){const r=await fetch(URL_+'/rest/v1/daily_ticks?key=eq.'+kk+'&tick_date=eq.'+d,{method:'DELETE',headers:h});if(!r.ok)throw new Error(await r.text());SET.delete(d)}
    else{const r=await fetch(URL_+'/rest/v1/daily_ticks',{method:'POST',headers:{...h,Prefer:'return=minimal'},body:JSON.stringify({tick_date:d,key:kk,done_by:HSEAuth.email||null})});if(!r.ok)throw new Error(await r.text());SET.add(d)}
    render()}catch(er){b.disabled=false;alert(/relation|does not exist|daily_ticks/.test(er.message)?'جدول ساخته نشده؛ فایل hse_worklog.sql را در Supabase اجرا کنید.':'خطا: '+er.message.slice(0,100))}});
$('grid').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;SEL=b.dataset.d;render()};
