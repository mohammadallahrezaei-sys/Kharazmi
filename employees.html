<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بانک پرسنل - نرم‌افزار جامع HSE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family: 'Vazirmatn', sans-serif; background: #0f172a; color: #f8fafc; }
details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
details[open] .chev { transform: rotate(180deg); }
.chev { transition: transform .15s; }
</style>
</head>
<body class="p-4 max-w-2xl mx-auto flex flex-col min-h-screen justify-between">
<div>
  <div class="flex justify-between items-center gap-2 mb-6 bg-slate-800 border border-slate-700 p-4 rounded-2xl shadow-md">
    <div class="flex items-center gap-3 min-w-0">
      <img src="logo.png" class="w-10 h-10 object-contain rounded shadow shrink-0" alt="لوگو" onerror="this.style.display='none'">
      <div class="min-w-0">
        <h1 class="text-base font-bold text-white">بانک پرسنل کارخانه</h1>
        <p class="text-[11px] text-slate-400">سامانه مدیریت پرسنل - گسترش فناوری خوارزمی</p>
      </div>
    </div>
    <div class="flex gap-2 shrink-0">
      <button onclick="toggleModal(true)" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs shadow-md">+ ثبت پرسنل</button>
      <a href="index.html" class="px-3 py-1.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-slate-300 hover:bg-slate-700">← بازگشت</a>
    </div>
  </div>

  <div class="mb-2">
    <input id="search" type="text" placeholder="جستجو در همه اطلاعات: نام، شماره پرسنلی، کد ملی، واحد، سمت، تلفن..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm outline-none focus:border-emerald-500">
  </div>
  <p id="count" class="text-xs text-slate-400 mb-3"></p>

  <div id="list" class="space-y-3 pb-10">
    <p class="text-center py-8 text-slate-400 text-sm">در حال بارگذاری اطلاعات پرسنل...</p>
  </div>
</div>

<footer class="bg-slate-800/50 border-t border-slate-700 text-center py-4 text-xs text-slate-400 mt-8">
  نرم‌افزار جامع HSE &copy; 2026 - گسترش فناوری خوارزمی | طراح نرم‌افزار: <span class="text-emerald-400 font-bold">محمد اله رضایی</span>
</footer>

<div id="addModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden backdrop-blur-sm">
  <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-lg w-full shadow-2xl max-h-[90vh] overflow-y-auto">
    <h2 class="text-lg font-bold text-white mb-4">فرم ثبت پرسنل جدید</h2>
    <form id="empForm" class="space-y-3">
      <div id="formFields" class="grid grid-cols-2 gap-3"></div>
      <div class="flex gap-2 pt-2">
        <button type="submit" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold rounded-xl text-sm">ثبت و ذخیره در دیتابیس</button>
        <button type="button" onclick="toggleModal(false)" class="px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-xl text-sm">انصراف</button>
      </div>
    </form>
  </div>
</div>

<script>
const URL_ = 'https://priopguwfjawybffarhd.supabase.co', KEY = 'sb_publishable_fKFQePO9qiFhj4qU3Vq4lQ_OAFi7rfu';
const H = { apikey: KEY, Authorization: `Bearer ${KEY}` };
let all = [];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

/* گروه‌بندی و برچسب همه ستون‌ها */
const GROUPS = [
  ['اطلاعات هویتی', [
    ['national_id', 'کد ملی', 1], ['father_name', 'نام پدر'], ['gender', 'جنسیت'], ['marital_status', 'وضعیت تأهل'],
    ['birth_cert_no', 'شماره شناسنامه', 1], ['birth_place', 'محل تولد'], ['issue_place', 'محل صدور'], ['__birth', 'تاریخ تولد'],
    ['education', 'تحصیلات'], ['military_status', 'وضعیت خدمت']]],
  ['اطلاعات شغلی و بیمه', [
    ['emp_id', 'شماره پرسنلی', 1], ['department', 'محل خدمت / واحد'], ['job_title', 'عنوان شغلی'], ['position_rahkaran', 'پست راهکاران'],
    ['supervisor', 'سرپرست مربوطه'], ['insurance_no', 'شماره بیمه', 1], ['insurance_start', 'شروع بکار بیمه‌ای', 1],
    ['initial_exam', 'معاینات بدو استخدام'], ['skills', 'مهارت و توانایی فنی'], ['training_courses', 'دوره‌های آموزشی']]],
  ['اطلاعات تماس', [
    ['phone_mobile', 'تلفن همراه ۱', 1, 'tel'], ['phone_mobile2', 'تلفن همراه ۲', 1, 'tel'], ['phone_landline', 'تلفن ثابت', 1, 'tel'],
    ['postal_code', 'کد پستی', 1], ['address', 'آدرس']]]
];
const KNOWN = new Set(['id', 'created_at', 'updated_at', 'first_name', 'last_name', 'birth_year', 'birth_month', 'birth_day'].concat(GROUPS.flatMap(g => g[1].map(f => f[0]))));

const val = (x, k) => {
  if (k === '__birth') return x.birth_year ? [x.birth_year, x.birth_month, x.birth_day].filter(Boolean).join('/') : '';
  return x[k] == null ? '' : String(x[k]).trim();
};
const cell = (x, [k, label, ltr, tel]) => {
  const v = val(x, k);
  const body = !v ? '<span class="text-slate-600">—</span>'
    : tel ? `<a href="tel:${esc(v)}" dir="ltr" class="text-emerald-400">${esc(v)}</a>`
    : ltr ? `<span dir="ltr">${esc(v)}</span>` : esc(v);
  return `<div class="bg-slate-900/60 rounded-lg px-3 py-2 ${k === 'address' || k === 'skills' || k === 'training_courses' ? 'col-span-2' : ''}">
    <div class="text-[11px] text-slate-400">${label}</div><div class="text-xs text-slate-100 break-words">${body}</div></div>`;
};

function card(x) {
  const extra = Object.keys(x).filter(k => !KNOWN.has(k) && x[k] != null && x[k] !== '');
  return `<details class="bg-slate-800 border border-slate-700 rounded-xl shadow-sm">
    <summary class="p-4 flex justify-between items-center gap-3">
      <div class="min-w-0">
        <p class="font-bold text-sm">${esc(x.first_name)} ${esc(x.last_name)} <span class="text-xs text-slate-400 font-normal">(${esc(x.emp_id)})</span></p>
        <p class="text-xs text-slate-400 mt-1">واحد: <span class="text-slate-200 font-semibold">${esc(x.department) || 'نامشخص'}</span> · سمت: ${esc(x.job_title) || '-'}</p>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full" dir="ltr">${esc(x.phone_mobile) || 'بدون شماره'}</span>
        <span class="chev text-slate-400 text-xs">▼</span>
      </div>
    </summary>
    <div class="px-4 pb-4 space-y-3 border-t border-slate-700 pt-3">
      ${GROUPS.map(([t, fs]) => `<div><h3 class="text-xs font-bold text-emerald-400 mb-2">${t}</h3><div class="grid grid-cols-2 gap-2">${fs.map(f => cell(x, f)).join('')}</div></div>`).join('')}
      ${extra.length ? `<div><h3 class="text-xs font-bold text-emerald-400 mb-2">سایر اطلاعات</h3><div class="grid grid-cols-2 gap-2">${extra.map(k => cell(x, [k, k])).join('')}</div></div>` : ''}
    </div>
  </details>`;
}

function render(arr) {
  document.getElementById('count').textContent = `${fa(arr.length)} نفر از ${fa(all.length)} نفر`;
  document.getElementById('list').innerHTML = arr.length ? arr.map(card).join('') : '<p class="text-center py-6 text-slate-500 text-sm">موردی یافت نشد.</p>';
}

async function loadEmployees() {
  try {
    const res = await fetch(`${URL_}/rest/v1/employees?select=*&order=emp_id.asc&limit=1000`, { headers: H });
    if (!res.ok) throw new Error(await res.text());
    all = await res.json();
    all.sort((a, b) => String(a.emp_id).localeCompare(String(b.emp_id), undefined, { numeric: true }));
    all.forEach(x => x.__s = Object.entries(x).filter(([k]) => k !== '__s').map(([, v]) => v).join(' ').toLowerCase());
    render(all);
    document.getElementById('search').oninput = e => {
      const q = e.target.value.trim().toLowerCase();
      render(q ? all.filter(x => x.__s.includes(q)) : all);
    };
  } catch (e) {
    document.getElementById('list').innerHTML = '<p class="text-center text-red-400 text-sm">خطا در برقراری ارتباط با پایگاه داده</p>';
  }
}

/* فرم ثبت: همه ستون‌های اصلی */
const FORM = [
  ['emp_id', 'شماره پرسنلی (الزامی)', 1], ['national_id', 'کد ملی'], ['first_name', 'نام (الزامی)', 1], ['last_name', 'نام خانوادگی (الزامی)', 1],
  ['father_name', 'نام پدر'], ['gender', 'جنسیت'], ['marital_status', 'وضعیت تأهل'], ['birth_place', 'محل تولد'],
  ['education', 'تحصیلات'], ['military_status', 'وضعیت خدمت'], ['department', 'واحد خدمت / بخش'], ['job_title', 'عنوان سمت شغلی'],
  ['supervisor', 'سرپرست مربوطه'], ['phone_mobile', 'تلفن همراه ۱'], ['phone_mobile2', 'تلفن همراه ۲'], ['phone_landline', 'تلفن ثابت'],
  ['postal_code', 'کد پستی'], ['address', 'آدرس', 0, 1]
];
document.getElementById('formFields').innerHTML = FORM.map(([k, l, req, wide]) =>
  `<div class="${wide ? 'col-span-2' : ''}"><label class="block text-xs text-slate-300 mb-1">${l}</label>
   <input type="text" data-f="${k}" ${req ? 'required' : ''} class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm focus:border-emerald-500 outline-none"></div>`).join('');

function toggleModal(show) {
  document.getElementById('addModal').classList.toggle('hidden', !show);
  if (!show) document.getElementById('empForm').reset();
}

document.getElementById('empForm').onsubmit = async e => {
  e.preventDefault();
  const body = {};
  document.querySelectorAll('[data-f]').forEach(i => { const v = i.value.trim(); if (v) body[i.dataset.f] = v; });
  try {
    const res = await fetch(`${URL_}/rest/v1/employees`, { method: 'POST', headers: { ...H, 'Content-Type': 'application/json', Prefer: 'return=representation' }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error(await res.text());
    alert('پرسنل جدید با موفقیت در دیتابیس ثبت شد.');
    toggleModal(false); loadEmployees();
  } catch (err) { alert('خطا در ثبت پرسنل: ' + err.message); }
};

loadEmployees();
</script>
</body>
</html>
