<!doctype html><html lang="fa" dir="rtl"><head><meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"><script src="auth.js"></script><script src="hse_nav.js" defer="defer"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لیست تلفن داخلی - نرم‌افزار جامع HSE</title><link rel="stylesheet" href="hse_ui.css"><style>.w{max-width:720px;margin:0 auto;padding:14px}.pbs{width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);margin:10px 0 6px}.pbc{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}.pbc button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap}.pbc button.on{background:var(--ac);border-color:var(--ac);color:var(--acx);font-weight:700}.pbu{margin-top:14px;border:1px solid var(--bd);border-radius:14px;background:var(--card);overflow:hidden}.pbu h2{margin:0;padding:10px 14px;font-size:14px;background:var(--soft);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;gap:8px}.pbu h2 small{font-weight:400;color:var(--mu)}.pbr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--bd);font-size:14px}.pbr:first-of-type{border-top:0}.pbn{min-width:0;overflow-wrap:anywhere}.pbx{flex:none;display:flex;gap:6px;align-items:center}.pbx button{border:1px solid var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--card));color:var(--ac);border-radius:10px;padding:6px 12px;font-size:16px;font-weight:700;cursor:pointer;min-width:56px}.pbm{font-size:11px;color:var(--mu);border:1px solid var(--bd);border-radius:99px;padding:2px 8px}mark{background:#fde68a;color:#111;border-radius:3px;padding:0 2px}#pbt{position:fixed;inset:auto 12px 16px;z-index:9;background:#1f2937;color:#fff;border-radius:10px;padding:10px;text-align:center;display:none}.pbx{flex-wrap:wrap;justify-content:flex-end}.pbx button.mob{border-color:#16a34a;color:#16a34a;background:color-mix(in srgb,#16a34a 10%,var(--card))}.pbx button.ed{min-width:0;padding:6px 8px;font-size:13px;border-color:var(--bd);color:var(--mu);background:var(--card)}[hidden]{display:none!important}.pbt2{display:flex;gap:8px;align-items:center;margin:4px 0}.pbt2 button{border:1px solid var(--ac);background:var(--ac);color:var(--acx);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}.pbn2{font-size:12px;border:1px solid var(--bd);background:var(--soft);border-radius:10px;padding:8px 10px;margin:6px 0}dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(92vw,420px);padding:16px}dialog::backdrop{background:rgba(15,23,42,.55)}dialog label{display:block;font-size:12px;color:var(--mu);margin-top:10px}dialog input{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg,var(--card));color:var(--tx);font:inherit;margin-top:4px}dialog .row{display:flex;gap:8px;margin-top:14px}dialog .row button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font:inherit}dialog .row .pri{background:var(--ac);border-color:var(--ac);color:var(--acx);font-weight:700}dialog .row .del{color:#dc2626;border-color:#dc2626;flex:none}</style></head><body><div class="w"><header class="hd"><img src="logo-sm.png" alt="لوگو" onerror='this.style.display="none";'><div class="min-w-0"><h1>📞 لیست تلفن داخلی</h1><div class="mu">گسترش فناوری خوارزمی · جستجو بر اساس واحد، نام یا شماره</div></div><a href="index.html" class="back">← بازگشت</a></header><input id="q" class="pbs" type="search" placeholder="🔍 جستجو: نام فرد، واحد، یا شمارهٔ داخلی..." autocomplete="off"><div id="chips" class="pbc"></div><div class="pbt2"><p id="cnt" class="mu" style=""></p><button id="bAdd" type="button" hidden>＋ افزودن شماره</button></div><div id="note"></div><div id="out"></div><p class="mu" style="">با لمس شمارهٔ داخلی، همان شماره کپی می‌شود. دکمهٔ سبز 📱 کدِ رسیدن به موبایل همان فرد است: شمارهٔ داخلی را بگیرید و بعد دو ستاره (**).</p></div><dialog id="dlg"><form method="dialog" id="fm" onsubmit="return false"><b id="dt">افزودن شماره</b> <label>واحد<input id="fU" list="ul" autocomplete="off" placeholder="نام واحد (موجود یا جدید)"></label><datalist id="ul"></datalist><label>نام فرد / محل<input id="fN" autocomplete="off"></label> <label>شمارهٔ داخلی (برای چند شماره با / جدا کنید)<input id="fX" dir="ltr" autocomplete="off" placeholder="مثلاً 115 یا 124/163"></label> <label>موبایل (اختیاری): اگر با «داخلی + **» به موبایل وصل می‌شود فقط ** بنویسید، یا کد کامل را مثل 166**<input id="fM" dir="ltr" autocomplete="off" placeholder="**"></label><div id="fE" style=""></div><div class="row"><button type="button" class="del" id="fD" hidden>حذف</button><button type="button" id="fC">انصراف</button><button type="button" class="pri" id="fS">ذخیره</button></div></form></dialog><div id="pbt"></div><script src="phonebook_data.js"></script><script>const $=t=>document.getElementById(t),esc=t=>String(t??"").replace(/[&<>"']/g,t=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[t]));const nz=t=>String(t||"").replace(/[يى]/g,"ی").replace(/ك/g,"ک").replace(/[‌‏]/g," ").replace(/[۰-۹]/g,t=>"۰۱۲۳۴۵۶۷۸۹".indexOf(t)).replace(/[٠-٩]/g,t=>"٠١٢٣٤٥٦٧٨٩".indexOf(t)).replace(/\s+/g," ").trim().toLowerCase();const fa=t=>String(t).replace(/\d/g,t=>"۰۱۲۳۴۵۶۷۸۹"[t]);const API="https://priopguwfjawybffarhd.supabase.co/rest/v1/phonebook";let P=[],U="",DB=false,EMPTY=false,MSG="";async function rq(t,e){const n=await fetch(API+t,{...e,headers:{"Content-Type":"application/json",Prefer:"return=representation",...(e||{}).headers||{}}});if(!n.ok)throw new Error(await n.text());return n.status===204?null:n.json()}function group(t){const e=new Map;t.forEach(t=>{if(!e.has(t.unit))e.set(t.unit,{u:t.unit,o:t.ord,e:[]});const n=e.get(t.unit);n.o=Math.min(n.o,t.ord);n.e.push({id:t.id,n:t.name,x:t.ext,m:t.mobile||"",o:t.ord})});return[...e.values()].sort((t,e)=>t.o-e.o).map(t=>({...t,e:t.e.sort((t,e)=>t.o-e.o)}))}async function load(){try{const t=await rq("?select=*&order=ord.asc&limit=2000");DB=true;EMPTY=!t.length;P=EMPTY?window.PHONES||[]:group(t)}catch(t){DB=false;P=window.PHONES||[];MSG="جدول ویرایش ساخته نشده؛ فایل hse_phonebook.sql را یک‌بار در Supabase اجرا کنید تا افزودن و ویرایش فعال شود."}$("bAdd").hidden=!DB||EMPTY;chips();draw();note()}function note(){$("note").innerHTML=!DB?`<div class="pbn2">⚠️ ${esc(MSG)} (فعلاً لیست فقط‌خواندنی است)</div>`:EMPTY?`<div class="pbn2">لیست فعلاً از فایل اولیه خوانده می‌شود. برای فعال شدن افزودن و ویرایش، یک‌بار آن را به پایگاه داده منتقل کنید. <button id="bImp" type="button" style="margin-top:6px;border:1px solid var(--ac);background:var(--ac);color:var(--acx);border-radius:10px;padding:6px 12px;cursor:pointer">انتقال لیست (${fa((window.PHONES||[]).reduce((t,e)=>t+e.e.length,0))} شماره)</button></div>`:""}function mobs(t){const e=(t.m||"").trim();if(!e)return[];if(e==="**")return String(t.x).split("/").map(t=>t.trim()).filter(Boolean).map(t=>t+"**");if(/^[\d]+\*+$/.test(e))return[e];return[]}const mobTxt=t=>{const e=(t.m||"").trim();return e&&e!=="**"&&!/^[\d]+\*+$/.test(e)?e:""};function hl(t,e){t=String(t);if(!e)return esc(t);const n=nz(t),a=n.indexOf(e);if(a<0||n.length!==t.length)return esc(t);return esc(t.slice(0,a))+"<mark>"+esc(t.slice(a,a+e.length))+"</mark>"+esc(t.slice(a+e.length))}function chips(){$("chips").innerHTML=`<button class="${U?"":"on"}" data-u="">همه واحدها</button>`+P.filter(t=>t.e.length).map(t=>`<button class="${U===t.u?"on":""}" data-u="${esc(t.u)}">${esc(t.u)}</button>`).join("");$("ul").innerHTML=P.map(t=>`<option value="${esc(t.u)}">`).join("")}function draw(){const t=nz($("q").value);let e=0,n=0;const a=P.filter(t=>t.e.length&&(!U||t.u===U)).map(a=>{const o=nz(a.u),i=t&&o.includes(t);const s=a.e.filter(e=>!t||i||nz(e.n).includes(t)||nz(e.x).includes(t)||nz(e.m).includes(t));if(!s.length)return"";e+=s.length;n++;return`<section class="pbu"><h2><span>${hl(a.u,t)}</span><small>${fa(s.length)} شماره</small></h2>`+s.map(e=>`<div class="pbr"><div class="pbn">${hl(e.n,t)}</div><div class="pbx">${mobTxt(e)?`<span class="pbm">همراه: ${esc(mobTxt(e))}</span>`:""}${mobs(e).map(t=>`<button type="button" class="mob" data-c="${esc(t)}" dir="ltr" title="کد رسیدن به موبایل: داخلی + **">📱 ${esc(t)}</button>`).join("")}${String(e.x).split("/").map(t=>t.trim()).filter(Boolean).map(e=>`<button type="button" data-c="${esc(e)}" dir="ltr">${hl(e,t)}</button>`).join("")}${DB&&e.id?`<button type="button" class="ed" data-ed="${esc(e.id)}" title="ویرایش">✏️</button>`:""}</div></div>`).join("")+`</section>`}).join("");$("out").innerHTML=a||'<div class="pbu" style="padding:18px;text-align:center" >موردی پیدا نشد.</div>';$("cnt").textContent=t||U?`${fa(e)} شماره در ${fa(n)} واحد`:`${fa(P.reduce((t,e)=>t+e.e.length,0))} شماره در ${fa(P.filter(t=>t.e.length).length)} واحد`}function toast(t){const e=$("pbt");e.textContent=t;e.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display="none",1600)}$("q").addEventListener("input",draw);$("chips").addEventListener("click",t=>{const e=t.target.closest("button");if(!e)return;U=e.dataset.u;chips();draw()});$("out").addEventListener("click",async t=>{const e=t.target.closest("[data-ed]");if(e)return openEd(e.dataset.ed);const n=t.target.closest("[data-c]");if(!n)return;const a=n.dataset.c;try{await navigator.clipboard.writeText(a);toast("کپی شد: "+fa(a))}catch(t){toast("شماره: "+fa(a))}});let EID=null;function openEd(t){EID=t||null;let e={n:"",x:"",m:"",u:U||""};if(t){for(const n of P){const a=n.e.find(e=>String(e.id)===String(t));if(a){e={...a,u:n.u};break}}}$("dt").textContent=t?"ویرایش شماره":"افزودن شماره";$("fU").value=e.u;$("fN").value=e.n;$("fX").value=e.x;$("fM").value=e.m;$("fE").textContent="";$("fD").hidden=!t;$("dlg").showModal()}$("bAdd").onclick=()=>openEd(null);$("fC").onclick=()=>$("dlg").close();$("fS").onclick=async()=>{const t=$("fU").value.trim(),e=$("fN").value.trim(),n=$("fX").value.trim(),a=$("fM").value.trim();if(!t||!e||!n)return $("fE").textContent="واحد، نام و شمارهٔ داخلی را وارد کنید.";try{if(EID)await rq("?id=eq."+encodeURIComponent(EID),{method:"PATCH",body:JSON.stringify({unit:t,name:e,ext:n,mobile:a})});else{const o=P.find(e=>e.u===t),i=P.flatMap(t=>t.e.map(t=>t.o||0)),s=o?Math.max(...o.e.map(t=>t.o||0))+1:(i.length?Math.max(...i):0)+1e3;await rq("",{method:"POST",body:JSON.stringify({unit:t,name:e,ext:n,mobile:a,ord:s})})}$("dlg").close();toast("ذخیره شد");await load()}catch(t){$("fE").textContent="خطا: "+String(t.message).slice(0,120)}};$("fD").onclick=async()=>{if(!EID||!confirm("این شماره حذف شود؟"))return;try{await rq("?id=eq."+encodeURIComponent(EID),{method:"DELETE"});$("dlg").close();toast("حذف شد");await load()}catch(t){$("fE").textContent="خطا: "+String(t.message).slice(0,120)}};$("note").addEventListener("click",async t=>{if(t.target.id!=="bImp")return;t.target.disabled=true;const e=[];(window.PHONES||[]).forEach((t,n)=>t.e.forEach((a,o)=>e.push({unit:t.u,name:a.n,ext:a.x,mobile:a.m||"",ord:(n+1)*1e3+o})));try{for(let t=0;t<e.length;t+=100)await rq("",{method:"POST",body:JSON.stringify(e.slice(t,t+100))});toast("منتقل شد");await load()}catch(e){toast("خطا: "+String(e.message).slice(0,100));t.target.disabled=false}});load();</script></body></html>
