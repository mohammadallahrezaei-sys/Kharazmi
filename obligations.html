<!doctype html><html lang="fa" dir="rtl"><head><meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"><script src="auth.js" data-roles="manager"></script><script src="hse_nav.js" defer="defer"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تعهدات دوره‌ای - نرم‌افزار جامع HSE</title><link rel="stylesheet" href="hse_ui.css"><style>.w{max-width:900px;margin:0 auto;padding:14px}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}.card2{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}.t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}.mu{color:var(--mu);font-size:12px}.b2{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.b2.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}.b2.ok{border-color:var(--ok);color:var(--ok)}.b2.bad{border-color:var(--bad);color:var(--bad)}.bg{display:inline-block;border-radius:99px;padding:1px 10px;font-size:11px;border:1px solid var(--bd)}.bg.ok{color:var(--ok);border-color:var(--ok)}.bg.bad{color:var(--bad);border-color:var(--bad)}.bg.wa{color:var(--wa);border-color:var(--wa)}.sm{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}.sm button{text-align:center;padding:8px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}.sm b{display:block;font-size:20px}.sm .on{border-color:var(--ac);outline:2px solid var(--ac)}input,select,textarea{font:inherit;font-size:13px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);padding:7px 9px;width:100%}dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(94vw,520px);padding:14px}dialog::backdrop{background:rgba(15,23,42,.55)}label.f{display:block;font-size:12px;color:var(--mu);margin-top:8px}.jd{display:flex;gap:4px}.jd select{width:auto;flex:1}.lg{border-top:1px dashed var(--bd);margin-top:6px;padding-top:4px;font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}[hidden]{display:none!important}</style></head><body><div class="w"><div class="top"><div><h1 style="">📆 تعهدات دوره‌ای HSE</h1><div class="mu">سنجش‌ها، مانورها، آزمون‌ها، ممیزی و بازنگری‌ها و مجوزها — هر کدام با موعد، سابقه و هشدار</div></div><div><a href="index.html">← صفحه اصلی</a></div></div><div class="sm" id="sm"></div><div class="row"><select id="cat" style=""></select><input id="q" placeholder="🔍 جستجو…" style=""><button class="b2 p" id="bAdd">＋ مورد جدید</button></div><div id="warn"></div><div id="list"></div></div><dialog id="dlg"></dialog><div id="toast" style=""></div><script src="eval_core.js"></script><script>const{fa:fa,esc:esc}=HSE,$=t=>document.querySelector(t),SB="https://priopguwfjawybffarhd.supabase.co/rest/v1/";const CATS=["سنجش و پایش","اضطراری و مانور","بازرسی و آزمون","ممیزی و بازنگری","قانونی و مجوز","محیط زیست","تأییدیه و معاینات","سایر"];const ANCH="تأییدیه و معاینات";const SEED=[["سنجش عوامل زیان‌آور شیمیایی (آلاینده‌سنجی هوای محیط کار)","سنجش و پایش",24,"هر ۲ سال؛ فقط در صورت درخواست شبکه بهداشت"],["سنجش صدا","سنجش و پایش",12,"مرکز بهداشت / شرکت دارای صلاحیت"],["سنجش روشنایی","سنجش و پایش",12,"مرکز بهداشت / شرکت دارای صلاحیت"],["سنجش استرس حرارتی (سالن‌های گرم)","سنجش و پایش",12,"مرکز بهداشت / شرکت دارای صلاحیت"],["مانور آتش‌سوزی و تخلیه","اضطراری و مانور",6,"HSE + آتش‌نشانی"],["مانور نشت اسید / مواد شیمیایی","اضطراری و مانور",12,"HSE"],["بازنگری طرح واکنش در شرایط اضطراری و تیم‌ها","اضطراری و مانور",12,"HSE"],["اندازه‌گیری ارت و بررسی سیستم برقگیر","بازرسی و آزمون",12,"برق / پیمانکار"],["بازرسی و آزمون مخازن تحت فشار / دیگ بخار","بازرسی و آزمون",12,"پیمانکار دارای صلاحیت"],["کالیبراسیون گازسنج‌ها و آشکارسازها","بازرسی و آزمون",6,"پیمانکار / سازنده"],["ممیزی داخلی HSE","ممیزی و بازنگری",12,"HSE"],["بازنگری مدیریت (ارائهٔ عملکرد HSE به مدیرعامل)","ممیزی و بازنگری",6,"مدیر HSE"],["بازنگری ارزیابی ریسک‌ها","ممیزی و بازنگری",12,"HSE"],["بازنگری برگه‌های ایمنی مواد (SDS) و فهرست مواد شیمیایی","ممیزی و بازنگری",12,"HSE"],["بررسی الزامات قانونی و تطبیق (قوانین کار، آیین‌نامه‌ها، ابلاغیه‌ها)","قانونی و مجوز",12,"HSE"],["پایش پساب و پسماند (نمونه‌برداری/آزمایش و تحویل به پیمانکار مجاز)","محیط زیست",6,"HSE / محیط زیست"]];const SEED2=[["اخذ تأییدیه‌های ایمنی (آتش‌نشانی، دستگاه‌ها و ...)","تأییدیه و معاینات",12,"سالی یک‌بار، سر موعد هر تأییدیه"],["معاینات دوره‌ای پرسنل (طب کار)","تأییدیه و معاینات",12,"سالی یک‌بار، سر موعد"]];SEED.push(...SEED2);let O=[],G=[],ME="",FIL="all";const todayISO=()=>HSEToday();const jl=t=>t?new Date(t+"T12:00:00Z").toLocaleDateString("fa-IR-u-ca-persian",{year:"numeric",month:"numeric",day:"numeric",timeZone:"UTC"}):"—";const diff=(t,e)=>Math.round((new Date(t+"T12:00:00Z")-new Date(e+"T12:00:00Z"))/864e5);function addM(t,e){const a=new Date(t+"T12:00:00Z"),n=a.getUTCDate();a.setUTCDate(1);a.setUTCMonth(a.getUTCMonth()+e);const o=new Date(Date.UTC(a.getUTCFullYear(),a.getUTCMonth()+1,0)).getUTCDate();a.setUTCDate(Math.min(n,o));return a.toISOString().slice(0,10)}const toast=t=>{const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display="none",2600)};async function rq(t,e={}){const a=await fetch(SB+t,{...e,headers:{"Content-Type":"application/json",Prefer:"return=representation",...e.headers||{}}});if(!a.ok)throw new Error((await a.text()).slice(0,250));const n=await a.text();return n?JSON.parse(n):null}const st=t=>{if(!t.next_due)return{k:"none",t:"موعد تعیین نشده",c:"wa",n:0};const e=diff(t.next_due,todayISO());return e<0?{k:"late",t:"معوق "+fa(-e)+" روز",c:"bad",n:e}:e<=30?{k:"soon",t:fa(e)+" روز مانده",c:"wa",n:e}:{k:"ok",t:fa(e)+" روز مانده",c:"ok",n:e}};async function load(){[O,G]=await Promise.all([HSE.getAll("hse_obligations?select=*&order=created_at.asc"),HSE.getAll("hse_obligation_log?select=*&order=done_at.desc")]);if(!Array.isArray(O))throw new Error("table");G=G||[];O=O.filter(t=>t.active!==false);draw()}function draw(){const t=O.map(t=>({o:t,s:st(t)})),e=e=>t.filter(t=>t.s.k===e).length;$("#sm").innerHTML=[["all","همه",O.length,""],["late","معوق",e("late"),"var(--bad)"],["soon","تا ۳۰ روز آینده",e("soon"),"var(--wa)"],["none","بدون موعد",e("none"),"var(--wa)"],["ok","در مهلت",e("ok"),"var(--ok)"]].map(([t,e,a,n])=>`<button data-f="${t}" class="${FIL===t?"on":""}"><b style="color:${n}">${fa(a)}</b>${e}</button>`).join("");const a=$("#cat").value||"";$("#cat").innerHTML='<option value="">همهٔ گروه‌ها</option>'+CATS.map(t=>`<option ${t===a?"selected":""}>${t}</option>`).join("");const n=$("#q").value.trim(),o=t.filter(t=>(FIL==="all"||t.s.k===FIL)&&(!a||t.o.category===a)&&(!n||[t.o.title,t.o.authority,t.o.owner,t.o.note].join(" ").includes(n))).sort((t,e)=>({late:0,none:1,soon:2,ok:3}[t.s.k]-{late:0,none:1,soon:2,ok:3}[e.s.k]||t.s.n-e.s.n));if(!O.length){$("#list").innerHTML=`<div class="card2">هنوز موردی ثبت نشده است.<div style="margin-top:8px"><button class="b2 p" id="bSeed">بارگذاری فهرست پیشنهادی (${fa(SEED.length)} مورد، قابل ویرایش و حذف)</button></div></div>`;return}const s=SEED.filter(t=>!O.some(e=>e.title===t[0]&&true));const i=O.find(t=>t.title.startsWith("سنجش عوامل زیان‌آور شیمیایی")&&t.period_months===12);$("#list").innerHTML=(s.length&&O.length?`<div class="card2" style="margin-bottom:8px">موارد پیشنهادی جدید: ${s.slice(-2).map(t=>esc(t[0])).join("، ")}${s.length>2?" و ...":""}<div style="margin-top:6px"><button class="b2" id="bMiss">افزودن ${fa(s.length>2?2:s.length)} مورد جدید</button>${i?' <button class="b2" id="bOld">تغییر دوره آلاینده‌سنجی به ۲ سال</button>':""}</div></div>`:"")+o.map(({o:t,s:e})=>{const a=G.filter(e=>e.obligation_id===t.id);return`<div class="card2"><div class="t"><div style="flex:1;min-width:220px"><b>${esc(t.title)}</b> <span class="bg">${esc(t.category)}</span> <span class="bg ${e.c}">${e.t}</span>\n     <div class="mu">هر ${fa(t.period_months)} ماه · موعد: ${jl(t.next_due)} · آخرین انجام: ${jl(t.last_done)}${t.authority?" · مجری: "+esc(t.authority):""}${t.owner?" · مسئول: "+esc(t.owner):""}</div>${t.note?`<div class="mu">${esc(t.note)}</div>`:""}</div>\n     <div class="row"><button class="b2 ok" data-a="done" data-id="${t.id}">✔ انجام شد</button><button class="b2" data-a="edit" data-id="${t.id}">✏️</button></div></div>\n     ${a.length?`<details><summary class="mu" style="cursor:pointer">سابقه (${fa(a.length)})</summary>${a.map(t=>`<div class="lg">${jl(t.done_at)}${t.note?" — "+esc(t.note):""}${t.done_by?' <span class="mu">('+esc(t.done_by)+")</span>":""}</div>`).join("")}</details>`:""}</div>`}).join("")||'<div class="card2 mu">موردی با این فیلتر نیست.</div>'}function dateField(t){return`<div id="${t}" class="jd"><select></select><select></select><select></select></div>`}function openDone(t){const e=O.find(e=>e.id===t);$("#dlg").innerHTML=`<b>ثبت انجام: ${esc(e.title)}</b>\n   <label class="f">تاریخ انجام</label>${dateField("dD")}\n   <label class="f">توضیح / شمارهٔ گزارش یا مدرک (اختیاری)<input id="dN"></label>\n   <div class="mu" style="margin-top:6px">${e.category===ANCH?"موعد ثابت: موعد بعدی "+fa(e.period_months)+" ماه بعد از موعد فعلی می‌شود (قابل ویرایش)":"موعد بعدی: "+fa(e.period_months)+" ماه بعد از تاریخ انجام (قابل ویرایش)"}</div>\n   <div id="dE" class="mu" style="color:var(--bad)"></div>\n   <div class="row" style="margin-top:12px"><button class="b2" id="dX">انصراف</button><button class="b2 p" id="dS" style="margin-inline-start:auto">ثبت</button></div>`;HSE.jdInit($("#dD"));HSE.jdSet($("#dD"),todayISO());$("#dlg").showModal();$("#dX").onclick=()=>$("#dlg").close();$("#dS").onclick=async()=>{const a=HSE.jdGet($("#dD"))||todayISO();if(a>todayISO())return $("#dE").textContent="تاریخ انجام نمی‌تواند در آینده باشد";try{await rq("hse_obligation_log",{method:"POST",body:JSON.stringify({obligation_id:t,done_at:a,note:$("#dN").value.trim()||null,done_by:ME||null}),headers:{Prefer:"return=minimal"}});const n={last_done:!e.last_done||a>=e.last_done?a:e.last_done};n.next_due=addM(n.last_done,e.period_months);if(e.category===ANCH&&e.next_due){let t=String(e.next_due).slice(0,10);do{t=addM(t,e.period_months)}while(t<=a);n.next_due=t}await rq("hse_obligations?id=eq."+t,{method:"PATCH",body:JSON.stringify(n),headers:{Prefer:"return=minimal"}});$("#dlg").close();toast("ثبت شد؛ موعد بعدی: "+jl(n.next_due));await load()}catch(t){$("#dE").textContent=t.message}}}function openForm(t){const e=t?O.find(e=>e.id===t):{period_months:12,category:CATS[0]};$("#dlg").innerHTML=`<b>${t?"ویرایش":"مورد جدید"}</b>\n   <label class="f">عنوان *<input id="fT" value="${esc(e.title||"")}"></label>\n   <label class="f">گروه<select id="fC">${CATS.map(t=>`<option ${t===e.category?"selected":""}>${t}</option>`).join("")}</select></label>\n   <label class="f">دوره (ماه)<input id="fP" type="number" min="1" max="120" value="${e.period_months}"></label>\n   <label class="f">آخرین انجام (در صورت وجود)</label>${dateField("fL")}\n   <label class="f">موعد بعدی (خالی = از آخرین انجام + دوره محاسبه می‌شود)</label>${dateField("fN")}\n   <label class="f">مجری / شرکت<input id="fA" value="${esc(e.authority||"")}"></label>\n   <label class="f">مسئول پیگیری<input id="fO" value="${esc(e.owner||"")}"></label>\n   <label class="f">توضیح<textarea id="fD" rows="2">${esc(e.note||"")}</textarea></label>\n   <div id="fE" class="mu" style="color:var(--bad)"></div>\n   <div class="row" style="margin-top:12px">${t?'<button class="b2 bad" id="fDel">حذف</button>':""}<button class="b2" id="fX">انصراف</button><button class="b2 p" id="fS" style="margin-inline-start:auto">ذخیره</button></div>`;HSE.jdInit($("#fL"),true);HSE.jdInit($("#fN"),true);if(e.last_done)HSE.jdSet($("#fL"),String(e.last_done).slice(0,10));if(e.next_due)HSE.jdSet($("#fN"),String(e.next_due).slice(0,10));$("#dlg").showModal();$("#fX").onclick=()=>$("#dlg").close();if(t)$("#fDel").onclick=async()=>{if(!confirm("این مورد و سابقه‌اش حذف شود؟"))return;try{await rq("hse_obligations?id=eq."+t,{method:"DELETE",headers:{Prefer:"return=minimal"}});$("#dlg").close();await load()}catch(t){$("#fE").textContent=t.message}};$("#fS").onclick=async()=>{const e=$("#fT").value.trim(),a=Math.max(1,Math.min(120,+$("#fP").value||12));if(!e)return $("#fE").textContent="عنوان را بنویسید";const n=HSE.jdGet($("#fL"));let o=HSE.jdGet($("#fN"));if(!o&&n)o=addM(n,a);const s={title:e,category:$("#fC").value,period_months:a,last_done:n||null,next_due:o||null,authority:$("#fA").value.trim()||null,owner:$("#fO").value.trim()||null,note:$("#fD").value.trim()||null};try{if(t)await rq("hse_obligations?id=eq."+t,{method:"PATCH",body:JSON.stringify(s),headers:{Prefer:"return=minimal"}});else await rq("hse_obligations",{method:"POST",body:JSON.stringify({...s,created_by:ME||null}),headers:{Prefer:"return=minimal"}});$("#dlg").close();toast("ثبت شد");await load()}catch(t){$("#fE").textContent=t.message}}}document.addEventListener("click",async t=>{const e=t.target.closest("[data-f],[data-a],#bAdd,#bSeed,#bMiss,#bOld");if(!e)return;try{if(e.id==="bAdd")return openForm(null);if(e.id==="bMiss"){e.disabled=true;await rq("hse_obligations",{method:"POST",body:JSON.stringify(SEED2.filter(t=>!O.some(e=>e.title===t[0])).map(([t,e,a,n])=>({title:t,category:e,period_months:a,authority:n,created_by:ME||null}))),headers:{Prefer:"return=minimal"}});toast("افزوده شد؛ موعد هر مورد را تعیین کنید");return load()}if(e.id==="bOld"){const t=O.find(t=>t.title.startsWith("سنجش عوامل زیان‌آور شیمیایی"));e.disabled=true;await rq("hse_obligations?id=eq."+t.id,{method:"PATCH",body:JSON.stringify({period_months:24,authority:"هر ۲ سال؛ فقط در صورت درخواست شبکه بهداشت"}),headers:{Prefer:"return=minimal"}});toast("دوره ۲ سال شد");return load()}if(e.id==="bSeed"){e.disabled=true;await rq("hse_obligations",{method:"POST",body:JSON.stringify(SEED.map(([t,e,a,n])=>({title:t,category:e,period_months:a,authority:n,created_by:ME||null}))),headers:{Prefer:"return=minimal"}});toast("فهرست بارگذاری شد؛ موعد هر مورد را تعیین کنید");return load()}if(e.dataset.f){FIL=e.dataset.f;return draw()}if(e.dataset.a==="done")openDone(e.dataset.id);else if(e.dataset.a==="edit")openForm(e.dataset.id)}catch(t){toast("خطا: "+t.message.slice(0,120))}});$("#q").oninput=draw;$("#cat").onchange=draw;HSEAuth.ready.then(()=>{ME=HSEAuth.email||"";load().catch(()=>{$("#warn").innerHTML='<div class="card2"><span class="bg bad">جدول ساخته نشده</span> فایل hse_obligations.sql را یک‌بار در Supabase SQL Editor اجرا کنید.</div>'})});</script></body></html>
