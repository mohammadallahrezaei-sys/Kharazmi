   <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="big ${col(c.total)}">${fa(c.total)}<span class="mu"> / ۱۰۰</span></div>
   <div class="mu">${fa(c.doneN)} چک‌لیست انجام‌شده · ${fa(c.cr)} عدم‌انطباق ثبت‌شده</div></div>
   <div class="mu">امتیاز شخصی${CFG.SHARED_IN_SCORE?'':' (بدون شاخص‌های مشترک واحد؛ نرمال‌شده روی ۱۰۰)'}</div><table style="margin-top:8px">${Object.keys(NAMES).filter(k=>CFG.SHARED_IN_SCORE||!SHARED.includes(k)).map(k=>`<tr><td>${NAMES[k]}</td><td style="width:30%"><div class="bar"><i style="width:${(c.s[k]||0)*100}%;background:var(--${c.s[k]>=.85?'ok':c.s[k]>=.65?'wa':'bad'})"></i></div></td><td class="c ${c.s[k]==null?'mu':col(c.s[k]*100)}">${c.s[k]==null?'بدون داده (از امتیاز خارج)':fa(c.pts[k])+' از '+fa(CFG.W[k])}</td></tr>`).join('')}</table>${CFG.SHARED_IN_SCORE?'':`<div class="mu" style="margin-top:10px">شاخص‌های مشترک واحد HSE (به کارشناس نسبت داده نمی‌شود) — امتیاز واحد: <b class="${col(c.unitScore)}">${fa(c.unitScore)}</b> / ۱۰۰</div><table>${SHARED.map(k=>`<tr><td>${NAMES[k]}</td><td style="width:30%"><div class="bar"><i style="width:${(c.s[k]||0)*100}%;background:var(--${c.s[k]>=.85?'ok':c.s[k]>=.65?'wa':'bad'})"></i></div></td><td class="c ${c.s[k]==null?'mu':col(c.s[k]*100)}">${c.s[k]==null?'بدون داده (از امتیاز خارج)':fa(c.pts[k])+' از '+fa(CFG.W[k])}</td></tr>`).join('')}</table>`}</div>
  <div class="card"><h2>نقاط ضعف و کم‌کاری این ماه</h2>${weak.length?`<ul>${weak.map(w=>`<li class="bad">${w}</li>`).join('')}</ul>`:'<div class="ok">مورد قابل‌توجهی ثبت نشده است.</div>'}</div>
  <div class="card"><h2>تطبیق با جدول زمان‌بندی ${lab(K)}</h2>${c.items.length?`<table>${c.items.map(x=>`<tr><td>${icon[x.st]} ${esc(x.t)}</td><td class="mu">${x.w?'مهلت: '+wtxt(x.w,K):''}</td><td class="${x.st==='mu'?'mu':x.st}">${x.txt}</td></tr>`).join('')}</table>
   <div class="mu" style="margin-top:6px">هر روز تأخیر ${fa(Math.round(CFG.LATE_PEN*100))}٪ از امتیاز آن چک‌لیست کم می‌کند. انجام زودتر از مهلت جریمه ندارد.</div>`:'<div class="mu">برای این ماه در جدول ۱۴۰۵ برنامه‌ای نیست.</div>'}
   ${isMgr()&&c.un.size?`<div class="wa" style="margin-top:6px">⚠ ثبت‌هایی که با هیچ چک‌لیست جدول تطبیق نخوردند: ${[...c.un].map(esc).join('، ')} — اگر چک‌لیست جدول هستند، کلمه‌ی کلیدی‌شان را در KW اضافه کنید.</div>`:''}</div>
  ${c.flags.length?`<div class="card"><h2>الگوهای نیازمند بررسی (بدون کسر امتیاز)</h2><ul>${c.flags.map(f=>`<li class="wa">${f}</li>`).join('')}</ul><div class="mu">زمان ثبت = زمان ورود به سامانه است، نه لزوماً زمان بازدید. پیش از هر اقدام انضباطی با خود کارشناس و فرم‌های کاغذی تطبیق دهید.</div></div>`:''}
  <div class="card"><h2>روند ۶ ماه اخیر (خودکنترلی)</h2><table><tr>${trend.map(t=>`<th class="c">${MN[+t[0].slice(5)-1]}${t[0]===nowK?'<span class="mu">جاری</span>':''}</th>`).join('')}</tr>
   <tr>${trend.map((t,i)=>`<td class="c ${cc(t[1])}">${fm(t[1])} ${i&&t[1]!=null&&trend[i-1][1]!=null?(t[1]>trend[i-1][1]?'↗':t[1]<trend[i-1][1]?'↘':''):''}</td>`).join('')}</tr></table></div>`;
}
const keysOf=v=>{const [t,a,b]=v.split(':');if(t==='m')return[a];const r=t==='q'?[(b-1)*3+1,b*3]:[1,12],o=[];
  for(let m=r[0];m<=r[1];m++){const k=a+'-'+String(m).padStart(2,'0');if(k<=nowK&&k>='1405-07')o.push(k)}return o};
function render(){
  const ms=document.getElementById('msel'),ks=keysOf(ms.value),out=document.getElementById('out'),ex=isMgr()?people():[ME];let h='';
  if(!ks.length){out.innerHTML='<div class="card mu">این دوره هنوز شروع نشده است.</div>';return}
  if(ks.length>1){
    h+=`<div class="card"><h2>امتیاز کارشناسان — ${esc(ms.selectedOptions[0].text)}</h2><table><tr><th></th>${ks.map(x=>`<th class="c">${MN[+x.slice(5)-1]}</th>`).join('')}<th class="c">میانگین</th></tr>
     ${ex.map(e=>{const t=ks.map(x=>tv(e,x)),tt=t.filter(v=>v!=null),av=tt.length?Math.round(tt.reduce((a,b)=>a+b,0)/tt.length):null;return `<tr><td>${esc(nm(e))}</td>${t.map(v=>`<td class="c ${cc(v)}">${fm(v)}</td>`).join('')}<td class="c ${cc(av)}"><b>${fm(av)}</b></td></tr>`}).join('')}</table>
     <div class="mu" style="margin-top:6px">امتیاز دوره‌ی فصلی/سالانه میانگین امتیاز ماه‌های گذشته‌ی آن است (جدول زمان‌بندی از مهر ۱۴۰۵ شروع می‌شود)؛ برای جزئیات و نقاط ضعف یک ماه را انتخاب کنید. دوره‌ها با «گزارش ماهانه HSE» یکسان‌اند.</div></div>`;
    out.innerHTML=h;return}
  const K=ks[0];
  if(isMgr()){
    const kk=[];let k=K;for(let i=0;i<6;i++){kk.unshift(k);k=prevK(k)}
    h+=`<div class="card"><h2>مقایسه کارشناسان (امتیاز ماهانه)</h2><table><tr><th></th>${kk.map(x=>`<th class="c">${MN[+x.slice(5)-1]}</th>`).join('')}</tr>
     ${ex.map(e=>`<tr><td>${esc(nm(e))}</td>${kk.map(x=>{const t=tv(e,x);return `<td class="c ${cc(t)}">${fm(t)}</td>`}).join('')}</tr>`).join('')}</table></div>`;
    h+=mgrCard(K);
    h+=card(document.getElementById('esel').value,K);
  }else h+=card(ME,K);
  h+=`<div class="mu">وزن‌ها: ${Object.keys(CFG.W).map(k=>NAMES[k]+' '+fa(CFG.W[k])).join('، ')}. حداقل‌ها در بخش CFG بالای فایل قابل تنظیم است. چک‌لیست «انجام‌شده» یعنی آخرین ثبت آن در همان ماه.</div>`;
  out.innerHTML=h;
}
HSEAuth.ready.then(()=>{ME=HSEAuth.email;start()});
</script>
