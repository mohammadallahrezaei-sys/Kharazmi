<script>
/* ================= تنظیمات (قابل ویرایش) ================= */
const URL_='https://priopguwfjawybffarhd.supabase.co',KEY='sb_publishable_fKFQePO9qiFhj4qU3Vq4lQ_OAFi7rfu';

const CFG={

};

/* ======================================================== */

const PFU=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',timeZone:'UTC'});
const key=p=>p.find(x=>x.type==='year').value+'-'+String(+p.find(x=>x.type==='month').value).padStart(2,'0');
function monthRange(K){const y=+K.slice(0,4),st=Date.UTC(y+621,2,10);let a=null,b=null;
  for(let i=0;i<400;i++){const t=new Date(st+i*864e5);if(key(PFU.formatToParts(t))===K){const s=t.toISOString().slice(0,10);if(!a)a=s;b=s}}return{a,b}}
const today=new Date().toLocaleDateString('en-CA');
const nowK=key(PFU.formatToParts(new Date()));
const lab=K=>MN[+K.slice(5)-1]+' '+fa(K.slice(0,4));
const pd=d=>new Date(d+'T12:00:00').toLocaleDateString('fa-IR',{weekday:'short',month:'long',day:'numeric'});

const hd=()=>({apikey:KEY,Authorization:'Bearer '+(TOK||KEY),'Content-Type':'application/json'});

function loginUI(m){document.getElementById('out').innerHTML='<div class="card bad">'+esc(m||'')+'</div>'}

async function getAll(t){let all=[],o=0;for(let n=0;n<50;n++){
  const r=await fetch(`${URL_}/rest/v1/${t}${t.includes('?')?'&':'?'}limit=1000&offset=${o}`,{headers:hd()}).catch(()=>null);
  if(!r||!r.ok)return null;const j=await r.json();if(!j.length)break;all=all.concat(j);o+=j.length}return all}

async function start(){
  document.getElementById('out').innerHTML='<div class="card">در حال دریافت اطلاعات...</div>';
  const since=encodeURIComponent(new Date(Date.now()-400*864e5).toISOString());
  let ek=await getAll('ekhtars?select=record_type,record_date,registered_by');const ekAttr=ek!=null;
  if(!ek)ek=await getAll('ekhtars?select=record_type,record_date')||[];
  const [ins,fin]=await Promise.all([getAll('inspections?select=module,location,total,ok,nc,na,created_at,inspector&created_at=gte.'+since),
    getAll('findings?select=status,module,created_at,closed_at,due_date,inspector')]);
  if(!ins||!fin)return loginUI('دریافت اطلاعات ناموفق بود (دسترسی یا اتصال)');
  const [cards,cul]=await Promise.all(['hse_cards?select=card_type,card_date,status','culture_assessments?select=assessed_at'].map(getAll));
  const [tr,ta,emp,inc,fu]=await Promise.all(['trainings?select=id,training_date','training_attendees?select=training_id,employee_id','employees?select=*',
    'clinic_incidents?select=corrective_action,action_status,action_due_date','clinic_followups?select=status,due_date'].map(getAll));
  D={cards,cul,ins:ins.filter(r=>r.module!=='Q'&&!String(r.location||'').startsWith(IMPORT_LOC)),fin:fin.filter(f=>f.status!=='cancelled'&&f.module!=='MED'),ek,ekAttr,tr:tr||[],ta:ta||[],emp:emp||[],inc:inc||[],fu:fu||[]};
  const es=document.getElementById('esel'),ms=document.getElementById('msel');
  const mine=isMgr()?people():[ME];
  es.innerHTML=mine.map(e=>`<option value="${esc(e)}">${esc(nm(e))}</option>`).join('');es.style.display=isMgr()?'':'none';
  const QN=['بهار','تابستان','پاییز','زمستان'];let K=nowK,o='<optgroup label="ماهانه">';
  for(let i=0;i<12;i++){o+=`<option value="m:${K}">${lab(K)}</option>`;K=prevK(K)}
  o+='</optgroup><optgroup label="فصلی">';{let y=+nowK.slice(0,4),q=Math.ceil(+nowK.slice(5)/3);for(let i=0;i<4;i++){o+=`<option value="q:${y}:${q}">فصل ${QN[q-1]} ${fa(y)}</option>`;if(--q<1){q=4;y--}}}
  o+=`</optgroup><optgroup label="سالانه"><option value="y:${nowK.slice(0,4)}">سال ${fa(nowK.slice(0,4))}</option></optgroup>`;
  ms.innerHTML=o;es.onchange=ms.onchange=render;
  document.getElementById('who').textContent=isMgr()?'نمای مدیر — همه کارشناسان':'نمای شخصی — فقط عملکرد خودتان';
  render();
}

/* ---------- جدول زمان‌بندی ۱۴۰۵ (از فایل اکسل) ---------- */
const SCHED=[{"t": "جرثقیل سقفی", "daily": false, "m": {"1405-08": [3, 3], "1405-09": [1, 1], "1405-10": [1, 1], "1405-11": [3, 3], "1405-12": [1, 1]}}, {"t": "بالابر", "daily": false, "m": {"1405-08": [4, 4], "1405-09": [2, 2], "1405-10": [5, 5], "1405-11": [5, 5], "1405-12": [2, 2]}}, {"t": "لیفتراک", "daily": false, "m": {"1405-08": [5, 5], "1405-09": [4, 4], "1405-10": [6, 6], "1405-11": [6, 6], "1405-12": [3, 3]}}, {"t": "پساب های فاضلابی و پسماند", "daily": false, "m": {"1405-08": [6, 6], "1405-09": [7, 7], "1405-10": [7, 7], "1405-11": [7, 7], "1405-12": [4, 4]}}, {"t": "اماکن عمومی و بهداشتی", "daily": false, "m": {"1405-08": [9, 9], "1405-09": [8, 8], "1405-10": [8, 8], "1405-11": [10, 10], "1405-12": [5, 5]}}, {"t": "انبارها", "daily": false, "m": {"1405-08": [10, 10], "1405-09": [9, 9], "1405-10": [9, 9], "1405-11": [11, 11], "1405-12": [8, 8]}}, {"t": "واحد فنی", "daily": false, "m": {"1405-08": [11, 11], "1405-09": [10, 10], "1405-10": [12, 12], "1405-11": [12, 12], "1405-12": [10, 10]}}, {"t": "انبار سیلندرهای تحت فشار", "daily": false, "m": {"1405-08": [13, 13], "1405-09": [11, 11], "1405-10": [13, 13], "1405-11": [13, 13], "1405-12": [11, 11]}}, {"t": "سیلندرهای تحت فشار", "daily": false, "m": {"1405-08": [13, 13], "1405-09": [11, 11], "1405-10": [13, 13], "1405-11": [13, 13], "1405-12": [11, 11]}}, {"t": "ایمنی دستگاه ها و تجهیزات", "daily": false, "m": {"1405-08": [16, 18], "1405-09": [14, 15], "1405-10": [14, 15], "1405-11": [14, 17], "1405-12": [12, 12]}}, {"t": "کپسول های اطفاء حریق", "daily": false, "m": {"1405-08": [19, 20], "1405-09": [16, 17], "1405-10": [19, 20], "1405-11": [18, 19], "1405-12": [15, 15]}}, {"t": "فایر باکس ها", "daily": false, "m": {"1405-08": [23, 23], "1405-09": [18, 18], "1405-10": [21, 21], "1405-11": [20, 20], "1405-12": [15, 15]}}, {"t": "ایمنی برق", "daily": false, "m": {"1405-08": [24, 26], "1405-09": [21, 25], "1405-10": [22, 26], "1405-11": [21, 25], "1405-12": [16, 16]}}, {"t": "ایمنی عمومی سالن ها و دفاتر", "daily": false, "m": {"1405-07": [22, 30], "1405-08": [27, 30], "1405-09": [26, 30], "1405-10": [27, 30], "1405-11": [26, 30], "1405-12": [17, 17]}}, {"t": "کنترل دارو", "daily": false, "m": {"1405-07": [30, 30], "1405-08": [30, 30], "1405-09": [30, 30], "1405-10": [30, 30], "1405-11": [30, 30], "1405-12": [18, 18]}}, {"t": "رستوران", "daily": true, "m": {}}, {"t": "خودروها", "daily": false, "m": {"1405-07": [28, 29], "1405-10": [5, 6]}}];
const KW=[['جرثقیل'],['بالابر'],['لیفتراک'],['پساب','پسماند'],['اماکن عمومی','بهداشتی'],['انبارها','انبار'],['واحد فنی'],['انبار سیلندر'],['سیلندرهای','سیلندر'],['ایمنی دستگاه','تجهیزات'],['کپسول'],['فایر'],['ایمنی برق','برق'],['سالن','دفاتر','ایمنی عمومی'],['دارو'],['رستوران'],['خودرو']];
const nz=s=>String(s||'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\u200c/g,' ');
/* کد ماژول ← ردیف(های) جدول؛ از تعریف چک‌لیست‌ها در checklists.html */
const MODS={CR:[0,1],FK:[2],ENV:[3],SAN:[4],W:[5],CY:[7,8],EQ:[9],F:[10,11],E:[12],S:[13],KIT:[15],V:[16]}; // D, CH, CT در جدول ۱۴۰۵ نیستند
const MAPPED=new Set(Object.values(MODS).flat());
function itemsOf(r){return MODS[r.module]||[]}
const PFD=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric',timeZone:'UTC'});
const pk=s=>{const p=PFD.formatToParts(new Date(s+'T12:00:00Z'));return{k:key(p),d:+p.find(x=>x.type==='day').value}};
const nowP=pk(today),d10=v=>String(v||'').slice(0,10);
const prevK=k=>{let y=+k.slice(0,4),m=+k.slice(5)-1;if(m<1){m=12;y--}return y+'-'+String(m).padStart(2,'0')};
const wtxt=(w,K)=>(w[0]===w[1]?fa(w[0]):fa(w[0])+' تا '+fa(w[1]))+' '+MN[+K.slice(5)-1];

/* تاریخ ثبت در جدول ekhtars شمسی است (مثل 1405/07/20)؛ مقایسه با مهر/ماه شمسی انجام می‌شود */
function ekIn(v,K){const t=String(v||'').replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)),m=/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/.exec(t);
  if(!m)return false;return m[1]+'-'+m[2].padStart(2,'0')===K&&(K!==nowK||+m[3]<=nowP.d)}
/* ---------- محاسبه ---------- */
function workdays(R){const end=R.b<today?R.b:today,o=[];
  for(let t=new Date(R.a+'T12:00:00');;t.setDate(t.getDate()+1)){const s=t.toLocaleDateString('en-CA');if(s>end)break;
    if(CFG.WORKDAYS.includes(t.getDay())&&!CFG.HOLIDAYS.includes(s))o.push(s)}return o}
/* پرسنل فعال در ماه K (قطع همکاری از ماه بعد حذف می‌شود) */
function empOn(K){return (D.emp||[]).filter(e=>HSEP.isActive(e,monthRange(K).a))}
function core(email,K){
  const R=monthRange(K),recs={},un=new Set(),mine=[];
  D.ins.forEach(r=>{if(!eqm(r.inspector,email))return;const d=new Date(r.created_at).toLocaleDateString('en-CA');if(d<R.a||d>R.b)return;
    mine.push({t:new Date(r.created_at).getTime(),m:r.module,k:[r.total,r.ok,r.nc,r.na].join(' - ')});
    const ii=itemsOf(r);if(!ii.length){if(r.module!=='D'&&r.module!=='CT'&&r.module!=='CH')un.add((r.module||'')+' | '+(r.location||''));return}
    ii.forEach(i=>{const o=recs[i]||(recs[i]={days:new Set(),nc:0});o.days.add(d);o.nc+=(r.nc||0)})});
  const flags=[],bm={};mine.forEach(x=>(bm[x.m]=bm[x.m]||[]).push(x));
  Object.entries(bm).forEach(([m,a])=>{if(a.length<8)return;const c={};a.forEach(x=>c[x.k]=(c[x.k]||0)+1);const [k,n]=Object.entries(c).sort((p,q)=>q[1]-p[1])[0];
    if(n/a.length>=0.8)flags.push(`${fa(n)} از ${fa(a.length)} ثبت ماژول ${m} دقیقاً نتیجه‌ی یکسان دارد (کل - تأیید - عدم‌انطباق - ن.م.: ${k})`)});
  const ts=mine.map(x=>x.t).sort((a,b)=>a-b);let mx=0;for(let i=0,j=0;i<ts.length;i++){while(ts[i]-ts[j]>30*6e4)j++;mx=Math.max(mx,i-j+1)}
  if(mx>=15)flags.push(`${fa(mx)} ثبت در یک بازه‌ی ۳۰ دقیقه‌ای (ممکن است ثبت دسته‌ای بعد از بازدید باشد)`);
  return{R,recs,un,flags}}
const created=(e,R)=>D.fin.filter(f=>eqm(f.inspector,e)&&d10(f.created_at)>=R.a&&d10(f.created_at)<=R.b).length;
function baseRate(K){if(CFG.RATE_FIXED)return CFG.RATE_FIXED;let n=0,c=0,k=K;
  for(let i=0;i<6;i++){k=prevK(k);people().forEach(e=>{const x=core(e,k);n+=Object.keys(x.recs).length;c+=created(e,x.R)})}
  return n>=10?c/n:CFG.RATE_DEFAULT}
function calc(email,K){
  const {R,recs,un,flags}=core(email,K),end=R.b<today?R.b:today,inR=d=>d>=R.a&&d<=end,past=K<nowK,cur=K===nowK;
  const items=[];
  SCHED.forEach((it,i)=>{
    if(it.daily){if(K<'1405-07'||K>'1405-12')return;const wd=workdays(R),dn=wd.filter(d=>recs[i]&&recs[i].days.has(d)).length;
      if(wd.length)items.push({i,t:it.t,daily:1,sc:dn/wd.length,st:dn<wd.length?'bad':'ok',txt:`روزانه: ${fa(dn)} از ${fa(wd.length)} روز کاری`});return}
    const w=it.m[K];if(!w)return;const o=recs[i];
    if(!MAPPED.has(i)){items.push({i,t:it.t,w,st:'wa',txt:'کد ماژول تعریف نشده — از امتیاز خارج است (به مدیر اطلاع دهید)'});return}
    if(o){const last=pk([...o.days].sort().pop()).d,late=Math.max(0,last-w[1]);
      items.push({i,t:it.t,w,sc:Math.max(0,1-CFG.LATE_PEN*late),st:late?'wa':'ok',txt:late?`${fa(late)} روز تأخیر`:'به‌موقع'})}
    else if(past||(cur&&nowP.d>w[1]))items.push({i,t:it.t,w,sc:0,miss:1,st:'bad',txt:'انجام نشده'});
    else items.push({i,t:it.t,w,st:'mu',txt:'هنوز موعد نرسیده'})});
  const ev=items.filter(x=>x.sc!=null),sched=ev.length?ev.reduce((s,x)=>s+x.sc,0)/ev.length:1;
  const doneN=Object.keys(recs).length,zero=items.filter(x=>!x.daily&&recs[x.i]&&recs[x.i].nc===0);
  const nDone=items.filter(x=>!x.daily&&recs[x.i]).length;
  const cr=created(email,R),rate=baseRate(K),tgtNc=Math.max(1,Math.ceil(CFG.RATE_FACTOR*rate*doneN));
  const F=D.fin.filter(f=>eqm(f.inspector,email));
  const cl=F.filter(f=>f.closed_at&&inR(d10(f.closed_at))&&f.due_date),ot=cl.filter(f=>d10(f.closed_at)<=f.due_date).length;
  const over=F.filter(f=>d10(f.created_at)<=end&&(f.status==='open'||(f.closed_at&&d10(f.closed_at)>end))&&f.due_date&&f.due_date<end).length;
  const close=Math.max(0,(cl.length?ot/cl.length:1)-0.1*over);
  const E=D.ek.filter(x=>ekIn(x.record_date,K)&&(!D.ekAttr||eqm(x.registered_by,email))),rw=E.filter(x=>x.record_type==='تشویق').length;
  const tgtEk=Math.max(CFG.MIN_EK,Math.ceil(empOn(K).length*CFG.EK_PER_EMP));
  /* شاخص‌های مشترک واحد HSE */
  const TR=D.tr.filter(t=>inR(d10(t.training_date))),cut=new Date(new Date(end).getTime()-365*864e5).toISOString().slice(0,10);
  const rec=new Set(D.tr.filter(t=>d10(t.training_date)>cut&&d10(t.training_date)<=end).map(t=>t.id));
  const eA=empOn(K),eS=new Set(eA.map(e=>e.id)),cov=eA.length?new Set(D.ta.filter(a=>rec.has(a.training_id)&&a.employee_id&&eS.has(a.employee_id)).map(a=>a.employee_id)).size/eA.length:0;
  const capaO=D.inc.filter(x=>x.corrective_action&&x.action_status!=='done'&&x.action_due_date&&x.action_due_date<end).length;
  const fuO=D.fu.filter(x=>x.status!=='done'&&x.status!=='cancelled'&&x.due_date&&x.due_date<end).length;
  const s={sched,finds:Math.min(1,cr/tgtNc),close,
    disc:0.7*Math.min(1,E.length/tgtEk)+0.3*Math.min(1,rw/CFG.MIN_RW),
    quality:nDone?Math.max(0,1-Math.max(0,zero.length/nDone-CFG.MAX_ZERO)/(1-CFG.MAX_ZERO)):1,
    train:0.5*Math.min(1,TR.length/CFG.MIN_TRAIN)+0.5*Math.min(1,cov/CFG.COV_TARGET),
    fup:Math.max(0,1-0.1*(capaO+fuO))};
  const pts={};let raw=0,wsum=0;for(const k in s){pts[k]=Math.round(s[k]*CFG.W[k]);if(CFG.SHARED_IN_SCORE||!SHARED.includes(k)){raw+=s[k]*CFG.W[k];wsum+=CFG.W[k]}}
  const total=Math.round(raw/wsum*100);
  const unitScore=Math.round(SHARED.reduce((a,k)=>a+s[k]*CFG.W[k],0)/SHARED.reduce((a,k)=>a+CFG.W[k],0)*100);
  return{unitScore,items,s,pts,total,zero,un,cr,tgtNc,over,ot,otN:cl.length,ek:E.length,rw,tgtEk,trN:TR.length,cov,capaO,fuO,doneN,rate,flags,na:!items.length}}

/* ---------- شاخص‌های مدیر واحد HSE (عملکرد واحد، نه بازرسی شخصی) ---------- */
const MW={train:20,fup:15,close:20,team:15,cards:10,disc:10,culture:10};
const MNAMES={train:'آموزش (جلسات ماهانه و پوشش ۱۲ ماهه‌ی پرسنل)',fup:'اقدام اصلاحی حوادث و پیگیری طب کار بدون معوقه',close:'مدیریت عدم‌انطباق‌های واحد (بستن به‌موقع و نبود معوقه)',team:'رعایت جدول زمان‌بندی توسط تیم کارشناسان',cards:'پاسخ به کارت‌های گزارش خطر/پیشنهاد (حداکثر ۷ روز)',disc:'فعالیت انضباطی و تشویقی واحد (همه‌ی ثبت‌کننده‌ها)',culture:'ارزیابی نردبان فرهنگ ایمنی (حداکثر هر ۶ ماه)'};
function mgrCalc(K){
  const R=monthRange(K),end=R.b<today?R.b:today,cl0=ME&&calc(ME,K),m={},det={};
  m.train=cl0.s.train;det.train=`${fa(cl0.trN)} جلسه (حداقل ${fa(CFG.MIN_TRAIN)}) · پوشش ${fa(Math.round(cl0.cov*100))}٪ (هدف ${fa(Math.round(CFG.COV_TARGET*100))}٪)`;
  m.fup=cl0.s.fup;det.fup=`${fa(cl0.capaO)} اقدام اصلاحی و ${fa(cl0.fuO)} پیگیری طب کار معوق`;
  const op=D.fin.filter(f=>d10(f.created_at)<=end&&(f.status==='open'||(f.closed_at&&d10(f.closed_at)>end))),ov=op.filter(f=>f.due_date&&f.due_date<end).length,
    cl=D.fin.filter(f=>f.closed_at&&d10(f.closed_at)>=R.a&&d10(f.closed_at)<=end&&f.due_date),ot=cl.filter(f=>d10(f.closed_at)<=f.due_date).length;
  m.close=(cl.length?.5*ot/cl.length:.5)+.5*(op.length?1-ov/op.length:1);
  det.close=`${fa(op.length)} مورد باز، ${fa(ov)} معوق · ${fa(ot)} از ${fa(cl.length)} بسته‌شده‌ی این ماه به‌موقع`;
  const ex=Object.keys(NAME_MAP).filter(e=>!eqm(e,ME)).map(e=>calc(e,K)).filter(c=>!c.na);
  m.team=ex.length?ex.reduce((a,c)=>a+c.s.sched,0)/ex.length:null;det.team=ex.length?`میانگین رعایت جدول: ${fa(Math.round(m.team*100))}٪ (${fa(ex.length)} کارشناس)`:'کارشناسی با برنامه‌ی این ماه نیست';
  if(D.cards){const pe=D.cards.filter(c=>['pending','in_review'].includes(c.status)&&c.card_date&&d10(c.card_date)<=end),old=pe.filter(c=>(new Date(end)-new Date(d10(c.card_date)))/864e5>7).length;
    m.cards=pe.length?1-old/pe.length:1;det.cards=`${fa(pe.length)} کارت بدون نتیجه، ${fa(old)} مورد بیش از ۷ روز`}else{m.cards=null;det.cards='دسترسی به جدول کارت‌ها نیست'}
  const E=D.ek.filter(x=>ekIn(x.record_date,K)),rw=E.filter(x=>x.record_type==='تشویق').length,tg=Math.max(CFG.MIN_EK,Math.ceil(empOn(K).length*CFG.EK_PER_EMP));
  m.disc=0.7*Math.min(1,E.length/tg)+0.3*Math.min(1,rw/CFG.MIN_RW);det.disc=`${fa(E.length)} مورد (هدف ${fa(tg)}) · ${fa(rw)} تشویق (هدف ${fa(CFG.MIN_RW)})`;
  if(D.cul){const last=D.cul.map(c=>d10(c.assessed_at)).filter(d=>d&&d<=end).sort().pop();
    if(last){const age=Math.round((new Date(end)-new Date(last))/864e5);m.culture=Math.max(0,Math.min(1,1-(age-180)/180));det.culture=`آخرین ارزیابی ${fa(Math.round(age/30))} ماه پیش`}else{m.culture=0;det.culture='ارزیابی ثبت نشده'}}else{m.culture=null;det.culture='دسترسی به جدول ارزیابی فرهنگ نیست'}
  let raw=0,ws=0;for(const k in MW)if(m[k]!=null){raw+=Math.max(0,Math.min(1,m[k]))*MW[k];ws+=MW[k]}
  const pts={};for(const k in MW)pts[k]=m[k]==null?null:Math.round(Math.max(0,Math.min(1,m[k]))*MW[k]);
  return{m,det,pts,total:ws?Math.round(raw/ws*100):null}}
function mgrCard(K){
  const c=mgrCalc(K);if(c.total==null)return'';
  return `<div class="card"><h2>شاخص‌های مدیر واحد HSE — ${lab(K)}${K===nowK?' <span class="mu">(ماه جاری؛ هنوز تمام نشده)</span>':''}</h2>
   <div class="big ${col(c.total)}">${fa(c.total)}<span class="mu"> / ۱۰۰</span></div>
   <table style="margin-top:8px">${Object.keys(MW).map(k=>`<tr><td>${MNAMES[k]}<div class="mu">${c.det[k]}</div></td><td style="width:26%"><div class="bar"><i style="width:${(c.m[k]||0)*100}%;background:var(--${c.m[k]>=.85?'ok':c.m[k]>=.65?'wa':'bad'})"></i></div></td><td class="c ${c.m[k]==null?'mu':col(c.m[k]*100)}">${c.pts[k]==null?'—':fa(c.pts[k])+' از '+fa(MW[k])}</td></tr>`).join('')}</table>
   <div class="mu" style="margin-top:6px">این شاخص‌ها عملکرد مدیریتی واحد را می‌سنجند و جدا از امتیاز شخصی بازرسی شماست. شاخصی که داده‌اش در دسترس نیست از محاسبه حذف و امتیاز روی ۱۰۰ نرمال می‌شود.</div></div>`}
const tv=(e,x)=>{const c=calc(e,x);return c.na?null:c.total};const fm=v=>v==null?'—':fa(v);const cc=v=>v==null?'mu':col(v);
const NAMES={sched:'رعایت جدول زمان‌بندی چک‌لیست‌ها',finds:'عدم‌انطباق ثبت‌شده نسبت به کار انجام‌شده',close:'پیگیری و بستن به‌موقع',disc:'تشویق/تذکر/اخطار',quality:'کیفیت بازدید (بدون «چک‌لیست خالی»)',train:'آموزش (مشترک واحد)',fup:'اقدام اصلاحی و پیگیری طب کار (مشترک واحد)'};

function card(email,K){
  const c=calc(email,K),weak=[];
  c.items.filter(x=>x.miss).forEach(x=>weak.push(`«${x.t}» تا ${wtxt(x.w,K)} انجام نشده است.`));
  c.items.filter(x=>x.sc>0&&x.st==='wa').forEach(x=>weak.push(`«${x.t}» ${x.txt} (مهلت: ${wtxt(x.w,K)}).`));
  if(c.cr<c.tgtNc)weak.push(`${fa(c.cr)} عدم‌انطباق ثبت شده؛ با توجه به ${fa(c.doneN)} چک‌لیست انجام‌شده و میانگین ۶ ماه گذشته‌ی واحد، انتظار حداقل ${fa(c.tgtNc)} مورد بود.`);
  if(c.zero.length)weak.push(`${fa(c.zero.length)} چک‌لیست بدون هیچ عدم‌انطباقی ثبت شده: ${c.zero.map(x=>x.t).join('، ')}.`);
  if(c.over)weak.push(`${fa(c.over)} عدم‌انطباق ثبت‌شده‌ی شما از مهلت گذشته و هنوز باز است.`);
  if(c.otN>c.ot)weak.push(`${fa(c.otN-c.ot)} مورد از ${fa(c.otN)} عدم‌انطباق بسته‌شده با تأخیر بسته شده است.`);
  if(c.ek<c.tgtEk||c.rw<CFG.MIN_RW)weak.push(`${fa(c.ek)} تشویق/تذکر/اخطار (${fa(c.rw)} تشویق)؛ انتظار حداقل ${fa(c.tgtEk)} مورد و ${fa(CFG.MIN_RW)} تشویق.${D.ekAttr?'':' (ستون ثبت‌کننده در جدول نیست؛ SQL ستون registered_by را اجرا کنید)'}`);
  if(c.s.train<.8)weak.push(`آموزش: ${fa(c.trN)} جلسه در ماه (حداقل ${fa(CFG.MIN_TRAIN)}) و پوشش ۱۲ ماهه‌ی پرسنل ${fa(Math.round(c.cov*100))}٪ (هدف ${fa(Math.round(CFG.COV_TARGET*100))}٪).`);
  if(c.capaO+c.fuO)weak.push(`${fa(c.capaO)} اقدام اصلاحی حوادث و ${fa(c.fuO)} پیگیری طب کار معوق است.`);
  const trend=[];let k=K;for(let i=0;i<6;i++){trend.unshift([k,tv(email,k)]);k=prevK(k)}
  const icon={ok:'✓',wa:'⚠',bad:'✗',mu:'…'};
  return `<div class="card"><h2>${esc(nm(email))} — ${lab(K)}${K===nowK?' <span class="mu">(ماه جاری؛ هنوز تمام نشده)</span>':''}</h2>
   <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="big ${col(c.total)}">${fa(c.total)}<span class="mu"> / ۱۰۰</span></div>
   <div class="mu">${fa(c.doneN)} چک‌لیست انجام‌شده · ${fa(c.cr)} عدم‌انطباق ثبت‌شده</div></div>
   <div class="mu">امتیاز شخصی${CFG.SHARED_IN_SCORE?'':' (بدون شاخص‌های مشترک واحد؛ نرمال‌شده روی ۱۰۰)'}</div><table style="margin-top:8px">${Object.keys(NAMES).filter(k=>CFG.SHARED_IN_SCORE||!SHARED.includes(k)).map(k=>`<tr><td>${NAMES[k]}</td><td style="width:30%"><div class="bar"><i style="width:${c.s[k]*100}%;background:var(--${c.s[k]>=.85?'ok':c.s[k]>=.65?'wa':'bad'})"></i></div></td><td class="c ${col(c.s[k]*100)}">${fa(c.pts[k])} از ${fa(CFG.W[k])}</td></tr>`).join('')}</table>${CFG.SHARED_IN_SCORE?'':`<div class="mu" style="margin-top:10px">شاخص‌های مشترک واحد HSE (به کارشناس نسبت داده نمی‌شود) — امتیاز واحد: <b class="${col(c.unitScore)}">${fa(c.unitScore)}</b> / ۱۰۰</div><table>${SHARED.map(k=>`<tr><td>${NAMES[k]}</td><td style="width:30%"><div class="bar"><i style="width:${c.s[k]*100}%;background:var(--${c.s[k]>=.85?'ok':c.s[k]>=.65?'wa':'bad'})"></i></div></td><td class="c ${col(c.s[k]*100)}">${fa(c.pts[k])} از ${fa(CFG.W[k])}</td></tr>`).join('')}</table>`}</div>
  <div class="card"><h2>نقاط ضعف و کم‌کاری این ماه</h2>${weak.length?`<ul>${weak.map(w=>`<li class="bad">${w}</li>`).join('')}</ul>`:'<div class="ok">مورد قابل‌توجهی ثبت نشده است.</div>'}</div>
  <div class="card"><h2>تطبیق با جدول زمان‌بندی ${lab(K)}</h2>${c.items.length?`<table>${c.items.map(x=>`<tr><td>${icon[x.st]} ${esc(x.t)}</td><td class="mu">${x.w?'مهلت: '+wtxt(x.w,K):''}</td><td class="${x.st==='mu'?'mu':x.st}">${x.txt}</td></tr>`).join('')}</table>
   <div class="mu" style="margin-top:6px">هر روز تأخیر ${fa(Math.round(CFG.LATE_PEN*100))}٪ از امتیاز آن چک‌لیست کم می‌کند. انجام زودتر از مهلت جریمه ندارد.</div>`:'<div class="mu">برای این ماه در جدول ۱۴۰۵ برنامه‌ای نیست.</div>'}
   ${isMgr()&&c.un.size?`<div class="wa" style="margin-top:6px">⚠ ثبت‌هایی که با هیچ چک‌لیست جدول تطبیق نخوردند: ${[...c.un].map(esc).join('، ')} — اگر چک‌لیست جدول هستند، کلمه‌ی کلیدی‌شان را در KW اضافه کنید.</div>`:''}</div>
  ${c.flags.length?`<div class="card"><h2>الگوهای نیازمند بررسی (بدون کسر امتیاز)</h2><ul>${c.flags.map(f=>`<li class="wa">${f}</li>`).join('')}</ul><div class="mu">زمان ثبت = زمان ورود به سامانه است، نه لزوماً زمان بازدید. پیش از هر اقدام انضباطی با خود کارشناس و فرم‌های کاغذی تطبیق دهید.</div></div>`:''}
  <div class="card"><h2>روند ۶ ماه اخیر (خودکنترلی)</h2><table><tr>${trend.map(t=>`<th class="c">${MN[+t[0].slice(5)-1]}${t[0]===nowK?'<span class="mu">جاری</span>':''}</th>`).join('')}</tr>
   <tr>${trend.map((t,i)=>`<td class="c ${cc(t[1])}">${fm(t[1])} ${i&&t[1]!=null&&trend[i-1][1]!=null?(t[1]>trend[i-1][1]?'↗':t[1]<trend[i-1][1]?'↘':''):''}</td>`).join('')}</tr></table></div>`;
}
const keysOf=v=>{const [t,a,b]=v.split(':');if(t==='m')return[a];const r=t==='q'?[(b-1)*3+1,b*3]:[1,12],o=[];
  for(let m=r[0];m<=r[1];m++){const k=a+'-'+String(m).padStart(2,'0');if(k<=nowK&&k>='1405-07')o.push(k)}return o};
function render(){
  const ms=document.getElementById('msel'),ks=keysOf(ms.value),out=document.getElementById('out'),ex=isMgr()?people():[ME];let h='';
  if(!ks.length){out.innerHTML='<div class="card mu">این دوره هنوز شروع نشده است.</div>';return}
  if(ks.length>1){
    h+=`<div class="card"><h2>امتیاز کارشناسان — ${esc(ms.selectedOptions[0].text)}</h2><table><tr><th></th>${ks.map(x=>`<th class="c">${MN[+x.slice(5)-1]}</th>`).join('')}<th class="c">میانگین</th></tr>
     ${ex.map(e=>{const t=ks.map(x=>tv(e,x)),tt=t.filter(v=>v!=null),av=tt.length?Math.round(tt.reduce((a,b)=>a+b,0)/tt.length):null;return `<tr><td>${esc(nm(e))}</td>${t.map(v=>`<td class="c ${cc(v)}">${fm(v)}</td>`).join('')}<td class="c ${cc(av)}"><b>${fm(av)}</b></td></tr>`}).join('')}</table>
     <div class="mu" style="margin-top:6px">امتیاز دوره‌ی فصلی/سالانه میانگین امتیاز ماه‌های گذشته‌ی آن است (جدول زمان‌بندی از مهر ۱۴۰۵ شروع می‌شود)؛ برای جزئیات و نقاط ضعف یک ماه را انتخاب کنید. دوره‌ها با «گزارش ماهانه HSE» یکسان‌اند.</div></div>`;
    out.innerHTML=h;return}
  const K=ks[0];
  if(isMgr()){
    const kk=[];let k=K;for(let i=0;i<6;i++){kk.unshift(k);k=prevK(k)}
    h+=`<div class="card"><h2>مقایسه کارشناسان (امتیاز ماهانه)</h2><table><tr><th></th>${kk.map(x=>`<th class="c">${MN[+x.slice(5)-1]}</th>`).join('')}</tr>
     ${ex.map(e=>`<tr><td>${esc(nm(e))}</td>${kk.map(x=>{const t=tv(e,x);return `<td class="c ${cc(t)}">${fm(t)}</td>`}).join('')}</tr>`).join('')}</table></div>`;
    h+=mgrCard(K);
    h+=card(document.getElementById('esel').value,K);
  }else h+=card(ME,K);
  h+=`<div class="mu">وزن‌ها: ${Object.keys(CFG.W).map(k=>NAMES[k]+' '+fa(CFG.W[k])).join('، ')}. حداقل‌ها در بخش CFG بالای فایل قابل تنظیم است. چک‌لیست «انجام‌شده» یعنی آخرین ثبت آن در همان ماه.</div>`;
  out.innerHTML=h;
}
