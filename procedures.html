<!doctype html><html lang="fa" dir="rtl"><head><meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"><script src="auth.js" data-roles="manager"></script><script src="hse_nav.js" defer="defer"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>برنامه دستورالعمل‌ها - نرم‌افزار جامع HSE</title><link rel="stylesheet" href="hse_ui.css"><style>.w{max-width:900px;margin:0 auto;padding:14px}.card2{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}.t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}.mu{color:var(--mu);font-size:12px}.b2{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.b2.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}.b2.ok{border-color:var(--ok);color:var(--ok)}.b2.bad{border-color:var(--bad);color:var(--bad)}.bg{display:inline-block;border-radius:99px;padding:1px 10px;font-size:11px;border:1px solid var(--bd)}.bg.ok{color:var(--ok);border-color:var(--ok)}.bg.bad{color:var(--bad);border-color:var(--bad)}.bg.wa{color:var(--wa);border-color:var(--wa)}.sm{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}.sm button{text-align:center;padding:8px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}.sm b{display:block;font-size:22px}input,select,textarea{font:inherit;font-size:13px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);padding:7px 9px;width:100%}dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(94vw,560px);padding:14px}dialog::backdrop{background:rgba(15,23,42,.55)}label.f{display:block;font-size:12px;color:var(--mu);margin-top:8px}.jd{display:flex;gap:4px}.jd select{width:auto;flex:1}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pb{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin:6px 0}.pb i{display:block;height:100%;background:var(--ok)}pre{white-space:pre-wrap;font:inherit;font-size:13px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;max-height:46vh;overflow:auto}[hidden]{display:none!important}</style></head><body><div class="w"><h1 style="">📘 برنامه تدوین دستورالعمل‌های HSE</h1><div style=""><a href="instructions.html" class="b2" style="">📚 کتابخانهٔ دستورالعمل‌های آماده (تک‌برگی و کامل)</a></div><div class="mu">دستورالعمل‌های سیستمی (مثل مدیریت حوادث و پیمانکاران)، دستگاه‌ها و فرایندها — هر کدام با موعد؛ موعدها در تقویم کاری مدیر هم می‌آید.</div><div class="card2"><div class="row"><b id="pt"></b><span class="mu" id="ps"></span></div><div class="pb"><i id="pbi" style=""></i></div></div><div class="sm" id="sm"></div><div class="row"><select id="kind" style=""><option value="">همهٔ انواع</option><option>سیستمی</option><option>دستگاه</option><option>فرایند</option></select><input id="q" placeholder="🔍 جستجو…" style=""><button class="b2 p" id="bAdd">＋ دستورالعمل جدید</button></div><div id="warn"></div><div id="list"></div></div><dialog id="dlg"></dialog><div id="toast" style=""></div><script src="eval_core.js"></script><script>const{fa:fa,esc:esc}=HSE,$=t=>document.querySelector(t),SB="https://priopguwfjawybffarhd.supabase.co/rest/v1/";const ST={planned:"برنامه‌ریزی‌شده",drafting:"در حال تدوین",review:"در بازنگری/تأیید",approved:"ابلاغ‌شده"},NX={planned:"drafting",drafting:"review",review:"approved"},NB={planned:"▶ شروع تدوین",drafting:"📨 ارسال برای بازنگری",review:"✔ ابلاغ شد"};const PRI={1:"اولویت بالا",2:"اولویت متوسط",3:"اولویت پایین"};const OUT={"سیستمی":["هدف","دامنه و محدوده اجرا","تعاریف و اختصارات","مسئولیت‌ها و اختیارات (مدیرعامل، مدیر HSE، سرپرستان، پرسنل)","شرح فعالیت‌ها (گام‌به‌گام، با مهلت و مسئول هر گام)","فرم‌ها و سوابق (نام فرم، محل نگهداری، مدت نگهداری)","شاخص‌های پایش و نحوهٔ گزارش‌دهی","مراجع و الزامات قانونی (قانون کار، آیین‌نامه‌های حفاظت فنی، استانداردها)","تاریخ تدوین، شمارهٔ ویرایش و امضاها"],"دستگاه":["هدف و دامنه (کد و نام دستگاه‌ها)","مشخصات و ظرفیت مجاز دستگاه","خطرات اصلی دستگاه (با بیان پیامد)","شرایط به‌کارگیری اپراتور (آموزش، صلاحیت، مجوز)","بازرسی پیش از شروع کار (چک‌لیست)","روش کار ایمن حین بهره‌برداری","توقف، تعمیر و نگهداری ایمن (شامل قفل و برچسب)","وضعیت اضطراری و اقدام فوری","بازرسی‌های دوره‌ای، تست‌ها و سوابق","تجهیزات حفاظت فردی لازم","مراجع و شمارهٔ ویرایش"],"فرایند":["هدف و دامنه (سوله/واحد)","شرح مختصر فرایند و مواد درگیر","خطرات فرایندی و محیط کار (اسید، گاز، گردوغبار، دما، فشار)","مسئولیت‌ها","روش اجرای ایمن مرحله‌به‌مرحله (راه‌اندازی، کار عادی، توقف)","کنترل‌های مهندسی و مدیریتی (تهویه، حفاظ، حدود مجاز)","تجهیزات حفاظت فردی","واکنش در نشتی، آتش‌سوزی و مسمومیت","پایش (سنجش، بازرسی) و آموزش لازم","سوابق و مراجع"]};let L=[],ME="",FIL="all",LIB=[];fetch("instructions/manifest.json").then(t=>t.json()).then(t=>{LIB=t;if(L.length)draw()}).catch(()=>{});const dl=t=>{const e=String(t.doc_no||"").match(/(?:HSEW|WI-HS)-\d+/g)||[];if(!e.length||!LIB.length)return"";const a=[...new Set(e)].map(t=>LIB.find(e=>e.code===t||e.long===t)).filter(Boolean);return a.length?'<div class="row" style="margin:6px 0">'+a.map(t=>`<a class="b2" style="text-decoration:none" href="instructions/${t.single||t.long}.${t.single?"pdf":"docx"}" target="_blank" rel="noopener">📄 ${esc(t.title.replace("دستورالعمل ",""))}</a>`).join("")+"</div>":""};const todayISO=()=>HSEToday();const jl=t=>t?new Date(t+"T12:00:00Z").toLocaleDateString("fa-IR-u-ca-persian",{year:"numeric",month:"numeric",day:"numeric",timeZone:"UTC"}):"—";const diff=(t,e)=>Math.round((new Date(t+"T12:00:00Z")-new Date(e+"T12:00:00Z"))/864e5);const toast=t=>{const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display="none",2600)};async function rq(t,e={}){const a=await fetch(SB+t,{...e,headers:{"Content-Type":"application/json",Prefer:"return=representation",...e.headers||{}}});if(!a.ok)throw new Error((await a.text()).slice(0,250));const n=await a.text();return n?JSON.parse(n):null}const st=t=>{if(t.status==="approved")return{k:"done",t:"ابلاغ شد"+(t.approved_at?" ("+jl(String(t.approved_at).slice(0,10))+")":""),c:"ok",n:9999};if(!t.target_date)return{k:"none",t:"بدون موعد",c:"wa",n:5e3};const e=diff(String(t.target_date).slice(0,10),todayISO());return e<0?{k:"late",t:"معوق "+fa(-e)+" روز",c:"bad",n:e}:e<=30?{k:"soon",t:fa(e)+" روز مانده",c:"wa",n:e}:{k:"ok",t:fa(e)+" روز مانده",c:"",n:e}};async function load(){L=await HSE.getAll("hse_procedures?select=*&order=target_date.asc");if(!Array.isArray(L))throw new Error("table");L=L.filter(t=>t.active!==false);draw()}function draw(){const t=L.map(t=>({o:t,s:st(t)})),e=e=>t.filter(t=>t.s.k===e).length,a=e("done");$("#pt").textContent=fa(a)+" از "+fa(L.length)+" دستورالعمل ابلاغ شده";$("#ps").textContent=L.length?fa(Math.round(a/L.length*100))+"٪ پیشرفت":"";$("#pbi").style.width=(L.length?a/L.length*100:0)+"%";$("#sm").innerHTML=[["all","همه",L.length,""],["late","معوق",e("late"),"var(--bad)"],["soon","تا ۳۰ روز آینده",e("soon"),"var(--wa)"],["ok","در مهلت",e("ok"),""],["done","ابلاغ‌شده",a,"var(--ok)"]].map(([t,e,a,n])=>`<button data-f="${t}" style="${FIL===t?"border-color:var(--ac);":""}"><b style="${n?"color:"+n:""}">${fa(a)}</b>${e}</button>`).join("");const n=$("#kind").value,s=$("#q").value.trim(),o=t.filter(t=>(FIL==="all"||t.s.k===FIL)&&(!n||t.o.kind===n)&&(!s||[t.o.title,t.o.owner,t.o.doc_no,t.o.note].join(" ").includes(s))).sort((t,e)=>(t.s.k==="done")-(e.s.k==="done")||t.s.n-e.s.n);if(!L.length){$("#list").innerHTML='<div class="card2">فهرستی ثبت نشده است. فایل hse_procedures.sql را یک‌بار در Supabase اجرا کنید تا فهرست پیشنهادی (حدود ۳۰ دستورالعمل با موعد) بارگذاری شود، یا «دستورالعمل جدید» را بزنید.</div>';return}$("#list").innerHTML=o.map(({o:t,s:e})=>`<div class="card2"><div class="t"><div style="flex:1;min-width:220px"><b>${esc(t.title)}</b> <span class="bg">${esc(t.kind)}</span> <span class="bg">${PRI[t.priority]||""}</span> <span class="bg ${e.c}">${e.t}</span>\n   <div class="mu">وضعیت: <b>${ST[t.status]}</b>${t.status!=="approved"?" · موعد: "+jl(t.target_date&&String(t.target_date).slice(0,10)):""}${t.owner?" · مسئول: "+esc(t.owner):""}${t.doc_no?" · شماره: "+esc(t.doc_no):""}</div>${t.note?`<div class="mu">${esc(t.note)}</div>`:""}</div>\n   ${dl(t)}<div class="row">${NX[t.status]?`<button class="b2 ${t.status==="review"?"ok":"p"}" data-a="next" data-id="${t.id}">${NB[t.status]}</button>`:""}<button class="b2" data-a="tpl" data-id="${t.id}">📋 ساختار</button><button class="b2" data-a="edit" data-id="${t.id}">✏️</button></div></div></div>`).join("")||'<div class="card2 mu">موردی با این فیلتر نیست.</div>'}function dateField(t){return`<div id="${t}" class="jd"><select></select><select></select><select></select></div>`}function openTpl(t){const e=L.find(e=>e.id===t),a=OUT[e.kind]||OUT["سیستمی"];const n=`دستورالعمل: ${e.title}\nشمارهٔ سند: ${e.doc_no||"………"}   ویرایش: ۰۰   تاریخ: ………\n\n`+a.map((t,e)=>`${e+1}. ${t}\n   …\n`).join("\n");$("#dlg").innerHTML=`<b>ساختار پیشنهادی: ${esc(e.title)}</b><div class="mu">سرفصل‌های استاندارد برای نوع «${esc(e.kind)}»؛ کپی کنید و در Word پر کنید.</div><pre id="tx">${esc(n)}</pre><div class="row" style="margin-top:10px"><button class="b2" id="tX">بستن</button><button class="b2 p" id="tC" style="margin-inline-start:auto">کپی متن</button></div>`;$("#dlg").showModal();$("#tX").onclick=()=>$("#dlg").close();$("#tC").onclick=async()=>{try{await navigator.clipboard.writeText(n);toast("کپی شد")}catch(t){const e=document.createRange();e.selectNodeContents($("#tx"));getSelection().removeAllRanges();getSelection().addRange(e);toast("متن انتخاب شد؛ کپی کنید")}}}function openForm(t){const e=t?L.find(e=>e.id===t):{kind:"سیستمی",priority:2,status:"planned"};$("#dlg").innerHTML=`<b>${t?"ویرایش":"دستورالعمل جدید"}</b>\n   <label class="f">عنوان *<input id="fT" value="${esc(e.title||"")}"></label>\n   <div class="row"><label class="f" style="flex:1">نوع<select id="fK">${["سیستمی","دستگاه","فرایند"].map(t=>`<option ${t===e.kind?"selected":""}>${t}</option>`).join("")}</select></label>\n   <label class="f" style="flex:1">اولویت<select id="fP">${[1,2,3].map(t=>`<option value="${t}" ${t==e.priority?"selected":""}>${PRI[t]}</option>`).join("")}</select></label>\n   <label class="f" style="flex:1">وضعیت<select id="fS">${Object.entries(ST).map(([t,a])=>`<option value="${t}" ${t===e.status?"selected":""}>${a}</option>`).join("")}</select></label></div>\n   <label class="f">موعد تدوین/ابلاغ</label>${dateField("fD")}\n   <div class="row"><label class="f" style="flex:1">مسئول تدوین<input id="fO" value="${esc(e.owner||"")}"></label><label class="f" style="flex:1">شمارهٔ سند<input id="fN" value="${esc(e.doc_no||"")}"></label></div>\n   <label class="f">توضیح<textarea id="fT2" rows="2">${esc(e.note||"")}</textarea></label>\n   <div id="fE" class="mu" style="color:var(--bad)"></div>\n   <div class="row" style="margin-top:12px">${t?'<button class="b2 bad" id="fDel">حذف</button>':""}<button class="b2" id="fX">انصراف</button><button class="b2 p" id="fSv" style="margin-inline-start:auto">ذخیره</button></div>`;HSE.jdInit($("#fD"),true);if(e.target_date)HSE.jdSet($("#fD"),String(e.target_date).slice(0,10));$("#dlg").showModal();$("#fX").onclick=()=>$("#dlg").close();if(t)$("#fDel").onclick=async()=>{if(!confirm("این دستورالعمل از برنامه حذف شود؟"))return;try{await rq("hse_procedures?id=eq."+t,{method:"DELETE",headers:{Prefer:"return=minimal"}});$("#dlg").close();await load()}catch(t){$("#fE").textContent=t.message}};$("#fSv").onclick=async()=>{const a=$("#fT").value.trim();if(!a)return $("#fE").textContent="عنوان را بنویسید";const n=$("#fS").value;const s={title:a,kind:$("#fK").value,priority:+$("#fP").value,status:n,target_date:HSE.jdGet($("#fD"))||null,owner:$("#fO").value.trim()||null,doc_no:$("#fN").value.trim()||null,note:$("#fT2").value.trim()||null};if(n==="approved"&&!e.approved_at)s.approved_at=todayISO();if(n!=="approved")s.approved_at=null;try{if(t)await rq("hse_procedures?id=eq."+t,{method:"PATCH",body:JSON.stringify(s),headers:{Prefer:"return=minimal"}});else await rq("hse_procedures",{method:"POST",body:JSON.stringify({...s,created_by:ME||null}),headers:{Prefer:"return=minimal"}});$("#dlg").close();toast("ثبت شد");await load()}catch(t){$("#fE").textContent=t.message}}}document.addEventListener("click",async t=>{const e=t.target.closest("[data-f],[data-a],#bAdd");if(!e)return;try{if(e.id==="bAdd")return openForm(null);if(e.dataset.f){FIL=e.dataset.f;return draw()}const t=L.find(t=>t.id===e.dataset.id);if(e.dataset.a==="edit")openForm(e.dataset.id);else if(e.dataset.a==="tpl")openTpl(e.dataset.id);else if(e.dataset.a==="next"&&t){const a=NX[t.status];if(a==="approved"&&!confirm("دستورالعمل ابلاغ شد؟ از تقویم کنار گذاشته می‌شود."))return;e.disabled=true;await rq("hse_procedures?id=eq."+t.id,{method:"PATCH",body:JSON.stringify({status:a,approved_at:a==="approved"?todayISO():null}),headers:{Prefer:"return=minimal"}});toast("وضعیت: "+ST[a]);await load()}}catch(t){toast("خطا: "+t.message.slice(0,120))}});$("#q").oninput=draw;$("#kind").onchange=draw;HSEAuth.ready.then(()=>{ME=HSEAuth.email||"";load().catch(()=>{$("#warn").innerHTML='<div class="card2"><span class="bg bad">جدول ساخته نشده</span> فایل hse_procedures.sql را یک‌بار در Supabase SQL Editor اجرا کنید.</div>'})});</script></body></html>
