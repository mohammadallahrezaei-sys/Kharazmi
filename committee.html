ector(t),{fa:fa,esc:esc}=HSE,MN=HSE.MN;const SB="https://priopguwfjawybffarhd.supabase.co",R=SB+"/rest/v1/";const en=t=>String(t==null?"":t).replace(/[۰-۹]/g,t=>"۰۱۲۳۴۵۶۷۸۹".indexOf(t)).replace(/[٠-٩]/g,t=>"٠١٢٣٤٥٦٧٨٩".indexOf(t));const ORG={labor:"اداره تعاون، کار و رفاه اجتماعی",health:"مرکز بهداشت"};const ADDR={labor:"ریاست محترم اداره تعاون، کار و رفاه اجتماعی شمال استان البرز",health:"ریاست محترم مرکز بهداشت شرق شهرستان کرج"};const SIGN={name:"محسن هفت لنگی",title:"مدیر اداری و منابع انسانی"};const ROLES=["کارفرما یا نماینده تام‌الاختیار","نماینده شورای اسلامی کار / کارگران","مدیر فنی","مسئول حفاظت فنی","مسئول بهداشت حرفه‌ای"];const KINDS=[["done","اقدامات انجام شده"],["ongoing","موارد در دست اقدام"],["new","مصوبات جدید"]];const RESULTS=["اقدام شد","در دست اقدام","مصوبه","لغو شد"];const CATS=["برنامه و گزارش","آموزش","ارزیابی ریسک","فرم و چک‌لیست","خوداظهاری","مستندات شبکه بهداشت","سایر"];const ST={draft:"در دست تهیه",ready:"آماده ارسال",sent:"ارسال شد"};const TRACK_FROM="1405/05/01";const WARN_DAYS=10;const isMgr=()=>window.HSEAuth&&HSEAuth.role==="manager";const uid=()=>crypto.randomUUID();const tj=()=>{const[t,e,n]=HSE.toJal(new Date);return t+"/"+String(e).padStart(2,"0")+"/"+String(n).padStart(2,"0")};const normD=t=>{t=en(t).trim().replace(/[-.]/g,"/");const e=/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/.exec(t);return e?e[1]+"/"+e[2].padStart(2,"0")+"/"+e[3].padStart(2,"0"):""};const fd=t=>t?fa(t):"—";const dayDiff=(t,e)=>{try{return Math.round((new Date(HSE.jalToISO(+t.slice(0,4),+t.slice(5,7),+t.slice(8,10))+"T12:00:00")-new Date(HSE.jalToISO(+e.slice(0,4),+e.slice(5,7),+e.slice(8,10))+"T12:00:00"))/864e5)}catch(t){return null}};function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display="none",2200)}async function rq(t,e={}){const n=await fetch(R+t,{...e,headers:{"Content-Type":"application/json",...e.headers||{}}});if(!n.ok)throw new Error((await n.text()).slice(0,300));const a=await n.text();return a?JSON.parse(a):null}let MEET=[],ITEMS=new Map,SUBS=new Map,DOCS=[],TAB="meetings",E=null,OK=true,DY="";async function load(){try{const[t,e,n,a]=await Promise.all(["committee_meetings?select=*&order=jdate.desc","committee_items?select=*&order=seq.asc","committee_submissions?select=*","committee_docs?select=*&order=jyear.desc"].map(HSE.getAll));MEET=t.sort((t,e)=>e.jdate.localeCompare(t.jdate));ITEMS=new Map;e.forEach(t=>{if(!ITEMS.has(t.meeting_id))ITEMS.set(t.meeting_id,[]);ITEMS.get(t.meeting_id).push(t)});SUBS=new Map;n.forEach(t=>SUBS.set(t.meeting_id+"|"+t.target,t));DOCS=a;OK=true}catch(t){OK=false;MEET=[];DOCS=[];$("#msg").innerHTML=`<div class="warn">⚠️ جدول‌های این ماژول ساخته نشده‌اند. فایل <b>hse_committee.sql</b> را یک‌بار در Supabase (SQL Editor) اجرا کنید و صفحه را دوباره باز کنید.<br><small dir="ltr">${esc(String(t.message||t).slice(0,160))}</small></div>`}render()}function subState(t){if(!t)return"none";if(t.receipt_no||t.receipt_date||(t.files||[]).length)return"recv";if(t.letter_no||t.letter_date)return"sent";return"none"}function subChip(t,e){const n=SUBS.get(t.id+"|"+e),a=subState(n),i=t.jdate<TRACK_FROM;if(a==="recv")return`<span class="chip ok">✅ ${ORG[e].split("،")[0]}: رسید ثبت شد</span>`;if(a==="sent")return`<span class="chip wa">📨 ${ORG[e].split("،")[0]}: ارسال شد، رسید نیست</span>`;if(i)return`<span class="chip">— ${ORG[e].split("،")[0]}: سابقه</span>`;const s=dayDiff(tj(),t.jdate);return`<span class="chip ${s!=null&&s>WARN_DAYS?"bad":"wa"}">⏳ ${ORG[e].split("،")[0]}: ارسال نشده${s>WARN_DAYS?" ("+fa(s)+" روز)":""}</span>`}const openItems=t=>(ITEMS.get(t.id)||[]).filter(t=>t.kind!=="done"&&t.result!=="اقدام شد"&&t.result!=="لغو شد");function render(){const t=[["meetings","جلسه‌ها"],["track","پیگیری ارسال"],["docs","بایگانی مستندات"]];$("#main").innerHTML=`<div class="tabs">${t.map(([t,e])=>`<button data-tab="${t}" class="${TAB===t&&!E?"on":""}">${e}</button>`).join("")}</div><div id="view"></div>`;if(!OK){$("#view").innerHTML="";return}if(E)return renderEdit();if(TAB==="meetings")renderMeetings();else if(TAB==="track")renderTrack();else renderDocs()}const sameDoc=(t,e)=>t.jyear===e.jyear&&(t.period||"")===(e.period||"")&&t.title===e.title;function needAttach(){if(!MEET.length||!window.CM_SEED)return false;return CM_SEED.some(t=>{const e=MEET.find(e=>e.year===t.y&&e.no===t.no);return e&&!(e.files||[]).length&&(t.files||[]).length})||(window.CM_DOCS||[]).some(t=>(t.files||[]).length&&!DOCS.some(e=>sameDoc(e,t)&&(e.files||[]).length))}async function attachSeed(t){t.disabled=true;toast("در حال پیوست فایل‌ها…");try{for(const t of CM_SEED){const e=MEET.find(e=>e.year===t.y&&e.no===t.no);if(!e)continue;if(!(e.files||[]).length&&(t.files||[]).length)await rq("committee_meetings?id=eq."+e.id,{method:"PATCH",body:JSON.stringify({files:t.files}),headers:{Prefer:"return=minimal"}});for(const n of["labor","health"]){const a=(t.subs||{})[n]||[];if(!a.length)continue;const i=SUBS.get(e.id+"|"+n)||{};if((i.files||[]).length)continue;await rq("committee_submissions?on_conflict=meeting_id,target",{method:"POST",body:JSON.stringify([{meeting_id:e.id,target:n,letter_no:i.letter_no||null,letter_date:i.letter_date||null,receipt_no:i.receipt_no||null,receipt_date:i.receipt_date||null,note:i.note||null,files:a}]),headers:{Prefer:"resolution=merge-duplicates,return=minimal"}})}}for(const t of window.CM_DOCS||[]){if(!(t.files||[]).length)continue;const e=DOCS.find(e=>sameDoc(e,t));if(e){if(!(e.files||[]).length)await rq("committee_docs?id=eq."+e.id,{method:"PATCH",body:JSON.stringify({files:t.files}),headers:{Prefer:"return=minimal"}})}else await rq("committee_docs",{method:"POST",body:JSON.stringify(t),headers:{Prefer:"return=minimal"}})}toast("فایل‌ها پیوست شد");await load()}catch(e){toast(/files/.test(e.message)?"ابتدا فایل hse_committee_files.sql را در Supabase اجرا کنید":"خطا: "+e.message.slice(0,100));t.disabled=false}}function importBar(){if(needAttach())return`<div class="warn">فایل‌های آرشیو (${fa(CM
