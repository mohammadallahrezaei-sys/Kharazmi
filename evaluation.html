<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ارزیابی عملکرد واحدها - نرم‌افزار جامع HSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<link rel="stylesheet" href="hse_ui.css">
<style>td input[type=number]{width:60px;padding:3px 6px}.z0{color:#34d399}.z1{color:#38bdf8}.z2{color:#fbbf24}.z3{color:#f87171}.inc td{background:#1e293b80}</style>
</head>
<body>
<div class="w" style="max-width:1100px">
  <div class="top">
    <div><h1>📊 ارزیابی عملکرد واحدها</h1><p>شاخص ایمنی، شاخص مشارکت و ماتریس مقایسه — محاسبه‌ی خودکار با فرمول‌های فایل اکسل</p></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><select id="mSel" style="width:auto"></select><button class="p" id="bSave">💾 ذخیره ورودی‌ها</button><button id="bZero">ثبت صفر برای واحدهای خالی</button><button id="bUnits">⚙ مدیریت واحدها</button><a class="btn" href="cards.html">کارت‌ها</a><a class="btn" href="index.html">← بازگشت</a></div>
  </div>
  <div id="err" class="err"></div>
  <div id="sum"></div>
  <div class="card sc"><table id="tb"></table></div>
  <div class="card mu" id="notes"></div>
</div>
<div class="modal" id="modal"><div style="max-width:760px">
  <h2 style="margin:0 0 8px;font-size:15px">مدیریت واحدها</h2>
  <div class="mu" style="margin-bottom:6px">«نام‌های معادل» نام واحد در بانک پرسنل است (با ویرگول جدا شود) تا حوادث و جلسات ایمنی به واحد درست نسبت داده شوند.</div>
  <div id="uList" class="sc"></div>
  <div style="display:flex;gap:6px;margin-top:10px"><button id="uAdd">+ واحد جدید</button><button class="p" id="uSave">ذخیره‌ی تغییرات</button><button id="uClose">بستن</button></div>
</div></div>
<script src="eval_core.js"></script>
<script>
const {esc,fa,req,monthKeys,monthLabel,loadEval,compute,ZONES,PARAM,getAll}=HSE;
const $=id=>document.getElementById(id);
let B=null,R=null,K=null;
$('mSel').innerHTML=monthKeys(12).map(k=>`<option value="${k}">${monthLabel(k)}</option>`).join('');
const n1=v=>fa(Math.round(v*10)/10);
async function load(){
  B=await loadEval();
  if(!B.units){$('err').style.display='block';$('err').textContent='جدول واحدها پیدا نشد. فایل hse_eval_setup.sql را در Supabase اجرا کنید.';return}
  $('err').style.display='none';draw();
}
function draw(){
  K=$('mSel').value;R=compute(K,B);
  const zn=['الگو','ایمن ولی ساکت','ریسک بالا، شفاف','نیازمند مداخله فوری'];
  $('sum').innerHTML=`<div class="g3" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:10px">${R.zones.map((z,i)=>`<div class="card" style="margin:0"><div class="mu">${ZONES[i]}</div><b class="z${i}" style="font-size:22px">${fa(z.length)}</b><div class="mu">${z.map(r=>esc(r.u.name)).join('، ')||'—'}</div></div>`).join('')}
   <div class="card" style="margin:0"><div class="mu">واجد شرایط واحد نمونه</div><b class="z0" style="font-size:22px">${fa(R.rank.length)}</b><div class="mu">${R.rank.slice(0,3).map(r=>fa(r.rank)+'. '+esc(r.u.name)).join('، ')||'—'}</div></div>
   <div class="card" style="margin:0"><div class="mu">داده‌ی ناقص (ورودی PPE/ناایمن ثبت نشده)</div><b class="${R.incomplete.length?'wa':'ok'}" style="font-size:22px">${fa(R.incomplete.length)}</b><div class="mu">${R.incomplete.length?'این واحدها در ماتریس و رتبه‌بندی نیامده‌اند':'همه ثبت شده'}</div></div></div>`;
  const h='<tr><th>واحد</th><th>ریسک</th><th>نفر</th><th>خطر</th><th>شبه</th><th>پیشنهاد</th><th>جلسه</th><th>PPE</th><th>ناایمن</th><th>حادثه/جزئی</th><th>روز</th><th>ایمنی</th><th>مشارکت</th><th>ناحیه</th><th>رتبه</th></tr>';
  $('tb').innerHTML=h+R.rows.map(r=>`<tr class="${r.entered?'':'inc'}"><td><b>${esc(r.u.name)}</b><div class="mu">${esc(r.u.manager||'بدون مسئول')}</div></td><td>${r.u.risk_level}</td><td>${fa(r.C)}</td><td>${fa(r.hz)}</td><td>${fa(r.nm)}</td><td>${fa(r.sg)}</td><td>${fa(r.talks)}</td>
   <td><input type="number" min="0" data-u="${r.u.id}" data-k="ppe" value="${r.entered?r.ppe:''}" placeholder="—"></td><td><input type="number" min="0" data-u="${r.u.id}" data-k="unsafe" value="${r.entered?r.unsafe:''}" placeholder="—"></td>
   <td>${fa(r.ac)}/${fa(r.ak)}</td><td>${fa(r.lost)}</td><td>${r.entered?n1(r.safety):'—'}</td><td>${n1(r.part)}</td><td class="${r.zone==null?'mu':'z'+r.zone}">${r.zone==null?'داده ناقص':ZONES[r.zone]}</td><td>${r.rank?fa(r.rank):'—'}</td></tr>`).join('');
  $('notes').innerHTML=`<b>یادداشت‌ها:</b> ساعت کار = روزهای ماه × نفرات × ${fa(PARAM.HOURS_PER_DAY)}؛ آستانه‌ها: ایمنی ≥ ${fa(PARAM.SAFETY_T)} و مشارکت ≥ ${fa(PARAM.PART_T)} (مطابق شیت پارامترها).«حادثه» = حوادثی با شدت متوسط به بالا و «جزئی» = حوادث جزئی ماژول بهداری؛ نسبت حادثه به واحد از روی «واحد» پرسنل در بانک پرسنل است.${R.incNoUnit?`<span class="wa">${fa(R.incNoUnit)} حادثه‌ی این ماه به هیچ واحدی نسبت داده نشد (واحد پرسنل یا نام معادل را در «مدیریت واحدها» تنظیم کنید).</span>`:''}
   کارت‌های این ماه: ${fa(R.cardsTotal)} (خطر ${fa(R.cardTypes.hazard)}، شبه‌حادثه ${fa(R.cardTypes.near_miss)}، پیشنهاد ${fa(R.cardTypes.suggestion)}؛ کارت‌های ردشده شمرده نمی‌شوند). جلسه‌ی ایمنی از ماژول آموزش (نوع «جلسه کوتاه ایمنی») گرفته می‌شود.`;
}
$('mSel').onchange=draw;
function inputs(){const m={};document.querySelectorAll('#tb input[data-u]').forEach(i=>{(m[i.dataset.u]=m[i.dataset.u]||{})[i.dataset.k]=i.value});return m}
async function saveRows(all,zeroEmpty){
  const m=inputs(),rows=[];
  Object.entries(m).forEach(([uid,v])=>{const e=v.ppe!==''||v.unsafe!=='';if(!e&&!zeroEmpty)return;if(!e&&R.rows.find(r=>r.u.id===uid).entered)return;rows.push({unit_id:uid,month_key:K,ppe_count:+v.ppe||0,unsafe_count:+v.unsafe||0})});
  if(!rows.length){alert('ورودی جدیدی برای ذخیره وجود ندارد.');return}
  try{await req('hse_unit_monthly?on_conflict=unit_id,month_key','POST',rows,'resolution=merge-duplicates,return=minimal');B=await loadEval();draw()}catch(e){alert('خطا در ذخیره: '+e.message)}
}
$('bSave').onclick=()=>saveRows(false,false);
$('bZero').onclick=()=>{if(confirm('برای واحدهایی که ورودی ندارند، «۰ مورد PPE و ۰ مورد رفتار ناایمن» ثبت شود؟\nاین یعنی در این ماه موردی مشاهده نشده است.'))saveRows(true,true)};
/* ---- مدیریت واحدها ---- */
function uDraw(){
  $('uList').innerHTML='<table><tr><th>نام واحد</th><th>مسئول</th><th>ریسک</th><th>نفر</th><th>نام‌های معادل در بانک پرسنل</th><th>فعال</th></tr>'+B.units.map(u=>`<tr data-id="${u.id||''}"><td><input type="text" data-k="name" value="${esc(u.name)}"></td><td><input type="text" data-k="manager" value="${esc(u.manager||'')}"></td><td><select data-k="risk_level" style="width:60px">${['A','B','C'].map(x=>`<option ${u.risk_level===x?'selected':''}>${x}</option>`).join('')}</select></td><td><input type="number" min="1" data-k="headcount" value="${u.headcount}" style="width:60px"></td><td><input type="text" data-k="aliases" value="${esc(u.aliases||'')}"></td><td><input type="checkbox" data-k="active" ${u.active!==false?'checked':''}></td></tr>`).join('')+'</table>';
}
$('bUnits').onclick=()=>{uDraw();$('modal').classList.add('on')};
$('uClose').onclick=()=>$('modal').classList.remove('on');
$('uAdd').onclick=()=>{B.units.push({name:'',manager:'',risk_level:'B',headcount:1,aliases:'',active:true});uDraw();$('uList').lastChild.scrollIntoView()};
$('uSave').onclick=async()=>{
  const trs=[...document.querySelectorAll('#uList tr[data-id]')];let bad=false;
  try{for(const tr of trs){const g=k=>{const e=tr.querySelector(`[data-k="${k}"]`);return e.type==='checkbox'?e.checked:e.value.trim()};const name=g('name');if(!name){if(!tr.dataset.id)continue;bad=true;continue}
    const body={name,manager:g('manager')||null,risk_level:g('risk_level'),headcount:Math.max(1,+g('headcount')||1),aliases:g('aliases')||null,active:g('active')};
    if(tr.dataset.id)await req('hse_units?id=eq.'+tr.dataset.id,'PATCH',body,'return=minimal');else await req('hse_units','POST',body,'return=minimal')}
    B=await loadEval();draw();uDraw();if(bad)alert('ردیف‌های بدون نام ذخیره نشدند.');else $('modal').classList.remove('on')}
  catch(e){alert('خطا در ذخیره: '+e.message)}};
load();
</script>
</body>
</html>
