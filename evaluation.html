<!doctype html><html lang="fa" dir="rtl"><head><meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"><script src="auth.js" data-roles="manager"></script><script src="report_tabs.js" defer="defer"></script><script src="hse_nav.js" defer="defer"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ارزیابی واحدهای کارخانه - نرم‌افزار جامع HSE</title><link rel="stylesheet" href="hse_ui.css"><style>td input[type=number]{width:60px;padding:3px 6px}.z0{color:var(--ok)}.z1{color:var(--in)}.z2{color:var(--wa)}.z3{color:var(--bad)}.inc td{background:var(--card) 80}</style></head><body><div class="w" style=""><div class="top"><div><h1>📊 ارزیابی واحدهای کارخانه</h1><p>شاخص ایمنی، شاخص مشارکت و ماتریس مقایسه — محاسبه‌ی خودکار با فرمول‌های فایل اکسل</p></div><div style=""><select id="mSel" style=""></select><button class="p" id="bSave">💾 ذخیره ورودی‌ها</button><button id="bZero" title="برای واحدهای ثبت‌نشده این ماه، PPE و ناایمن صفر ثبت می‌شود">0️⃣ ثبت صفر برای ثبت‌نشده‌ها</button><button id="bUnits">⚙ مدیریت واحدها</button><a class="btn" href="cards.html">کارت‌ها</a><a class="btn" href="index.html">← بازگشت</a></div></div><div id="err" class="err"></div><div id="sum"></div><div class="card sc"><table id="tb"></table></div><div class="card mu" id="notes"></div></div><div class="modal" id="modal"><div style=""><h2 style="">مدیریت واحدها</h2><div class="mu" style="">«نام‌های معادل» نام واحد در پرونده پرسنل است (با ویرگول جدا شود) تا حوادث و جلسات ایمنی به واحد درست نسبت داده شوند.</div><div id="uList" class="sc"></div><div id="uSum" class="mu" style=""></div><div style=""><button id="uFix" title="تعداد هر واحد را از روی پرونده‌های پرسنل فعال (قطع همکاری‌نشده) جایگزین می‌کند؛ بعد «ذخیره» را بزنید">✓ اصلاح تعداد از لیست پرسنل فعال</button><button id="uAdd">+ واحد جدید</button><button class="p" id="uSave">ذخیره‌ی تغییرات</button><button id="uClose">بستن</button></div></div></div><script src="eval_core.js"></script><script>const{esc:esc,fa:fa,req:req,monthKeys:monthKeys,monthLabel:monthLabel,loadEval:loadEval,compute:compute,ZONES:ZONES,PARAM:PARAM,getAll:getAll,unitMatcher:unitMatcher,isActive:isActive}=HSE;const $=t=>document.getElementById(t);let B=null,R=null,K=null;$("mSel").innerHTML=monthKeys(12).map(t=>`<option value="${t}">${monthLabel(t)}</option>`).join("");const n1=t=>fa(Math.round(t*10)/10);async function load(){B=await loadEval({days:450});if(!B.units){$("err").style.display="block";$("err").textContent="جدول واحدها پیدا نشد. فایل hse_eval_setup.sql را در Supabase اجرا کنید.";return}$("err").style.display="none";draw()}function draw(){K=$("mSel").value;R=compute(K,B);const t=["الگو","ایمن ولی ساکت","ریسک بالا، شفاف","نیازمند مداخله فوری"];$("sum").innerHTML=`<div class="g3" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:10px">${R.zones.map((t,e)=>`<div class="card" style="margin:0"><div class="mu">${ZONES[e]}</div><b class="z${e}" style="font-size:22px">${fa(t.length)}</b><div class="mu">${t.map(t=>esc(t.u.name)).join("، ")||"—"}</div></div>`).join("")}\n   <div class="card" style="margin:0"><div class="mu">واجد شرایط واحد نمونه</div><b class="z0" style="font-size:22px">${fa(R.rank.length)}</b><div class="mu">${R.rank.slice(0,3).map(t=>fa(t.rank)+". "+esc(t.u.name)).join("، ")||"—"}</div></div>\n   <div class="card" style="margin:0"><div class="mu">داده‌ی ناقص (PPE/ناایمن یا تعداد مشاهده‌ی کافی ثبت نشده)</div><b class="${R.incomplete.length?"wa":"ok"}" style="font-size:22px">${fa(R.incomplete.length)}</b><div class="mu">${R.incomplete.length?"این واحدها در ماتریس و رتبه‌بندی نیامده‌اند؛ ورودی را ثبت کنید یا (برای ماه‌های قبل از آبان ۱۴۰۵) دکمهٔ «ثبت صفر» را بزنید":"همه ثبت شده"}</div></div></div>`;const e="<tr><th>واحد</th><th>ریسک</th><th>نفر</th><th>خطر</th><th>شبه</th><th>پیشنهاد</th><th>جلسه</th><th>PPE</th><th>ناایمن</th><th>مشاهده</th><th>حادثه/جزئی (ماه)</th><th>حادثه ۱۲ماهه</th><th>روز</th><th>ایمنی</th><th>مشارکت</th><th>ناحیه</th><th>رتبه</th></tr>";$("tb").innerHTML=e+R.rows.map(t=>`<tr class="${t.entered?"":"inc"}"><td><b>${esc(t.u.name)}</b><div class="mu">${esc(t.u.manager||"بدون مسئول")}</div></td><td>${t.u.risk_level}</td><td>${fa(t.C)}</td><td>${fa(t.hz)}</td><td>${fa(t.nm)}</td><td>${fa(t.sg)}</td><td>${fa(t.talks)}</td>\n   <td><input type="number" min="0" data-u="${t.u.id}" data-k="ppe" value="${t.entered?t.ppe:""}" placeholder="—"></td><td><input type="number" min="0" data-u="${t.u.id}" data-k="unsafe" value="${t.entered?t.unsafe:""}" placeholder="—"></td>\n   <td><input type="number" min="0" data-u="${t.u.id}" data-k="obs" value="${t.obs!=null?t.obs:""}" placeholder="≥${fa(t.need)}"></td>\n   <td>${fa(t.ac)}/${fa(t.ak)}</td><td>${fa(t.ac12)}</td><td>${fa(t.lost)}</td><td>${t.entered?n1(t.safety):"—"}</td><td>${n1(t.part)}</td><td class="${t.zone==null?"mu":"z"+t.zone}">${t.zone==null?"داده ناقص":ZONES[t.zone]}</td><td>${t.rank?fa(t.rank):"—"}</td></tr>`).join("");$("notes").innerHTML=`<b>روش محاسبه:</b> ساعت کار = روزهای کاری واقعی (شنبه تا چهارشنبه) × نفرات × ${fa(PARAM.HOURS_PER_DAY)}. نرخ حادثه و روز از دست رفته روی <b>۱۲ ماه متحرک</b> و با کفِ مواجهه‌ی ${fa(PARAM.FLOOR_H.toLocaleString("en"))} ساعت (پایه‌ی OSHA) حساب می‌شود تا نوسان تصادفی واحد کوچک نتیجه را تعیین نکند. PPE و رفتار ناایمن درصدِ <b>تعداد مشاهده</b> است و از ${PARAM.OBS_FROM.replace("1405-","ماه ")} بدون مشاهده‌ی کافی (حداقل ${fa(PARAM.MIN_OBS)} یا نصف نفرات) امتیاز نمی‌گیرد؛ «صفر» بدون مشاهده بهترین امتیاز نیست. حادثه‌ی جزئی (کمک‌های اولیه) از امتیاز ایمنی خارج است تا گزارش‌دهی جریمه نشود. ارفاق ریسک حذف شده و همه‌ی واحدها با یک ترازو سنجیده می‌شوند. وزن ایمنی: PPE ${fa(PARAM.W.X)}، رفتار ناایمن ${fa(PARAM.W.AB)}، تعداد حادثه ${fa(PARAM.W.AF)}، روز از دست رفته ${fa(PARAM.W.AJ)} (۵۰٪ پیشرو، ۵۰٪ پسرو). آستانه‌ها: ایمنی ≥ ${fa(PARAM.SAFETY_T)} و مشارکت ≥ ${fa(PARAM.PART_T)}.«حادثه» = شدت متوسط به بالا؛ «جزئی» = حوادث جزئی ماژول بهداری.<br>   کارت‌های این ماه: ${fa(R.cardsTotal)} (خطر ${fa(R.cardTypes.hazard)}، شبه‌حادثه ${fa(R.cardTypes.near_miss)}، پیشنهاد ${fa(R.cardTypes.suggestion)}؛ کارت‌های ردشده شمرده نمی‌شوند). جلسه‌ی ایمنی از ماژول آموزش (نوع «جلسه کوتاه ایمنی») گرفته می‌شود.`}$("mSel").onchange=draw;function inputs(){const t={};document.querySelectorAll("#tb input[data-u]").forEach(e=>{(t[e.dataset.u]=t[e.dataset.u]||{})[e.dataset.k]=e.value});return t}async function saveRows(){const t=inputs(),e=[];Object.entries(t).forEach(([t,a])=>{if(a.ppe===""&&a.unsafe===""&&a.obs==="")return;const n=R.rows.find(e=>e.u.id===t).need;if(K>=PARAM.OBS_FROM&&(a.obs===""||+a.obs<n)){e.push({err:t});return}e.push({unit_id:t,month_key:K,ppe_count:+a.ppe||0,unsafe_count:+a.unsafe||0,obs_count:a.obs===""?null:+a.obs})});const a=e.filter(t=>t.err).map(t=>R.rows.find(e=>e.u.id===t.err).u.name),n=e.filter(t=>!t.err);if(a.length)alert("تعداد مشاهده کمتر از حداقل است (هر مشاهده یک نفر/یک بازدید ثبت‌شده است). برای این واحدها ذخیره نشد:\n"+a.join("، "));if(!n.length){if(!a.length)alert("ورودی جدیدی برای ذخیره وجود ندارد.");return}try{try{await req("hse_unit_monthly?on_conflict=unit_id,month_key","POST",n,"resolution=merge-duplicates,return=minimal")}catch(t){if(!/obs_count/.test(t.message))throw t;alert("ستون obs_count در دیتابیس نیست؛ فایل hse_unit_obs.sql را اجرا کنید. فعلاً بدون تعداد مشاهده ذخیره می‌شود.");await req("hse_unit_monthly?on_conflict=unit_id,month_key","POST",n.map(({obs_count:t,...e})=>e),"resolution=merge-duplicates,return=minimal")}B=await loadEval({days:450});draw()}catch(t){alert("خطا در ذخیره: "+t.message)}}$("bSave").onclick=()=>saveRows();$("bZero").onclick=async()=>{if(K>=PARAM.OBS_FROM){alert("از "+monthLabel(PARAM.OBS_FROM)+" به بعد برای هر واحد باید تعداد مشاهده‌ی واقعی (حداقل مقدار نشان‌داده‌شده) ثبت شود؛ ثبت صفر برای این ماه مجاز نیست.");return}const t=R.rows.filter(t=>!t.entered);if(!t.length){alert("همه‌ی واحدهای این ماه قبلاً ثبت شده‌اند.");return}if(!confirm("برای "+t.length+" واحد ثبت‌نشده ("+t.map(t=>t.u.name).join("، ")+") مقدار PPE و ناایمن = ۰ ثبت شود؟\nاین یعنی در این ماه موردی مشاهده نشده است."))return;try{await req("hse_unit_monthly?on_conflict=unit_id,month_key","POST",t.map(t=>({unit_id:t.u.id,month_key:K,ppe_count:0,unsafe_count:0})),"resolution=merge-duplicates,return=minimal");B=await loadEval({days:450});draw()}catch(t){alert("خطا در ثبت: "+t.message)}};function uDraw(){$("uList").innerHTML="<table><tr><th>نام واحد</th><th>مسئول</th><th>ریسک</th><th>نفر (ثبت‌شده)</th><th>پرسنل فعال (از لیست)</th><th>نام‌های معادل در پرونده پرسنل</th><th>فعال</th></tr>"+B.units.map(t=>`<tr data-id="${t.id||""}"><td><input type="text" data-k="name" value="${esc(t.name)}"></td><td><input type="text" data-k="manager" value="${esc(t.manager||"")}"></td><td><select data-k="risk_level" style="width:60px">${["A","B","C"].map(e=>`<option ${t.risk_level===e?"selected":""}>${e}</option>`).join("")}</select></td><td><input type="number" min="1" data-k="headcount" value="${t.headcount}" style="width:60px"></td><td class="ac" style="white-space:nowrap"></td><td><input type="text" data-k="aliases" value="${esc(t.aliases||"")}"></td><td><input type="checkbox" data-k="active" ${t.active!==false?"checked":""}></td></tr>`).join("")+"</table>";refreshCounts()}const TODAY=(new Date).toLocaleDateString("en-CA");function refreshCounts(){const t=[...document.querySelectorAll("#uList tr[data-id]")],e=(t,e)=>{const a=t.querySelector(`[data-k="${e}"]`);return a?a.value.trim():""};const a=t.map(t=>({name:e(t,"name"),aliases:e(t,"aliases"),_tr:t})),n=unitMatcher(a),s=new Map,i={};let l=0;(B.emp||[]).forEach(t=>{if(!isActive(t,TODAY))return;l++;const e=n(t.department);if(e)s.set(e,(s.get(e)||0)+1);else{const e=String(t.department||"").trim()||"(بدون واحد در پرونده)";i[e]=(i[e]||0)+1}});let r=0;a.forEach(t=>{const a=s.get(t)||0,n=+e(t._tr,"headcount")||0,i=t._tr.querySelector(".ac");r+=a;t._tr.dataset.n=a;i.innerHTML=!t.name?"":a===0?'<b style="color:var(--bad)">۰</b> <span class="mu">بدون پرسنل منطبق</span>':a===n?`<b style="color:var(--ok)">${fa(a)}</b> ✓`:`<b style="color:var(--wa)">${fa(a)}</b> <span class="mu">≠ ${fa(n)}</span>`});const o=Object.entries(i).sort((t,e)=>e[1]-t[1]),d=o.reduce((t,e)=>t+e[1],0);$("uSum").innerHTML=`جمع پرسنل فعال در لیست پرسنل: <b>${fa(l)}</b> · منطبق با واحدها: <b>${fa(r)}</b> · بدون واحد منطبق: <b style="color:${d?"var(--wa)":"var(--ok)"}">${fa(d)}</b>`+(d?"<br>این‌ها به هیچ واحدی وصل نشدند (برای هر کدام «نام معادل» اضافه کنید): "+o.slice(0,12).map(t=>esc(t[0])+" ("+fa(t[1])+")").join("، ")+(o.length>12?" …":""):"")}$("uList").addEventListener("input",t=>{if(t.target.matches("[data-k=name],[data-k=aliases],[data-k=headcount]"))refreshCounts()});$("uFix").onclick=()=>{let t=0;const e=[];document.querySelectorAll("#uList tr[data-id]").forEach(a=>{const n=+a.dataset.n||0,s=a.querySelector("[data-k=headcount]"),i=a.querySelector("[data-k=name]").value.trim();if(!i)return;if(n>0){if(+s.value!==n){s.value=n;t++}}else e.push(i)});refreshCounts();alert((t?fa(t)+" واحد اصلاح شد؛ برای اعمال «ذخیره‌ی تغییرات» را بزنید.":"تعداد همهٔ واحدها با لیست پرسنل فعال یکی بود.")+(e.length?"\nواحدهای بدون پرسنل منطبق (تغییر نکردند): "+e.join("، ")+" — نام معادل را بررسی کنید یا واحد را غیرفعال کنید.":""))};$("bUnits").onclick=()=>{uDraw();$("modal").classList.add("on")};$("uClose").onclick=()=>$("modal").classList.remove("on");$("uAdd").onclick=()=>{B.units.push({name:"",manager:"",risk_level:"B",headcount:1,aliases:"",active:true});uDraw();$("uList").lastChild.scrollIntoView()};$("uSave").onclick=async()=>{const t=[...document.querySelectorAll("#uList tr[data-id]")];let e=false;try{for(const a of t){const t=t=>{const e=a.querySelector(`[data-k="${t}"]`);return e.type==="checkbox"?e.checked:e.value.trim()};const n=t("name");if(!n){if(!a.dataset.id)continue;e=true;continue}const s={name:n,manager:t("manager")||null,risk_level:t("risk_level"),headcount:Math.max(1,+t("headcount")||1),aliases:t("aliases")||null,active:t("active")};if(a.dataset.id)await req("hse_units?id=eq."+a.dataset.id,"PATCH",s,"return=minimal");else await req("hse_units","POST",s,"return=minimal")}B=await loadEval({days:450});draw();uDraw();if(e)alert("ردیف‌های بدون نام ذخیره نشدند.");else $("modal").classList.remove("on")}catch(t){alert("خطا در ذخیره: "+t.message)}};load();</script></body></html>
