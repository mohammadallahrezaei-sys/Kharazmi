<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 Vazirmatn,Tahoma,sans-serif;padding:12px 14px 80px}
#app{max-width:640px;margin:auto}h2{font-size:17px;margin:12px 0 4px}small{color:var(--mu);display:block}

const $=s=>document.querySelector(s),view=h=>$('#app').innerHTML=h,esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>new Date(d).toLocaleDateString('fa-IR');
let tok=localStorage.tk||'',mail=localStorage.em||'',cur,A={},N={},D={loc:''};
const save=()=>localStorage.draft=JSON.stringify({k:cur[0],loc:D.loc,A,N});
async function api(p,o={}){const r=await fetch(URL_+'/rest/v1/'+p,{...o,headers:{apikey:KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json',Prefer:'return=representation'}});
 if(r.status==401){logout();throw new Error('نشست تمام شد؛ دوباره وارد شوید')}if(!r.ok)throw new Error(await r.text());return r.json()}
function loginV(m=''){view(`<h2>ورود به دفتر HSE</h2><input id=em type=email dir=ltr placeholder="ایمیل"><input id=pw type=password dir=ltr placeholder="رمز"><button class=p data-a=login>ورود</button><p class=e>${m}</p>`)}
function logout(){tok='';localStorage.removeItem('tk');loginV()}
async function login(){try{const r=await fetch(URL_+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value.trim(),password:$('#pw').value})}),j=await r.json();
 if(!r.ok)return loginV('ایمیل یا رمز اشتباه است');tok=localStorage.tk=j.access_token;mail=localStorage.em=j.user.email;home()}catch(e){loginV('اتصال به سرور برقرار نشد')}}
async function home(){view('<p>در حال بارگذاری…</p>');let L={};
 try{(await api('inspections?select=module,created_at&order=created_at.desc&limit=500')).forEach(r=>L[r.module]=L[r.module]||r.created_at)}catch(e){}
 view('<h2>بازدید جدید</h2>'+M.map(m=>`<button class=m data-a=open data-k=${m[0]}><b>${m[1]}</b><small>${m[2]}${m[3]?' · '+m[3]:''} · آخرین بازدید: ${L[m[0]]?fd(L[m[0]]):'—'}</small></button>`).join('')+`<button class=p data-a=finds>موارد باز عدم‌انطباق</button><button class=l data-a=logout>خروج (${esc(mail)})</button>`)}
function form(){const m=cur;view(`<button class=l data-a=home>‹ بازگشت</button><h2>${m[1]}</h2><small>${m[2]} ${m[3]}</small><input id=loc placeholder="محل / سالن / دستگاه (الزامی)" value="${esc(D.loc)}">`+m[4].map((q,i)=>{const id=m[0]+'-'+(i+1),a=A[id];
 return `<div class="q ${a=='nc'?'bad':''}"><p>${i+1}. ${q}</p><div class=b>${[['ok','مطابق'],['nc','عدم‌انطباق'],['na','نامربوط']].map(([v,t])=>`<button data-a=ans data-id=${id} data-v=${v} class="${a==v?'on '+v:''}">${t}</button>`).join('')}</div>${a=='nc'?`<input data-note=${id} placeholder="توضیح / اقدام لازم" value="${esc(N[id])}">`:''}</div>`}).join('')+'<button class=p data-a=send>ثبت بازدید</button>')}
async function send(){const m=cur,loc=D.loc.trim();if(!loc)return alert('محل بازدید را بنویسید');const ids=m[4].map((_,i)=>m[0]+'-'+(i+1)),un=ids.filter(i=>!A[i]).length;
 if(un&&!confirm(un+' سؤال بی‌پاسخ است. ثبت شود؟'))return;const c=v=>ids.filter(i=>A[i]==v).length;
 try{const[r]=await api('inspections',{method:'POST',body:JSON.stringify({module:m[0],location:loc,freq:m[2],total:ids.length,ok:c('ok'),nc:c('nc'),na:c('na')})});
 const f=ids.filter(i=>A[i]=='nc').map(i=>({inspection_id:r.id,module:m[0],location:loc,qid:i,question:m[4][+i.split('-')[1]-1],note:N[i]||null}));
 if(f.length)await api('findings',{method:'POST',body:JSON.stringify(f)});localStorage.removeItem('draft');alert('ثبت شد'+(f.length?` — ${f.length} مورد عدم‌انطباق باز`:''));home()}catch(e){alert('ثبت نشد: '+e.message)}}
async function finds(){view('<p>در حال بارگذاری…</p>');try{const r=await api('findings?status=eq.open&order=created_at.desc&limit=300');
 view(`<button class=l data-a=home>‹ بازگشت</button><h2>موارد باز (${r.length})</h2>`+(r.map(x=>`<div class="q bad"><p>${esc(x.question)}</p><small>${esc((M.find(m=>m[0]==x.module)||[])[1])} · ${esc(x.location)} · ${fd(x.created_at)} · ${esc(x.inspector)}</small>${x.note?`<p>${esc(x.note)}</p>`:''}<button class=p data-a=close data-id=${x.id}>رفع شد</button></div>`).join('')||'<p>مورد بازی وجود ندارد.</p>'))}catch(e){alert(e.message)}}
document.onclick=async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,y=scrollY;
 if(a=='login')login();else if(a=='logout')logout();else if(a=='home')home();else if(a=='finds')finds();else if(a=='send')send();
 else if(a=='open'){cur=M.find(m=>m[0]==t.dataset.k);const d=JSON.parse(localStorage.draft||'{}');if(d.k==cur[0]){A=d.A;N=d.N;D.loc=d.loc}else{A={};N={};D.loc=''}form()}
 else if(a=='ans'){A[t.dataset.id]=t.dataset.v;save();form();scrollTo(0,y)}
 else if(a=='close'){try{await api('findings?id=eq.'+t.dataset.id,{method:'PATCH',body:JSON.stringify({status:'closed',closed_at:new Date().toISOString(),closed_by:mail})});finds()}catch(e){alert(e.message)}}};
document.oninput=e=>{const t=e.target;if(t.id=='loc')D.loc=t.value;else if(t.dataset.note)N[t.dataset.note]=t.value;else return;save()};
tok?home():loginV();
</script></body></html>
